[book]
title = "CPEE Log Error Console"
description = "Documentation for the CPEE LLM Error Debugging Console"
authors = ["Christian Horne"]
language = "en"
multilingual = false
src = "docs/src"

[build]
build-dir = "docs/book"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/Spunsel/cpee-log-error-console"
edit-url-template = "https://github.com/Spunsel/cpee-log-error-console/edit/main/{path}"
site-url = "/cpee-log-error-console/documentation/"

[output.html.search]
enable = true
limit = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.playground]
editable = false
copyable = true
copyable-hidden = true
