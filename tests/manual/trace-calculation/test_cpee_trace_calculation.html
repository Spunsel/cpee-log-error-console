        // Load jQuery first (required by CPEE renderer)
        async function loadJQuery() {
            if (typeof $ !== 'undefined') {
                // Initialize extensions if jQuery already loaded
                try {
                    JQueryExtensions.initialize();
                } catch (e) {
                    console.warn('[Test] JQueryExtensions already initialized or error:', e);
                }
                return;
            }
            
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js';
                script.onload = () => {
                    console.log('[Test] jQuery loaded');
                    // Initialize CPEE jQuery extensions
                    try {
                        JQueryExtensions.initialize();
                        console.log('[Test] JQueryExtensions initialized');
                    } catch (e) {
                        console.warn('[Test] Failed to initialize JQueryExtensions:', e);
                    }
                    resolve();
                };
                script.onerror = () => reject(new Error('Failed to load jQuery'));
                document.head.appendChild(script);
            });
        }
        
        // Setup jQuery path interceptors for CPEE libraries
        function setupJQueryInterceptors() {
            if (!window.$ || !window.$.ajax) {
                return;
            }
            
            // Intercept $.ajax
            const originalAjax = window.$.ajax;
            window.$.ajax = function(url, options) {
                let actualUrl = typeof url === 'string' ? url : (options || url).url;
                
                if (actualUrl && actualUrl.includes('src/libs/cpee-layout') && !actualUrl.startsWith('../../../')) {
                    actualUrl = actualUrl.replace(/^.*?(src\/libs\/cpee-layout.*)/, '../../../$1');
                    if (!actualUrl.endsWith('.svg')) {
                        console.log(`[Interceptor] ajax: ${actualUrl}`);
                    }
                    
                    if (typeof url === 'string') {
                        url = actualUrl;
                    } else {
                        (options || url).url = actualUrl;
                    }
                }
                
                return originalAjax.call(this, url, options);
            };
            
            // Intercept $.getScript
            const originalGetScript = window.$.getScript;
            window.$.getScript = function(url, callback) {
                if (url && url.includes('src/libs/cpee-layout') && !url.startsWith('../../../')) {
                    url = url.replace(/^.*?(src\/libs\/cpee-layout.*)/, '../../../$1');
                    console.log(`[Interceptor] getScript: ${url}`);
                }
                return originalGetScript.call(this, url, callback);
            };
            
            console.log('[Test] jQuery path interceptors installed');
        }
        
        // Initialize graph renderer
        async function initializeGraphRenderer() {
            if (!graphRenderer) {
                // Load jQuery first
                await loadJQuery();
                
                // Setup interceptors after jQuery is loaded
                setupJQueryInterceptors();
                
                // Provide dummy functions for WfAdaptor
                window.save = function() {
                    console.log('[Dummy] save() called - ignoring in test environment');
                };
                
                graphRenderer = new CPEEWfAdaptorRenderer();
                await graphRenderer.initialize('cpee-graph-container', null, null);
            }
        }
        
        // Render CPEE graph

            try {
                console.log('[Test] Starting graph render...');
                await initializeGraphRenderer();
                console.log('[Test] Renderer initialized, calling renderGraph...');
                await graphRenderer.renderGraph(xmlString);
                console.log('[Test] renderGraph call completed');
                
                // Wait a bit for async rendering to complete
                setTimeout(() => {
                    const svg = document.querySelector('#cpee-graph-container svg');
                    if (svg) {
                        console.log('[Test] SVG found in container');
                    } else {
                        console.warn('[Test] No SVG found after rendering');
                    }
                }, 1000);
            } catch (error) {
                console.error('Error rendering CPEE graph:', error);
                console.error('Error stack:', error.stack);
                const container = document.getElementById('cpee-graph-container');
                if (container) {
                    container.innerHTML = `<div style="color: #ef4444; padding: 1rem;">Error rendering graph: ${error.message}<br><small>${error.stack}</small></div>`;
                }
            }

        function calculateTraces() {

                    maxLoopIterations: MAX_LOOP_ITERATIONS,
                    maxPathLength: 100
                });

                // Compare with expected traces if available
                const expectedTraces = example.expected || [];
                const expectedCount = example.expectedCount;
                
                if (expectedCount !== undefined) {
                    // Count-only comparison
                    const countMatch = calculatedTraces.length === expectedCount;

                    console.log(`Calculated Count: ${calculatedTraces.length}`);
                    console.log(`Match: ${countMatch ? 'YES' : 'NO'}`);

                    document.getElementById('matching-count').textContent = countMatch ? '1' : '0';
                    document.getElementById('missing-count').textContent = countMatch ? '0' : '1';
                    document.getElementById('wrong-count').textContent = countMatch ? '0' : '1';

                    document.getElementById('computed-traces').innerHTML = '<div class="empty-state">Count-only comparison</div>';
                    document.getElementById('matching-traces').innerHTML = '<div class="empty-state">Count-only comparison</div>';
                    document.getElementById('missing-traces').innerHTML = '<div class="empty-state">Count-only comparison</div>';
                    document.getElementById('wrong-traces').innerHTML = '<div class="empty-state">Count-only comparison</div>';
                } else if (expectedTraces.length > 0) {
                    const comparison = compareTraces(calculatedTraces, expectedTraces);

        function displayCalculatedTraces(traces) {
            const container = document.getElementById('calculated-traces');

        function compareTraces(calculated, expected) {
            // Convert traces to comparable format
            const calcPaths = calculated.map(t => {
                // Check if path was terminated by escape (property is on the path array)
                const wasTerminated = t.path._terminatedByEscape === true;
                const path = t.path.map(task => ({
                    id: task.id,
                    alt_id: task.alt_id,
                    task: task.task
                }));
                // If trace was terminated by escape, add escape marker
                if (wasTerminated) {
                    path.push({ "escape": true });
                }
                return JSON.stringify(path);
            });
            
            const expPaths = expected.map(t => JSON.stringify(t));

            const correct = [];
            const missing = [];
            const wrong = [];
            const matchedCalcIndices = new Set();
            const matchedExpIndices = new Set();

            // Find matches
            expPaths.forEach((expPath, expIndex) => {
                const calcIndex = calcPaths.findIndex((calcPath, idx) => 
                    calcPath === expPath && !matchedCalcIndices.has(idx)
                );
                if (calcIndex !== -1) {
                    correct.push({ expectedIndex: expIndex, calculatedIndex: calcIndex });
                    matchedCalcIndices.add(calcIndex);
                    matchedExpIndices.add(expIndex);
                }
            });

            // Find missing (expected but not calculated)
            expPaths.forEach((expPath, expIndex) => {
                if (!matchedExpIndices.has(expIndex)) {
                    missing.push(expIndex);
                }
            });

            // Find wrong (calculated but not expected)
            calcPaths.forEach((calcPath, calcIndex) => {
                if (!matchedCalcIndices.has(calcIndex)) {
                    wrong.push(calcIndex);
                }
            });

            return {
                correct,
                missing,
                wrong
            };
        }

            missingContainer.innerHTML = '';

                            ).join(' → ')}
                        </div>

                    wrongContainer.appendChild(traceItem);
                });
            }
        }
