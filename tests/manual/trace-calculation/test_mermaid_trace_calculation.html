<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Mermaid Trace Calculation Test</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            padding: 2rem;
            max-width: 1800px;
            margin: 0 auto;
            background: #0f172a;
            color: #e2e8f0;
            line-height: 1.6;
        }
        
        h1 {
            color: #f1f5f9;
            margin-bottom: 1rem;
            font-size: 2rem;
        }
        
        h2 {
            color: #f1f5f9;
            margin-top: 0;
            margin-bottom: 1rem;
            font-size: 1.5rem;
            border-bottom: 2px solid #334155;
            padding-bottom: 0.5rem;
        }

        h3 {
            color: #cbd5e1;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            font-size: 1.1rem;
        }
        
        .controls {
            background: #1e293b;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            margin-bottom: 2rem;
            border: 1px solid #334155;
        }
        
        .example-selector {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .example-selector label {
            font-weight: 600;
            color: #cbd5e1;
        }
        
        .example-selector select {
            padding: 0.5rem 1rem;
            border: 2px solid #475569;
            border-radius: 6px;
            font-size: 1rem;
            background: #0f172a;
            color: #e2e8f0;
            cursor: pointer;
        }
        
        .example-selector select:hover {
            border-color: #60a5fa;
        }
        
        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #3b82f6;
            color: white;
            font-size: 0.875rem;
            font-weight: 500;
            transition: background 0.2s;
        }
        
        .btn:hover {
            background: #2563eb;
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        
        .panel {
            background: #1e293b;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }
        
        .code-block {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #cbd5e1;
        }
        
        .trace-item {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            transition: border-color 0.2s;
        }

        .trace-item.correct {
            border-left: 4px solid #10b981;
            background: #064e3b20;
        }

        .trace-item.wrong {
            border-left: 4px solid #ef4444;
            background: #7f1d1d20;
        }

        .trace-item.missing {
            border-left: 4px solid #f59e0b;
            background: #78350f20;
        }
        
        .trace-path {
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
            color: #cbd5e1;
            line-height: 1.8;
        }
        
        .trace-task {
            display: inline-block;
            background: #334155;
            color: #e2e8f0;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            margin: 0.25rem 0.25rem 0.25rem 0;
        }
        
        .stats {
            display: flex;
            gap: 2rem;
            margin-top: 1rem;
            padding: 1rem;
            background: #0f172a;
            border-radius: 6px;
            border: 1px solid #334155;
        }
        
        .stat-item {
            display: flex;
            flex-direction: column;
        }
        
        .stat-label {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: #f1f5f9;
        }

        .stat-value.match {
            color: #10b981;
        }

        .stat-value.mismatch {
            color: #ef4444;
        }
        
        .trace-section {
            margin-top: 1.5rem;
        }

        .trace-section-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            padding: 0.75rem;
            background: #0f172a;
            border-radius: 6px;
            border-left: 4px solid;
        }

        .trace-section-title.correct {
            border-left-color: #10b981;
            color: #10b981;
        }

        .trace-section-title.wrong {
            border-left-color: #ef4444;
            color: #ef4444;
        }

        .trace-section-title.missing {
            border-left-color: #f59e0b;
            color: #f59e0b;
        }

        .trace-count {
            background: #334155;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #64748b;
            font-style: italic;
        }

        .trace-section.compact {
            margin-top: 1rem;
        }

        .compact-traces {
            max-height: 400px;
            overflow-y: auto;
        }

        .trace-item.compact {
            padding: 0.5rem;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }

        .trace-path.compact {
            font-size: 0.8rem;
            line-height: 1.6;
        }
    </style>
</head>

        <h2>Comparison Results</h2>

            <div class="stat-item">

            <div class="stat-item">
                <span class="stat-label">Missing Traces</span>
                <span class="stat-value mismatch" id="missing-count">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Wrong Traces</span>
                <span class="stat-value mismatch" id="wrong-count">0</span>
            </div>
        </div>
        
        <div class="trace-section compact">
            <div class="trace-section-title">
                <span>Expected Traces</span>
                <span class="trace-count" id="expected-traces-count">0</span>
            </div>
            <div id="expected-traces" class="compact-traces"></div>
        </div>
        
        <div class="trace-section compact">
            <div class="trace-section-title">
                <span>Computed Traces</span>

        <div class="trace-section compact">

        <div class="trace-section compact">

        // Initialize

        function loadExample(name) {
            const example = examples[name];
            if (!example) {
                console.error(`Example ${name} not found`);
                return;
            }

            document.getElementById('mermaid-input').textContent = example.mermaid;
        }

        function calculateTraces() {
            const example = examples[currentExample];
            if (!example) {
                console.error(`Example ${currentExample} not found`);
                return;
            }

            try {
                // Console log: EXAMPLE X
                console.log(`\n${'='.repeat(80)}`);
                console.log(`EXAMPLE ${currentExample}:`);
                console.log(`${'='.repeat(80)}\n`);

                // Console log: Mermaid
                console.log('Mermaid:');
                console.log(example.mermaid);
                console.log('\n');

                // Calculate traces
                calculatedTraces = MermaidTraceCalculator.calculateAllTraces(example.mermaid, {
                    maxLoopIterations: MAX_LOOP_ITERATIONS,
                    maxPathLength: 100
                });

                // Compare with expected traces if available
                if (example.expected) {
                    const comparison = compareTraces(calculatedTraces, example.expected);
                    displayComparison(comparison);
                    
                    // Console log comparison results
                    console.log('Matching Traces:');
                    comparison.matching.forEach(calcIndex => {
                        const trace = calculatedTraces[calcIndex];
                        console.log(`  ${trace.path.map(t => `${t.task} (${t.alt_id})`).join(' → ')}`);
                    });
                    console.log('\nMissing Traces:');
                    comparison.missing.forEach(expIndex => {
                        const trace = example.expected[expIndex];
                        console.log(`  ${trace.map(t => `${t.task} (${t.alt_id})`).join(' → ')}`);
                    });
                    console.log('\nWrong Traces:');
                    comparison.wrong.forEach(calcIndex => {
                        const trace = calculatedTraces[calcIndex];
                        console.log(`  ${trace.path.map(t => `${t.task} (${t.alt_id})`).join(' → ')}`);
                    });
                } else if (example.expectedCount) {
                    // Count-only comparison
                    const comparison = {
                        matching: [],
                        missing: [],
                        wrong: [],
                        expectedCount: example.expectedCount,
                        computedCount: calculatedTraces.length
                    };
                    
                    if (calculatedTraces.length === example.expectedCount) {
                        comparison.matching = calculatedTraces.map((_, i) => i);
                    } else if (calculatedTraces.length < example.expectedCount) {
                        comparison.missing = Array.from({ length: example.expectedCount - calculatedTraces.length }, (_, i) => i);
                        comparison.wrong = calculatedTraces.map((_, i) => i);
                    } else {
                        comparison.wrong = calculatedTraces.map((_, i) => i);
                    }
                    
                    displayComparison(comparison);
                } else {
                    // No expected traces - just display calculated
                    displayCalculatedTraces(calculatedTraces);
                }

            } catch (error) {
                console.error('Error calculating traces:', error);
                console.error('Error stack:', error.stack);
            }
        }

        function displayCalculatedTraces(traces) {
            const container = document.getElementById('computed-traces');
            if (!container) return;
            container.innerHTML = '';
            
            if (traces.length === 0) {
                container.innerHTML = '<div class="empty-state">No traces calculated</div>';
                return;
            }
            
            traces.forEach((trace) => {
                const traceItem = document.createElement('div');
                traceItem.className = 'trace-item compact';
                traceItem.innerHTML = `
                    <div class="trace-path compact">
                        ${trace.path.map(task => 
                            `<span class="trace-task">${task.task || task.alt_id} (${task.alt_id})</span>`
                        ).join(' → ')}
                    </div>
                `;
                container.appendChild(traceItem);
            });
        }

        function compareTraces(calculated, expected) {
            // Convert traces to comparable format
            const calcPaths = calculated.map(t => JSON.stringify(t.path.map(task => ({
                id: task.id,
                alt_id: task.alt_id,
                task: task.task
            }))));
            
            const expPaths = expected.map(t => JSON.stringify(t));

            const correct = [];
            const missing = [];
            const wrong = [];
            const matchedCalcIndices = new Set();
            const matchedExpIndices = new Set();

            // Find matches
            expPaths.forEach((expPath, expIndex) => {
                const calcIndex = calcPaths.findIndex((calcPath, idx) => 
                    calcPath === expPath && !matchedCalcIndices.has(idx)
                );
                
                if (calcIndex !== -1) {
                    correct.push({ calc: calcIndex, exp: expIndex });
                    matchedCalcIndices.add(calcIndex);
                    matchedExpIndices.add(expIndex);
                }
            });

            // Find missing (expected but not calculated)
            expPaths.forEach((expPath, expIndex) => {
                if (!matchedExpIndices.has(expIndex)) {
                    missing.push(expIndex);
                }
            });

            // Find wrong (calculated but not expected)
            calcPaths.forEach((calcPath, calcIndex) => {
                if (!matchedCalcIndices.has(calcIndex)) {
                    wrong.push(calcIndex);
                }
            });

            return {
                matching: correct.map(c => c.calc),
                missing: missing,
                wrong: wrong
            };
        }

        function displayComparison(comparison) {
            // Update statistics
            const expectedCount = examples[currentExample].expected ? examples[currentExample].expected.length : (examples[currentExample].expectedCount || 0);
            const computedCount = calculatedTraces.length;
            const matchingCount = comparison.matching.length;
            const missingCount = comparison.missing.length;
            const wrongCount = comparison.wrong.length;

            document.getElementById('expected-count').textContent = expectedCount;
            document.getElementById('computed-count').textContent = computedCount;
            document.getElementById('matching-count').textContent = matchingCount;
            document.getElementById('missing-count').textContent = missingCount;
            document.getElementById('wrong-count').textContent = wrongCount;

            // Display expected traces
            const expectedContainer = document.getElementById('expected-traces');
            expectedContainer.innerHTML = '';
            if (examples[currentExample].expected) {
                examples[currentExample].expected.forEach((trace, index) => {
                    const traceItem = document.createElement('div');
                    traceItem.className = 'trace-item compact';
                    traceItem.innerHTML = `

                            ).join(' → ')}
                        </div>
                    `;
                    expectedContainer.appendChild(traceItem);
                });
            } else {
                expectedContainer.innerHTML = `<div class="empty-state">Expected count: ${expectedCount}</div>`;

            document.getElementById('expected-traces-count').textContent = expectedCount;

            // Display computed traces
            displayCalculatedTraces(calculatedTraces);
            document.getElementById('computed-traces-count').textContent = computedCount;

            // Display matching traces
            const matchingContainer = document.getElementById('matching-traces');
            matchingContainer.innerHTML = '';
            if (comparison.matching.length === 0) {
                matchingContainer.innerHTML = '<div class="empty-state">No matching traces found</div>';
            } else {
                comparison.matching.forEach((calcIndex) => {
                    const trace = calculatedTraces[calcIndex];
                    const traceItem = document.createElement('div');
                    traceItem.className = 'trace-item compact correct';
                    traceItem.innerHTML = `
                        <div class="trace-path compact">
                            ${trace.path.map(task =>

                            ).join(' → ')}
                        </div>
                    `;
                    matchingContainer.appendChild(traceItem);
                });
            }
            document.getElementById('matching-traces-count').textContent = matchingCount;

            // Display missing traces
            const missingContainer = document.getElementById('missing-traces');
            missingContainer.innerHTML = '';
            if (comparison.missing.length === 0) {
                missingContainer.innerHTML = '<div class="empty-state">No missing traces found</div>';
            } else {
                comparison.missing.forEach((expIndex) => {
                    const trace = examples[currentExample].expected[expIndex];

                    traceItem.className = 'trace-item compact missing';
                    traceItem.innerHTML = `
                        <div class="trace-path compact">
                            ${trace.map(task => 
                                `<span class="trace-task">${task.task || task.alt_id} (${task.alt_id})</span>`
                            ).join(' → ')}
                        </div>
                    `;
                    missingContainer.appendChild(traceItem);
                });
            }
            document.getElementById('missing-traces-count').textContent = missingCount;

            // Display wrong traces
            const wrongContainer = document.getElementById('wrong-traces');
            wrongContainer.innerHTML = '';
            if (comparison.wrong.length === 0) {
                wrongContainer.innerHTML = '<div class="empty-state">No wrong traces found</div>';
            } else {
                comparison.wrong.forEach((calcIndex) => {
                    const trace = calculatedTraces[calcIndex];
                    const traceItem = document.createElement('div');
                    traceItem.className = 'trace-item compact wrong';
                    traceItem.innerHTML = `
                        <div class="trace-path compact">
                            ${trace.path.map(task => 
                                `<span class="trace-task">${task.task || task.alt_id} (${task.alt_id})</span>`
                            ).join(' → ')}
                        </div>
                    `;
                    wrongContainer.appendChild(traceItem);
                });
            }
            document.getElementById('wrong-traces-count').textContent = wrongCount;
        }

        // Expose functions globally
        window.calculateTraces = calculateTraces;

        // Load initial example
        loadExample('1528-Step1');
