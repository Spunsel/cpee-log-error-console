        body {

            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            padding: 2rem 0;
        }

        .container {

        }

        .card {

            border: none;
            border-radius: 12px;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        /* Test container - simulate main app structure */
        .test-section {
            /* Add cpee-section class to test CSS effects */
            position: relative;
        }

        .test-section.cpee-section [id*="-graph-container"] {
            min-width: 100%;
            width: max-content;
            position: relative;
        }

        .test-section.cpee-section [id*="-graph-container"] svg {
            width: auto !important;
            max-width: none !important;
            display: block;
        }

        #graph-container {
            min-height: 800px;
            height: 800px;
            background: white;
            border-radius: 8px;
            overflow: auto;
        }

        /* Simulate content-box for preserveHeightDuringTransition */
        .content-box {
            position: relative;
        }

        .content-box.transitioning {
            overflow: hidden;
        }

        .xml-input {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }

        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
        }

        .graph-controls button {
            font-size: 0.8rem;
            padding: 0.25rem 0.5rem;
        }

        /* Toggle buttons to enable/disable features for testing */
        .test-controls {
            background: rgba(255, 255, 255, 0.9);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .test-controls label {
            margin-right: 1rem;
            font-weight: 500;
        }

        .test-controls input[type="checkbox"] {
            margin-right: 0.5rem;
        }

        .toggle-label {
            display: flex;
            align-items: center;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            transition: background-color 0.2s;
            cursor: pointer;
        }

        .toggle-label:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .toggle-label input[type="checkbox"] {
            margin-right: 0.5rem;
            cursor: pointer;
        }

        .toggle-label span {
            user-select: none;
        }
    </style>
</head>

        import { CPEEWfAdaptorRenderer } from '../../../src/components/renderers/CPEEWfAdaptorRenderer.js';

            rawContentRenderer = new RawContentRenderer(domRegistry, eventBus);
            console.log('✅ RawContentRenderer initialized');
        } catch (error) {
            console.warn('⚠️ RawContentRenderer initialization failed:', error);
        }
        
        // Mock step object for raw content rendering
        const createMockStep = (xmlContent) => {
            return {
                getInputCpeeTreeRaw: () => ({
                    getContent: () => xmlContent,
                    getLength: () => xmlContent ? xmlContent.length : 0
                })
            };
        };
        
        // Current mock step
        let currentMockStep = null;
        
        // Setup event listeners (like ContentVisualizationCoordinator)
        function setupEventListeners() {
            // Scale change listener
            eventBus.on('scaleDisplay:scaleChanged', (data) => {
                const scale = data.scale;
                console.log(`[Test] Scale changed to ${scale}x`);
            });
            
            // Theme change listener
            eventBus.on('themeSelector:themeChanged', async (data) => {
                const theme = data.theme;
                console.log(`[Test] Theme changed to ${theme}, would re-render CPEE graphs...`);
                // In test, we could re-render here if needed
            });
            
            // Dark mode change listener
            eventBus.on('darkMode:toggled', async (data) => {
                const isDark = data.isDark;
                console.log(`[Test] Dark mode toggled to ${isDark}, would re-render all graphs...`);
                // In test, we could re-render here if needed
            });
            
            // View mode change listener (like RawContentCoordinator)
            eventBus.on('viewModeToggle:modeChanged', (data) => {
                const { sectionId, mode } = data;
                console.log(`[Test] View mode changed: ${sectionId} → ${mode}`);
                handleViewModeChange(sectionId, mode);
            });
            
            console.log('✅ Event listeners setup complete');
        }
        
        // Handle view mode changes (like RawContentCoordinator.updateSectionDisplay)
        function handleViewModeChange(sectionId, mode) {
            const sectionElement = document.getElementById(sectionId);
            if (!sectionElement) {
                console.warn(`[Test] Section element not found: ${sectionId}`);
                return;
            }
            
            const contentBox = sectionElement.querySelector('.content-box');
            if (!contentBox) {
                console.warn(`[Test] Content box not found in section: ${sectionId}`);
                return;
            }
            
            if (mode === 'raw' || mode === 'log') {
                // Scroll to top
                contentBox.scrollTo({ top: 0, left: 0 });
                
                // Store view mode in section element
                sectionElement.dataset.viewMode = mode;
                
                // Display raw content
                if (rawContentRenderer && currentMockStep) {
                    rawContentRenderer.displayRawContent(sectionId, contentBox, currentMockStep, mode);
                    console.log(`✅ Displayed ${mode} content for ${sectionId}`);
                }
            } else if (mode === 'traces') {
                // Scroll to top
                contentBox.scrollTo({ top: 0, left: 0 });
                
                // Store view mode in section element
                sectionElement.dataset.viewMode = mode;
                
                // Display traces content
                if (rawContentRenderer && currentMockStep) {
                    rawContentRenderer.displayRawContent(sectionId, contentBox, currentMockStep, 'traces');
                    console.log(`✅ Displayed traces content for ${sectionId}`);
                }
            } else {
                // Visual mode - restore visual content
                delete sectionElement.dataset.viewMode;
                
                // Hide raw/log/traces content
                if (rawContentRenderer) {
                    rawContentRenderer.hideRawContent(contentBox);
                }
                
                // Restore visual content (like ContentVisualizationCoordinator.restoreVisualContent)
                contentBox.style.position = 'relative';
                contentBox.style.overflow = 'auto';
                
                // Show all visual content
                const visualElements = contentBox.querySelectorAll('[data-content-type="visual"]');
                visualElements.forEach(el => {
                    el.style.display = 'block';
                    el.style.visibility = 'visible';
                    el.style.pointerEvents = 'auto';
                    el.style.zIndex = '1';
                });
                
                console.log(`✅ Restored visual content for ${sectionId}`);
            }
        }
        
        // Attach view mode toggle buttons to section (like RawContentCoordinator.setupForStep)
        function attachViewModeToggle() {
            if (!viewModeToggle) {
                console.warn('⚠️ ViewModeToggle not available');
                return;
            }
            
            const sectionElement = document.getElementById('input-cpee');
            if (!sectionElement) {
                return;
            }
            
            // Check if toggle already exists
            const existingToggle = sectionElement.querySelector('.view-mode-toggle');
            if (existingToggle) {
                return; // Already attached
            }
            
            // Get the left-title-side span (created by ViewModeToggle)
            const header = sectionElement.querySelector('h3');
            if (!header) {
                return;
            }
            
            let leftTitleSide = header.querySelector('.left-title-side');
            if (!leftTitleSide) {
                leftTitleSide = document.createElement('span');
                leftTitleSide.className = 'left-title-side';
                header.appendChild(leftTitleSide);
            }
            
            // Create toggle button
            const toggleButton = viewModeToggle.createToggleButton('input-cpee', 'Input CPEE-Tree');
            leftTitleSide.appendChild(toggleButton);
            
            console.log('✅ View mode toggle attached to input-cpee section');
        }

        // Simulate createGraphContainer from ContentVisualizationCoordinator
        // This matches the main app's createGraphContainer which uses domRegistry.createElement
        function createGraphContainer(type, useDomRegistry = false) {
            const uniqueId = `${type}-${Date.now()}`;
            const containerConfig = configManager.get('rendering.containers.graphContainer');
            
            let container;
            if (useDomRegistry && domRegistry) {
                // Use domRegistry.createElement exactly like main app
                container = domRegistry.createElement('div', {
                    id: uniqueId,
                    className: 'graph-container'
                }, containerConfig);
            } else {
                // Create element manually
                container = document.createElement('div');
                container.id = uniqueId;
                container.className = 'graph-container';
                
                // Apply styles from containerConfig (like domRegistry does)
                if (containerConfig) {
                    Object.entries(containerConfig).forEach(([key, value]) => {
                        if (key !== 'className' && key !== 'id') {
                            container.style[key] = value;
                        }
                    });
                }
            }
            
            return container;
        }

        // Simulate preserveHeightDuringTransition from ContentVisualizationCoordinator
        function preserveHeightDuringTransition(element) {
            const currentHeight = element.offsetHeight;
            const contentBox = element.closest('.content-box') || element;
            
            // Add transitioning class to hide overflow
            contentBox.classList.add('transitioning');
            
            const minHeightValue = 100; // Default min height
            
            if (currentHeight > minHeightValue) {
                element.style.height = currentHeight + 'px';
            }
            
            // Return cleanup function
            return () => {
                requestAnimationFrame(() => {
                    element.style.height = 'auto';
                    contentBox.classList.remove('transitioning');
                    // Force layout recalculation
                    void element.offsetHeight;
                });
            };
        }

        // Initialize the authentic CPEE renderer
        let renderer = null;
        let currentCleanup = null;
        
        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const useEventBus = document.getElementById('enable-eventbus').checked;
                renderer = new CPEEWfAdaptorRenderer(useEventBus ? eventBus : null);
                
                // Set up post-render callback (like main app)
                renderer.setPostRenderCallback((sectionId, svgElement) => {
                    console.log(`[Test] Post-render callback for ${sectionId}`);
                    
                    // Add cpee-section class if enabled
                    const enableCpeeClass = document.getElementById('enable-cpee-section-class').checked;
                    const useFullStructure = document.getElementById('enable-full-structure').checked;
                    if (enableCpeeClass) {
                        if (useFullStructure) {
                            const section = document.getElementById('input-cpee');
                            section.classList.add('cpee-section');
                        } else {
                            const wrapper = document.getElementById('graph-wrapper-simple');
                            wrapper.classList.add('cpee-section');
                        }
                        console.log('✅ Added .cpee-section class');
                    }
                    
                    // Mark visual content with data-content-type="visual" (needed for view mode switching)
                    const enableViewModeToggle = document.getElementById('enable-view-mode-toggle').checked;
                    if (enableViewModeToggle) {
                        if (useFullStructure) {
                            const contentBox = document.querySelector('#input-cpee .content-box');
                            if (contentBox) {
                                // Find the graph container and mark it as visual content
                                const graphContainer = contentBox.querySelector('[id*="-graph-container"]');
                                if (graphContainer && !graphContainer.hasAttribute('data-content-type')) {
                                    graphContainer.setAttribute('data-content-type', 'visual');
                                    console.log('✅ Marked graph container as data-content-type="visual"');
                                }
                            }
                        } else {
                            // Also mark for simple structure
                            const graphContainer = document.getElementById('graph-container');
                            if (graphContainer && !graphContainer.hasAttribute('data-content-type')) {
                                graphContainer.setAttribute('data-content-type', 'visual');
                                console.log('✅ Marked graph container (simple) as data-content-type="visual"');
                            }
                        }
                    }
                    
                    // Register with HighlightCoordinator if enabled
                    const enableHighlight = document.getElementById('enable-highlight-coordinator').checked;
                    if (enableHighlight && highlightCoordinator) {
                        highlightCoordinator.registerSection('input-cpee', svgElement);
                        highlightCoordinator.attachCPEEClickHandlers(svgElement, 'input-cpee');
                        console.log('✅ HighlightCoordinator registered section and attached click handlers');
                    }
                    
                    // Simulate adjustSVGHeight() call (happens in main app after rendering)
                    // This modifies SVG height using getBBox() which could affect rendering
                    const enableAdjustHeight = document.getElementById('enable-adjust-height').checked;
                    if (enableAdjustHeight) {
                        setTimeout(() => {
                            if (renderer && renderer.svgContainer) {
                                try {
                                    const svg = renderer.svgContainer;
                                    if (svg.children && svg.children.length > 0) {
                                        const bbox = svg.getBBox();
                                        if (bbox && !isNaN(bbox.height) && bbox.height > 0) {
                                            const requiredHeight = Math.max(bbox.height + bbox.y + 20, 100);
                                            svg.setAttribute('height', requiredHeight.toString());
                                            svg.style.height = requiredHeight + 'px';
                                            console.log('✅ adjustSVGHeight() applied, height:', requiredHeight);
                                        }
                                    }
                                } catch (error) {
                                    console.warn('⚠️ adjustSVGHeight() failed:', error);
                                }
                            }
                        }, 100);
                    }
                    
                    // Auto-apply scale if enabled
                    const autoApplyScale = document.getElementById('auto-apply-scale').checked;
                    if (autoApplyScale) {
                        setTimeout(() => {
                            const scaleValue = parseFloat(document.getElementById('scale-select').value);
                            const useFullStructure = document.getElementById('enable-full-structure').checked;
                            const containerId = useFullStructure ? 'graph-container-full' : 'graph-container';
                            const container = document.getElementById(containerId);
                            const svgContainer = container.querySelector('[id*="graphcanvas-"]') || 
                                                container.querySelector('svg');
                            if (svgContainer) {
                                const success = SVGScaleUtility.applyScale(svgContainer, scaleValue, 'cpee');
                                if (success) {
                                    console.log(`✅ Auto-applied scale: ${scaleValue}x`);
                                    updateScaleInfo();
                                } else {
                                    console.warn('⚠️ Failed to auto-apply scale');
                                }
                            }
                        }, 200); // Small delay to ensure SVG is fully rendered
                    }
                });
                
                // Determine which container to use based on full structure toggle
                const useFullStructure = document.getElementById('enable-full-structure').checked;
                const containerId = useFullStructure ? 'graph-container-full' : 'graph-container';
                
                await renderer.initialize(containerId, 'status-message', 'xml-input');
                console.log('🏛️ Authentic CPEE renderer ready');
                
                // Setup event listeners (like ContentVisualizationCoordinator)
                setupEventListeners();
                
                // Auto-render the example after a short delay
                setTimeout(() => {
                    document.getElementById('render-btn').click();
                }, 1000);
                
            } catch (error) {
                console.error('Failed to initialize renderer:', error);
                document.getElementById('status-message').innerHTML = 
                    '<div class="alert alert-danger">Failed to initialize CPEE renderer: ' + error.message + '</div>';
                document.getElementById('status-message').style.display = 'block';
            }
        });

        // Event handlers
        document.getElementById('render-btn').addEventListener('click', async () => {
            const xmlInput = document.getElementById('xml-input');
            if (!xmlInput.value.trim()) {
                renderer.showStatus('❌ Please enter CPEE XML', 'error');
                return;
            }

            try {
                const useFullStructure = document.getElementById('enable-full-structure').checked;
                const graphWrapper = useFullStructure ? 
                    document.getElementById('input-cpee') : 
                    document.getElementById('graph-wrapper-simple');
                const graphContainer = useFullStructure ? 
                    document.getElementById('graph-container-full') : 
                    document.getElementById('graph-container');
                const inputCpeeContent = useFullStructure ?
                    document.getElementById('input-cpee-content') :
                    document.getElementById('input-cpee-content-simple');
                
                // Show/hide appropriate structure
                if (useFullStructure) {
                    document.getElementById('graph-wrapper-simple').style.display = 'none';
                    document.getElementById('input-cpee').style.display = 'block';
                } else {
                    document.getElementById('graph-wrapper-simple').style.display = 'block';
                    document.getElementById('input-cpee').style.display = 'none';
                }
                
                // Clean up previous state
                if (currentCleanup) {
                    currentCleanup();
                }
                
                // Remove cpee-section class if it was added (for simple structure)
                if (!useFullStructure) {
                    const simpleWrapper = document.getElementById('graph-wrapper-simple');
                    if (simpleWrapper) {
                        simpleWrapper.classList.remove('cpee-section');
                    }
                }
                
                // Simulate preserveHeightDuringTransition on the correct element
                const enablePreserveHeight = document.getElementById('enable-preserve-height').checked;
                if (enablePreserveHeight) {
                    const targetElement = useFullStructure ? inputCpeeContent : graphWrapper;
                    currentCleanup = preserveHeightDuringTransition(targetElement);
                    console.log('✅ preserveHeightDuringTransition applied');
                }
                
                // Simulate createGraphContainer if enabled
                const enableCreateContainer = document.getElementById('enable-create-container').checked;
                const enableContainerConfig = document.getElementById('enable-container-config').checked;
                const enableDomRegistry = document.getElementById('enable-dom-registry').checked;
                
                if (enableCreateContainer) {
                    // Clear and recreate container
                    if (useFullStructure) {
                        inputCpeeContent.innerHTML = '';
                    } else {
                        graphContainer.innerHTML = '';
                    }
                    
                    const newContainer = createGraphContainer('input-cpee', enableDomRegistry);
                    
                    // Apply container config styles if enabled (like domRegistry does)
                    // Note: domRegistry already applies these, so only do it if not using domRegistry
                    if (enableContainerConfig && !enableDomRegistry) {
                        const containerConfig = configManager.get('rendering.containers.graphContainer');
                        if (containerConfig) {
                            Object.entries(containerConfig).forEach(([key, value]) => {
                                if (key !== 'className' && key !== 'id' && typeof value === 'string') {
                                    newContainer.style[key] = value;
                                }
                            });
                            console.log('✅ Container config styles applied');
                        }
                    }
                    
                    if (useFullStructure) {
                        inputCpeeContent.appendChild(newContainer);
                    } else {
                        graphContainer.appendChild(newContainer);
                    }
                    console.log('✅ createGraphContainer used, new container ID:', newContainer.id);
                    
                    // Re-initialize renderer with new container
                    await renderer.initialize(newContainer.id, 'status-message', 'xml-input');
                }
                
                // Initialize StepSection if enabled (like main app)
                const enableStepSection = document.getElementById('enable-step-section').checked;
                if (enableStepSection && useFullStructure) {
                    try {
                        if (!stepSection) {
                            stepSection = new StepSection('input-cpee', { startCollapsed: false });
                            console.log('✅ StepSection initialized');
                        }
                    } catch (error) {
                        console.warn('⚠️ StepSection initialization failed:', error);
                    }
                }
                
                // Initialize SectionExpandCollapse if enabled (like main app)
                const enableSectionExpand = document.getElementById('enable-section-expand').checked;
                if (enableSectionExpand && useFullStructure && sectionExpandCollapse) {
                    try {
                        const section = document.getElementById('input-cpee');
                        const header = section.querySelector('h3');
                        if (header && !header.querySelector('.section-expand-collapse-btn')) {
                            const expandButton = sectionExpandCollapse.createExpandCollapseButton('input-cpee');
                            header.appendChild(expandButton);
                            console.log('✅ SectionExpandCollapse button added');
                        }
                    } catch (error) {
                        console.warn('⚠️ SectionExpandCollapse setup failed:', error);
                    }
                }
                
                // Store XML for re-rendering (like main app)
                currentInputCpeeXml = xmlInput.value;
                
                // Create/update mock step with current XML
                currentMockStep = createMockStep(xmlInput.value);
                
                // Attach view mode toggle buttons if enabled
                const enableViewModeToggle = document.getElementById('enable-view-mode-toggle').checked;
                if (enableViewModeToggle && useFullStructure && viewModeToggle) {
                    attachViewModeToggle();
                }
                
                // Simulate StepViewer.displayStep() sequence BEFORE rendering
                // 1. Clear highlights from previous step
                const enableHighlightOnStepChange = document.getElementById('enable-highlight-on-step-change').checked;
                if (enableHighlightOnStepChange && highlightCoordinator) {
                    highlightCoordinator.onStepChanged();
                    console.log('✅ Simulated highlightCoordinator.onStepChanged()');
                }
                
                // 2. Set current step mapping (mock task mapping)
                if (enableHighlightOnStepChange && highlightCoordinator) {
                    // Create a mock task mapping (empty for now, but the call is important)
                    highlightCoordinator.setCurrentStepMapping(null); // or create a mock TaskMapping
                    console.log('✅ Simulated highlightCoordinator.setCurrentStepMapping()');
                }
                
                // 3. Simulate StepNavigator.setupNavigation() - inserts navigation-wrapper before processAnalysis
                const enableStepNavigator = document.getElementById('enable-step-navigator').checked;
                if (enableStepNavigator && useFullStructure) {
                    // Check if navigation-wrapper already exists
                    let navWrapper = document.getElementById('navigation-wrapper');
                    if (!navWrapper) {
                        navWrapper = document.createElement('div');
                        navWrapper.id = 'navigation-wrapper';
                        navWrapper.className = 'navigation-wrapper';
                        navWrapper.style.cssText = 'margin-bottom: 1rem; padding: 0.5rem; background: #f8f9fa; border-radius: 4px;';
                        navWrapper.innerHTML = '<div style="text-align: center; color: #666; font-size: 0.9rem;">[Simulated Navigation Wrapper]</div>';
                        
                        // Insert before the section (simulating insertion before processAnalysis)
                        const sectionElement = document.getElementById('input-cpee');
                        if (sectionElement && sectionElement.parentNode) {
                            sectionElement.parentNode.insertBefore(navWrapper, sectionElement);
                            console.log('✅ Simulated StepNavigator.setupNavigation() - inserted navigation-wrapper');
                        }
                    }
                }
                
                // 4. Simulate hiding processAnalysis initially (it's shown after 3x RAF)
                const enableProcessAnalysisVisibility = document.getElementById('enable-process-analysis-visibility').checked;
                if (enableProcessAnalysisVisibility && useFullStructure) {
                    const sectionElement = document.getElementById('input-cpee');
                    if (sectionElement) {
                        sectionElement.style.display = 'none'; // Hide initially
                        console.log('✅ Simulated hiding processAnalysis initially');
                    }
                }
                
                // Render the graph
                await renderer.renderGraph(xmlInput.value);
                
                // Simulate RawContentCoordinator.setupForStep() -> resetAllViewModes() -> restoreVisualContent()
                // This happens AFTER rendering in the main app and sets contentBox.style.overflow = 'auto'
                // This could cause SVG reflow issues!
                const enableRestoreVisual = document.getElementById('enable-restore-visual').checked;
                const enableRafDelay = document.getElementById('enable-raf-delay').checked;
                
                if (enableRestoreVisual && useFullStructure) {
                    const applyRestoreVisual = () => {
                        const sectionElement = document.getElementById('input-cpee');
                        if (sectionElement) {
                            const contentBox = sectionElement.querySelector('.content-box');
                            if (contentBox) {
                                // Simulate restoreVisualContent() - this sets overflow: auto
                                // This is what happens in ContentVisualizationCoordinator.restoreVisualContent()
                                contentBox.style.position = 'relative';
                                contentBox.style.overflow = 'auto';
                                console.log('✅ Simulated restoreVisualContent() - set contentBox.style.overflow = "auto"');
                                
                                // Also simulate showing visual elements (though they don't have data-content-type="visual" yet)
                                const visualElements = contentBox.querySelectorAll('[data-content-type="visual"]');
                                visualElements.forEach(el => {
                                    el.style.display = 'block';
                                    el.style.visibility = 'visible';
                                    el.style.pointerEvents = 'auto';
                                    el.style.zIndex = '1';
                                });
                            }
                        }
                    };
                    
                    if (enableRafDelay) {
                        // Simulate the multiple requestAnimationFrame calls from StepViewer.displayStep()
                        // This waits for DOM updates to complete before showing content
                        new Promise(resolve => {
                            requestAnimationFrame(() => {
                                requestAnimationFrame(() => {
                                    requestAnimationFrame(() => {
                                        resolve();
                                    });
                                });
                            });
                        }).then(() => {
                            applyRestoreVisual();
                        });
                    } else {
                        setTimeout(() => {
                            applyRestoreVisual();
                        }, 100); // Small delay to ensure rendering is complete
                    }
                }
                
                // Simulate the final part of StepViewer.displayStep() - show processAnalysis after 3x RAF
                if (enableProcessAnalysisVisibility && useFullStructure) {
                    // Wait for all DOM elements to be finished setting up (3x requestAnimationFrame)
                    await new Promise(resolve => {
                        requestAnimationFrame(() => {
                            requestAnimationFrame(() => {
                                requestAnimationFrame(() => {
                                    resolve();
                                });
                            });
                        });
                    });
                    
                    // Now show the processAnalysis section (removeClass('processAnalysis', 'hidden'))
                    const sectionElement = document.getElementById('input-cpee');
                    if (sectionElement) {
                        sectionElement.style.display = 'block'; // Show after setup complete
                        console.log('✅ Simulated showing processAnalysis after 3x RAF');
                    }
                }
                
                // Update scale info after rendering
                setTimeout(() => {
                    updateScaleInfo();
                }, 300);
                
                // Clean up preserveHeightAfterTransition
                if (currentCleanup) {
                    setTimeout(() => {
                        currentCleanup();
                        currentCleanup = null;
                    }, 100);
                }
                
            } catch (error) {
                console.error('Error rendering graph:', error);
                renderer.showStatus('❌ Error: ' + error.message, 'error');
            }
        });

        // SVGScaleUtility test functions
        function getCurrentSvgElement() {
            const useFullStructure = document.getElementById('enable-full-structure').checked;
            const containerId = useFullStructure ? 'graph-container-full' : 'graph-container';
            const container = document.getElementById(containerId);
            if (!container) return null;
            
            // Try to find CPEE SVG element
            const svgElement = container.querySelector('[id*="graphcanvas-"]') || 
                             container.querySelector('svg');
            return svgElement;
        }
        
        // Enable/Disable all toggles
        function setupToggleControls() {
            const allToggles = [
                'enable-cpee-section-class',
                'enable-highlight-coordinator',
                'enable-preserve-height',
                'enable-create-container',
                'enable-eventbus',
                'enable-adjust-height',
                'enable-container-config',
                'enable-step-section',
                'enable-section-expand',
                'enable-dom-registry',
                'enable-full-structure',
                'enable-restore-visual',
                'enable-raf-delay',
                'enable-view-mode-toggle',
                'enable-step-navigator',
                'enable-highlight-on-step-change',
                'enable-process-analysis-visibility'
            ];
            
            document.getElementById('enable-all-btn').addEventListener('click', () => {
                allToggles.forEach(id => {
                    const checkbox = document.getElementById(id);
                    if (checkbox) checkbox.checked = true;
                });
                console.log('✅ All features enabled');
            });
            
            document.getElementById('disable-all-btn').addEventListener('click', () => {
                allToggles.forEach(id => {
                    const checkbox = document.getElementById(id);
                    if (checkbox) checkbox.checked = false;
                });
                console.log('✅ All features disabled');
            });
        }

        function updateScaleInfo() {
            const infoDiv = document.getElementById('scale-info');
            if (!infoDiv) return;
            
            const svgElement = getCurrentSvgElement();
            
            if (!svgElement) {
                infoDiv.style.display = 'none';
                return;
            }
            
            const currentScale = SVGScaleUtility.getCurrentScale(svgElement);
            const originalDims = SVGScaleUtility.getOriginalDimensions(svgElement);
            const validScales = SVGScaleUtility.getValidScales();
            
            let info = '<strong>Scale Information:</strong><br>';
            info += `Current Scale: ${currentScale !== null ? currentScale + 'x' : 'Unknown'}<br>`;
            if (originalDims) {
                info += `Original Dimensions: ${originalDims.width.toFixed(2)} × ${originalDims.height.toFixed(2)}<br>`;
            }
            info += `Valid Scales: ${validScales.join(', ')}x`;
            
            infoDiv.innerHTML = info;
            infoDiv.style.display = 'block';
        }

        // Setup SVGScaleUtility event listeners after DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            // Setup toggle controls
            setupToggleControls();
            // Apply scale button
            document.getElementById('apply-scale-btn').addEventListener('click', () => {
                const scaleValue = parseFloat(document.getElementById('scale-select').value);
                const svgElement = getCurrentSvgElement();
                
                if (!svgElement) {
                    alert('No SVG element found. Please render a graph first.');
                    return;
                }
                
                const success = SVGScaleUtility.applyScale(svgElement, scaleValue, 'cpee');
                if (success) {
                    console.log(`✅ Applied scale: ${scaleValue}x`);
                    updateScaleInfo();
                } else {
                    console.warn('⚠️ Failed to apply scale');
                    alert('Failed to apply scale. Check console for details.');
                }
            });

            // Remove scale button (reset to 1.0)
            document.getElementById('remove-scale-btn').addEventListener('click', () => {
                const svgElement = getCurrentSvgElement();
                
                if (!svgElement) {
                    alert('No SVG element found. Please render a graph first.');
                    return;
                }
                
                const success = SVGScaleUtility.removeScale(svgElement, 'cpee');
                if (success) {
                    console.log('✅ Reset scale to 1.0x');
                    document.getElementById('scale-select').value = '1.0';
                    updateScaleInfo();
            } else {
                    console.warn('⚠️ Failed to reset scale');
                    alert('Failed to reset scale. Check console for details.');
                }
            });

            // Get current scale button
            document.getElementById('get-current-scale-btn').addEventListener('click', () => {
                const svgElement = getCurrentSvgElement();
                
                if (!svgElement) {
                    alert('No SVG element found. Please render a graph first.');
                    return;
                }
                
                const currentScale = SVGScaleUtility.getCurrentScale(svgElement);
                if (currentScale !== null) {
                    alert(`Current Scale: ${currentScale}x`);
                    console.log(`Current Scale: ${currentScale}x`);
                } else {
                    alert('Could not determine current scale.');
                    console.warn('Could not determine current scale');
                }
                updateScaleInfo();
            });

            // Get original dimensions button
            document.getElementById('get-original-dims-btn').addEventListener('click', () => {
                const svgElement = getCurrentSvgElement();
                
                if (!svgElement) {
                    alert('No SVG element found. Please render a graph first.');
                    return;
                }
                
                const dims = SVGScaleUtility.getOriginalDimensions(svgElement);
                if (dims) {
                    alert(`Original Dimensions:\nWidth: ${dims.width.toFixed(2)}px\nHeight: ${dims.height.toFixed(2)}px`);
                    console.log('Original Dimensions:', dims);
                } else {
                    alert('Could not get original dimensions.');
                    console.warn('Could not get original dimensions');
                }
                updateScaleInfo();
            });

            // Get valid scales button
            document.getElementById('get-valid-scales-btn').addEventListener('click', () => {
                const validScales = SVGScaleUtility.getValidScales();
                alert(`Valid Scale Levels:\n${validScales.join(', ')}x`);
                console.log('Valid Scales:', validScales);
                updateScaleInfo();
            });

            // Update scale info when scale select changes
            document.getElementById('scale-select').addEventListener('change', () => {
                updateScaleInfo();
            });
        });

    </script>
</body>
</html>
