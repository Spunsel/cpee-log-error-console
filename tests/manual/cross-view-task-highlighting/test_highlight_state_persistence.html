<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Highlight State Persistence Test - Phase 22.6</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
            background: #f8fafc;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #2563eb;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .test-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .test-section h2 {
            color: #1e293b;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 16px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        button:hover {
            background: #1d4ed8;
        }

        .content-box {
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 15px;
            background: #f9fafb;
            margin: 20px 0;
        }

        .content-box h3 {
            color: #374151;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .content-box svg {
            border: 1px solid #d1d5db;
            background: white;
            width: 100%;
            height: 150px;
        }

        #console {
            margin-top: 20px;
            padding: 15px;
            background: #1e293b;
            color: #e2e8f0;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
        }

        .log-entry {
            margin-bottom: 8px;
            padding: 8px;
            background: rgba(255,255,255,0.05);
            border-left: 3px solid #60a5fa;
        }

        .state-display {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
        }

        .state-display h3 {
            color: #374151;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .state-value {
            font-family: 'Courier New', monospace;
            background: white;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #d1d5db;
        }

        /* Include highlight styles */
        :root {
            --highlight-stroke: #2563eb;
            --highlight-active-stroke: #1d4ed8;
        }

        .task-highlighted {
            stroke: var(--highlight-stroke) !important;
            stroke-width: 3px !important;
            opacity: 1 !important;
            filter: drop-shadow(0 0 4px #60a5fa);
        }

        .task-highlighted-active {
            stroke: var(--highlight-active-stroke) !important;
            stroke-width: 4px !important;
            opacity: 1 !important;
            filter: drop-shadow(0 0 6px #3b82f6);
        }

        .task-clickable {
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .task-clickable:hover {
            filter: brightness(1.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💾 Highlight State Persistence Test</h1>
        <p class="subtitle">Test highlight state management across view changes and step navigation - Phase 22.6</p>

        <div class="test-section">
            <h2>Simulation Controls</h2>
            <div class="controls">
                <button id="btn-click-task1">Click Task 1</button>
                <button id="btn-click-task2">Click Task 2</button>
                <button id="btn-click-task1-again">Click Task 1 Again (Toggle)</button>
                <button id="btn-step-change">Simulate Step Change</button>
                <button id="btn-clear">Clear Highlights</button>
                <button id="btn-clear-console">Clear Console</button>
            </div>
        </div>

        <div class="test-section">
            <h2>Current State</h2>
            <div class="state-display">
                <h3>Active Highlight State</h3>
                <div class="state-value" id="active-state">No active highlight</div>
            </div>
            <div class="state-display">
                <h3>Highlighted Tasks</h3>
                <div class="state-value" id="highlighted-tasks">None</div>
            </div>
        </div>

        <div class="test-section">
            <h2>Test Content</h2>
            <div class="content-box">
                <h3>Current Step Content</h3>
                <svg id="test-graph" width="100%" height="150" viewBox="0 0 400 150">
                    <g class="task-group" id="task-1" data-task-id="task-1">
                        <rect x="50" y="50" width="100" height="50" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
                        <text x="100" y="82" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="600">Task 1</text>
                    </g>
                    <g class="task-group" id="task-2" data-task-id="task-2">
                        <rect x="200" y="50" width="100" height="50" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
                        <text x="250" y="82" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="600">Task 2</text>
                    </g>
                    <g class="task-group" id="task-3" data-task-id="task-3">
                        <rect x="350" y="50" width="100" height="50" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
                        <text x="400" y="82" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="600">Task 3</text>
                    </g>
                </svg>
            </div>
        </div>

        <div class="test-section">
            <h2>Console Output</h2>
            <div id="console"></div>
        </div>
    </div>

    <script type="module">
        import { CrossViewHighlightManager } from '../../../src/components/coordinators/CrossViewHighlightManager.js';

        // Create mock DOM registry
        const domRegistry = {
            getElementSafe: (id) => document.getElementById(id)
        };

        // Initialize manager
        const crossViewManager = new CrossViewHighlightManager(domRegistry);
        
        // Register the single section for this test
        const container = document.getElementById('test-graph');
        if (container) {
            crossViewManager.registerSection('test-section', container);
        }

        let clickCount = 0;

        // Setup event listeners
        function setupEventListeners() {
            document.getElementById('btn-click-task1').addEventListener('click', () => {
                simulateTaskClick('task-1');
            });
            document.getElementById('btn-click-task2').addEventListener('click', () => {
                simulateTaskClick('task-2');
            });
            document.getElementById('btn-click-task1-again').addEventListener('click', () => {
                simulateTaskClick('task-1');
            });
            document.getElementById('btn-step-change').addEventListener('click', simulateStepChange);
            document.getElementById('btn-clear').addEventListener('click', clearHighlights);
            document.getElementById('btn-clear-console').addEventListener('click', clearConsole);
        }

        // Controls
        function simulateTaskClick(taskId) {
            clickCount++;
            log(`Click #${clickCount}: ${taskId}`, 'click');
            crossViewManager.onTaskClicked(taskId, 'test-section', 'test-section');
            updateStateDisplay();
        }

        function simulateStepChange() {
            log('Step changed - clearing highlights', 'state-change');
            crossViewManager.onStepChanged();
            updateStateDisplay();
        }

        function clearHighlights() {
            log('Highlights manually cleared', 'action');
            crossViewManager.clearAllHighlights();
            updateStateDisplay();
        }

        function clearConsole() {
            const consoleDiv = document.getElementById('console');
            consoleDiv.innerHTML = '';
        }

        function updateStateDisplay() {
            const activeState = document.getElementById('active-state');
            const highlightedTasks = document.getElementById('highlighted-tasks');
            
            if (crossViewManager.activeTaskId) {
                activeState.textContent = `Task: ${crossViewManager.activeTaskId}, Section: ${crossViewManager.activeSourceSection}`;
            } else {
                activeState.textContent = 'No active highlight';
            }
            
            const taskCount = crossViewManager.highlightedTasks.size;
            if (taskCount > 0) {
                const tasks = Array.from(crossViewManager.highlightedTasks.values())
                    .map(set => Array.from(set))
                    .flat()
                    .join(', ');
                highlightedTasks.textContent = `${taskCount} sections: [${tasks}]`;
            } else {
                highlightedTasks.textContent = 'None';
            }
        }

        function log(message, type = 'info') {
            const consoleDiv = document.getElementById('console');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            consoleDiv.appendChild(entry);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            console.log(message);
        }

        // Log initialization
        log('CrossViewHighlightManager initialized');
        log('Highlight state persistence test ready');
        updateStateDisplay();
        
        // Setup event listeners
        setupEventListeners();
    </script>
</body>
</html>
