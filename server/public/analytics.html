<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPEE Debug Console — Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #0f1117;
            --bg2: #161822;
            --surface: #1c1e2e;
            --surface2: #252840;
            --border: #2d3154;
            --border2: #3d4172;
            --text: #e2e8f0;
            --text2: #8b92b3;
            --text3: #5c6190;
            --primary: #6366f1;
            --primary-bg: rgba(99,102,241,.12);
            --green: #22c55e;
            --green-bg: rgba(34,197,94,.12);
            --red: #ef4444;
            --red-bg: rgba(239,68,68,.12);
            --orange: #f59e0b;
            --orange-bg: rgba(245,158,11,.12);
            --cyan: #06b6d4;
            --cyan-bg: rgba(6,182,212,.12);
            --purple: #a855f7;
            --purple-bg: rgba(168,85,247,.12);
            --pink: #ec4899;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 2px 8px rgba(0,0,0,.3);
            --transition: .2s ease;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg); color: var(--text); line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text3); }

        /* Header */
        .header {
            background: var(--surface); border-bottom: 1px solid var(--border);
            padding: 16px 32px; display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100; backdrop-filter: blur(12px);
        }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .header h1 { font-size: 18px; font-weight: 700; letter-spacing: -.3px; }
        .header h1 span { color: var(--primary); }
        .header .meta { font-size: 12px; color: var(--text3); }
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .btn {
            border: 1px solid var(--border); background: var(--surface2); color: var(--text);
            padding: 7px 14px; border-radius: var(--radius-sm); cursor: pointer;
            font-size: 12px; font-weight: 500; transition: all var(--transition);
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn:hover { border-color: var(--primary); background: var(--primary-bg); }
        .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
        .btn-primary:hover { opacity: .9; }
        .auto-refresh-indicator {
            width: 7px; height: 7px; border-radius: 50%; background: var(--green);
            display: inline-block; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }

        /* Layout */
        .container { max-width: 1600px; margin: 0 auto; padding: 24px 32px; }

        /* Nav tabs */
        .nav-tabs {
            display: flex; gap: 4px; margin-bottom: 24px; background: var(--surface);
            border: 1px solid var(--border); border-radius: var(--radius); padding: 4px;
            overflow-x: auto;
        }
        .nav-tab {
            padding: 8px 18px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500;
            color: var(--text2); cursor: pointer; white-space: nowrap; transition: all var(--transition);
            border: none; background: transparent;
        }
        .nav-tab:hover { color: var(--text); background: var(--surface2); }
        .nav-tab.active { color: #fff; background: var(--primary); }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* Grid */
        .grid { display: grid; gap: 16px; margin-bottom: 20px; }
        .grid-4 { grid-template-columns: repeat(4, 1fr); }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-2 { grid-template-columns: repeat(2, 1fr); }
        .grid-2-1 { grid-template-columns: 2fr 1fr; }
        .grid-1-2 { grid-template-columns: 1fr 2fr; }
        @media (max-width: 1200px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) {
            .grid-4, .grid-3, .grid-2, .grid-2-1, .grid-1-2 { grid-template-columns: 1fr; }
            .container { padding: 16px; }
            .header { padding: 12px 16px; }
        }

        /* Cards */
        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow);
            transition: border-color var(--transition);
        }
        .card:hover { border-color: var(--border2); }
        .card-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 16px;
        }
        .card-title {
            font-size: 13px; font-weight: 600; color: var(--text2);
            text-transform: uppercase; letter-spacing: .5px;
        }
        .card-badge {
            font-size: 11px; padding: 2px 8px; border-radius: 12px;
            font-weight: 600;
        }

        /* KPI stat cards */
        .kpi { display: flex; flex-direction: column; gap: 2px; }
        .kpi-icon {
            width: 36px; height: 36px; border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; margin-bottom: 12px;
        }
        .kpi-value { font-size: 28px; font-weight: 800; letter-spacing: -.5px; color: var(--text); }
        .kpi-label { font-size: 12px; color: var(--text2); margin-top: 2px; }
        .kpi-sublabel { font-size: 11px; color: var(--text3); margin-top: 2px; }
        .kpi-trend { font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 3px; }
        .kpi-trend.up { color: var(--green); }
        .kpi-trend.down { color: var(--red); }

        /* Chart containers */
        .chart-container { position: relative; }
        .chart-container canvas { max-height: 260px; }
        .chart-container-lg canvas { max-height: 320px; }

        /* Tables */
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td {
            text-align: left; padding: 10px 14px;
            border-bottom: 1px solid var(--border);
        }
        th {
            font-weight: 600; color: var(--text2); font-size: 11px;
            text-transform: uppercase; letter-spacing: .5px;
            background: var(--bg2); position: sticky; top: 0; z-index: 1;
        }
        td { color: var(--text); }
        tr:hover td { background: rgba(99,102,241,.04); }
        .table-scroll { max-height: 420px; overflow-y: auto; border-radius: var(--radius-sm); }

        /* Badges */
        .badge {
            display: inline-block; padding: 3px 10px; border-radius: 12px;
            font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px;
        }
        .badge-primary { background: var(--primary-bg); color: var(--primary); }
        .badge-green { background: var(--green-bg); color: var(--green); }
        .badge-red { background: var(--red-bg); color: var(--red); }
        .badge-orange { background: var(--orange-bg); color: var(--orange); }
        .badge-cyan { background: var(--cyan-bg); color: var(--cyan); }
        .badge-purple { background: var(--purple-bg); color: var(--purple); }

        /* Progress bars */
        .progress-bar {
            height: 8px; background: var(--bg2); border-radius: 4px;
            overflow: hidden; position: relative;
        }
        .progress-fill {
            height: 100%; border-radius: 4px;
            transition: width .6s ease;
        }

        /* Search/filter */
        .search-input {
            background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm);
            color: var(--text); padding: 7px 12px; font-size: 12px; width: 220px;
            outline: none; transition: border-color var(--transition);
        }
        .search-input:focus { border-color: var(--primary); }
        .search-input::placeholder { color: var(--text3); }

        /* Event stream */
        .event-stream { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace; }
        .event-time { color: var(--text3); white-space: nowrap; font-size: 11px; }
        .event-name { font-weight: 600; color: var(--cyan); }

        /* Heatmap */
        .heatmap { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; }
        .heatmap-cell {
            aspect-ratio: 1; border-radius: 3px; position: relative;
            transition: transform var(--transition);
        }
        .heatmap-cell:hover { transform: scale(1.3); z-index: 1; }
        .heatmap-labels { display: flex; justify-content: space-between; margin-top: 6px; }
        .heatmap-labels span { font-size: 10px; color: var(--text3); }

        /* Section spacing */
        .section-title {
            font-size: 16px; font-weight: 700; color: var(--text);
            margin-bottom: 16px; letter-spacing: -.3px;
        }
        .section-divider { border: none; border-top: 1px solid var(--border); margin: 8px 0 24px; }

        /* Empty state */
        .empty-state {
            text-align: center; padding: 32px; color: var(--text3); font-size: 13px;
        }

        /* Loading */
        .loading {
            text-align: center; padding: 80px 40px; color: var(--text2); font-size: 14px;
        }
        .loading-spinner {
            width: 32px; height: 32px; border: 3px solid var(--border);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin .8s linear infinite; margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { color: var(--red); padding: 40px; text-align: center; font-size: 14px; }

        /* Tooltips on table */
        [data-tooltip] { position: relative; cursor: default; }
        [data-tooltip]:hover::after {
            content: attr(data-tooltip); position: absolute; bottom: 100%; left: 50%;
            transform: translateX(-50%); background: var(--surface2); color: var(--text);
            padding: 4px 8px; border-radius: 4px; font-size: 11px; white-space: nowrap;
            box-shadow: var(--shadow); z-index: 10; pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div>
                <h1><span>CPEE</span> Debug Console Analytics</h1>
                <div class="meta" id="lastUpdated">Loading...</div>
            </div>
        </div>
        <div class="header-actions">
            <span id="autoRefreshDot" class="auto-refresh-indicator" style="display:none" title="Auto-refreshing every 30s"></span>
            <button class="btn" onclick="toggleAutoRefresh()" id="autoRefreshBtn">Auto-refresh: Off</button>
            <button class="btn" onclick="exportData()" title="Export raw JSON data">Export</button>
            <button class="btn btn-primary" onclick="loadData()">Refresh</button>
        </div>
    </div>

    <div class="container">
        <div class="nav-tabs" id="navTabs">
            <button class="nav-tab active" data-tab="overview">Overview</button>
            <button class="nav-tab" data-tab="users">Users & Sessions</button>
            <button class="nav-tab" data-tab="features">Features & Events</button>
            <button class="nav-tab" data-tab="performance">Performance</button>
            <button class="nav-tab" data-tab="analysis">Analysis Results</button>
            <button class="nav-tab" data-tab="stream">Event Stream</button>
        </div>
        <div id="content"><div class="loading"><div class="loading-spinner"></div>Loading analytics...</div></div>
    </div>

<script>
const TOKEN = new URLSearchParams(window.location.search).get('token') || '';
const API_HEADERS = TOKEN ? { 'X-Analytics-Token': TOKEN } : {};
let _stats = null, _sessions = null, _events = null;
let _autoRefreshTimer = null;
let _charts = {};

async function api(path) {
    const res = await fetch(path, { headers: API_HEADERS });
    if (!res.ok) { throw new Error(`API ${path}: ${res.status}`); }
    return res.json();
}

async function loadData() {
    try {
        const [stats, sessions, events] = await Promise.all([
            api('/api/telemetry/stats'),
            api('/api/telemetry/sessions'),
            api('/api/telemetry/events')
        ]);
        _stats = stats; _sessions = sessions; _events = events;
        renderAll();
        document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    } catch (err) {
        document.getElementById('content').innerHTML = `<div class="error">Failed to load: ${err.message}</div>`;
    }
}

function renderAll() {
    destroyAllCharts();
    const el = document.getElementById('content');
    el.innerHTML = `
        <div class="tab-panel active" id="panel-overview"></div>
        <div class="tab-panel" id="panel-users"></div>
        <div class="tab-panel" id="panel-features"></div>
        <div class="tab-panel" id="panel-performance"></div>
        <div class="tab-panel" id="panel-analysis"></div>
        <div class="tab-panel" id="panel-stream"></div>
    `;
    renderOverview();
    renderUsers();
    renderFeatures();
    renderPerformance();
    renderAnalysis();
    renderStream();
    activateTab(document.querySelector('.nav-tab.active').dataset.tab);
}

// ── Tab Navigation ──────────────────────────────────────────────────────────

document.getElementById('navTabs').addEventListener('click', e => {
    const tab = e.target.closest('.nav-tab');
    if (!tab) return;
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activateTab(tab.dataset.tab);
});

function activateTab(tabId) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    const panel = document.getElementById('panel-' + tabId);
    if (panel) panel.classList.add('active');
}

// ── Auto Refresh ────────────────────────────────────────────────────────────

function toggleAutoRefresh() {
    if (_autoRefreshTimer) {
        clearInterval(_autoRefreshTimer);
        _autoRefreshTimer = null;
        document.getElementById('autoRefreshBtn').textContent = 'Auto-refresh: Off';
        document.getElementById('autoRefreshDot').style.display = 'none';
    } else {
        _autoRefreshTimer = setInterval(loadData, 30000);
        document.getElementById('autoRefreshBtn').textContent = 'Auto-refresh: 30s';
        document.getElementById('autoRefreshDot').style.display = 'inline-block';
    }
}

function exportData() {
    const blob = new Blob([JSON.stringify({ stats: _stats, sessions: _sessions, events: _events }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `telemetry-export-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
}

// ── Chart Helpers ───────────────────────────────────────────────────────────

const C = ['#6366f1','#22c55e','#f59e0b','#ef4444','#a855f7','#06b6d4','#ec4899','#f97316','#14b8a6','#8b5cf6'];
const CHART_DEFAULTS = {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
        legend: { labels: { color: '#8b92b3', font: { size: 11 }, padding: 12, usePointStyle: true, pointStyleWidth: 8 } }
    },
    scales: {
        x: { ticks: { color: '#5c6190', font: { size: 10 } }, grid: { color: '#2d315422' }, border: { color: '#2d3154' } },
        y: { ticks: { color: '#5c6190', font: { size: 10 } }, grid: { color: '#2d315444' }, border: { color: '#2d3154' }, beginAtZero: true }
    }
};

function makeChart(id, cfg) {
    const canvas = document.getElementById(id);
    if (!canvas) return null;
    const chart = new Chart(canvas, cfg);
    _charts[id] = chart;
    return chart;
}

function destroyAllCharts() {
    for (const c of Object.values(_charts)) { try { c.destroy(); } catch {} }
    _charts = {};
}

function doughnutOpts(legendPos = 'right') {
    return {
        responsive: true, maintainAspectRatio: false,
        cutout: '65%',
        plugins: {
            legend: { position: legendPos, labels: { color: '#8b92b3', font: { size: 11 }, padding: 10, usePointStyle: true, pointStyleWidth: 8 } }
        }
    };
}

// ── OVERVIEW TAB ────────────────────────────────────────────────────────────

function renderOverview() {
    const s = _stats;
    const sessions = _sessions;
    const returning = countReturning(sessions);
    const newU = s.uniqueUsers - returning;
    const avgDur = fmtMs(s.avgSessionDurationMs);
    const evtsPerSession = sessions.length > 0 ? (s.totalEvents / sessions.length).toFixed(1) : '0';

    document.getElementById('panel-overview').innerHTML = `
        <div class="grid grid-4">
            <div class="card kpi">
                <div class="kpi-icon" style="background:var(--primary-bg);color:var(--primary)">&#128100;</div>
                <div class="kpi-value">${s.uniqueUsers}</div>
                <div class="kpi-label">Unique Users</div>
                <div class="kpi-sublabel">${newU} new &middot; ${returning} returning</div>
            </div>
            <div class="card kpi">
                <div class="kpi-icon" style="background:var(--green-bg);color:var(--green)">&#128202;</div>
                <div class="kpi-value">${s.totalSessions}</div>
                <div class="kpi-label">Sessions</div>
                <div class="kpi-sublabel">${evtsPerSession} events/session</div>
            </div>
            <div class="card kpi">
                <div class="kpi-icon" style="background:var(--cyan-bg);color:var(--cyan)">&#9889;</div>
                <div class="kpi-value">${s.totalEvents.toLocaleString()}</div>
                <div class="kpi-label">Total Events</div>
                <div class="kpi-sublabel">${Object.keys(s.eventCounts).length} types &middot; ${fmtBytes(s.storageSizeBytes)}</div>
            </div>
            <div class="card kpi">
                <div class="kpi-icon" style="background:var(--orange-bg);color:var(--orange)">&#9201;</div>
                <div class="kpi-value">${avgDur}</div>
                <div class="kpi-label">Avg Session Duration</div>
                <div class="kpi-sublabel">${Object.keys(s.dailyCounts).length} day(s) of data</div>
            </div>
        </div>
        <div class="grid grid-2-1">
            <div class="card">
                <div class="card-header"><span class="card-title">Events & Sessions Over Time</span></div>
                <div class="chart-container chart-container-lg"><canvas id="chartOverviewTimeline" height="300"></canvas></div>
            </div>
            <div class="card">
                <div class="card-header"><span class="card-title">Hourly Activity</span></div>
                <div id="heatmapContainer"></div>
                <div style="margin-top:20px">
                    <div class="card-header"><span class="card-title">Event Categories</span></div>
                    <div class="chart-container"><canvas id="chartOverviewCat" height="180"></canvas></div>
                </div>
            </div>
        </div>
        <div class="grid grid-3">
            <div class="card">
                <div class="card-header"><span class="card-title">Browsers</span></div>
                <div class="chart-container" style="height:200px"><canvas id="chartOverviewBrowser"></canvas></div>
            </div>
            <div class="card">
                <div class="card-header"><span class="card-title">Operating Systems</span></div>
                <div class="chart-container" style="height:200px"><canvas id="chartOverviewOS"></canvas></div>
            </div>
            <div class="card">
                <div class="card-header"><span class="card-title">Viewports</span></div>
                <div class="chart-container" style="height:200px"><canvas id="chartOverviewViewport"></canvas></div>
            </div>
        </div>
        <div class="grid grid-2">
            <div class="card">
                <div class="card-header"><span class="card-title">Verification Results</span></div>
                <div class="chart-container" style="height:200px"><canvas id="chartOverviewVerify"></canvas></div>
            </div>
            <div class="card">
                <div class="card-header"><span class="card-title">Trace Comparison</span></div>
                <div class="chart-container" style="height:200px"><canvas id="chartOverviewComp"></canvas></div>
            </div>
        </div>
    `;
    // Timeline
    const days = Object.keys(s.dailyCounts).sort();
    const evtData = days.map(d => s.dailyCounts[d]);
    const sesData = days.map(d => s.sessionsPerDay?.[d] || 0);
    makeChart('chartOverviewTimeline', {
        type: 'line',
        data: {
            labels: days,
            datasets: [
                { label: 'Events', data: evtData, borderColor: C[0], backgroundColor: C[0]+'18', fill: true, tension: .4, pointRadius: 3, borderWidth: 2 },
                { label: 'Sessions', data: sesData, borderColor: C[1], backgroundColor: C[1]+'18', fill: true, tension: .4, pointRadius: 3, borderWidth: 2 }
            ]
        },
        options: { ...CHART_DEFAULTS, plugins: { ...CHART_DEFAULTS.plugins, legend: { ...CHART_DEFAULTS.plugins.legend, display: true } } }
    });
    // Heatmap
    buildHeatmap(s.hourlyActivity || []);
    // Categories
    const catSorted = Object.entries(s.categoryCounts).sort((a,b) => b[1]-a[1]);
    makeChart('chartOverviewCat', {
        type: 'bar',
        data: { labels: catSorted.map(e=>e[0]), datasets: [{ data: catSorted.map(e=>e[1]), backgroundColor: C.slice(0,catSorted.length).map(c=>c+'99'), borderColor: C.slice(0,catSorted.length), borderWidth: 1 }] },
        options: { ...CHART_DEFAULTS, indexAxis: 'y', plugins: { legend: { display: false } } }
    });
    // Browser doughnut
    makeDoughnut('chartOverviewBrowser', s.browsers);
    makeDoughnut('chartOverviewOS', s.oses);
    makeDoughnut('chartOverviewViewport', s.viewportCategories || {});
    // Verification
    const v = s.verification || {};
    makeChart('chartOverviewVerify', {
        type: 'bar',
        data: {
            labels: ['Sound', 'Unsound', 'Bounded', 'Unbounded'],
            datasets: [{ data: [v.sound||0, v.unsound||0, v.bounded||0, v.unbounded||0], backgroundColor: [C[1]+'99', C[3]+'99', C[0]+'99', C[2]+'99'], borderColor: [C[1],C[3],C[0],C[2]], borderWidth: 1 }]
        },
        options: { ...CHART_DEFAULTS, plugins: { legend: { display: false } } }
    });
    // Comparison
    const comp = s.comparison || {};
    makeChart('chartOverviewComp', {
        type: 'doughnut',
        data: { labels: ['Match', 'Mismatch'], datasets: [{ data: [comp.match||0, comp.mismatch||0], backgroundColor: [C[1], C[3]] }] },
        options: { ...doughnutOpts(), plugins: { ...doughnutOpts().plugins,
            title: { display: true, text: `${comp.matchRate||0}% match rate (${comp.total||0} total)`, color: '#8b92b3', font: { size: 12 } }
        }}
    });
}

function buildHeatmap(hours) {
    const container = document.getElementById('heatmapContainer');
    if (!container) return;
    const max = Math.max(...hours, 1);
    let cells = '';
    for (let h = 0; h < 24; h++) {
        const intensity = hours[h] / max;
        const bg = intensity === 0 ? 'var(--bg2)' : `rgba(99,102,241,${.15 + intensity * .7})`;
        cells += `<div class="heatmap-cell" style="background:${bg}" data-tooltip="${h}:00 — ${hours[h]} events"></div>`;
    }
    container.innerHTML = `
        <div class="heatmap">${cells}</div>
        <div class="heatmap-labels"><span>0:00</span><span>6:00</span><span>12:00</span><span>18:00</span><span>23:00</span></div>
    `;
}

function makeDoughnut(id, data) {
    const labels = Object.keys(data);
    const values = Object.values(data);
    if (values.every(v => v === 0)) return;
    makeChart(id, { type: 'doughnut', data: { labels, datasets: [{ data: values, backgroundColor: C.slice(0, labels.length) }] }, options: doughnutOpts() });
}

// ── USERS & SESSIONS TAB ────────────────────────────────────────────────────

        const os = s.environment ? parseOSUA(s.environment.userAgent||'') : '—';
        const vp = s.environment ? `${s.environment.viewportWidth||'?'}x${s.environment.viewportHeight||'?'}` : '—';
        const tz = s.environment?.timezone || '—';
        const badgeClass = s.durationMs > 60000 ? 'badge-green' : s.durationMs > 10000 ? 'badge-orange' : 'badge-red';
        return `<tr data-searchable="${esc(s.fingerprint)} ${browser} ${os} ${tz}">
            <td class="event-time">${fmtTime(s.firstSeen)}</td>
            <td data-tooltip="${esc(s.fingerprint)}"><code>${esc((s.fingerprint||'').slice(0,12))}</code></td>
            <td><span class="badge ${badgeClass}">${dur}</span></td>
            <td>${s.eventCount}</td>
            <td>${browser}</td>
            <td>${os}</td>
            <td>${vp}</td>
            <td style="color:var(--text3)">${tz}</td>
        </tr>`;
    }).join('');

        <th>Started</th><th>User</th><th>Duration</th><th>Events</th><th>Browser</th><th>OS</th><th>Viewport</th><th>Timezone</th>
    </tr></thead><tbody>${rows}</tbody></table>`;

// ── Shared Helpers ──────────────────────────────────────────────────────────

function fmtMs(ms) {
    if (!ms && ms !== 0) return '—';
    if (ms < 1000) return ms + 'ms';
    const sec = ms / 1000;
    if (sec < 60) return sec.toFixed(1) + 's';
    return Math.floor(sec / 60) + 'm ' + Math.round(sec % 60) + 's';
}

function fmtBytes(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(1) + ' MB';
}

function fmtTime(ts) {
    if (!ts) return '—';
    const d = new Date(ts);
    return d.toLocaleDateString(undefined, { month:'short', day:'numeric' }) + ' ' + d.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit', second:'2-digit' });
}

function countReturning(sessions) {
    const fp = {};
    for (const s of sessions) { if (s.fingerprint) { fp[s.fingerprint] = (fp[s.fingerprint]||0) + 1; } }
    return Object.values(fp).filter(c => c > 1).length;
}

function categorize(name) {
    if (name.startsWith('session:')) return 'session';
    if (name.startsWith('metric:')) return 'metric';
    if (name.startsWith('trace')) return 'trace';
    if (name.includes('instance') || name.includes('Instance')) return 'instance';
    if (name.includes('step') || name.includes('Step') || name.includes('sidebar') || name.includes('header') || name.includes('keyboard')) return 'navigation';
    if (name.includes('Comparison') || name.includes('comparison')) return 'comparison';
    if (name.includes('Reconciliation') || name.includes('reconciliation')) return 'reconciliation';
    if (name.includes('highlight') || name.includes('Highlight')) return 'highlight';
    if (name.includes('view') || name.includes('View') || name.includes('dark') || name.includes('theme') || name.includes('scale')) return 'ui';
    if (name.includes('verification') || name.includes('reachability')) return 'analysis';
    return 'other';
}

function summarizeData(data) {
    if (!data) return '—';
    if (typeof data === 'string') return data.slice(0, 100);
    const keys = Object.keys(data);
    if (keys.length === 0) return '—';
    const parts = keys.slice(0, 4).map(k => {
        const v = data[k];
        const vs = v === null ? 'null' : typeof v === 'object' ? JSON.stringify(v).slice(0,40) : String(v).slice(0,40);
        return `${k}=${vs}`;
    });
    if (keys.length > 4) parts.push(`+${keys.length-4}`);
    return parts.join(' · ');
}

function parseBrowserUA(ua) {
    if (ua.includes('Firefox/')) return 'Firefox';
    if (ua.includes('Edg/')) return 'Edge';
    if (ua.includes('Chrome/')) return 'Chrome';
    if (ua.includes('Safari/')) return 'Safari';
    return 'Other';
}

function parseOSUA(ua) {
    if (ua.includes('Windows')) return 'Windows';
    if (ua.includes('Mac OS')) return 'macOS';
    if (ua.includes('Linux')) return 'Linux';
    if (ua.includes('Android')) return 'Android';
    if (ua.includes('iPhone') || ua.includes('iPad')) return 'iOS';
    return 'Other';
}

function esc(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
}

loadData();
