event:
  concept:instance: 193
  id:id: ex-ante
  cpee:instance: 9d2d65f3-9f80-414e-b3d0-7b3567a6c455
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/change
  cpee:description: "<?xml version=\"1.0\"?>\n<description xmlns=\"http://cpee.org/ns/description/1.0\">\n
    \ <manipulate id=\"a11\" label=\"Instantiate Variables\">\n    <code>data.direction
    = []\ndata.rotate_needed = false\ndata.rotate_terrain_id = nil\ndata.expand_needed
    = false\ndata.expand_rows = nil\ndata.expand_cols = nil\ndata.exp_terrain_found
    = false</code>\n  </manipulate>\n  <manipulate id=\"a6\" label=\"Determine Grid
    Expansion or Terrain Rotation\">\n    <code>player_pos = data.current_player[\"position\"]\n\nrow
    = player_pos[0]\ncol = player_pos[1]\n\ncell = data.game_state[row-1][col-1]\n\nif
    cell[\"exit\"]\n  if [1, 12].include?(row) || [1, 12].include?(col)\n    terrain_id
    = cell[\"terrainID\"]\n    if terrain_id\n      data.rotate_needed = true\n      data.rotate_terrain_id
    = terrain_id\n    else\n      raise \"Error: No terrainID found at player position!\"\n
    \   end\n    data.expand_needed = false\n  else\n    if [4,5,8,9].include?(row)\n
    \     if row == 4\n        expansion_rows = (5..8).to_a  # Moving south\n        data.direction
    &lt;&lt; 0\n      elsif row == 5\n        expansion_rows = (1..4).to_a  # Moving
    north\n        data.direction &lt;&lt; 3    \n      elsif row == 8\n        expansion_rows
    = (9..12).to_a # Moving south\n        data.direction &lt;&lt; 0\n      elsif
    row == 9\n        expansion_rows = (5..8).to_a  # Moving north\n        data.direction
    &lt;&lt; 3\n      end\n\n      data.direction &lt;&lt; ((col - 1) % 4)\n\n      if
    col.between?(1,4)\n        expansion_cols = (1..4).to_a\n      elsif col.between?(5,8)\n
    \       expansion_cols = (5..8).to_a    \n      elsif col.between?(9,12)\n        expansion_cols
    = (9..12).to_a\n      end\n\n    else    \n      data.direction &lt;&lt; ((row
    - 1) % 4)\n      if [4,5,8,9].include?(col)\n        if col == 4\n          expansion_cols
    = (5..8).to_a  # Moving east\n          data.direction &lt;&lt; 0\n        elsif
    col == 5\n          expansion_cols = (1..4).to_a  # Moving west\n          data.direction
    &lt;&lt; 3\n        elsif col == 8\n          expansion_cols = (9..12).to_a #
    Moving east\n          data.direction &lt;&lt; 0\n        elsif col == 9\n          expansion_cols
    = (5..8).to_a  # Moving west\n          data.direction &lt;&lt; 3\n        end\n\n
    \       if row.between?(1,4)\n          expansion_rows = (1..4).to_a\n        elsif
    row.between?(5,8)\n          expansion_rows = (5..8).to_a\n        elsif row.between?(9,12)\n
    \         expansion_rows = (9..12).to_a\n        end\n      else\n        data.expand_needed
    = false\n      end\n    end\n\n    empty = true\n    expansion_rows&amp;.each
    do |r|\n      expansion_cols&amp;.each do |c|\n        cell_to_check = data.game_state[r-1][c-1]\n
    \       if cell_to_check[\"terrainID\"]\n          empty = false\n          break\n
    \       end\n      end\n      break unless empty\n    end\n\n    if empty\n      data.expand_needed
    = true\n      data.expand_rows = expansion_rows\n      data.expand_cols = expansion_cols\n
    \   else\n      data.expand_needed = false\n    end\n    data.rotate_needed =
    false\n  end\nend</code>\n    <annotations>\n      <_logging_behavior>\n        <_exclude/>\n
    \     </_logging_behavior>\n      <_context_data_analysis>\n        <probes/>\n
    \     </_context_data_analysis>\n    </annotations>\n  </manipulate>\n  <choose
    mode=\"exclusive\" label=\"\">\n    <alternative condition=\"data.expand_needed
    == true\">\n      <manipulate id=\"a1\" label=\"Find Suitable Terrain\">\n        <code>def
    rotate_matrix(matrix, degrees)\n  case degrees\n  when 0 then matrix\n  when 90
    then matrix.transpose.map(&amp;:reverse)\n  when 180 then matrix.map(&amp;:reverse).reverse\n
    \ when 270 then matrix.transpose.reverse\n  end\nend\n\ndef rotate_walls(horizontal,
    vertical, degrees)\n  case degrees\n  when 0\n    [horizontal, vertical]\n  when
    90\n    [vertical.map(&amp;:reverse), horizontal.reverse]\n  when 180\n    [horizontal.reverse.map(&amp;:reverse),
    vertical.reverse.map(&amp;:reverse)]\n  when 270\n    [vertical.reverse, horizontal.map(&amp;:reverse)]\n
    \ end\nend\n\n# ====== Setup ======\n\nterrains = data.terrain_template\nterrains
    = JSON.parse(terrains) if terrains.is_a?(String)\n\nused_ids = data.terrain_pieces.map
    { |t| t[\"id\"] }\navailable_terrains = terrains.reject { |t| used_ids.include?(t[\"id\"])
    }\n\n# ====== Search for matching terrain ======\n\nnew_tile = nil\nnew_rotation
    = nil\nfound_match = false\nt_row = data.direction[0]\nt_col = data.direction[1]\n\navailable_terrains.shuffle.each
    do |candidate|  \n  [0, 90, 180, 270].each do |rotation|\n    rotated_cells =
    rotate_matrix(candidate[\"cells\"], rotation)\n\n    if rotated_cells[t_row][t_col]
    &amp;&amp; rotated_cells[t_row][t_col][\"exit\"] == true\n      new_tile = candidate\n
    \     new_rotation = rotation\n      found_match = true\n      break\n    end\n
    \ end\n  break if found_match\nend\n\nunless found_match &amp;&amp; new_tile\n
    \ data.exp_terrain_found = false\n  return\nelse\n  data.exp_terrain_found = true\nend\n\n#
    ====== Place the terrain ======\n\nrotated_horizontal, rotated_vertical = rotate_walls(new_tile[\"horizontal_walls\"],
    new_tile[\"vertical_walls\"], new_rotation)\nrotated_cells_final = rotate_matrix(new_tile[\"cells\"],
    new_rotation)\n\nstart_row = data.expand_rows.first\nstart_col = data.expand_cols.first\nplacement
    = ((start_row - 1) / 4 + 1) * 10 + ((start_col - 1) / 4 + 1)\n\ndata.current_terrain
    = {\n  \"id\" =&gt; new_tile[\"id\"],\n  \"home\" =&gt; new_tile[\"home\"],\n
    \ \"rotation\" =&gt; new_rotation,\n  \"placement\" =&gt; placement,\n  \"horizontal_walls\"
    =&gt; rotated_horizontal,\n  \"vertical_walls\" =&gt; rotated_vertical\n}\n\ndata.terrain_pieces
    ||= []\ndata.terrain_pieces &lt;&lt; data.current_terrain\n\ngrid = data.game_state\n\n(0..3).each
    do |r|\n  (0..3).each do |c|\n    global_pos = [start_row + r, start_col + c]\n
    \   rotated_cell = rotated_cells_final[r][c]\n\n    grid_row = global_pos[0] -
    1\n    grid_col = global_pos[1] - 1\n\n    grid[grid_row][grid_col][\"terrainID\"]
    = new_tile[\"id\"]\n    grid[grid_row][grid_col][\"effect\"] = rotated_cell[\"effect\"]\n
    \   grid[grid_row][grid_col][\"occupied\"] = nil\n    grid[grid_row][grid_col][\"exit\"]
    = rotated_cell[\"exit\"]\n  end\nend\n\ndata.game_state = grid</code>\n      </manipulate>\n
    \     <choose mode=\"exclusive\" label=\"\">\n        <alternative condition=\"data.exp_terrain_found
    == true\">\n          <call id=\"a3\" endpoint=\"subprocess\">\n            <parameters>\n
    \             <label>Expand Grid</label>\n              <color/>\n              <method>:post</method>\n
    \             <arguments>\n                <behavior>wait_running</behavior>\n
    \               <url>https://cpee.org/hub/server/Teaching.dir/Prak.dir/TUM-Prak-24-WS.dir/Zeka_Dizdar.dir/virtual.dir/place_terrain.xml</url>\n
    \               <init>\n                  <title>#, a new path is REVEALED to
    you!</title>\n                  <message>Please wait while the new piece is revealed...</message>\n
    \                 <player_id>!data.current_player[\"title\"]</player_id>\n                  <game_state>!data.game_state</game_state>\n
    \                 <terrain_pieces>!data.terrain_pieces</terrain_pieces>\n                  <type>2</type>\n
    \                 <current_terrain>!data.current_terrain</current_terrain>\n                </init>\n
    \               <endpoints/>\n                <attributes/>\n                <customization/>\n
    \             </arguments>\n            </parameters>\n            <code>\n              <signal/>\n
    \             <prepare/>\n              <finalize output=\"result\">data.terrain_shift
    = true</finalize>\n              <update output=\"result\"/>\n              <rescue
    output=\"result\"/>\n            </code>\n            <annotations>\n              <_generic/>\n
    \             <_logging_behavior>\n                <_exclude/>\n                <_include/>\n
    \             </_logging_behavior>\n              <_timing>\n                <_timing_weight/>\n
    \               <_timing_avg/>\n                <explanations/>\n              </_timing>\n
    \             <_shifting>\n                <_shifting_type>Duration</_shifting_type>\n
    \             </_shifting>\n              <_context_data_analysis>\n                <probes/>\n
    \               <ips/>\n              </_context_data_analysis>\n              <report>\n
    \               <url/>\n              </report>\n              <_notes>\n                <_notes_general/>\n
    \             </_notes>\n            </annotations>\n            <documentation>\n
    \             <input/>\n              <output/>\n              <implementation>\n
    \               <description/>\n              </implementation>\n              <code>\n
    \               <description/>\n              </code>\n            </documentation>\n
    \         </call>\n          <_probability>\n            <_probability_min/>\n
    \           <_probability_max/>\n            <_probability_avg/>\n          </_probability>\n
    \       </alternative>\n        <otherwise>\n          <call id=\"a2\" endpoint=\"frames_display\">\n
    \           <parameters>\n              <label>Instruct Player of Blocked Path</label>\n
    \             <color/>\n              <arguments>\n                <type>set</type>\n
    \               <lx>6</lx>\n                <ly>3</ly>\n                <x_amount>3</x_amount>\n
    \               <y_amount>1</y_amount>\n                <button/>\n                <style/>\n
    \               <urls>\n                  <urls_item>\n                    <lang>de-at</lang>\n
    \                   <url>https://lehre.bpm.in.tum.de/~ge87max/instruction/instruction.html</url>\n
    \                 </urls_item>\n                </urls>\n                <default>\n
    \                 <title>#, the way is SHUT!</title>\n                  <message>Try
    to find another way around the dungeon...</message>\n                  <player_id>!data.current_player[\"title\"]</player_id>\n
    \               </default>\n              </arguments>\n            </parameters>\n
    \           <code>\n              <signal/>\n              <prepare>endpoints.frames_display
    += attributes.fid</prepare>\n              <finalize output=\"result\">data.terrain_shift
    = false</finalize>\n              <update output=\"result\"/>\n              <rescue
    output=\"result\"/>\n            </code>\n            <annotations>\n              <_generic/>\n
    \             <_logging_behavior>\n                <_exclude/>\n                <_include/>\n
    \             </_logging_behavior>\n              <_timing>\n                <_timing_weight/>\n
    \               <_timing_avg/>\n                <explanations/>\n              </_timing>\n
    \             <_shifting>\n                <_shifting_type>Duration</_shifting_type>\n
    \             </_shifting>\n              <_context_data_analysis>\n                <probes/>\n
    \               <ips/>\n              </_context_data_analysis>\n              <report>\n
    \               <url/>\n              </report>\n              <_notes>\n                <_notes_general/>\n
    \             </_notes>\n            </annotations>\n            <documentation>\n
    \             <input/>\n              <output/>\n              <implementation>\n
    \               <description/>\n              </implementation>\n              <code>\n
    \               <description/>\n              </code>\n            </documentation>\n
    \         </call>\n          <call id=\"a9\" endpoint=\"timeout\">\n            <parameters>\n
    \             <label>Wait for Blocked Path Message</label>\n              <color/>\n
    \             <method>:post</method>\n              <arguments>\n                <timeout>3</timeout>\n
    \               <data/>\n              </arguments>\n            </parameters>\n
    \           <annotations>\n              <_generic/>\n              <_logging_behavior>\n
    \               <_exclude/>\n                <_include/>\n              </_logging_behavior>\n
    \             <_timing>\n                <_timing_weight/>\n                <_timing_avg/>\n
    \               <explanations/>\n              </_timing>\n              <_shifting>\n
    \               <_shifting_type>Duration</_shifting_type>\n              </_shifting>\n
    \             <_context_data_analysis>\n                <probes/>\n                <ips/>\n
    \             </_context_data_analysis>\n              <report>\n                <url/>\n
    \             </report>\n              <_notes>\n                <_notes_general/>\n
    \             </_notes>\n            </annotations>\n            <documentation>\n
    \             <input/>\n              <output/>\n              <implementation>\n
    \               <description/>\n              </implementation>\n            </documentation>\n
    \         </call>\n          <call id=\"a8\" endpoint=\"frames_display\">\n            <parameters>\n
    \             <label>Clear Blocked Path Message Box</label>\n              <color/>\n
    \             <arguments>\n                <type>set</type>\n                <lx>6</lx>\n
    \               <ly>3</ly>\n                <x_amount>3</x_amount>\n                <y_amount>1</y_amount>\n
    \               <button/>\n                <style/>\n                <urls/>\n
    \               <default/>\n              </arguments>\n            </parameters>\n
    \           <code>\n              <signal/>\n              <prepare>endpoints.frames_display
    += attributes.fid</prepare>\n              <finalize output=\"result\"/>\n              <update
    output=\"result\"/>\n              <rescue output=\"result\"/>\n            </code>\n
    \           <annotations>\n              <_generic/>\n              <_logging_behavior>\n
    \               <_exclude/>\n                <_include/>\n              </_logging_behavior>\n
    \             <_timing>\n                <_timing_weight/>\n                <_timing_avg/>\n
    \               <explanations/>\n              </_timing>\n              <_shifting>\n
    \               <_shifting_type>Duration</_shifting_type>\n              </_shifting>\n
    \             <_context_data_analysis>\n                <probes/>\n                <ips/>\n
    \             </_context_data_analysis>\n              <report>\n                <url/>\n
    \             </report>\n              <_notes>\n                <_notes_general/>\n
    \             </_notes>\n            </annotations>\n            <documentation>\n
    \             <input/>\n              <output/>\n              <implementation>\n
    \               <description/>\n              </implementation>\n              <code>\n
    \               <description/>\n              </code>\n            </documentation>\n
    \         </call>\n        </otherwise>\n      </choose>\n      <_probability>\n
    \       <_probability_min/>\n        <_probability_max/>\n        <_probability_avg/>\n
    \     </_probability>\n    </alternative>\n    <alternative condition=\"data.rotate_needed
    == true\">\n      <manipulate id=\"a4\" label=\"Transpose Terrain 90 Degrees\">\n
    \       <code>require 'json'\n\n# ====== Helpers ======\n\ndef rotate_matrix(matrix,
    degrees)\n  case degrees\n  when 0 then matrix\n  when 90 then matrix.transpose.map(&amp;:reverse)\n
    \ when 180 then matrix.map(&amp;:reverse).reverse\n  when 270 then matrix.transpose.reverse\n
    \ end\nend\n\ndef rotate_walls(horizontal, vertical, degrees)\n  case degrees\n
    \ when 0\n    [horizontal, vertical]\n  when 90\n    [vertical.map(&amp;:reverse),
    horizontal.reverse]\n  when 180\n    [horizontal.reverse.map(&amp;:reverse), vertical.reverse.map(&amp;:reverse)]\n
    \ when 270\n    [vertical.reverse, horizontal.map(&amp;:reverse)]\n  end\nend\n\ndef
    rotate_coord(row, col, degrees)\n  case degrees\n  when 0 then [row, col]\n  when
    90 then [col, 3 - row]\n  when 180 then [3 - row, 3 - col]\n  when 270 then [3
    - col, row]\n  end\nend\n\n# ====== Rotate the Terrain Piece ======\n\n# 1. Find
    the terrain to rotate\nterrain_to_rotate = data.terrain_pieces.find { |t| t[\"id\"]
    == data.rotate_terrain_id }\n\n# 2. Rotate its properties\nterrain_to_rotate[\"rotation\"]
    = (terrain_to_rotate[\"rotation\"] + 90) % 360\n\nrotated_horizontal, rotated_vertical
    = rotate_walls(\n  terrain_to_rotate[\"horizontal_walls\"],\n  terrain_to_rotate[\"vertical_walls\"],\n
    \ 90\n)\n\nterrain_to_rotate[\"horizontal_walls\"] = rotated_horizontal\nterrain_to_rotate[\"vertical_walls\"]
    = rotated_vertical\n\n# 3. Set current_terrain\ndata.current_terrain = terrain_to_rotate.dup\n\n#
    4. Update terrain_pieces\ndata.terrain_pieces.map! do |t|\n  t[\"id\"] == data.rotate_terrain_id
    ? terrain_to_rotate : t\nend\n\n# ====== Rotate the Terrain Cells and Update Game
    State ======\n\n# 5. Get starting row and col from placement\nplacement = data.current_terrain[\"placement\"]\n\nrow_start
    = ((placement / 10) - 1) * 4\ncol_start = ((placement % 10) - 1) * 4\n\n# 6. Fetch
    original terrain template\nterrain_template = data.terrain_template.find { |t|
    t[\"id\"] == data.current_terrain[\"id\"] }\nraise \"Terrain template not found!\"
    unless terrain_template\n\n# 7. Rotate the cells\nrotated_cells = rotate_matrix(terrain_template[\"cells\"],
    data.current_terrain[\"rotation\"])\n\n# 8. Find players standing on the terrain
    before rotation\nplayers_to_relocate = []\n\n(0..3).each do |r|\n  (0..3).each
    do |c|\n    global_r = row_start + r\n    global_c = col_start + c\n    cell =
    data.game_state[global_r][global_c]\n    if cell[\"occupied\"]\n      players_to_relocate
    &lt;&lt; { id: cell[\"occupied\"], old_local: [r, c] }\n    end\n  end\nend\n\n#
    9. Update game state cells to the new rotated cells\n(0..3).each do |r|\n  (0..3).each
    do |c|\n    global_r = row_start + r\n    global_c = col_start + c\n    rotated_cell
    = rotated_cells[r][c]\n\n    data.game_state[global_r][global_c][\"terrainID\"]
    = data.current_terrain[\"id\"]\n    data.game_state[global_r][global_c][\"effect\"]
    = rotated_cell[\"effect\"]\n    data.game_state[global_r][global_c][\"exit\"]
    = rotated_cell[\"exit\"]\n    data.game_state[global_r][global_c][\"occupied\"]
    = nil\n  end\nend\n\n# 10. Move players to their rotated new positions\nplayers_to_relocate.each
    do |player_info|\n  old_r, old_c = player_info[:old_local]\n  new_r, new_c = rotate_coord(old_r,
    old_c, 90)\n\n  global_new_r = row_start + new_r\n  global_new_c = col_start +
    new_c\n\n  # Update game_state\n  data.game_state[global_new_r][global_new_c][\"occupied\"]
    = player_info[:id]\n\n  # Update player_data\n  player = data.player_data.find
    { |p| p[\"id\"] == player_info[:id] }\n  if player\n    player[\"position\"] =
    [global_new_r + 1, global_new_c + 1]\n  end\n\n  # Update current_player  \n  current
    = data.current_player\n  if current &amp;&amp; current[\"id\"] == player_info[:id]\n
    \   current[\"position\"] = [global_new_r + 1, global_new_c + 1]\n    data.current_player
    = current\n  end\n\n  # Update initiative_order\n  if data.initiative_order\n
