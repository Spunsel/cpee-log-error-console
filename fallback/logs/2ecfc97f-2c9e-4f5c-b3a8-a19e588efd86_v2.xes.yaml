event:
  concept:instance: 521
  id:id: ex-ante
  cpee:instance: 2ecfc97f-2c9e-4f5c-b3a8-a19e588efd86
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 612ae01e0850102c93bd022e3c428f794db3c043
  cpee:exposition: |-
    # User Input:
    Prozess: Auftragsabwicklung Pool: GreenSupply GmbH Lanes (Rollen): Vertrieb, Logistik

    Ablauf:

    Start-Ereignis (Vertrieb): Ein Auftrag geht per E-Mail oder über ein Online-Formular ein.

    Aktivität (Vertrieb): Auftrag im ERP-System erfassen.

    Exklusives Gateway (Vertrieb): Existiert der Kunde bereits im System?

    Pfad "Nein": Aktivität: Kundendaten anlegen. Danach Zusammenführung in den Hauptprozess.

    Pfad "Ja": Direkte Weiterführung im Hauptprozess.

    Exklusives Gateway (Vertrieb): Ist der Auftragswert größer als X?

    Pfad "Ja": Aktivität: Zahlungsbedingungen anpassen (Vorkasse). Danach Zusammenführung in den Hauptprozess.

    Pfad "Nein": Direkte Weiterführung im Hauptprozess.

    Aktivität (Vertrieb): Auftrag an Logistik weitergeben.

    Aktivität (Logistik): Materialverfügbarkeit prüfen.

    Exklusives Gateway (Logistik): Ist ausreichend Material vorhanden?

    Pfad "Nein": Aktivität: Nachbestellung auslösen. Folgend ein Zwischenereignis (Timer/Message): Auf Materialeingang warten. Danach Weiterführung zur Einplanung.

    Pfad "Ja": Direkte Weiterführung zur Einplanung.

    Aktivität (Logistik): Auftrag für Produktion und Versand einplanen und Liefertermin ermitteln.

    Aktivität (Logistik): Ermittelten Liefertermin an Vertrieb übergeben.

    Aktivität (Vertrieb): Auftragsbestätigung mit realistischem Liefertermin an den Kunden versenden.

    End-Ereignis (Vertrieb): Auftragsbestätigung versendet.

    Dokumentation für deine Abgabe (Teil von Aufgabe 1)

    Neben dem Modell musst du laut Aufgabenstellung noch zwei Dinge festhalten:

    1. Umgang mit dem Expressauftrag

    Entscheidung: Expressaufträge werden im Modell bewusst ausgeklammert. Sie werden lediglich als Priorisierungsregel bei der Prüfung und Einplanung behandelt, jedoch nicht als eigener Prozesspfad dargestellt.

    Begründung: Die Interview-Notizen geben explizit an, dass dies "kein eigener Prozess" ist. Die grundlegenden fachlichen Schritte (Erfassen, Prüfen, Einplanen) bleiben gleich. Ein zusätzlicher Pfad für Expressaufträge würde das Modell ohne fachlichen Mehrwert unnötig komplex machen.

    2. Getroffene Annahmen

    Annahme 1 (Informationsfluss): Da der Vertrieb am Ende die Auftragsbestätigung inklusive eines realistischen Liefertermins versendet , muss die Logistik diesen Termin nach der Einplanung zwingend an den Vertrieb zurückmelden. Dieser Rückfluss wurde im Modell explizit ergänzt.

    Annahme 2 (Reihenfolge der Prüfungen): Es wird angenommen, dass die Anlage fehlender Kundendaten vor der Prüfung der Zahlungsbedingungen erfolgt, da der Auftrag so vorbereitet werden soll, dass vollständige Stammdaten für nachfolgende Schritte vorliegen.
  time:timestamp: '2026-03-23T10:18:29.993481+01:00'
