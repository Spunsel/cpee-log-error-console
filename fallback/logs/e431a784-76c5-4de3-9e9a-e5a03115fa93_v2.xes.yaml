event:
  concept:instance: 487
  id:id: ex-ante
  cpee:instance: e431a784-76c5-4de3-9e9a-e5a03115fa93
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: e8a4dd4e858425f399ee3ec4a2d20d7e36aa4e99
  cpee:exposition: |-
    %% Output Intermediate
    Mermaid.js does not support swimlane diagrams or the modeling of documents directly attached to activities. However, we can represent the process flow with tasks, gateways, and events. Here is a simplified version of the process:

    ```mermaid
    graph LR
    0:startevent:((startevent)) --> 1:task:(Employee fills out travel request in SAP)
    1:task:(Employee fills out travel request in SAP) --> 2:task:(Request sent to supervisor electronically)
    2:task:(Supervisor checks request for completeness and validity) --> 3:exclusivegateway:{x}
    3:exclusivegateway:{x} --> |Request approved| 4:task:(Employee receives approval email from SAP)
    3:exclusivegateway:{x} --> |Request denied| 5:task:(Employee receives denial email from SAP)
    3:exclusivegateway:{x} --> |Supervisor has questions| 6:task:(Employee updates request and resubmits in SAP)
    4:task:(Employee receives approval email from SAP) --> 7:task:(Employee books travel through portals)
    7:task:(Employee books travel through portals) --> 8:task:(Employee conducts business trip and collects receipts)
    8:task:(Employee conducts business trip and collects receipts) --> 9:task:(Employee completes expense report in SAP and attaches electronic receipts)
    9:task:(Employee completes expense report in SAP and attaches electronic receipts) --> 10:endevent:(((endevent)))
    5:task:(Employee receives denial email from SAP) --> 10:endevent:(((endevent)))
    6:task:(Employee updates request and resubmits in SAP) --> 2:task:(Request sent to supervisor electronically)
    ```

    This code will generate a BPMN diagram that accurately represents the described business process.
  time:timestamp: '2026-03-19T20:25:08.346516+01:00'
