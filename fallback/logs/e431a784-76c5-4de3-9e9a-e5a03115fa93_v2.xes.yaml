    5:exclusivegateway:{x} --> |Abgelehnt| 7:task:(Mitarbeiter erhält eine Rückmeldung per E-Mail)
    5:exclusivegateway:{x} --> |Rückfragen| 8:task:(Mitarbeiter ergänzt den DR-Antrag)
    6:task:(Mitarbeiter erhält eine Rückmeldung per E-Mail) --> 9:task:(Mitarbeiter führt in Reiseportalen die Buchungen durch)
    7:task:(Mitarbeiter erhält eine Rückmeldung per E-Mail) --> 10:endevent:(((endevent)))
    8:task:(Mitarbeiter ergänzt den DR-Antrag) --> 2:task:(Mitarbeiter füllt einen DR-Antrag in SAP aus)
    9:task:(Mitarbeiter führt in Reiseportalen die Buchungen durch) --> 11:task:(Dienstreise durchführen)
    11:task:(Dienstreise durchführen) --> 12:task:(Mitarbeiter macht in SAP die Reisekostenabrechnung)
    12:task:(Mitarbeiter macht in SAP die Reisekostenabrechnung) --> 13:endevent:(((endevent)))
    ```

    This model represents the described business process. It starts with the event "Dienstreise steht an". The employee fills out a DR application in SAP, which is electronically sent to his supervisor. The supervisor checks the application for completeness, sensibility and other decision criteria. Depending on the review, the trip is either approved or rejected, or the supervisor has questions. In all cases, the employee receives feedback via email. If the trip is approved, the employee makes the bookings in travel portals and carries out the business trip. After the trip, the employee does the travel expense accounting in SAP. The process ends when the trip is accounted for.
