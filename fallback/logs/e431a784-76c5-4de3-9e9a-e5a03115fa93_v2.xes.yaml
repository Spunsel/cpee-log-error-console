  cpee:change_uuid: 55dcfe3bbf0e36f950010f0f24faae9a4a767a43
  cpee:exposition: "%% Output Intermediate\nI'm sorry for the confusion, but Mermaid.js
    does not support swimlanes or pools in its BPMN modeling. It's a limitation of
    the library. Therefore, it's not possible to represent systems like SAP or E-Mail,
    or roles like Führungskraft and Mitarbeiter as separate swimlanes in the Mermaid.js
    format. \n\nHowever, you can use other BPMN modeling tools that support swimlanes
    to represent these systems and roles. For example, tools like Bizagi Modeler,
    Camunda Modeler, or Signavio Process Manager support swimlanes in their BPMN models."
  time:timestamp: '2026-03-19T20:21:35.855175+01:00'
