event:
  concept:instance: 487
  id:id: ex-ante
  cpee:instance: e431a784-76c5-4de3-9e9a-e5a03115fa93
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: '0489b1c9763c9cd4f016a9edc65d4cc1a3a93d8a'
  cpee:exposition: |
    # User Input:
    Startereignis ist "Dienstreise steht an" 

    Der Mitarbeiter füllt einen DR-Antrag in SAP aus 

    Der Antrag geht elektronisch an seine Führungskraft. 

    Die Führungskraft prüft den Antrag auf Vollständigkeit, Sinnhaftigkeit und weitere Entscheidungskriterien. 

    Entweder wird die Dienstreise genehmigt, oder sie wird abgelehnt. In beiden Fällen erhält der Mitarbeiter eine Rückmeldung per E-Mail (aus SAP). 

    Es gibt den Fall, dass die Führungskraft Rückfragen an den Mitarbeiter hat, die geklärt werden müssen. Dann ergänzt der Mitarbeiter den DR-Antrag und sendet ihn erneut im SAP. 

    Bei Genehmigung führt der Mitarbeiter in Reiseportalen die Buchungen durch. 

    Dann führt er die Dienstreise durch. Dabei entstehen Belege als Dokumente. 

    Nach der Dienstreise macht der Mitarbeiter in SAP die Reisekostenabrechnung. Dabei fügt er die elektronischen Belege hinzu. 

    Ende: Dienstreise ist abgerechnet. 

    Bitte erstelle ein Schwimmbahn-Diagramm mit den Rollen Führungskraft, Mitarbeiter und Systeme. 
    Packe in die Systeme-Schwimmbahn alle Systeme wie SAP, E-Mail etc. 
    Modelliere Dokumente an die Aktivitäten. 
    Wenn möglich modelliere von links nach rechts. 
  time:timestamp: '2026-03-19T20:26:40.057590+01:00'
