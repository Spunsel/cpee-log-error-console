    Der Prozess beginnt, sobald ein Kunde das italienische Restaurant betritt. Hat er eine Reservierung, wird er von einem Kellner direkt zu seinem Tisch begleitet und kann anschlieÃŸend seine Bestellung aufgeben. Liegt keine Reservierung vor, wird zunÃ¤chst geprÃ¼ft, ob ein Tisch frei ist. Ist kein Tisch verfÃ¼gbar, kann der Kunde entweder warten oder das Restaurant wieder verlassen. Entscheidet er sich zu gehen, endet der Prozess an dieser Stelle. Wartet er, wird nach einer gewissen Zeit ein Tisch frei, und der Kellner fÃ¼hrt ihn dann an seinen Platz, sodass er ebenfalls bestellen kann.

    Sobald die Bestellung aufgenommen ist, leitet der Kellner sie an die KÃ¼che weiter. Dort bereitet der PizzabÃ¤cker die Pizza zu. Falls nicht alle benÃ¶tigten Zutaten sofort bereitstehen, werden sie zuerst vorbereitet. AnschlieÃŸend wird die Pizza gebacken. Nach der Fertigstellung bringt der Kellner die Pizza an den Tisch. Der Kunde isst, bezahlt beim Kellner und verlÃ¤sst danach das Restaurant. Damit ist der Prozess abgeschlossen.
    Wenn er wegen keinem Platz gehen muss, so erhÃ¤lt er ein Gutschein fÃ¼r das NÃ¤chste mal.
