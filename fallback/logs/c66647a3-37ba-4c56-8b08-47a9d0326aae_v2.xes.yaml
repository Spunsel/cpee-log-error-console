  id:id: ex-ante
  cpee:instance: c66647a3-37ba-4c56-8b08-47a9d0326aae
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/change
  cpee:description: |
    <?xml version="1.0"?>
    <testset xmlns="http://cpee.org/ns/properties/2.0">
      <executionhandler>ruby</executionhandler>
      <dataelements/>
      <endpoints>
        <user>https-post://cpee.org/services/timeout-user.php</user>
        <auto>https-post://cpee.org/services/timeout-auto.php</auto>
        <subprocess>https-post://cpee.org/flow/start/url/</subprocess>
        <timeout>https-post://cpee.org/services/timeout.php</timeout>
        <send>https-post://cpee.org/ing/correlators/message/send/</send>
        <receive>https-get://cpee.org/ing/correlators/message/receive/</receive>
      </endpoints>
      <attributes>
        <info>knbknk</info>
        <modeltype>CPEE</modeltype>
        <theme>preset</theme>
      </attributes>
      <description>
        <description xmlns="http://cpee.org/ns/description/1.0" xmlns:a="http://cpee.org/ns/annotation/1.0">
          <call id="a1" endpoint="" a:alt_id="1">
            <parameters>
              <label>Check Car Registration</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
          <choose mode="exclusive" a:alt_id="2">
            <alternative condition="Went to Service" language="text/javascript">
              <call id="a5" endpoint="" a:alt_id="3">
                <parameters>
                  <label>Notify Driver</label>
                  <method/>
                  <type>:task</type>
                  <arguments/>
                </parameters>
              </call>
              <choose mode="exclusive" a:alt_id="4">
                <alternative condition="Went to Service" language="text/javascript">
                  <call id="a11" endpoint="" a:alt_id="5">
                    <parameters>
                      <label>Mechanic Enters Car Problems</label>
                      <method/>
                      <type>:task</type>
                      <arguments/>
                    </parameters>
                  </call>
                </alternative>
                <alternative condition="">
                  <call id="a13" endpoint="" a:alt_id="|Did Not Go (30 days passed">
                    <parameters>
                      <label/>
                      <method/>
                      <type>:task</type>
                      <arguments/>
                    </parameters>
                  </call>
                </alternative>
              </choose>
            </alternative>
            <alternative condition="No, Not Registered" language="text/javascript">
              <call id="a7" endpoint="" a:alt_id="14">
                <parameters>
                  <label>Inform Driver Not Registered</label>
                  <method/>
                  <type>:task</type>
                  <arguments/>
                </parameters>
              </call>
            </alternative>
          </choose>
        </description>
      </description>
      <transformation>
        <description type="copy"/>
        <dataelements type="none"/>
        <endpoints type="none"/>
      </transformation>
    </testset>
  cpee:change_uuid: ed72f7309dc041f5c8378662e0ad4990ac69ccce
  time:timestamp: '2026-05-05T19:27:58.906090+02:00'
