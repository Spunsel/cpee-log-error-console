  cpee:change_uuid: 74f1a3bd05ddac534b3a3c6ac7c76434e3cdab86
  cpee:exposition: |-
    # User Input:
    The Campus Café order fulfillment process begins when a customer arrives at the counter and places their order verbally or written on a pad. The cashier then enters the order into the point�of�sale (POS) system and confirms it with the customer. Next, the customer pays using cash, card, or mobile payment. The cashier sends the order ticket to the kitchen printer.

    In the kitchen, staff receive the ticket and first check inventory for the required ingredients. If ingredients are available, they proceed to prepare the food by assembling and cooking it, then plate it and perform a quality check. If ingredients are missing, they notify the cashier of the shortage, request a restock from the supplier, or use a substitute, then continue preparation.

    Parallel to food prep, the barista starts making the drink. Once food is ready, a runner takes it to the counter. The customer waits at the counter for pickup, receives both food and drink, and the process ends.
  time:timestamp: '2026-02-20T16:55:30.004371+01:00'
