  cpee:change_uuid: 176463fb2e9227979f87da44ad267809359b2541
  cpee:exposition: "# User Input:\nDer Prozess beginnt damit, dass ein öffentlicher
    Auftraggeber eine Ausschreibung über ein Vergabeportal oder eine Homepage veröffentlicht,
    wodurch das Büro veranlasst wird, die bereitgestellten Ausschreibungsunterlagen
    herunterzuladen und für die interne Bearbeitung zu sichern.\rNachdem die Unterlagen
    vorliegen, werden diese in das entsprechende Kalkulationsprogramm „Nextbau" integriert,
    damit die strukturierten Daten für die folgende Kalkulation genutzt werden können.\rAnschließend
    wird das Angebot abgegeben\rNach der Angebotsabgabe folgt der Submissionstermin,
    an dem der Auftraggeber entscheidet, ob der Anbieter den Zuschlag erhält; wenn
    der Zuschlag erteilt wird, gilt der Angebots- bzw. Auftragsprozess als erfolgreich
    abgeschlossen, während bei Nicht-Erhalt des Zuschlags der Prozess als fehlgeschlagen
    endet.\r"
  time:timestamp: '2025-11-30T16:44:57.930020+01:00'
