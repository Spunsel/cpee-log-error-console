event:
  concept:instance: 4453
  id:id: ex-ante
  cpee:instance: 2239e658-449c-4208-a666-5f5b04b34b10
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 949567981208de9582ed67bb6b391f5ff55cfdc4
  cpee:exposition: |-
    # User Input:
    Maak een BPMN model van het order-to-cash proces met de volgende stappen:

    Start event: Inkooporder ontvangen.

    Taak: Voorraad controleren.

    Gateway (Exclusive): Is er voldoende voorraad?

    Nee: Taak 'Order afwijzen', gevolgd door End event 'Order afgewezen'.

    Ja: Taak 'Order bevestigen'.

    Gateway (Parallel):

    Taak 'Factuur verzenden'.

    Taak 'Goederen verzenden'.

    Taak: Betaling ontvangen.

    Taak: Order archiveren.

    End event: Order voltooid.
  time:timestamp: '2026-03-26T12:29:43.197532+01:00'
