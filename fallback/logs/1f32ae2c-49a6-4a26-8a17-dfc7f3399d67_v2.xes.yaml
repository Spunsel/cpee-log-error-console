event:
  concept:instance: 1467
  id:id: external
  cpee:activity: external
  cpee:instance: 1f32ae2c-49a6-4a26-8a17-dfc7f3399d67
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 95b9a351345fa44c6fc7d7877e827a4c158307dd
  cpee:exposition: |-
    # User Input:
    Der längste Zungenbrecher der Welt ist der offizielle Name der thailändischen Hauptstadt Bangkok, der aus 168 lateinischen Zeichen besteht und als längster Ortsname der Welt gilt.
     Dieser Name, der in der thailändischen Sprache aus altindischen Sprachen wie Pali und Sanskrit stammt, wird auch als „Krung Thep Maha Nakhon Amon Rattanakosin Mahinthara Ayuthaya Mahadilok Phop Noppharat Ratchathani Burirom Udom Ratchaniwet Maha Sathan Amon Piman Awatan Sathit Sakkathattiya Witsanukam Prasit“ bezeichnet und bedeutet etwa: „Große Stadt der Devas (geflügelte Wesen), Residenz des heiligen Smaragd-Buddhas, voller Wohlstand und immerwährender Schönheit, geschmückt mit neun wertvollen Edelsteinen, reich an gewaltigen königlichen Palästen, himmlischer Wohnort, der auf der Erde von Thao Sakka Thewarat Witsanukam für die wiedergeborenen Gottheiten gebaut wurde“.
     Obwohl er als Zungenbrecher gilt, ist er in Thailand durch ein Lied der Rockband Asanee-Wasan aus den 1980er Jahren so populär geworden, dass viele Menschen ihn mitsingen können.
    Ein weiterer bekannter langer Zungenbrecher stammt aus der deutschen Sprache und lautet: „Am zehnten zehnten zehn Uhr zehn zogen zehn zahme Ziegen zehn Zentner Zucker zum Zoo.“
     Ein weiterer deutscher Zungenbrecher, der als besonders schwierig gilt, ist: „Blaukraut bleibt Blaukraut und Brautkleid bleibt Brautkleid“.
     In der englischen Sprache gilt der Satz „The sixth sick sheikh’s sixth sheep’s sick“ als schwierigster Zungenbrecher und ist im Guinness-Buch der Rekorde eingetragen.
    Ein weiterer langer sprachlicher Ausdruck ist das aus Sanskrit stammende Wort „Methionylthreonylthreonylglutaminylarginyl…isoleucine“, das mit 189.819 Buchstaben das längste Wort der Welt in wissenschaftlicher Hinsicht darstellt und als Proteinname in der Medizin verwendet wird.
     Auch der griechische Begriff aus einer Komödie von Aristophanes mit 182 Buchstaben gilt als eines der längsten Wörter in einem literarischen Werk.
     In der deutschen Sprache wird das Wort „Gesellschaft der Beamten des Hauptbetriebswerks des Elektrizitäts-Dampfschiffverkehrs auf der Donau“ als das längste deutsche Wort angesehen.
  time:timestamp: '2025-11-01T23:53:27.561642+01:00'
