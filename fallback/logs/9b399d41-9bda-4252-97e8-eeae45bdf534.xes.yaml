event:
  concept:instance: 104290
  id:id: external
  cpee:activity: external
  cpee:instance: 9b399d41-9bda-4252-97e8-eeae45bdf534
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 6130b453f3878a2a17c01a645ebfe79508b5a593
  cpee:exposition: |-
    # User Input:
    Der Prozess beginnt, sobald ein Kunde das italienische Restaurant betritt. Hat er eine Reservierung, wird er von einem Kellner direkt zu seinem Tisch begleitet und kann anschließend seine Bestellung aufgeben. Liegt keine Reservierung vor, wird zunächst geprüft, ob ein Tisch frei ist. Ist kein Tisch verfügbar, kann der Kunde entweder warten oder das Restaurant wieder verlassen. Entscheidet er sich zu gehen, endet der Prozess an dieser Stelle. Wartet er, wird nach einer gewissen Zeit ein Tisch frei, und der Kellner führt ihn dann an seinen Platz, sodass er ebenfalls bestellen kann.

    Sobald die Bestellung aufgenommen ist, leitet der Kellner sie an die Küche weiter. Dort bereitet der Pizzabäcker die Pizza zu. Falls nicht alle benötigten Zutaten sofort bereitstehen, werden sie zuerst vorbereitet. Anschließend wird die Pizza gebacken. Nach der Fertigstellung bringt der Kellner die Pizza an den Tisch. Der Kunde isst, bezahlt beim Kellner und verlässt danach das Restaurant. Damit ist der Prozess abgeschlossen.
  time:timestamp: '2026-01-12T08:29:35.505390+01:00'
