  cpee:description: |
    <?xml version="1.0"?>
    <description xmlns="http://cpee.org/ns/description/1.0" xmlns:a="http://cpee.org/ns/annotation/1.0">
      <call id="a1" endpoint="" a:alt_id="1">
        <parameters>
          <label>Gather customer request</label>
          <method/>
          <type>:task</type>
          <arguments/>
        </parameters>
      </call>
      <call id="a3" endpoint="" a:alt_id="2">
        <parameters>
          <label>Capture chainsaw properties: Schwertl&#xE4;nge, chain width, power type, guide bar type, chain pitch</label>
          <method/>
          <type>:task</type>
          <arguments/>
        </parameters>
      </call>
      <call id="a5" endpoint="" a:alt_id="3">
        <parameters>
          <label>Confirm specifications with customer</label>
          <method/>
          <type>:task</type>
          <arguments/>
        </parameters>
      </call>
      <parallel wait="-1" cancel="last" a:alt_id="4">
        <parallel_branch>
          <call id="a9" endpoint="" a:alt_id="5">
            <parameters>
              <label>Order guide bar</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
        </parallel_branch>
        <parallel_branch>
          <call id="a11" endpoint="" a:alt_id="6">
            <parameters>
              <label>Order chain</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
        </parallel_branch>
        <parallel_branch>
          <call id="a13" endpoint="" a:alt_id="7">
            <parameters>
              <label>Order power unit: electric or motor</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
        </parallel_branch>
        <parallel_branch>
          <call id="a15" endpoint="" a:alt_id="8">
            <parameters>
              <label>Order housing &amp; handles</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
        </parallel_branch>
        <parallel_branch>
          <call id="a17" endpoint="" a:alt_id="9">
            <parameters>
              <label>Order accessories &amp; fasteners</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
        </parallel_branch>
      </parallel>
      <call id="a29" endpoint="" a:alt_id="11">
        <parameters>
          <label>Receive all parts</label>
          <method/>
          <type>:task</type>
          <arguments/>
        </parameters>
      </call>
      <call id="a31" endpoint="" a:alt_id="12">
        <parameters>
          <label>Manual inspection of all parts</label>
          <method/>
          <type>:task</type>
          <arguments/>
        </parameters>
      </call>
      <parallel wait="-1" cancel="last" a:alt_id="13">
        <parallel_branch>
          <call id="a35" endpoint="" a:alt_id="14">
            <parameters>
              <label>Assemble first chainsaw</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
        </parallel_branch>
        <parallel_branch>
          <loop mode="post_test" condition=" updates needed  &amp;&amp;  no update now ">
            <choose mode="exclusive" a:alt_id="30">
              <alternative condition=" updates needed  or  no update now " language="text/javascript"/>
              <alternative condition=" no update now " language="text/javascript"/>
            </choose>
          </loop>
        </parallel_branch>
      </parallel>
      <call id="a51" endpoint="" a:alt_id="17">
        <parameters>
          <label>Ship first saw to customer</label>
          <method/>
          <type>:task</type>
          <arguments/>
        </parameters>
      </call>
      <choose mode="exclusive" a:alt_id="18">
        <alternative condition=" approved " language="text/javascript">
          <parallel wait="-1" cancel="last" a:alt_id="24">
            <parallel_branch>
              <call id="a59" endpoint="" a:alt_id="19">
                <parameters>
                  <label>"Assemble next chainsaw (remaining order)"</label>
                  <method/>
                  <type>:task</type>
                  <arguments/>
                </parameters>
              </call>
            </parallel_branch>
            <parallel_branch>
              <loop mode="post_test" condition=" updates needed  &amp;&amp;  no update now ">
                <choose mode="exclusive" a:alt_id="28">
                  <alternative condition=" updates needed  or  no update now " language="text/javascript"/>
                  <alternative condition=" no update now " language="text/javascript"/>
                </choose>
              </loop>
            </parallel_branch>
          </parallel>
          <call id="a75" endpoint="" a:alt_id="27">
            <parameters>
              <label>Ship produced saw to customer</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
        </alternative>
        <alternative condition=" not approved " language="text/javascript">
          <call id="a57" endpoint="" a:alt_id="20">
            <parameters>
              <label>Handle changes / rework first saw</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
        </alternative>
      </choose>
    </description>
  cpee:change_uuid: 78321fc5c393b27eedca99ef8d2e46ca660f36f3
  time:timestamp: '2025-11-04T16:03:18.267162+01:00'
