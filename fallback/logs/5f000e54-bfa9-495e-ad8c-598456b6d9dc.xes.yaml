  id:id: external
  cpee:activity: external
  cpee:instance: 5f000e54-bfa9-495e-ad8c-598456b6d9dc
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/change
  cpee:description: |
    <?xml version="1.0"?>
    <description xmlns="http://cpee.org/ns/description/1.0" xmlns:a="http://cpee.org/ns/annotation/1.0">
      <call id="a1" endpoint="" a:alt_id="a1">
        <parameters>
          <label>Check if refill is needed</label>
          <method/>
          <type>:task</type>
          <arguments/>
        </parameters>
      </call>
      <call id="a3" endpoint="" a:alt_id="a2">
        <parameters>
          <label>Collect email addresses</label>
          <method/>
          <type>:task</type>
          <arguments/>
        </parameters>
      </call>
      <choose mode="exclusive" a:alt_id="gw1s">
        <alternative condition="data.refill == &quot;no&quot;">
          <_probability>
            <_probability_min/>
            <_probability_max/>
            <_probability_avg/>
          </_probability>
          <call id="a7" endpoint="" a:alt_id="a5">
            <parameters>
              <label>Send email: No coffee ordered</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
        </alternative>
        <alternative condition="Yes" language="text/javascript">
          <call id="a11" endpoint="" a:alt_id="a9">
            <parameters>
              <label>Initiate coffee ordering</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
          <call id="a13" endpoint="" a:alt_id="a11">
            <parameters>
              <label>Confirm preferences</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
          <call id="a15" endpoint="" a:alt_id="a13">
            <parameters>
              <label>Send confirmation email to office</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
        </alternative>
      </choose>
    </description>
  cpee:change_uuid: fbce2f3743c1307f26cd48544e5ba98afd8ec5d5
  time:timestamp: '2026-02-06T12:16:08.635676+01:00'
