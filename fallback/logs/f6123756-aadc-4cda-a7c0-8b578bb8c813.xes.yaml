  cpee:instance: f6123756-aadc-4cda-a7c0-8b578bb8c813
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 9c41d8db9dcc15a53948cbb11ffeca5497eb852a
  cpee:exposition: |-
    # User Input:
    In a pizza parlor, a customer enters the building. When there is a free table or hew has a reservation, a server will bring him to a seat. If not, he will be notified and can choose to wait or leave. When he leaves, the process ends. If not, he soon will order. the server will take the order and send it to the cook, who will check, if every ingredient is ready to be used. If not, the customer will be notified and the cook will prepare ingredients. If everything is in order, the cook bakes the pizza. When finished, the server will deliver the food. After the customer is done and ready to leave, the customer will pay and leave the process ends.
  time:timestamp: '2026-01-12T01:22:47.728378+01:00'
