  cpee:exposition: |-
    # User Input:
    On a beautiful autumn day, Lothar cycles to the gym. In downtown WÃ¼rzburg, a momentary lapse in concentration causes his front wheel to get caught in the tram tracks and he falls onto his right wrist. He can hardly move it and realizes that something is wrong. He therefore decides to go to his family doctor.
    His family doctor takes a brief medical history and performs a physical examination. She documents the results on Lothar's paper patient file. The wrist is only slightly swollen and the family doctor suspects only a bruise. Since Lothar also has an abrasion on his knee joint, the family doctor asks about his tetanus status. Lothar has to admit that he has lost his vaccination card and cannot remember when he last had a vaccination. She therefore gives him a booster shot and issues a new paper vaccination card. To rule out a fracture of the right wrist, she refers Lothar for an X-ray.
    Lothar spends the entire afternoon on the phone and finally finds a radiology practice that can squeeze him in for an appointment the next day.Â 


