  cpee:change_uuid: db3c7016b08ad1ffa20efc6656161a86dab1f74e
  cpee:exposition: |-
    # User Input:
    A customer contacts your workshop to order a custom bicycle, specifying frame size, material, color, and gear system preferences. The Sales Manager records these requirements and forwards them to the Design Engineer, who prepares the technical blueprint and bill of materials. Once approved by the customer, the Procurement Officer orders the necessary components—frames, wheels, brakes, and saddles—from multiple suppliers in parallel. Each supplier sends confirmation and estimated delivery dates, which are tracked in the procurement system. When all parts arrive, the Quality Inspector examines them for defects or mismatches. If a component fails inspection, a replacement request is initiated, delaying assembly. The Assembly Technician then constructs the bicycle according to the blueprint, performing multiple tests during the build. After assembly, a Test Rider verifies ride quality before the final product is cleaned, photographed, and shipped to the customer with an update report.
  time:timestamp: '2025-11-09T00:22:27.168833+01:00'
