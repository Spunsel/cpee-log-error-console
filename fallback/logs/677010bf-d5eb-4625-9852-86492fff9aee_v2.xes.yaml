    Textual description of a business process:

    The finance department of a university hospital wants to bill infrastructure costs. First, the costs are identified and recorded. Then, the costs are reviewed. If the costs are approved, they are billed. If the costs are not approved, they are revised. After the costs are billed, the customer is notified. The process ends when the customer pays the bill.

    Mermaid.js BPMN model:

    ```mermaid
    graph LR
    0:startevent:((startevent)) --> 1:task:(Identify and record costs)
    1:task:(Identify and record costs) --> 2:task:(Review costs)
    2:task:(Review costs) --> 3:exclusivegateway:{x}
    3:exclusivegateway:{x} --> |Costs approved| 4:task:(Bill costs)
    3:exclusivegateway:{x} --> |Costs not approved| 5:task:(Revise costs)
    4:task:(Bill costs) --> 6:task:(Notify customer)
    5:task:(Revise costs) --> 2:task:(Review costs)
    6:task:(Notify customer) --> 7:task:(Customer pays bill)
    7:task:(Customer pays bill) --> 8:endevent:(((endevent)))
    ```
    This model represents the described business process. It starts with identifying and recording the costs, which are then reviewed. Depending on the review, the costs are either billed or revised. If the costs are billed, the customer is notified. The process ends when the customer pays the bill.
  time:timestamp: '2025-11-05T12:31:50.689142+01:00'
