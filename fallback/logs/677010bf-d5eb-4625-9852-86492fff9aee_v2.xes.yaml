event:
  concept:instance: 6554
  id:id: external
  cpee:activity: external
  cpee:instance: 677010bf-d5eb-4625-9852-86492fff9aee
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: a7a17d277393271d4cc0fb5de9f1710bdf1e1929
  cpee:exposition: "# User Input:\n\U0001F9E9 Prozessname: Verrechnung von Infrastrukturkosten\n\nProzessziel:\nZurechnung
    und Umlage von zentralen Infrastrukturkosten (z. B. IT, Gebäude, Energie, Reinigung,
    Verwaltung) auf nutzende Organisationseinheiten (Kliniken, Institute, Forschungsbereiche)
    gemäß interner Kostenverteilungslogik und Trennungsrechnung.\n\n\U0001F3D7️ BPMN-Akteure
    (Swimlanes)\n\nKostenstellenverantwortliche / Fachabteilungen\n(z. B. Technischer
    Dienst, IT, Verwaltung)\n\nFinanzabteilung / Controlling\n(z. B. KLR-Team, Finanzcontrolling)\n\nDatenmanagement
    / ERP-System\n(z. B. SAP, BI-System)\n\nKliniken & Institute (Kostenträger)\n(Empfänger
    der Umlage)\n\nLeitung Finanzen / Vorstand Verwaltung\n(Freigabe und Reporting)\n\n\U0001F9ED
    BPMN-Prozessbeschreibung (Textform)\n1. Start: Periodenbeginn (z. B. Quartal /
    Jahr)\n\nEreignis: „Kostenverteilungsperiode beginnt“\n\nTrigger: Automatischer
    Prozessstart im ERP-System oder durch Controlling-Kalender.\n\n2. Sammeln der
    Infrastrukturkosten (Kostenstellenverantwortliche)\n\nAktivitäten:\n\nErfassung
    der angefallenen Infrastrukturkosten (z. B. IT, Strom, Gebäudereinigung, Verwaltung)\n\nZuordnung
    zu Kostenstellen (Primärkosten)\n\nÜbermittlung an Controlling\n\nDatenaustausch:
    Buchungsläufe, Kostenartenberichte\n\n3. Plausibilitätsprüfung der Daten (Finanzabteilung)\n\nAktivitäten:\n\nPrüfung
    der Vollständigkeit und Korrektheit der Kostenarten\n\nAbgleich mit Budget- und
    Vorperiodenwerten\n\nRückmeldung bei Auffälligkeiten an Fachabteilungen\n\nEntscheidungspunkt:
    „Kosten plausibel?“\n\nNein: Rückgabe zur Korrektur\n\nJa: Weiter\n\n4. Definition
    der Verteilungsschlüssel (Controlling)\n\nAktivitäten:\n\nFestlegung oder Aktualisierung
    der Umlageschlüssel (z. B. m², Personalstellen, IT-Nutzer, Laborstunden)\n\nGenehmigung
    durch Leitung Finanzen (falls notwendig)\n\nDatenbasis: Stammdaten, Nutzungsstatistiken,
    HR-Daten\n\n5. Durchführung der Umlage (ERP-System / Controlling)\n\nAktivitäten:\n\nBerechnung
    der Umlage auf Empfänger-Kostenstellen gemäß Schlüssel\n\nBuchung der sekundären
    Kosten im ERP-System (z. B. SAP-CO Umlagezyklus)\n\nSystemereignis: „Umlauf abgeschlossen“\n\n6.
    Prüfung der Umlageergebnisse (Controlling + Empfänger)\n\nAktivitäten:\n\nEmpfänger
    erhalten Umlageberichte\n\nKontrolle auf sachliche und rechnerische Richtigkeit\n\nFeedback
    an Controlling bei Auffälligkeiten\n\nEntscheidungspunkt: „Ergebnisse korrekt?“\n\nNein:
    Korrektur und Neuverteilung\n\nJa: Weiter\n\n7. Reporting und Freigabe (Finanzleitung)\n\nAktivitäten:\n\nErstellung
    des Verrechnungsberichts (z. B. je Klinik/Institut)\n\nVorlage an Leitung Finanzen
    / Vorstand Verwaltung\n\nFreigabe und Kommunikation an alle Einheiten\n\nDokumentation
    im ERP/BI-System\n\n8. Ende des Prozesses\n\nEreignis: „Umlage abgeschlossen und
    freigegeben“\n\nOutput:\n\nBuchungssätze im ERP-System\n\nBericht an Ministerium/Universität
    (Trennungsrechnung)\n\nGrundlage für Budgetplanung und Controlling"
  time:timestamp: '2025-11-05T12:12:59.382315+01:00'
