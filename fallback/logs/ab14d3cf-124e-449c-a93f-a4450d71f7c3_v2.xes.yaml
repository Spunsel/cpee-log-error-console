event:
  concept:instance: 1317
  id:id: external
  cpee:activity: external
  cpee:instance: ab14d3cf-124e-449c-a93f-a4450d71f7c3
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: f9e4d7da58dd75e6c25d8c1842b61fa06262e47a
  cpee:exposition: |+
    # User Input:
    Provided Changes:
    Parts can only be inspected after they have arrived.

    The chainsaw can only be assembled if all parts have been successfully inspected; otherwise, they must be reordered.

    Production updates must be sent regularly during production, not only after completion.

    After adjustment and bug fixing, feedback must be obtained again before producing the remainder of the order.


    Additional Information:
    Original Process Description:
    Category: Manufacturing
    Title: Chainsaw

    You produce custom chainsaws on demand. Your chainsaws have at least 5
    properties such as length of the "guide bar" (SchwertlÃ¤nge), chain width,
    electric or motor chainsaw. After your customer told you the properties, you
    can start ordering the parts from various online sources (in parallel). After
    the parts arrive you have to do a manual inspection of all parts, and then
    assemble the parts. During production, you regularly send updates to your
    customer. After producing the first saw you send it to your customer. If he
    likes it, the rest of his order are produced.

    Task:
    Considering the provided process description and apply the mentioned changes to create a refined valid BPMN graph.

  time:timestamp: '2025-10-30T12:29:32.056023+01:00'
