  cpee:change_uuid: c9d0d87fece5ef4f7ec343afc4b079b0b8fd3d4b
  cpee:exposition: |-
    %% Output Intermediate
    Due to the complexity of the process description, the model will be simplified to meet all requirements. The model will focus on the main steps of the process: detecting a data breach, notifying the supervisory authority, providing detailed information about the breach, and communicating the breach to the data subject if necessary.

    ```mermaid
    graph LR
    0:startevent:((startevent)) --> 1:task:(Detect personal data breach)
    1:task:(Detect personal data breach) --> 2:task:(Processor notifies controller)
    2:task:(Processor notifies controller) --> 3:exclusivegateway:{x}
    3:exclusivegateway:{x} --> |Within 72 hours| 4:task:(Controller notifies supervisory authority)
    3:exclusivegateway:{x} --> |After 72 hours| 5:task:(Controller notifies supervisory authority with reasons for delay)
    4:task:(Controller notifies supervisory authority) --> 6:task:(Provide detailed information about the breach)
    5:task:(Controller notifies supervisory authority with reasons for delay) --> 6:task:(Provide detailed information about the breach)
    6:task:(Provide detailed information about the breach) --> 7:exclusivegateway:{x}
    7:exclusivegateway:{x} --> |High risk to rights and freedoms| 8:task:(Communicate breach to data subject)
    7:exclusivegateway:{x} --> |No high risk or conditions in Art. 34(3) are met| 9:task:(No communication to data subject required)
    8:task:(Communicate breach to data subject) --> 10:endevent:(((endevent)))
    9:task:(No communication to data subject required) --> 10:endevent:(((endevent)))
    ```

    This model represents the described process, where a personal data breach is detected, the processor notifies the controller, the controller notifies the supervisory authority (either within 72 hours or after 72 hours with reasons for delay), detailed information about the breach is provided, and depending on the risk to rights and freedoms, the breach is either communicated to the data subject or no communication is required. The process ends after the communication step.
  time:timestamp: '2026-01-03T15:22:39.064611+01:00'
