event:
  concept:instance: 12236
  id:id: ex-ante
  cpee:instance: 0c394da1-e70b-42c9-b13a-bed0037bf97a
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: ec97c4d49fe3b0458a5c5f88cac824e211bc2e55
  cpee:exposition: |-
    # User Input:
    Article 62: Measures for providers and deployers, in particular SMEs, including start-ups
    --PARALLEL TASKS--
    1(a) Member States shall undertake the following actions provide SMEs, including start-ups, having a registered office or a branch in the Union, with priority access to the AI regulatory sandboxes, to the extent ; the priority access shall not preclude other SMEs, including start-ups, other than those referred to in this paragraph from access to the AI regulatory sandbox, provided
    1(b) Member States shall undertake the following actions organise specific awareness raising and training activities on the application of this Regulation tailored to the needs of SMEs including start-ups, deployers and local public authorities
    1(c) Member States shall undertake the following actions utilise existing dedicated channels and where appropriate, establish new ones for communication with SMEs including start-ups, deployers, other innovators and local public authorities to provide advice and respond to queries about the implementation of this Regulation, including as regards participation in AI regulatory sandboxes
    1(d) Member States shall undertake the following actions facilitate the participation of SMEs and other relevant stakeholders in the standardisation development process
    --END OF PARALLEL TASKS--
    2 The specific interests AND needs of the SME providers, including start-ups, shall be taken by Member States into account when setting the fees for conformity assessment under, reducing those fees proportionately to their size, market size and other relevant indicators.
    --PARALLEL TASKS--
    3(a) The AI Office shall undertake the following actions provide standardised templates for areas covered by this Regulation, as specified by the Board in its request
    3(b) The AI Office shall undertake the following actions develop and maintain a single information platform providing easy information in relation to this Regulation for all operators across the Union
    3(c) The AI Office shall undertake the following actions organise appropriate communication campaigns to raise awareness about the obligations arising from this Regulation
    3(d) The AI Office shall undertake the following actions evaluate and promote the convergence of best practices in public procurement procedures in relation to AI systems
    --END OF PARALLEL TASKS--
  time:timestamp: '2026-05-15T14:35:47.565302+02:00'
