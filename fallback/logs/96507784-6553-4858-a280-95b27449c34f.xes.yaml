  cpee:exposition: |-
    # User Input:
    A customer sits at a booth, scanning a laminated menu before signaling the server. Instead of a table setting, they provide a delivery address and a callback number.

    The server notes down the order—a large pepperoni with extra garlic—and processes the payment, including the tip, at the terminal. With the transaction complete, the customer skips the silverware, grabs a printed receipt, and heads out the door to wait for the pie to arrive at their own table at home.
  time:timestamp: '2026-04-17T15:58:32.883750+02:00'
