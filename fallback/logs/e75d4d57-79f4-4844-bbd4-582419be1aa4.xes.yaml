  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 515af3f4a2e5d3d90fc8aa474075b2af79af594b
  cpee:exposition: |+
    # User Input:
    the process continues to a task where a user attempts to log in. After this task, the process reaches another decision point that immediately merges into a subsequent decision point.

    From the second decision point, the process splits into two parallel paths.

    In the first path, the process continues to a task where the user logs in using their email and password, followed by a task indicating that the user is now logged in. This path then converges at a third decision point.

    In the second path, if the user has purchased the game, they proceed to a task where they register using a key, email, and password. This is followed by a fourth decision point.

    If the data entered is incorrect, a task displays an error message, and the process loops back to the task where the user attempts to log in. After this task, the process merges at a fifth decision point.

    If the data is correct, a confirmation email is sent, and the user opens the link in the email. This leads to a task recording the last login time, followed by a task indicating that the user is now logged in. The process then splits into two parallel paths at a sixth decision point, which immediately merges into a subsequent decision point.

    The two paths then converge at the fifth decision point.

    After the fifth decision point, the process escalates and merges into the third decision point.

    Finally, after the third decision point, the process loops back to the first decision point.

    If the condition at the first decision point is false, the process ends.

