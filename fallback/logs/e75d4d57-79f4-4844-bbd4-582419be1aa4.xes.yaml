  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: e03e2bce9c078daf7b9bacabe29d2bd9499ec68c
  cpee:exposition: |-
    # User Input:
    Log-In Service für ein Videospiel. Wenn ein nutzer das spiel gekauft hat, erhält er einen Key, den er bei der Registrierung für die Online-Services angeben muss, zusammen mit einer E-Mail-Adresse und einem passwort. wenn eines der dinge nicht passt, soll eine fehlermeldung erscheinen. Wenn alles passt, soll eine bestätigungsmail an die person versendet werden. diese muss er öffnen und auf den link klicken. wenn er das getan hat, muss er sich ein letztes mal einloggen und ist dann eingeloggt. der prozess endet. wenn er das spiel nicht neu gekauft hat, kann er sich mit seinem email und passwort anmelden und ist startklar. der prozess endet.
  time:timestamp: '2026-01-11T21:16:48.148560+01:00'
