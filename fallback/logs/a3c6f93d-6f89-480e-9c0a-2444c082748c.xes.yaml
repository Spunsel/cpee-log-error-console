  concept:instance: 71491
  id:id: ex-ante
  cpee:instance: a3c6f93d-6f89-480e-9c0a-2444c082748c
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: e93b76409873360647e094b9d81806a64bf221bf
  cpee:exposition: |-
    # User Input:
    Book Printing Process Description
    1. Process Initiation and Initial Approval

    The process begins with the Publishing Expert.
    The Publishing Expert prepares a “Book Printing Request Letter” whenever a book is scheduled for printing. This request is then submitted to the Publishing Manager for review and approval.

    The Publishing Manager reviews the request letter and signs it if approved. After approval, a decision must be made regarding the printing location.

    2. Decision on Printing Location

    At this stage, the Publishing Manager determines whether the book will be printed at the university’s internal printing house or by an external printing house.

    If the printing is outsourced to an external printing house, the process proceeds directly to the external printing workflow.
    If the university printing house is selected, the process follows a more administrative route involving the Administrative and Support Manager.
  time:timestamp: '2026-05-30T10:21:21.196479+02:00'
