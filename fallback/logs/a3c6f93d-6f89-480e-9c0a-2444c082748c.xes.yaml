event:
  concept:instance: 71491
  id:id: ex-ante
  cpee:instance: a3c6f93d-6f89-480e-9c0a-2444c082748c
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 2c949b0a43e1edcd91490b345faf017f76e5dfcc
  cpee:exposition: |-
    # User Input:
    3. External Printing House Workflow

    In the external printing workflow, the Printing House Representative receives the approved request and proceeds with printing the book.

    After the printing operation is completed, the representative prepares an official letter along with the cost invoice and sends them to the Publishing Unit for confirmation that the work has been completed according to the agreement.

    4. University Printing House Workflow (Z Path)

    When the university printing house is involved, the Administrative and Support Manager first receives and reviews the request letter.

    If no issues are identified, the manager approves and signs the confirmation letter together with the cost invoice. The university printing house then performs the printing operation and prepares the final letter and invoice to be submitted to the Publishing Manager.
  time:timestamp: '2026-05-30T10:18:34.013461+02:00'
