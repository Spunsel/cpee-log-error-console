event:
  concept:instance: 83264
  id:id: external
  cpee:activity: external
  cpee:instance: 1a5c30c2-34bc-45da-b305-3408387bb0ae
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 66faa6c4bfb11a8c0f5ea459f2cf2a16bad39421
  cpee:exposition: |+
    # User Input:
    Prozessbeschreibung „Drittmittelmanagement mit dem Master für HS/FE – Bearbeitung geförderter Projekte“

    Die Bearbeitung geförderter Projekte im Master für HS/FE umfasst den vollständigen Prozess von der Anbahnung eines geförderten Vorhabens über die Anlage und Pflege der projektbezogenen Stammdaten, die Budgetierung und laufende Bewirtschaftung bis hin zur Auswertung und Erstellung von Verwendungsnachweisen gegenüber den Mittelgebern. Fachlich verantwortet wird der Prozess durch den Bereich Drittmittelmanagement in enger Zusammenarbeit mit den antragstellenden und durchführenden Organisationseinheiten (Fakultäten, Institute, wissenschaftliche Projektleitungen).

    Zu Beginn werden geförderte Projekte außerhalb von SAP S/4HANA inhaltlich konzipiert, geeignete Förderprogramme identifiziert und Förderanträge erstellt, eingereicht und vertraglich fixiert. Nach Zugang der Förderzusage und Abschluss der Förderverträge werden die für die weitere SAP-gestützte Abwicklung notwendigen Stammdaten im System angelegt. Hierzu gehört die Definition der Stammdatenstruktur über die SAP-Module PS (Projektsystem), PSM-FM (Haushaltsmanagement) und PSM-GM (Fördermittelmanagement/Grants Management). Je Fördervertrag wird eine Projektdefinition im Modul PS angelegt, die den organisatorischen Rahmen des Projekts bildet. Darauf aufbauend werden für jede Mittelherkunft (Fördermittel und ggf. Eigenmittel) eine oder mehrere PSP-Elemente definiert. Zu jedem PSP-Element wird im Haushaltsmanagement ein korrespondierendes Haushaltsprogramm und im Fördermittelmanagement ein Vorhaben eingerichtet; je Projektdefinition wird eine passende Förderung angelegt.

    Die Anlage und Pflege von Projektdefinitionen und PSP-Elementen erfolgt über den Project Builder (CJ20N). Im Rahmen dieser Pflege werden insbesondere Nummernkreise, Kurzbeschreibungen, Projektprofile (z. B. „Nicht wirtschaftliches Projekt“ für geförderte Forschung), Verantwortlichkeiten (Projektleitung, Antragsteller), organisatorische Zuordnungen (Kostenrechnungskreis, Buchungskreis, Werk, Profitcenter), Laufzeiten sowie optionale Langtexte gepflegt. Für die PSP-Elemente werden zusätzlich Projektart, verantwortliche Kostenstellen, fondsbezogene Angaben (Eigen- oder Fremdmittel), Zusatzinformationen (z. B. Förderkennzeichen, Institut, Fakultät, MINT-Bereich, Förderer, Durchführende Stelle) sowie Overhead-Parameter (Overhead-Prozentsatz, Kostenartengruppen, Zielkontierungselemente) hinterlegt. Diese Daten bilden die Grundlage für automatische Ableitungen in Haushalt und Fördermittelmanagement sowie für die spätere Overheadumbuchung.

    Im nächsten Schritt werden die korrespondierenden Haushaltsprogramme im Modul PSM-FM sowie die Förderungen und Vorhaben im Modul PSM-GM angelegt. Soweit möglich erfolgt diese Anlage automatisiert auf Basis der vorhandenen PSP-Elemente (z. B. mittels FMMDAUTO für Haushaltsprogramme und /GISA/GMGENERATE für Förderungen und Vorhaben). Dabei werden Nummern, Bezeichnungen, Gültigkeitszeiträume und wesentliche Attribute aus den Projektdaten übernommen. Ergänzend dazu werden Einnahmen- und Ausgabearten sowie deren Gruppen gepflegt und über Ableitungstabellen projektspezifisch, mittelgeberspezifisch oder generisch hinterlegt. Diese Einstellungen stellen sicher, dass bei der Verbuchung von Belegen die korrekten E/A-Arten im Fördermittelmanagement ermittelt werden.

    Auf dieser Stammdatenbasis erfolgt die Budgetierung der externen Fördermittel und der optionalen Eigenmittel. Die Budgetierung wird im Fördermittelmanagement auf der Kombination von Fonds, Förderung, Vorhaben und Einnahmen-/Ausgabeart vorgenommen und in einer definierten Budgetversion geführt. Budgeterfassungsbelege werden erfasst, bei Bedarf umgebucht oder angepasst und über geeignete Berichte (z. B. Gesamtbudget versus Obligo-/Ist-Summen) ausgewertet. Parallel wird im Haushaltsmanagement die aktive Verfügbarkeitskontrolle (AVK) für Eigenmittel-PSP-Elemente und im Fördermittelmanagement für Fremdmittel-PSP-Elemente eingerichtet. Über spezialisierte Kontroll-Ledger, Ableitungsstrategien und Toleranzprofile wird geprüft, ob für jede Buchung ausreichend Budget zur Verfügung steht; bei Überschreitung greifen die definierten Prüf- und Sperrmechanismen.

    In der operativen Projektphase werden die laufenden Aufwendungen und gegebenenfalls Erträge auf die geförderten PSP-Elemente gebucht. Hierzu zählen insbesondere Personalkosten (aus HR-/Payroll-Schnittstellen für projektfinanzierte Mitarbeiter oder über FI-Umbuchungen für haushaltsfinanzierte Mitarbeitende), Beschaffungen von Waren, Dienstleistungen und Investitionsgütern, interne Leistungsverrechnungen für haushaltsfinanzierte Ressourcen (Räume, Labore, Maschinen) sowie Reisekosten (aus einem Reisekostensystem). Zusätzlich können Mittelreservierungen als manuelle Obligo-Belege angelegt werden, um Budgetmittel vorab zu binden. Sämtliche Buchungen werden über die im Customizing hinterlegten Ableitungsstrategien automatisiert den korrekten Haushalts- und Fördermittelkontierungen sowie den relevanten AVK-Objekten zugeordnet.

    Für die Refinanzierung von Gemeinkosten wird in regelmäßigen Abständen eine Overheadumbuchung durchgeführt. Auf Basis der im PSP-Stamm definierten Overheadparameter (Overhead-Prozentsatz, leistungsfähige Kostenarten, Zielkontierungen) berechnet ein spezielles Programm die umzubuchenden Overheadbeträge, belastet die geförderten PSP-Elemente und entlastet die hinterlegten Kostenstellen, Fonds oder anderen PSP-Elemente. Prozessbegleitend stehen vielfältige Berichts- und Auswertungstools zur Verfügung, mit denen Budget-, Obligo- und Ist-Daten nach verschiedenen Merkmalen (z. B. Projekt, Förderung, Vorhaben, Einnahmen-/Ausgabeart, Jahr) analysiert werden können.

    Im Rahmen des Mittelabrufs werden die beim Fördermittelgeber anzufordernden Beträge ermittelt, die debitorischen Ausgangsrechnungen erstellt, genehmigt, verbucht, gedruckt und versendet. Ansprechpartner, Rechnungsempfänger und Rechnungsdaten werden in entsprechenden Apps gepflegt, ein definierter Genehmigungsworkflow stellt die sachliche und rechnerische Richtigkeit sicher, und ein generisches Schnittstellencockpit übernimmt die technische Verbuchung der Ausgangsrechnungsvorgänge. Die Zahlungseingänge werden in der Finanzbuchhaltung verarbeitet und fließen in die Auswertungen des Fördermittelmanagements ein.

    Mit Abschluss der inhaltlichen Projektbearbeitung werden die projektbezogenen Stammdaten (Projektdefinitionen und PSP-Elemente) in den Abschlussstatus versetzt, sodass weitere operative Buchungen unterbunden werden. Abschließend erfolgt die projektspezifische Auswertung der Mittelverwendung und -bewirtschaftung. Über entsprechende Berichte werden die für interne und externe Berichtspflichten erforderlichen Kennzahlen bereitgestellt. Für die Mittelgeber werden auf Basis von Einzelpostenlisten und Budget-/Ist-Auswertungen Verwendungsnachweise erstellt, die außerhalb des Systems formal aufbereitet, geprüft und fristgerecht eingereicht werden. Damit ist der Prozess der Bearbeitung des geförderten Projekts im Master für HS/FE abgeschlossen.

  time:timestamp: '2025-12-11T15:56:02.138461+01:00'
...
