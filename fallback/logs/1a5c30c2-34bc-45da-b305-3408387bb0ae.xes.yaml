    # User Input:
    Prozessbeschreibung â€žDrittmittelmanagement mit dem Master fÃ¼r HS/FE â€“ Bearbeitung gefÃ¶rderter Projekteâ€œ

    Die Bearbeitung gefÃ¶rderter Projekte im Master fÃ¼r HS/FE umfasst den vollstÃ¤ndigen Prozess von der Anbahnung eines gefÃ¶rderten Vorhabens Ã¼ber die Anlage und Pflege der projektbezogenen Stammdaten, die Budgetierung und laufende Bewirtschaftung bis hin zur Auswertung und Erstellung von Verwendungsnachweisen gegenÃ¼ber den Mittelgebern. Fachlich verantwortet wird der Prozess durch den Bereich Drittmittelmanagement in enger Zusammenarbeit mit den antragstellenden und durchfÃ¼hrenden Organisationseinheiten (FakultÃ¤ten, Institute, wissenschaftliche Projektleitungen).

    Zu Beginn werden gefÃ¶rderte Projekte auÃŸerhalb von SAP S/4HANA inhaltlich konzipiert, geeignete FÃ¶rderprogramme identifiziert und FÃ¶rderantrÃ¤ge erstellt, eingereicht und vertraglich fixiert. Nach Zugang der FÃ¶rderzusage und Abschluss der FÃ¶rdervertrÃ¤ge werden die fÃ¼r die weitere SAP-gestÃ¼tzte Abwicklung notwendigen Stammdaten im System angelegt. Hierzu gehÃ¶rt die Definition der Stammdatenstruktur Ã¼ber die SAP-Module PS (Projektsystem), PSM-FM (Haushaltsmanagement) und PSM-GM (FÃ¶rdermittelmanagement/Grants Management). Je FÃ¶rdervertrag wird eine Projektdefinition im Modul PS angelegt, die den organisatorischen Rahmen des Projekts bildet. Darauf aufbauend werden fÃ¼r jede Mittelherkunft (FÃ¶rdermittel und ggf. Eigenmittel) eine oder mehrere PSP-Elemente definiert. Zu jedem PSP-Element wird im Haushaltsmanagement ein korrespondierendes Haushaltsprogramm und im FÃ¶rdermittelmanagement ein Vorhaben eingerichtet; je Projektdefinition wird eine passende FÃ¶rderung angelegt.

    Die Anlage und Pflege von Projektdefinitionen und PSP-Elementen erfolgt Ã¼ber den Project Builder (CJ20N). Im Rahmen dieser Pflege werden insbesondere Nummernkreise, Kurzbeschreibungen, Projektprofile (z. B. â€žNicht wirtschaftliches Projektâ€œ fÃ¼r gefÃ¶rderte Forschung), Verantwortlichkeiten (Projektleitung, Antragsteller), organisatorische Zuordnungen (Kostenrechnungskreis, Buchungskreis, Werk, Profitcenter), Laufzeiten sowie optionale Langtexte gepflegt. FÃ¼r die PSP-Elemente werden zusÃ¤tzlich Projektart, verantwortliche Kostenstellen, fondsbezogene Angaben (Eigen- oder Fremdmittel), Zusatzinformationen (z. B. FÃ¶rderkennzeichen, Institut, FakultÃ¤t, MINT-Bereich, FÃ¶rderer, DurchfÃ¼hrende Stelle) sowie Overhead-Parameter (Overhead-Prozentsatz, Kostenartengruppen, Zielkontierungselemente) hinterlegt. Diese Daten bilden die Grundlage fÃ¼r automatische Ableitungen in Haushalt und FÃ¶rdermittelmanagement sowie fÃ¼r die spÃ¤tere Overheadumbuchung.

    Im nÃ¤chsten Schritt werden die korrespondierenden Haushaltsprogramme im Modul PSM-FM sowie die FÃ¶rderungen und Vorhaben im Modul PSM-GM angelegt. Soweit mÃ¶glich erfolgt diese Anlage automatisiert auf Basis der vorhandenen PSP-Elemente (z. B. mittels FMMDAUTO fÃ¼r Haushaltsprogramme und /GISA/GMGENERATE fÃ¼r FÃ¶rderungen und Vorhaben). Dabei werden Nummern, Bezeichnungen, GÃ¼ltigkeitszeitrÃ¤ume und wesentliche Attribute aus den Projektdaten Ã¼bernommen. ErgÃ¤nzend dazu werden Einnahmen- und Ausgabearten sowie deren Gruppen gepflegt und Ã¼ber Ableitungstabellen projektspezifisch, mittelgeberspezifisch oder generisch hinterlegt. Diese Einstellungen stellen sicher, dass bei der Verbuchung von Belegen die korrekten E/A-Arten im FÃ¶rdermittelmanagement ermittelt werden.

    Auf dieser Stammdatenbasis erfolgt die Budgetierung der externen FÃ¶rdermittel und der optionalen Eigenmittel. Die Budgetierung wird im FÃ¶rdermittelmanagement auf der Kombination von Fonds, FÃ¶rderung, Vorhaben und Einnahmen-/Ausgabeart vorgenommen und in einer definierten Budgetversion gefÃ¼hrt. Budgeterfassungsbelege werden erfasst, bei Bedarf umgebucht oder angepasst und Ã¼ber geeignete Berichte (z. B. Gesamtbudget versus Obligo-/Ist-Summen) ausgewertet. Parallel wird im Haushaltsmanagement die aktive VerfÃ¼gbarkeitskontrolle (AVK) fÃ¼r Eigenmittel-PSP-Elemente und im FÃ¶rdermittelmanagement fÃ¼r Fremdmittel-PSP-Elemente eingerichtet. Ãœber spezialisierte Kontroll-Ledger, Ableitungsstrategien und Toleranzprofile wird geprÃ¼ft, ob fÃ¼r jede Buchung ausreichend Budget zur VerfÃ¼gung steht; bei Ãœberschreitung greifen die definierten PrÃ¼f- und Sperrmechanismen.

    In der operativen Projektphase werden die laufenden Aufwendungen und gegebenenfalls ErtrÃ¤ge auf die gefÃ¶rderten PSP-Elemente gebucht. Hierzu zÃ¤hlen insbesondere Personalkosten (aus HR-/Payroll-Schnittstellen fÃ¼r projektfinanzierte Mitarbeiter oder Ã¼ber FI-Umbuchungen fÃ¼r haushaltsfinanzierte Mitarbeitende), Beschaffungen von Waren, Dienstleistungen und InvestitionsgÃ¼tern, interne Leistungsverrechnungen fÃ¼r haushaltsfinanzierte Ressourcen (RÃ¤ume, Labore, Maschinen) sowie Reisekosten (aus einem Reisekostensystem). ZusÃ¤tzlich kÃ¶nnen Mittelreservierungen als manuelle Obligo-Belege angelegt werden, um Budgetmittel vorab zu binden. SÃ¤mtliche Buchungen werden Ã¼ber die im Customizing hinterlegten Ableitungsstrategien automatisiert den korrekten Haushalts- und FÃ¶rdermittelkontierungen sowie den relevanten AVK-Objekten zugeordnet.

    FÃ¼r die Refinanzierung von Gemeinkosten wird in regelmÃ¤ÃŸigen AbstÃ¤nden eine Overheadumbuchung durchgefÃ¼hrt. Auf Basis der im PSP-Stamm definierten Overheadparameter (Overhead-Prozentsatz, leistungsfÃ¤hige Kostenarten, Zielkontierungen) berechnet ein spezielles Programm die umzubuchenden OverheadbetrÃ¤ge, belastet die gefÃ¶rderten PSP-Elemente und entlastet die hinterlegten Kostenstellen, Fonds oder anderen PSP-Elemente. Prozessbegleitend stehen vielfÃ¤ltige Berichts- und Auswertungstools zur VerfÃ¼gung, mit denen Budget-, Obligo- und Ist-Daten nach verschiedenen Merkmalen (z. B. Projekt, FÃ¶rderung, Vorhaben, Einnahmen-/Ausgabeart, Jahr) analysiert werden kÃ¶nnen.

    Im Rahmen des Mittelabrufs werden die beim FÃ¶rdermittelgeber anzufordernden BetrÃ¤ge ermittelt, die debitorischen Ausgangsrechnungen erstellt, genehmigt, verbucht, gedruckt und versendet. Ansprechpartner, RechnungsempfÃ¤nger und Rechnungsdaten werden in entsprechenden Apps gepflegt, ein definierter Genehmigungsworkflow stellt die sachliche und rechnerische Richtigkeit sicher, und ein generisches Schnittstellencockpit Ã¼bernimmt die technische Verbuchung der AusgangsrechnungsvorgÃ¤nge. Die ZahlungseingÃ¤nge werden in der Finanzbuchhaltung verarbeitet und flieÃŸen in die Auswertungen des FÃ¶rdermittelmanagements ein.

    Mit Abschluss der inhaltlichen Projektbearbeitung werden die projektbezogenen Stammdaten (Projektdefinitionen und PSP-Elemente) in den Abschlussstatus versetzt, sodass weitere operative Buchungen unterbunden werden. AbschlieÃŸend erfolgt die projektspezifische Auswertung der Mittelverwendung und -bewirtschaftung. Ãœber entsprechende Berichte werden die fÃ¼r interne und externe Berichtspflichten erforderlichen Kennzahlen bereitgestellt. FÃ¼r die Mittelgeber werden auf Basis von Einzelpostenlisten und Budget-/Ist-Auswertungen Verwendungsnachweise erstellt, die auÃŸerhalb des Systems formal aufbereitet, geprÃ¼ft und fristgerecht eingereicht werden. Damit ist der Prozess der Bearbeitung des gefÃ¶rderten Projekts im Master fÃ¼r HS/FE abgeschlossen.

