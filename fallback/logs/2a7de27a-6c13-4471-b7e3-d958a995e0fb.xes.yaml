event:
  concept:instance: 75001
  id:id: external
  cpee:activity: external
  cpee:instance: 2a7de27a-6c13-4471-b7e3-d958a995e0fb
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 90976d49c89883b1a02ba796b899b61d709f63fc
  cpee:exposition: |-
    # User Input:
    The process starts when a customer wants to rent a bike, this is requested online through their website. In the first step, the customer will write an email asking if there are any bikes available at that time. Swapfiets online customer service will receive the email and contact the Swapfiets store employees, those are the ones who check the availability of the bikes. If no bikes are available, Swapfiets online customer service will notify the customer, and the service will not be supported.
    Otherwise, if bikes are available, the customer must fill in all the required information and pay the first fee while the Swapfiets store employees prepare the bike. Once they have completed everything, they can get the bike from the shop and the contract will be started.
    In case something is wrong, maintenance will be requested, and it will be the Swapfiets store employees who will fix or swap the bike. The customer will proceed to take the bike to the nearest Swapfiets store or also, the staff will pick up the bike at the customer's place, so that the store employees can check that it is something wrong. The bike will be analyzed, and depending on the damage, it will be swapped for another one, or fixed.
    Once the bike is ready to be used, the customer will pick it up at the store and start using it again. The maintenance process can be performed as many times as the bike requires. Once the customer wants to terminate the contract, provided that at least two months have passed since the beginning of the contract, he must send a warning message to Swapfiets employees saying that he wants to terminate the contract. The customer must take the bike to the shop, and the employees will check it and if everything is correct, they will register it as available and ready for a new rental contract.
  time:timestamp: '2025-11-28T18:01:32.070809+01:00'
