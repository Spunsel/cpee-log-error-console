  cpee:exposition: |-
    # User Input:
    model the loop using two gateways of the same type â€” one for the decision (split) and one for returning to the start of the repeated part (merge).

    The merge gateway must appear before the first task of the loop segment.


    The process starts when the lab material is received.
    The material is then checked for correctness and quality. If the check reveals that the sample is unsuitableâ€”for example, the labeling is unclear or the volume is insufficientâ€”the sample is re-prepared or reprocessed, and the check is repeated.
    Once the sample passes the check, the examination is performed. After the examination, a report is created to document the results.
    The process ends when the report is completed.
  time:timestamp: '2025-10-28T23:31:43.978352+01:00'
