event:
  concept:instance: 71490
  id:id: ex-ante
  cpee:instance: 8e2b8dc6-3b95-48b2-be32-6e3fdff3df6d
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: b8cf3b94d062555a746b9a1718fe3b46edc77d16
  cpee:exposition: |-
    # User Input:
    Book Printing Process Description




    1. Process Initiation and Initial Approval

    The process begins with the Publishing Expert.
    The Publishing Expert prepares a “Book Printing Request Letter” whenever a book is scheduled for printing. This request is then submitted to the Publishing Manager for review and approval.

    The Publishing Manager reviews the request letter and signs it if approved. After approval, a decision must be made regarding the printing location.

    2. Decision on Printing Location

    At this stage, the Publishing Manager determines whether the book will be printed at the university’s internal printing house or by an external printing house.

    If the printing is outsourced to an external printing house, the process proceeds directly to the external printing workflow.
    If the university printing house is selected, the process follows a more administrative route involving the Administrative and Support Manager.
    3. External Printing House Workflow

    In the external printing workflow, the Printing House Representative receives the approved request and proceeds with printing the book.

    After the printing operation is completed, the representative prepares an official letter along with the cost invoice and sends them to the Publishing Unit for confirmation that the work has been completed according to the agreement.

    4. University Printing House Workflow (Z Path)

    When the university printing house is involved, the Administrative and Support Manager first receives and reviews the request letter.

    If no issues are identified, the manager approves and signs the confirmation letter together with the cost invoice. The university printing house then performs the printing operation and prepares the final letter and invoice to be submitted to the Publishing Manager.

    5. Cost Review by the Publishing Manager

    Regardless of whether the printing was completed internally or externally, all invoices and related documents are reviewed again by the Publishing Manager.

    The Publishing Manager carefully checks the letter and the cost invoice to ensure compliance with the allocated budget and prior agreements.

    6. Quality and Quantity Verification

    After managerial approval, the printed books are delivered to the Publishing Expert.

    The Publishing Expert verifies the books by comparing the quantity and quality of the printed materials against the issued invoice. At this stage, a control checkpoint is performed:

    If discrepancies or quality issues are identified, the books or invoice are returned to the printing house for invoice correction and document revision.
    If the verification is successful, the process moves to the final stage.
    7. Final Stage: Storage and Distribution

    Once all approvals and verifications are completed, the Publishing Expert officially records the receipt of the printed books.

    The books are then transferred to the warehouse for storage. Finally, the distribution and dissemination process begins, marking the completion of the overall workflow.
