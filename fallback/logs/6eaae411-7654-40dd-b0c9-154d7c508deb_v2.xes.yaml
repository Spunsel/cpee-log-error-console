event:
  concept:instance: 193
  id:id: external
  cpee:activity: external
  cpee:instance: 6eaae411-7654-40dd-b0c9-154d7c508deb
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 2780c046d454f87e5dd3bad823b090878d2e3d18
  cpee:exposition: |-
    # User Input:
    Booking a plane ticket begins when the user initiates the booking process on a travel website or app. The user first provides travel details including departure airport, destination airport, travel dates, number of passengers, and cabin class. If any mandatory information is missing, the system prompts the user to complete the form until all fields are valid. Once the details are complete, the system searches for available flights through airline databases or APIs. If no flights are found, the user is informed and can adjust search criteria and repeat the search. If flights are found, the system displays available options with times, prices, durations, and stop information. The user may filter or sort these options by preferences such as price or airline. When a flight is selected, the system stores the choice and moves to passenger information entry.


    In this step, the user provides names, birth dates, passport details, and contact information for each traveler. The system validates that the data is complete and formatted correctly; if errors are found, the user is prompted to correct them before continuing. After that, the user may choose optional add-ons such as checked baggage, preferred seating, travel insurance, or meals. Each selected extra updates the total price. If the user declines extras, the process skips ahead to the review stage.


    The booking summary screen shows all chosen details: selected flight, passenger data, extras, and total price. The user reviews the information and either confirms or returns to previous steps to make changes. When the user confirms, the process proceeds to payment. The user selects a payment method—credit card, PayPal, bank transfer, or other—and the system connects to a secure payment gateway. If payment authorization fails, the user can retry the payment or choose another method until successful. Once payment is approved, the system finalizes the booking, generating a unique booking ID and e-ticket.


    The system sends a confirmation email or SMS to the user containing booking details and ticket attachments. If delivery fails, the system retries sending or provides a link to download the ticket directly. The process concludes when the user successfully receives the confirmation and ticket. Throughout the process, validation and error handling loops ensure that incomplete forms, failed searches, or payment issues can be corrected without restarting. The final outcome is a confirmed, paid, and delivered plane ticket ready for the traveler’s journey.
  time:timestamp: '2025-11-01T15:29:21.659635+01:00'
