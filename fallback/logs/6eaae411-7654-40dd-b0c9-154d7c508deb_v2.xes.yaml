event:
  concept:instance: 193
  id:id: external
  cpee:activity: external
  cpee:instance: 6eaae411-7654-40dd-b0c9-154d7c508deb
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/change
  cpee:description: |
    <?xml version="1.0"?>
    <description xmlns="http://cpee.org/ns/description/1.0" xmlns:a="http://cpee.org/ns/annotation/1.0">
      <call id="a1" endpoint="" a:alt_id="a1">
        <parameters>
          <label>Open Airline Website/App</label>
          <method/>
          <type>:task</type>
          <arguments/>
        </parameters>
      </call>
      <call id="a3" endpoint="" a:alt_id="a2">
        <parameters>
          <label>Select 'Book a Flight'</label>
          <method/>
          <type>:task</type>
          <arguments/>
        </parameters>
      </call>
      <loop mode="pre_test" condition="true">
        <call id="a5" endpoint="" a:alt_id="a3">
          <parameters>
            <label>Enter Departure City</label>
            <method/>
            <type>:task</type>
            <arguments/>
          </parameters>
        </call>
        <call id="a7" endpoint="" a:alt_id="a4">
          <parameters>
            <label>Enter Destination City</label>
            <method/>
            <type>:task</type>
            <arguments/>
          </parameters>
        </call>
        <call id="a9" endpoint="" a:alt_id="a5">
          <parameters>
            <label>Select Departure Date</label>
            <method/>
            <type>:task</type>
            <arguments/>
          </parameters>
        </call>
        <call id="a11" endpoint="" a:alt_id="a6">
          <parameters>
            <label>Select Return Date</label>
            <method/>
            <type>:task</type>
            <arguments/>
          </parameters>
        </call>
        <call id="a13" endpoint="" a:alt_id="a7">
          <parameters>
            <label>Enter Number of Passengers</label>
            <method/>
            <type>:task</type>
            <arguments/>
          </parameters>
        </call>
        <call id="a15" endpoint="" a:alt_id="a8">
          <parameters>
            <label>Search for Flights</label>
            <method/>
            <type>:task</type>
            <arguments/>
          </parameters>
        </call>
        <loop mode="pre_test" condition="Flights Found">
          <choose mode="exclusive" a:alt_id="ex1">
            <alternative condition="Flights Found" language="text/javascript">
              <call id="a19" endpoint="" a:alt_id="a9">
                <parameters>
                  <label>Display Available Flights</label>
                  <method/>
                  <type>:task</type>
                  <arguments/>
                </parameters>
              </call>
              <call id="a27" endpoint="" a:alt_id="a12">
                <parameters>
                  <label>Select a Flight</label>
                  <method/>
                  <type>:task</type>
                  <arguments/>
                </parameters>
              </call>
              <choose mode="exclusive" a:alt_id="ex2">
                <alternative condition="No Flight Selected" language="text/javascript">
                  <call id="a23" endpoint="" a:alt_id="a11">
                    <parameters>
                      <label>Modify Search Criteria</label>
                      <method/>
                      <type>:task</type>
                      <arguments/>
                    </parameters>
                  </call>
                  <call id="a5" endpoint="" a:alt_id="a3">
                    <parameters>
                      <label>Enter Departure City</label>
                      <method/>
                      <type>:task</type>
                      <arguments/>
                    </parameters>
                  </call>
                  <call id="a7" endpoint="" a:alt_id="a4">
                    <parameters>
                      <label>Enter Destination City</label>
                      <method/>
                      <type>:task</type>
                      <arguments/>
                    </parameters>
                  </call>
                  <call id="a9" endpoint="" a:alt_id="a5">
                    <parameters>
                      <label>Select Departure Date</label>
                      <method/>
                      <type>:task</type>
                      <arguments/>
                    </parameters>
                  </call>
                  <call id="a11" endpoint="" a:alt_id="a6">
                    <parameters>
                      <label>Select Return Date</label>
                      <method/>
                      <type>:task</type>
                      <arguments/>
                    </parameters>
                  </call>
                  <call id="a13" endpoint="" a:alt_id="a7">
                    <parameters>
                      <label>Enter Number of Passengers</label>
                      <method/>
                      <type>:task</type>
                      <arguments/>
                    </parameters>
                  </call>
                  <call id="a15" endpoint="" a:alt_id="a8">
                    <parameters>
                      <label>Search for Flights</label>
                      <method/>
                      <type>:task</type>
                      <arguments/>
                    </parameters>
                  </call>
                </alternative>
                <alternative condition="Flight Selected" language="text/javascript">
                  <call id="a31" endpoint="" a:alt_id="a13">
                    <parameters>
                      <label>Display Flight Details</label>
                      <method/>
                      <type>:task</type>
                      <arguments/>
                    </parameters>
                  </call>
                  <call id="a35" endpoint="" a:alt_id="a14">
                    <parameters>
                      <label>Confirm Flight Selection</label>
                      <method/>
                      <type>:task</type>
                      <arguments/>
                    </parameters>
                  </call>
                  <call id="a37" endpoint="" a:alt_id="a15">
                    <parameters>
                      <label>Enter Passenger Details</label>
                      <method/>
                      <type>:task</type>
                      <arguments/>
                    </parameters>
                  </call>
                  <call id="a39" endpoint="" a:alt_id="a16">
                    <parameters>
                      <label>Select Seat Assignments</label>
                      <method/>
                      <type>:task</type>
                      <arguments/>
                    </parameters>
                  </call>
                  <call id="a41" endpoint="" a:alt_id="a17">
                    <parameters>
                      <label>Add Optional Services</label>
                      <method/>
                      <type>:task</type>
                      <arguments/>
                    </parameters>
                  </call>
                  <call id="a43" endpoint="" a:alt_id="a18">
                    <parameters>
                      <label>Review Booking Summary</label>
                      <method/>
                      <type>:task</type>
                      <arguments/>
                    </parameters>
                  </call>
                  <choose mode="exclusive" a:alt_id="ex3">
                    <alternative condition="Summary OK" language="text/javascript">
                      <call id="a47" endpoint="" a:alt_id="a19">
                        <parameters>
                          <label>Proceed to Payment</label>
                          <method/>
                          <type>:task</type>
                          <arguments/>
                        </parameters>
                      </call>
                      <call id="a51" endpoint="" a:alt_id="a20">
                        <parameters>
                          <label>Enter Payment Information</label>
                          <method/>
                          <type>:task</type>
                          <arguments/>
                        </parameters>
                      </call>
                      <choose mode="exclusive" a:alt_id="ex4">
                        <alternative condition="">
                          <call id="a55" endpoint="" a:alt_id="a21">
                            <parameters>
                              <label>Generate Booking Confirmation</label>
                              <method/>
                              <type>:task</type>
                              <arguments/>
                            </parameters>
                          </call>
                          <call id="a61" endpoint="" a:alt_id="a23">
                            <parameters>
                              <label>Send Confirmation Email/SMS</label>
                              <method/>
                              <type>:task</type>
                              <arguments/>
                            </parameters>
                          </call>
                          <choose mode="exclusive" a:alt_id="ex5">
                            <alternative condition="Confirmation Sent" language="text/javascript"/>
                            <alternative condition="Confirmation Failed" language="text/javascript">
                              <call id="a67" endpoint="" a:alt_id="a24">
                                <parameters>
                                  <label>Retry Sending Confirmation</label>
                                  <method/>
                                  <type>:task</type>
                                  <arguments/>
                                </parameters>
                              </call>
                            </alternative>
                          </choose>
                        </alternative>
                        <alternative condition="Payment Failed" language="text/javascript">
                          <call id="a57" endpoint="" a:alt_id="a22">
                            <parameters>
                              <label>Display Payment Error Message</label>
                              <method/>
                              <type>:task</type>
                              <arguments/>
                            </parameters>
                          </call>
                          <call id="a51" endpoint="" a:alt_id="a20">
                            <parameters>
                              <label>Enter Payment Information</label>
                              <method/>
                              <type>:task</type>
                              <arguments/>
                            </parameters>
                          </call>
                        </alternative>
                      </choose>
                    </alternative>
                    <alternative condition="Summary Not OK" language="text/javascript">
                      <call id="a37" endpoint="" a:alt_id="a15">
                        <parameters>
                          <label>Enter Passenger Details</label>
                          <method/>
                          <type>:task</type>
                          <arguments/>
                        </parameters>
                      </call>
                    </alternative>
                  </choose>
                  <escape a:alt_id="-1"/>
                </alternative>
              </choose>
            </alternative>
            <alternative condition="No Flights Found" language="text/javascript">
              <call id="a21" endpoint="" a:alt_id="a10">
                <parameters>
                  <label>Display 'No Flights' Message</label>
                  <method/>
                  <type>:task</type>
                  <arguments/>
                </parameters>
              </call>
              <call id="a23" endpoint="" a:alt_id="a11">
                <parameters>
                  <label>Modify Search Criteria</label>
                  <method/>
                  <type>:task</type>
                  <arguments/>
                </parameters>
              </call>
              <call id="a5" endpoint="" a:alt_id="a3">
                <parameters>
                  <label>Enter Departure City</label>
                  <method/>
                  <type>:task</type>
                  <arguments/>
                </parameters>
              </call>
              <call id="a7" endpoint="" a:alt_id="a4">
                <parameters>
                  <label>Enter Destination City</label>
                  <method/>
                  <type>:task</type>
