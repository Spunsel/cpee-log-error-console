  cpee:change_uuid: 6531eb31adf7e7fd931ee16d73b58712aea6f397
  cpee:exposition: |-
    # User Input:
    Customersuploadtheircomplaintvia an online form. The formcontainstheinsurancenumber, theamountofdamage, anda descriptionofthedamage.
    Iftheamountofdamageis≤ 100 Euro, an automaticplausibilitycheck isconductedandthecomplaintisapproved. The customerisinformedvia emailandthemoneytransferisinitiated.
    Ifthedamageamountisabove100 Euro, a clerkchecksthecomplaint. The customerisinformedon thedecisionvia email. Ifthecomplaintisrejected, thecustomerisofferedan optionalmeeting.
  time:timestamp: '2026-04-27T10:35:40.407333+02:00'
