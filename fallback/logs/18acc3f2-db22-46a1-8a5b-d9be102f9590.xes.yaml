event:
  concept:instance: 11725
  id:id: ex-ante
  cpee:instance: 18acc3f2-db22-46a1-8a5b-d9be102f9590
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 1f005af7d3ab45a3a0457c7f2e252a62119afa75
  cpee:exposition: |-
    # User Input:
    This is the process for a loan approval.

    A customer creates a loan application and submits it to its bank. The pre-verification (PV) service verifies whether the application is complete. If something is missing, the PV service asks the customer to correct the application and re-submits it. Else, the PV service starts the identity and compliance checks. 

    PV Service queries the KYC Service to get the KYC status of the customer. In parallel, PV Service queries the Compliance Service to get the sanction history and AML risk level of the customer. If the KYC status comes back negative, or the AML risk level is over 50%, the PV service automatically denies the loan. Else, they proceed with credit and risk assessment. To do so, the PV Service computes the DTI ratio, then queries the risk assessment service to get the risk score. The risk assessment service queries the credit score service to get the customer credit score. The credit score services look at the customer file to compute its credit score. Finally, the risk assessment service computes the risk score of the loan based on the credit score and the DTI ratio.

    If the risk score is over 50%, the PV service automatically denies the loan. Else, it determines the loan category based on all the elements in the loan application. If the loan category is small, the PV service automatically approves the loan and computes an interest rate. Else, the PV service transmits the loan application to the loan officer. The loan officer reviews the loan application, and approves or denies it (with justification).
  time:timestamp: '2026-05-07T22:42:32.467922+02:00'
