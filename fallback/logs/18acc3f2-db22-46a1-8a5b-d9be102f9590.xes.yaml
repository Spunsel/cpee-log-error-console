  cpee:change_uuid: 1f005af7d3ab45a3a0457c7f2e252a62119afa75
  cpee:exposition: |-
    %% Output Intermediate
    ```mermaid
    graph LR
    0:startevent:((startevent)) --> 1:task:(Create Loan Application)
    1:task:(Create Loan Application) --> 2:task:(Submit Loan Application)
    2:task:(Submit Loan Application) --> 3:task:(Pre-Verification)
    3:task:(Pre-Verification) --> 4:exclusivegateway:{x}
    4:exclusivegateway:{x} --> |Incomplete| 5:task:(Correct Application)
    5:task:(Correct Application) --> 3:task:(Pre-Verification)
    4:exclusivegateway:{x} --> |Complete| 6:parallelgateway:{AND}
    6:parallelgateway:{AND} --> 7:task:(KYC Check)
    6:parallelgateway:{AND} --> 8:task:(Compliance Check)
    7:task:(KYC Check) --> 9:parallelgateway:{AND}
    8:task:(Compliance Check) --> 9:parallelgateway:{AND}
    9:parallelgateway:{AND} --> 10:exclusivegateway:{x}
    10:exclusivegateway:{x} --> |KYC Negative or AML Risk > 50%| 11:task:(Deny Loan)
    10:exclusivegateway:{x} --> |KYC Positive and AML Risk <= 50%| 12:task:(Compute DTI Ratio)
    12:task:(Compute DTI Ratio) --> 13:task:(Risk Assessment)
    13:task:(Risk Assessment) --> 14:exclusivegateway:{x}
    14:exclusivegateway:{x} --> |Risk Score > 50%| 11:task:(Deny Loan)
    14:exclusivegateway:{x} --> |Risk Score <= 50%| 15:task:(Determine Loan Category)
    15:task:(Determine Loan Category) --> 16:exclusivegateway:{x}
    16:exclusivegateway:{x} --> |Small Loan| 17:task:(Approve Loan and Compute Interest Rate)
    16:exclusivegateway:{x} --> |Large Loan| 18:task:(Transmit to Loan Officer)
    18:task:(Transmit to Loan Officer) --> 19:task:(Review Loan Application)
    19:task:(Review Loan Application) --> 20:exclusivegateway:{x}
    20:exclusivegateway:{x} --> |Approved| 21:task:(Approve Loan)
    20:exclusivegateway:{x} --> |Denied| 11:task:(Deny Loan)
    11:task:(Deny Loan) --> 22:endevent:(((endevent)))
    17:task:(Approve Loan and Compute Interest Rate) --> 22:endevent:(((endevent)))
    21:task:(Approve Loan) --> 22:endevent:(((endevent)))
    ```
    This model represents the loan approval process. It starts with the customer creating and submitting a loan application. The application goes through pre-verification, KYC and compliance checks, risk assessment, and loan category determination. Depending on the results of these checks and assessments, the loan is either approved or denied. If the loan category is large, the loan application is reviewed by a loan officer who makes the final decision.
