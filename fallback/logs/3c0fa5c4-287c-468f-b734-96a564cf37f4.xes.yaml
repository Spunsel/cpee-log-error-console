event:
  concept:instance: 9785
  id:id: external
  cpee:activity: external
  cpee:instance: 3c0fa5c4-287c-468f-b734-96a564cf37f4
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 3d511b681959cd352182313a5b180f6b5508f4d4
  cpee:exposition: |-
    # User Input:
    Generate an organizational chart for a business process management system, focusing on the major stakeholders involved in process modeling and execution as described in "Conversational Process Modeling and Automation" (CEUR-WS, 2025):


    The CEO is at the top of the organization.


    Compliance Officer reports to the CEO and collaborates with the Audit Team and Legal Team.


    Process Supervisor is responsible for instantiating and supervising process execution. The Supervisor is managed by the CEO and works closely with the Process Designer and the Process Participant.


    Process Designer (also managed by the CEO) creates and improves process models and relies on the IT Department for technical support and system integration.


    The IT Department supports both the Supervisor and Designer, ensuring the technical infrastructure is maintained.


    Audit Team and Legal Team both support the Compliance Officer on regulatory, reporting, and governance tasks.


    Process Participant carries out human/manual tasks assigned by the Supervisor.


    Draw directed connections based on reporting lines and functional collaborations. Use the following entities:
    CEO, Compliance Officer, Audit Team, Legal Team, Process Supervisor, Process Designer, Process Participant, IT Department.
  time:timestamp: '2025-11-10T16:01:12.512652+01:00'
