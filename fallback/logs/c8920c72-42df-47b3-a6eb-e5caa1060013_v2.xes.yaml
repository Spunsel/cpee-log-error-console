    graph LR
    0:startevent:((startevent)) --> 1:task:(Receive Sample)
    1:task:(Receive Sample) --> 2:task:(Check Sample)
    2:task:(Check Sample) --> 3:task:(Carry Out Examination)
    3:task:(Carry Out Examination) --> 4:task:(Results Available)
    4:task:(Results Available) --> 5:task:(Prepare Report)
    4:task:(Results Available) --> 6:exclusivegateway:{x}
    6 --> 7:task:(Send for Confirmatory Testing) |Results Require|
    6 --> 8:exclusivegateway:{x} |Results Do Not Require|
    7:task:(Send for Confirmatory Testing) --> 9:exclusivegateway:{O}
    8:exclusivegateway:{x} --> 9:exclusivegateway:{O}
    4:task:(Results Available) --> 10:task:(Notify Clinician) |Critical Results|
    4:task:(Results Available) --> 11:exclusivegateway:{x} |Non-Critical Results|
    10:task:(Notify Clinician) --> 9:exclusivegateway:{O}
    11:exclusivegateway:{x} --> 9:exclusivegateway:{O}
    5:task:(Prepare Report) --> 9:exclusivegateway:{O}
    9:exclusivegateway:{O} --> 12:endevent:(((endevent)))
    ```
  time:timestamp: '2025-10-28T16:47:07.600762+01:00'
