    %% Output Intermediate
    ```mermaid
    graph LR
    0:startevent:((startevent)) --> 1:task:(Flag potential data breach)
    1:task:(Flag potential data breach) --> 2:task:(Log incident)
    2:task:(Log incident) --> 3:task:(Perform initial triage)
    3:task:(Perform initial triage) --> 4:task:(Take containment actions)
    4:task:(Take containment actions) --> 5:task:(Isolate affected systems/accounts)
    5:task:(Isolate affected systems/accounts) --> 6:task:(Secure evidence)
    6:task:(Secure evidence) --> 7:task:(Analyze nature and scope of incident)
    7:task:(Analyze nature and scope of incident) --> 8:task:(Evaluate risk to affected individuals)
    8:task:(Evaluate risk to affected individuals) --> 9:exclusivegateway:{x}
    9:exclusivegateway:{x} --> |Breach is notifiable| 10:task:(Prepare and submit formal report)
    10:task:(Prepare and submit formal report) --> 11:task:(Contact affected individuals)
    11:task:(Contact affected individuals) --> 12:task:(Conduct full investigation)
    9:exclusivegateway:{x} --> |Breach is not notifiable| 12:task:(Conduct full investigation)
    12:task:(Conduct full investigation) --> 13:task:(Implement technical and organisational fixes)
    13:task:(Implement technical and organisational fixes) --> 14:task:(Verify effectiveness of measures)
    14:task:(Verify effectiveness of measures) --> 15:task:(Record incident in breach register)
    15:task:(Record incident in breach register) --> 16:task:(Review response process)
    16:task:(Review response process) --> 17:task:(Update policies, procedures, or staff training)
    17:task:(Update policies, procedures, or staff training) --> 18:endevent:(((endevent)))
    ```

    This code represents the described business process. It starts with flagging a potential data breach, logging the incident, performing initial triage, taking containment actions, isolating affected systems/accounts, securing evidence, analyzing the nature and scope of the incident, evaluating the risk to affected individuals, and deciding whether the breach is notifiable. If the breach is notifiable, a formal report is prepared and submitted, and affected individuals are contacted. Regardless of whether the breach is notifiable, a full investigation is conducted, technical and organisational fixes are implemented, the effectiveness of these measures is verified, the incident is recorded in the breach register, the response process is reviewed, and policies, procedures, or staff training are updated. The process ends with the end event.
