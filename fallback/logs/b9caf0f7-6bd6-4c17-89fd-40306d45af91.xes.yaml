event:
  concept:instance: 9699
  id:id: ex-ante
  cpee:instance: b9caf0f7-6bd6-4c17-89fd-40306d45af91
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 00f1b8e4ea01ec8ddeaa38908ac4bb8156c6dbe7
  cpee:exposition: |
    # User Input:
    When a potential data breach is flagged, the incident is logged and an initial triage is performed to confirm whether personal data has been compromised. Immediate containment actions are taken to stop the breach from spreading, affected systems or accounts are isolated, and evidence is secured to support the investigation that follows.
    To assess the breach, the security and data protection teams analyse the nature and scope of the incident, identifying which categories and volumes of personal data were affected and how many individuals are involved. The risk to affected individuals is evaluated, and a decision is made on whether the breach meets the threshold for regulatory notification.
    If the breach is notifiable, the Data Protection Officer prepares and submits a formal report to the relevant supervisory authority within 72 hours of the organisation becoming aware of the incident. Where the breach poses a high risk to the rights and freedoms of individuals, those individuals are also contacted directly and advised of the steps they can take to protect themselves.
    A full investigation is conducted to determine the root cause of the breach and the full extent of any data exposure. Once the cause is understood, technical and organisational fixes are implemented to resolve the vulnerability, and the effectiveness of those measures is verified before the incident is considered resolved.
    Once the breach has been resolved, the full incident is formally recorded in the organisation's breach register as required under GDPR Article 33(5). The response process is reviewed by the relevant teams to identify lessons learned, and any necessary updates to policies, procedures, or staff training are carried out to reduce the likelihood of a similar incident occurring again.
  time:timestamp: '2026-04-21T16:49:08.183672+02:00'
