  cpee:exposition: |+
    # User Input:


     
    1.Aufgabe: Du bist ein erfahrener Prozessmanager. Erstelle basierend auf der folgenden Prozessbeschreibung ein syntaktisch und semantisch korrektes BPMN-Diagramm.
    2.        Prozessbeschreibung: You produce airplanes. While the base model is always the same, your customer likes to pimp their airplane with fancy interior. You let them decide between a number of 5 different bars, the number of seats, their color, and the amount of water in the toilets of their plane. After you received the specifications you send the requirements to different teams to manufacture the parts in parallel. E.g. manufacturing the vodka bar is done by the Russian team, the whiskey bar is manufactured by an Irish team. After receiving the individual bits and pieces, the interior of the plane is assembled, and the plane is sent on a test flight. During the flight you create a test protocol which is sent to you and the customer. The plane is delivered to the customer, which has to confirm.

  time:timestamp: '2026-04-26T09:55:28.083390+02:00'
