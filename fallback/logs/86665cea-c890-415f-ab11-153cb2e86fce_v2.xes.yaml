event:
  concept:instance: 41
  id:id: ex-ante
  cpee:instance: 86665cea-c890-415f-ab11-153cb2e86fce
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: fc93aee27e099daf340dae656522c1bce33f6798
  cpee:exposition: |-
    # User Input:
    This evaluation will consist of a short introduction, followed by two main tasks. The entire session is planned to take approximately one hour.

    Task 1 is based on a predefined, simple B2B order processing scenario.

    You will be provided with a checklist to guide you through the required steps. The purpose of this task is to help you become familiar with the main features of the tool.

    Task 2 is based on a real-world case.

    In this task, you will use the tool more independently to create and refine your own model based on the provided documentation.

    Following the tasks, you are required to complete a set of open-ended questions.

    These questions can be answered either after completing Task 1 or at the end of the evaluation after Task 2.
  time:timestamp: '2026-03-17T09:44:31.834136+01:00'
