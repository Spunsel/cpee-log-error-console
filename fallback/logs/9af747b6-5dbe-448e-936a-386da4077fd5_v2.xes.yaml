event:
  concept:instance: 6098
  id:id: external
  cpee:activity: external
  cpee:instance: 9af747b6-5dbe-448e-936a-386da4077fd5
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 86c572bed288874c688587f51d883d4657c5ae75
  cpee:exposition: |+
    # User Input:
    After receiving the customerâ€™s order, it is forwarded to the respective manufacturing teams.
    The production process then splits into three parallel branches:
    Manufacture the seats,
    Set the water amount, and
    Manufacture the selected bars.
    The bar manufacturing process operates as an inclusive subprocess. Depending on the customer's customization, any combination of the five available bar types â€” Vodka, Whiskey, Wine, Gin, and Juice Bar â€” may be produced, including none, some, or all of them. The process continues once all selected bars have been manufactured. Once all parallel tasks â€” seat manufacturing, water adjustment, and the selected bar productions â€” are completed, the process flow continues with assembling the airplane interior.
    After the interior has been assembled, the plane undergoes a test flight. During this flight, the system collects flight data. Then, after the flight, a test protocol should be created.
    Once the protocol is complete, it is sent simultaneously to both the manufacturer (â€œmeâ€) and the customer for review. Finally, the airplane is delivered to the customer, who must confirm receipt and acceptance of the product, thereby completing the process.

  time:timestamp: '2025-11-04T21:02:45.887718+01:00'
...
