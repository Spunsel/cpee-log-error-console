event:
  concept:instance: 6098
  id:id: external
  cpee:activity: external
  cpee:instance: 9af747b6-5dbe-448e-936a-386da4077fd5
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 365ef48cbe30b2b8248ef53263b71200b1383c8d
  cpee:exposition: |+
    # User Input:
    You produce airplanes. While the base model is always the same, your customer likes to pimp their airplane with fancy interior.
    You let them decide between a number of 5 different bars, the number of seats, their color, and the amount of water in the toilets of their plane (you can come up with additional stuff).
    After you received the specifications you send the requirements to different teams to manufacture the parts.
    E.g. manufacturing the vodka bar is done by the Russian team, the whiskey bar is manufactured by an Irish team.
    After receiving the individual bits and pieces, the interior of the plane is assembled, and the plane is sent on a test flight.
    During the flight you create a test protocol which is sent to you and the customer.
    The plane is delivered to the customer, which has to confirm. Constrct the model as following: First, receive the order from the customer; Second, send the order to the manufacturing teams; 3. Task: Manufacture seats, 4. Task: set water amount. Tasks 3, 4, and the process of manufacturing bars should run in parallel, and the process has to wait until all of Tasks 3, 4, and the process of manufacturing bars are finished, then it is allowed to proceed. The process of manufacturing bars involves tasks 4 to 9, which include manufacturing vodka/whiskey/ wine/ gin/ juice bars. From tasks 4 to 9, a minimum of 0 and a maximum of 5 tasks can be done. After all of Tasks 3, 4, and the process of manufacturing bars are finished, comes Task 10: assemble interior. Then the test flight should be conducted, and then the task â€œcollect flight dataâ€, then the task â€œcreate test protocolâ€; After this, the protocol should be sent simultaneously to â€œmeâ€ and the â€œcustomerâ€. Then comes the task â€œdeliver planeâ€, then the task â€œreceive customer confirmationâ€.

  time:timestamp: '2025-11-04T20:42:58.310828+01:00'
...
