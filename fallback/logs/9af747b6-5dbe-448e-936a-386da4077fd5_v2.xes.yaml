event:
  concept:instance: 6098
  id:id: external
  cpee:activity: external
  cpee:instance: 9af747b6-5dbe-448e-936a-386da4077fd5
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 077d7cebd2618169ad3883f5e03bee152a978639
  cpee:exposition: |-
    # User Input:
    After receiving the customerâ€™s order, it is sent to the respective manufacturing teams.
    The production process then splits into three parallel branches:


    Manufacture the seats,


    Set the water amount, and


    Manufacture the selected bars.


    The bar manufacturing process functions as an optional parallel subprocess. Depending on the customerâ€™s customization, none, some, or all of the five available bar types (Vodka, Whiskey, Wine, Gin, and Juice Bar) may be produced simultaneously.
    Once all parallel tasks â€” seat manufacturing, water adjustment, and the selected bar productions â€” are completed, the process flow continues with assembling the airplane interior.


    After the interior has been assembled, the plane undergoes a test flight. During this flight, the system simultaneously collects flight data and creates a test protocol.
    Once the protocol is complete, it is sent simultaneously to both the manufacturer (â€œmeâ€) and the customer for review.
    Finally, the airplane is delivered to the customer, who must confirm receipt and acceptance of the product, thereby completing the process.
  time:timestamp: '2025-11-04T20:51:37.316021+01:00'
