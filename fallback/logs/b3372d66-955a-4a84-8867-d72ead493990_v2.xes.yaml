  cpee:exposition: |-
    # User Input:



    Proces: Start-up onderneming zoekt financiering (AS-IS)

    Pool: Start-up onderneming (Ã©Ã©n pool, drie swimlanes)

    Swimlane 1 â€” Hoofdproces (founder) Het proces start met een startgebeurtenis. De founder doorloopt achtereenvolgens: (1) Valideer idee en markt, (2) Uitwerken financieel plan, (3) Bepaal financiÃ«le behoeften, (4) Verzamel ecosysteemondersteuning. Daarna volgt een exclusieve gateway "Voldoende?": bij Ja eindigt het proces met "Geen funding nodig"; bij Nee gaat de flow naar een inclusieve gateway die twee parallelle subprocessen activeert: "Werken met de overheid" en "Zoeken op private markt". Na beide subprocessen convergeert de flow naar "Funding proces afgerond".

    Swimlane 2 â€” Subproces: Werken met de overheid

    De subproces start met een inclusieve gateway "Soort investeringsmechanisme?" met vijf uitgaande paden: Tax Shelter, Winwinlening, LRM, PMV, VLAIO.

    Pad Tax Shelter:

    Voorwaarden onderzoeken
    Investeerders zoeken
    Fiscaal attest opmaken per investeerder
    Attesten indienen bij fiscus (Belcotax-on-web)
    Exclusieve gateway "Goedgekeurd?": Ja â†’ Kapitaalverhoging doorvoeren â†’ Uitgeven aandelen aan investeerders â†’ eindgebeurtenis "Fiscaal voordeel"; Nee â†’ eindgebeurtenis "Geen fiscaal voordeel"

    Pad Winwinlening:

    Particuliere kredietgever zoeken
    VLAIO dossier samenstellen & indienen
    Leningsakte aanmaken
    Akte & aflossingstabel digitaal bezorgen
    Leningsakte ondertekenen
    Exclusieve gateway "Goedgekeurd?": Ja â†’ eindgebeurtenis "Financiering verkregen"; Nee â†’ eindgebeurtenis "Geen lening ontvangen"

    Pad LRM:

    Intakegesprek met LRM
    Financieel plan indienen
    Exclusieve gateway "Goedgekeurd?": Ja â†’ Ingaan op voorstel â†’ eindgebeurtenis "Financiering verkregen"; Nee â†’ eindgebeurtenis "Geen financiering"

    Pad PMV:

    Aanvraag indienen via platform
    Financieel plan indienen
    Exclusieve gateway "Goedgekeurd?": Ja â†’ eindgebeurtenis "Financiering verkregen"; Nee â†’ eindgebeurtenis "Geen financiering"

    Pad VLAIO:

    Nagaan voorwaarden
    Exclusieve gateway "Voldaan?": Ja â†’ Plan indienen â†’ exclusieve gateway "Goedgekeurd?": Ja â†’ eindgebeurtenis "Financiering verkregen"; Nee â†’ eindgebeurtenis "Geen financiering"; Nee â†’ eindgebeurtenis "Geen financiering"

    Swimlane 3 â€” Subproces: Zoeken op private markt

    De subproces start met een exclusieve gateway met drie uitgaande paden: Business angels, Venture capital, Banken.

    Pad Business angels:

    Identificeer potentiÃ«le business angels
    Pitchen voor Investment Forum
    Exclusieve gateway "Positief?": Ja â†’ Onderhandelen over deal â†’ Ondertekenen fundingcontract â†’ eindgebeurtenis "Financiering ontvangen"; Nee â†’ eindgebeurtenis "Geen funding ontvangen"

    Pad Venture capital:

    Identificeer geschikte VC fondsen
    Voorbereiden pitch
    Screening- en partner meeting (timer: 4-8 weken)
    Exclusieve gateway "Positief?": Ja â†’ Term sheet reviewen â†’ Onderhandelen voorwaarden en waardering â†’ Closing en post-closing afspraken â†’ eindgebeurtenis "Financiering ontvangen"; Nee â†’ eindgebeurtenis "Geen funding ontvangen"

    Pad Banken:

    Selecteer geschikte bank
    Aanvragen banklening
    Gesprek met bankadviseur
    Aanvraag indienen via platform
    Exclusieve gateway "Goedgekeurd?" (timer: 2 weken): Ja â†’ Ondertekenen leningsovereenkomst â†’ eindgebeurtenis "Krediet ontvangen"; Nee â†’ eindgebeurtenis "Geen lening ontvangen"

    Timers aanwezig in het diagram:

    Due diligence business angels: 2-6 weken
    Due diligence VC: 4-8 weken
    Bankbeoordeling: 2 weken
    PMV: Â±4 weken
    VLAIO: Â±8 weken
    LRM: Â±10 dagen
