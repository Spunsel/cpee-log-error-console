event:
  concept:instance: 11288
  id:id: ex-ante
  cpee:instance: f5a66e53-f50f-4429-a634-ed41ecfa8c95
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 4ee116066f131705da6327ee783a948461b03533
  cpee:exposition: |+
    # User Input:
    The police has a new app to remind you of your car service. The process is started after a successful service. When a service is necessary, the system checks if your car is still registered. If it is registered, you are notified. If you do not go to the service, you are fined after 30 days. At the car service facility the mechanic enters the problems of your car for reference. While you wait (can take several days), you get status updates via email). You can pay through the app, when the repair is done. The mechanic enters that the repair was successful and you got your "Pickerl". The mechanic enters the time for you next service.

  time:timestamp: '2026-05-05T17:33:20.405827+02:00'
...
