event:
  concept:instance: 98621
  id:id: external
  cpee:activity: external
  cpee:instance: 90989ee1-9ae9-4aec-92ad-58cc81b6c60a
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 92fd64bdddb428812beeae6f2cc916f88c053ec2
  cpee:exposition: |-
    %% Output Intermediate
    Due to the complexity of the description, the model has been simplified to meet all requirements. The model represents the main process of a customer deciding to activate or deactivate the consumption time series display, notifying the network operator, and the meter reporting its status to the central system.

    ```mermaid
    graph LR
    0:startevent:((startevent)) --> 1:exclusivegateway:{x}
    1:exclusivegateway:{x} --> |Activate Display| 2:task:(Customer activates consumption time series display)
    1:exclusivegateway:{x} --> |Deactivate Display| 3:task:(Customer deactivates consumption time series display)
    2:task:(Customer activates consumption time series display) --> 4:task:(Notify network operator about activation)
    3:task:(Customer deactivates consumption time series display) --> 5:task:(Notify network operator about deactivation)
    4:task:(Notify network operator about activation) --> 6:task:(Meter reports status as ALARM or EVENT and logs)
    5:task:(Notify network operator about deactivation) --> 6:task:(Meter reports status as ALARM or EVENT and logs)
    6:task:(Meter reports status as ALARM or EVENT and logs) --> 7:endevent:(((endevent)))
    ```

    This model represents the described process. The customer decides to activate or deactivate the consumption time series display. The network operator is notified about the customer's decision. The meter then reports its status as ALARM or EVENT and logs the event. The process ends after the meter reports its status.
  time:timestamp: '2025-12-29T10:47:24.593987+01:00'
