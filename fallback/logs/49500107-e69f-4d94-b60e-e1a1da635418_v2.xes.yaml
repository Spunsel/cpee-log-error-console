event:
  concept:instance: 12238
  id:id: ex-ante
  cpee:instance: 49500107-e69f-4d94-b60e-e1a1da635418
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: fb5415f9905958ad339ca935fd3bbe8567baea00
  cpee:exposition: |-
    # User Input:
    Article 33: Notification of a personal data breach to the supervisory authority
    1 In the case of a personal data breach, the controller shall and, where feasible, not later than 72 hours after having become aware of it, notify the personal data breach to the supervisory authority competent IAW, unless the personal data breach is unlikely to result in a risk to the rights and freedoms of natural persons.
    IF the notification to the supervisory authority is not made by corresponding authority within 72 hours, it shall be accompanied by reasons for the delay.
    2 The processor shall notify the controller after becoming aware of a personal data breach.
    --PARALLEL TASKS--
    3(a) The notification referred to in shall at least describe the nature of the personal data breach the categories AND approximate number of data subjects concerned and the categories and approximate number of personal data records concerned
    3(b) The notification referred to in shall at least communicate the name and contact details of the data protection officer or other contact point where more information can be obtained by corresponding authority
    3(c) The notification referred to in shall at least describe the likely consequences of the personal data breach
    3(d) The notification referred to in shall at least describe the measures taken or proposed to be taken by the controller to address the personal data breachwhere appropriate, measures
    --END OF PARALLEL TASKS--
    4 IF, and in so far as, it is not possible to provide the information at the same time, the information may be provided by corresponding authority in phases without undue further delay.
    5 The controller shall document any personal data breaches, comprising the facts relating to the personal data breach, its effects and the remedial action taken.
    That documentation shall enable the supervisory authority to verify compliance with this Article.
    ---
    Article 34: Communication of a personal data breach to the data subject
    1 When the personal data breach is likely to result in a high risk to the rights and freedoms of natural persons, the controller shall communicate the personal data breach to the data subject.
    2 The communication to the data subject referred to in of this Article shall describe in clear and plain language the nature of the personal data breach AND contain at least the information and measures referred to in points (b), (c) and (d).
    --PARALLEL TASKS--
    3(a) The communication to the data subject referred to in shall not be required by corresponding authority if any of the following conditions are met by corresponding authority the controller has implemented appropriate technical and organisational protection measures, and those measures were applied by corresponding authority to the personal data affected by the personal data breach those
    3(b) The communication to the data subject referred to in shall not be required by corresponding authority if any of the following conditions are met by corresponding authority the controller has taken subsequent measures which ensure that the high risk to the rights and freedoms of data subjects referred to in is no longer likely to materialise
    3(c) The communication to the data subject referred to in shall not be required by corresponding authority if any of the following conditions are met by corresponding authority the communication would involve disproportionate effort. In such a case, there shall instead be a public communication or similar measure whereby the data subjects are informed by corresponding authority in an equally effective manner
    --END OF PARALLEL TASKS--
    4 IF the controller has not already communicated the personal data breach to the data subject, the supervisory authority, having considered the likelihood of the personal data breach resulting in a high risk, may require it to do so or may decide that any of the conditions referred to in are met by corresponding authority.
  time:timestamp: '2026-05-15T14:37:39.387541+02:00'
