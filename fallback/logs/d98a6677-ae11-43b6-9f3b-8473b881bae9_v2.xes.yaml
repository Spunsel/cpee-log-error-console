event:
  concept:instance: 8733
  id:id: ex-ante
  cpee:instance: d98a6677-ae11-43b6-9f3b-8473b881bae9
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: c351749ed443c7841f9c624ec6661d14715f80af
  cpee:exposition: |-
    # User Input:
    <description xmlns="http://cpee.org/ns/description/1.0" xmlns:a="http://cpee.org/ns/annotation/1.0">


      <!-- Task A: basic task accumulation -->
      <call id="1" a:alt_id="1">
        <parameters><label>"A"</label></parameters>
      </call>


      <!-- XOR gateway with 3 branches -->
      <choose id="2" a:alt_id="2">


        <!-- Alternative 1: normal branch -->
        <alternative condition="data.x == 1">
          <call id="3" a:alt_id="3">
            <parameters><label>"B"</label></parameters>
          </call>
        </alternative>


        <!-- Alternative 2: escape branch (task before escape) -->
        <alternative condition="data.x == 2">
          <call id="4" a:alt_id="4">
            <parameters><label>"C"</label></parameters>
          </call>
          <escape id="5" a:alt_id="-1"/>
        </alternative>


        <!-- Otherwise: empty default branch (returns FT unchanged) -->
        <otherwise/>


      </choose>


      <!-- AND gateway with 2 branches -->
      <parallel id="6" a:alt_id="6">


        <parallel_branch>
          <call id="7" a:alt_id="7">
            <parameters><label>"D"</label></parameters>
          </call>
        </parallel_branch>


        <parallel_branch>
          <call id="8" a:alt_id="8">
            <parameters><label>"E"</label></parameters>
          </call>
        </parallel_branch>


      </parallel>


      <!-- Unconditional loop with escape inside -->
      <loop id="9" a:alt_id="9" condition="true">


        <choose id="10" a:alt_id="10">


          <alternative condition="data.y == 1">
            <call id="11" a:alt_id="11">
              <parameters><label>"F"</label></parameters>
            </call>
          </alternative>


          <alternative condition="data.y == 2">
            <escape id="12" a:alt_id="-1"/>
          </alternative>


          <otherwise>
            <call id="13" a:alt_id="13">
              <parameters><label>"G"</label></parameters>
            </call>
          </otherwise>


        </choose>


      </loop>


      <!-- Conditional loop (condition != "true") -->
      <loop id="14" a:alt_id="14" condition="data.z > 0">
        <call id="15" a:alt_id="15">
          <parameters><label>"H"</label></parameters>
        </call>
      </loop>


    </description>
  time:timestamp: '2026-04-02T17:47:32.727600+02:00'
