event:
  concept:instance: 82072
  id:id: external
  cpee:activity: external
  cpee:instance: 18d6ddf5-abb5-4b2a-985d-d89faffe79ae
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 5072ed5ac57dd8aa8bc9c043fa78ec33251dbf56
  cpee:exposition: |-
    # User Input:
    . Preparation


    1.1. Collect materials


    Bucket


    Car shampoo


    Hose or pressure washer


    Microfiber mitts


    Wheel cleaner & brush


    Drying towels


    1.2. do not inspect


    Note any pre-existing damage


    Check heavily soiled areas (mud, insects, wheels)


    1.3. Choose washing area


    Ensure access to water


    Park in shade if possible


    2. Pre-Rinse


    2.1. Rinse entire car with water


    Remove loose dirt


    Focus on wheel arches and lower panels


    3. Clean Wheels


    3.1. Apply wheel cleaner
    3.2. Scrub using wheel brush
    3.3. Rinse wheels thoroughly


    4. Hand Wash


    4.1. Prepare two buckets


    One with shampoo water (“wash bucket”)


    One with plain water (“rinse bucket”)


    4.2. Wash car from top to bottom using wash mitt


    Roof → windows → bonnet → sides → rear → bumpers


    4.3. Rinse the mitt frequently in the rinse bucket
    4.4. Rinse the car fully after washing


    5. Drying


    5.1. Use microfiber drying towels
    5.2. Start from top and move downward
    5.3. Wipe door jambs and edges


    6. Final Details


    6.1. Clean windows
    6.2. Apply tire shine (optional)
    6.3. Inspect vehicle


    Ensure no soap residue


    Confirm wheels and panels are clean


    7. Process End


    Car is washed, dried, and ready for delivery or customer pickup.
  time:timestamp: '2025-12-04T16:10:14.852850+01:00'
