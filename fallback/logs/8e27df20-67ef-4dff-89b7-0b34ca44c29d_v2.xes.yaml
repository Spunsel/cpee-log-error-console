event:
  concept:instance: 14972
  id:id: external
  cpee:activity: external
  cpee:instance: 8e27df20-67ef-4dff-89b7-0b34ca44c29d
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: a1249b0aabe72c29619a96219d35c53cba1b209b
  cpee:exposition: |-
    # User Input:
    make a graph how to create a mermaid diagram from these instructions:
    ingredients (what you need)


    any place that renders Mermaid:


    a markdown file with ```mermaid code blocks (e.g., many docs tools, GitHub, Obsidian), or


    the online editor at mermaid.live


    this snippet (we’ll paste and tweak it)


    steps


    Declare a flowchart + direction
    Start your block and choose a layout direction: TD (top-down) or LR (left-right).


    flowchart TD




    Add start/end shapes
    Use ( ) for rounded (start/end) and [ ] for processes.


    flowchart TD
      Start([Start]) --> Init[Initialize]




    Add a decision
    Decision nodes use { }. Label outgoing edges for clarity.


    flowchart TD
      Start([Start]) --> Init[Initialize]
      Init --> Check{Ready?}
      Check -- Yes --> Proceed[Proceed with task]
      Check -- No --> Fix[Fix prerequisites] --> Check




    Create a loop
    Loops are just arrows that go back to an earlier node (often a decision). The line above already loops: Fix --> Check.


    Split into parallel branches
    Mermaid doesn’t enforce “true concurrency,” but you model parallel work by forking to two branches and later joining them. A tiny “fork”/“join” dummy node (small circle) reads well:


    flowchart TD
      Start([Start]) --> Init[Initialize]
      Init --> Check{Ready?}
      Check -- Yes --> Fork(( ))
      Check -- No --> Fix[Fix prerequisites] --> Check


      %% parallel branch A
      Fork --> A1[Do step A1] --> A2[Do step A2] --> Join(( ))


      %% parallel branch B
      Fork --> B1[Do step B1] --> B2[Do step B2] --> Join


      %% continue after join
      Join --> Verify{All good?}
      Verify -- No --> Rework[Rework] --> Verify
      Verify -- Yes --> Done([Done])




    (Optional) group branches for clarity
    Use subgraph … end to visually cluster parallel lanes or phases.


    flowchart TD
      Start([Start]) --> Init[Initialize]
      Init --> Check{Ready?}
      Check -- Yes --> Fork(( ))
      Check -- No --> Fix[Fix prerequisites] --> Check


      subgraph "Parallel work"
        direction TB
        Fork --> A1[Do step A1] --> A2[Do step A2] --> Join(( ))
        Fork --> B1[Do step B1] --> B2[Do step B2] --> Join
      end


      Join --> Verify{All good?}
      Verify -- No --> Rework[Rework] --> Verify
      Verify -- Yes --> Done([Done])




    (Optional) style it a bit
    You can tweak looks with classDef and class, or quick per-node styles:


    flowchart TD
      %% graph
      Start([Start]):::io --> Init[Initialize]
      Init --> Check{Ready?}:::decision
      Check -- Yes --> Fork(( )):::gate
      Check -- No --> Fix[Fix prerequisites] --> Check


      subgraph "Parallel work"
        direction TB
        Fork --> A1[Do step A1] --> A2[Do step A2] --> Join(( )):::gate
        Fork --> B1[Do step B1] --> B2[Do step B2] --> Join
      end


      Join --> Verify{All good?}:::decision
      Verify -- No --> Rework[Rework] --> Verify
      Verify -- Yes --> Done([Done]):::io


      %% simple class definitions
      classDef decision stroke-width:2px,stroke-dasharray:3 3;
      classDef gate stroke:#666,fill:#eee;
      classDef io fill:#e0f7ff,stroke:#06b6d4;




    Render it


    If you’re in Markdown, wrap the whole graph with triple backticks and mermaid:


    ```mermaid
    flowchart TD
    …your nodes/edges…




    If you’re in mermaid.live, paste it and the preview appears immediately.
  time:timestamp: '2025-11-12T20:45:05.073204+01:00'
