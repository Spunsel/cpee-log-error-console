event:
  concept:instance: 2181
  id:id: external
  cpee:activity: external
  cpee:instance: d41f711b-e8ac-4362-949a-5ec9f2573e11
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: d0315f196b90d5147b8fdebfdf68d1f9f65701be
  cpee:exposition: |+
    # User Input:
    Here is the description of a process:
    You produce airplanes. While the base model is always the same, your customer likes to pimp their airplane with fancy interior. You let them decide between a number of 5 different bars, the number of seats, their color, and the amount
    of water in the toilets of their plane (you can come up with additional stuff).
    After you received the specifications you send the requirements to different teams to manufacture the parts. E.g. manufacturing the vodka bar is done by the Russian team, the whiskey bar is manufactured by an Irish team.
    After receiving the individual bits and pieces, the interior of the plane is assembled, and the plane is sent on a test flight. During the flight you
    create a test protocol which is sent to you and the customer. The plane is delivered to the customer, which has to confirm.
    Your task is to create a BPMN-Model according to the process description. While modeling, you need to think step-by step and follow the given instructions:
    1. Analyze the process carefully
    2. Identify the responsible actors and think of pools and lines in the model accordingly
    3. List all activities which can be considered as tasks in the model
    4. Classify the relations between tasks as flows(Which connections (flows) are sequence/message flows?)
    5. Start to construct the process with your findings from the previous steps
    6. Finally, generate a complete BPMN-Model
    Your output needs to be in Mermaid.js-Format.

  time:timestamp: '2025-11-03T13:46:25.051175+01:00'
...
