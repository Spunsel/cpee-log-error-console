  cpee:change_uuid: 4e59daf576749ad0bf7c9ff6efb199ceaa9f97c5
  cpee:exposition: |-
    %% Output Intermediate
    ```mermaid
    bpmn
      direction LR
      0:startevent:((startevent))
      1:task:(Review Credit Request)
      2:parallelgateway:{AND}
      3:task:(Evaluate Financial Risk)
      4:exclusivegateway:{x}
      5:task:(Calculate Standard Terms)
      6:task:(Prepare Custom Terms)
      7:exclusivegateway:{x}
      8:task:(Prepare Contract)
      9:parallelgateway:{AND}
      10:task:(Send Quote to Customer)
      11:endevent:(((endevent)))

      0 --> 1
      1 --> 2
      2 --> 3
      2 --> 4
      4 --> |Standard Terms| 5
      4 --> |Special Terms| 6
      5 --> 7
      6 --> 7
      7 --> 8
      3 --> 9
      8 --> 9
      9 --> 10
      10 --> 11
    ```
  time:timestamp: '2025-10-28T13:31:06.705036+01:00'
