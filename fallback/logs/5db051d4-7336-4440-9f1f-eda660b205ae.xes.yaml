event:
  concept:instance: 83252
  id:id: external
  cpee:activity: external
  cpee:instance: 5db051d4-7336-4440-9f1f-eda660b205ae
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/change
  cpee:description: |
    <?xml version="1.0"?>
    <description xmlns="http://cpee.org/ns/description/1.0">
      <call id="a1" endpoint="bookAir">
        <parameters>
          <label>Book Airline 1</label>
          <method>:post</method>
          <arguments>
            <from>!data.from</from>
            <to>!data.to</to>
            <persons>!data.persons</persons>
          </arguments>
        </parameters>
        <code>
          <prepare/>
          <finalize output="result">data.airline = result.value('id')
    data.costs += result.value('costs').to_f
    status.update 1, 'Hotel'</finalize>
          <update output="result"/>
          <rescue output="result"/>
        </code>
        <annotations>
          <_timing>
            <_timing_weight/>
            <_timing_avg/>
            <explanations/>
          </_timing>
          <_shifting>
            <_shifting_type>Duration</_shifting_type>
          </_shifting>
          <_context_data_analysis>
            <probes/>
            <ips/>
          </_context_data_analysis>
          <report>
            <url/>
          </report>
          <_notes>
            <_notes_general/>
          </_notes>
        </annotations>
        <documentation>
          <input/>
          <output/>
          <implementation>
            <description/>
          </implementation>
          <code>
            <description/>
          </code>
        </documentation>
      </call>
      <parallel wait="-1" cancel="last">
        <loop mode="pre_test" condition="data.persons &gt; 0">
          <parallel_branch>
            <call id="a2" endpoint="bookHotel">
              <parameters>
                <label>Book Hotel</label>
                <method>:post</method>
                <arguments>
                  <to>!data.to</to>
                </arguments>
              </parameters>
              <code>
                <prepare/>
                <finalize output="result">data.hotels &lt;&lt; result.value('id')
    data.costs += result.value('costs').to_f</finalize>
                <update output="result"/>
                <rescue output="result"/>
              </code>
              <annotations>
                <_timing>
                  <_timing_weight/>
                  <_timing_avg/>
                  <explanations/>
                </_timing>
                <_shifting>
                  <_shifting_type>Duration</_shifting_type>
                </_shifting>
                <_context_data_analysis>
                  <probes/>
                  <ips/>
                </_context_data_analysis>
                <report>
                  <url/>
                </report>
                <_notes>
                  <_notes_general/>
                </_notes>
              </annotations>
              <documentation>
                <input/>
                <output/>
                <implementation>
                  <description/>
                </implementation>
                <code>
                  <description/>
                </code>
              </documentation>
            </call>
          </parallel_branch>
          <manipulate id="a3">data.persons -= 1</manipulate>
        </loop>
      </parallel>
      <choose mode="exclusive">
        <alternative condition="data.costs &gt; 700">
          <_probability>
            <_probability_min/>
            <_probability_max/>
            <_probability_avg/>
          </_probability>
          <call id="a4" endpoint="approve">
            <parameters>
              <label>Approve Hotel</label>
              <method>:post</method>
              <arguments>
                <costs>!data.costs</costs>
              </arguments>
            </parameters>
            <annotations>
              <_timing>
                <_timing_weight/>
                <_timing_avg/>
                <explanations/>
              </_timing>
              <_shifting>
                <_shifting_type>Duration</_shifting_type>
              </_shifting>
              <_context_data_analysis>
                <probes/>
                <ips/>
              </_context_data_analysis>
              <report>
                <url/>
              </report>
              <_notes>
                <_notes_general/>
              </_notes>
            </annotations>
            <documentation>
              <input/>
              <output/>
              <implementation>
                <description/>
              </implementation>
            </documentation>
          </call>
        </alternative>
        <otherwise/>
      </choose>
    </description>
  cpee:change_uuid: 5f60bded24546af5660254d84d5be643360e3356
  time:timestamp: '2025-12-11T13:46:22.142054+01:00'
