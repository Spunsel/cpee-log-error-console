  cpee:exposition: |-
    # User Input:
    Pool: Lothar â€“ Accident and Treatment Journey
    Lane: Lothar


    Start Event:


    Bicycle accident in city center â†’ fall onto right wrist


    Activities:


    Experiences pain and immobility in right wrist


    Decides to visit family doctor


    Travels to family doctorâ€™s office


    Lane: Family Doctor Practice
    Subprocess: Initial Medical Consultation


    Activities:


    Perform medical history (anamnesis)


    Perform physical examination


    Document findings in paper patient record


    Exclusive Gateway: Suspected fracture?


    If NO â†’ Diagnose bruise only â†’ End process


    If YES â†’ Continue


    Activities:
    4. Ask about tetanus immunization status


    Exclusive Gateway: Tetanus status known?


    If YES â†’ Continue


    If NO â†’


    Administer tetanus booster


    Issue new paper vaccination record


    Activities:
    5. Issue referral for X-ray of right wrist
    6. Patient leaves practice


    Lane: Lothar


    Activities:


    Calls radiology practices


    Finds available appointment next day


    Travels to radiology practice


    Lane: Radiology Practice (X-ray)
    Subprocess: Imaging and Reporting


    Activities:


    Register patient


    Collect data:


    Medical history


    Medications


    Allergies


    Previous imaging


    Perform X-ray (two views)


    Store images on CD


    Hand out CD to patient


    Announce:


    Findings will be sent by mail to family doctor


    Radiologist will call if abnormal


    Exclusive Gateway: Abnormal finding?


    If NO â†’ End subprocess


    If YES â†’


    Radiologist calls patient


    Event:


    Notification: non-displaced radius fracture


    Lane: Lothar


    Activities:


    Receives phone call


    Decision: Attend trauma clinic same day


    Travels to emergency department


    Lane: Emergency Department (First Visit)
    Subprocess: Emergency Evaluation


    Activities:


    Patient waits


    Patient uses smartphone (parallel activity â€“ optional)


    Trauma surgeon repeats:


    Medical history


    Medication


    Allergies


    Tetanus status


    Exclusive Gateway: Medication list available?


    If YES â†’ Proceed


    If NO â†’ Try calling family doctor


    Exclusive Gateway: Family doctor reached?


    If NO â†’ Continue without medication list


    If YES â†’ Collect info


    Activities:
    4. Attempt to open CD


    Exclusive Gateway: CD readable?


    If YES â†’ Review images


    If NO â†’ Use smartphone photos


    Exclusive Gateway: Clear surgical indication?


    If YES â†’ Prepare for surgery


    If NO â†’


    Apply cast


    Instruct patient to return next day


    Require new CD from radiology


    Activities:
    5. Issue:


    Pain medication prescription


    Sick note (4 weeks)


    Lane: Lothar


    Activities:


    Visits radiology again (08:00)


    Requests new CD


    Travels to hospital again


    Lane: Emergency Department (Second Visit)
    Subprocess: Re-evaluation


    Activities:


    Patient waits again


    Personal activities (online orders, cancellation)


    Activities:
    3. New physician takes history again
    4. CD is read successfully
    5. Medication plan requested via fax


    Exclusive Gateway: SL gap enlarged?


    If NO â†’ Proceed to surgery


    If YES â†’ Suspect ligament injury


    Activities:
    6. Check for previous X-rays


    Exclusive Gateway: Previous imaging available?


    If YES â†’ Compare


    If NO â†’ Order MRI


    Lane: Radiology Practice (MRI)
    Subprocess: MRI


    Activities:


    Register patient


    Collect history and allergies again


    Perform MRI


    Radiologist evaluates images


    Exclusive Gateway: Acute ligament injury?


    If YES â†’ Modify surgery plan


    If NO â†’ Confirm old injury


    Activities:
    5. Radiologist informs trauma consultant


    Lane: Trauma Outpatient Department


    Activities:


    Patient seen same day


    Surgery date scheduled


    Lane: Anesthesia Department
    Subprocess: Preoperative Assessment


    Activities:


    Collect:


    Medical history


    Medication


    Allergies


    Provide anesthesia consent documentation


    Lane: Ward / Nursing


    Activities:


    Admission to ward


    Collect medical data again


    Lane: Surgery Day
    Subprocess: Preoperative Issue


    Activities:


    Ward doctor searches for consent form


    Exclusive Gateway: Consent found?


    If YES â†’ Continue


    If NO â†’ Cancel surgery


    Exclusive Gateway: Patient has own copy?


    If YES â†’ Continue


    If NO â†’ End process (surgery delayed)


    Subprocess: Anesthesia Complication


    Activities:


    Local anesthetic administered


    Exclusive Gateway: Allergic reaction occurs?


    If NO â†’ Continue surgery normally


    If YES â†’


    Anaphylactic shock


    Emergency stabilization


    Switch to general anesthesia


    Lane: Operating Room


    Activities:


    Surgery performed successfully


    Lane: Hospital Ward
    Subprocess: Discharge


    Activities:


    One night ICU


    One night normal ward


    Issue allergy card


    Provide discharge instructions


    Exclusive Gateway: Discharge letter ready?


    If YES â†’ Hand out


    If NO â†’ Send to family doctor by mail


    Lane: Family Doctor (Aftercare)
    Subprocess: Postoperative Treatment


    Activities:


    Wound checks


    Suture removal


    Issue prescriptions:


    Pain medication


    Physiotherapy


    Lane: Lothar
    Subprocess: Follow-Up Issues


    Exclusive Gateway: Prescription available?


    If YES â†’ Visit pharmacy


    If NO â†’ Buy OTC medication


    Lane: Physiotherapy
    Subprocess: Physiotherapy Search


    Activities:


    Search physiotherapist online


    Multiple rejections


    Exclusive Gateway: Appointment found?


    If NO â†’ Continue searching


    If YES â†’ Schedule appointment (4 weeks later)


    Subprocess: First Physiotherapy Session


    Activities:


    Physiotherapist requests aftercare plan


    Exclusive Gateway: Plan available?


    If YES â†’ Start therapy normally


    If NO â†’ Therapy starts without plan


    End Event
