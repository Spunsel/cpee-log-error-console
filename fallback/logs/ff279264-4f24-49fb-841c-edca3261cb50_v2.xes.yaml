  cpee:change_uuid: f5e4743e5388e6621c1781d8d9903f6a57acfb2b
  cpee:exposition: |-
    # User Input:
    Article 48: Request for a European cybersecurity certification scheme
    1 The Commission may request ENISA to prepare a candidate scheme or to review an existing European cybersecurity certification scheme on the basis of the Union rolling work programme.
    2 In duly justified cases, the Commission OR the ECCG may request ENISA to prepare a candidate scheme or to review an existing European cybersecurity certification scheme.
    The Union rolling work programme shall be updated by Commission and ECCG accordingly.
    ---
    Article 49: Preparation, adoption and review of a European cybersecurity certification scheme
    1 Following a request from the Commission pursuant to Article 48, ENISA shall prepare a candidate scheme.
    2 Following a request from the ECCG pursuant to, ENISA may prepare a candidate scheme.
    IF ENISA refuses such a request, ENISA shall give reasons for its refusal.
    Any decision to refuse such a request shall be taken by the Management Board.
    3 When preparing a candidate scheme, ENISA shall consult all relevant stakeholders by means of a formal, open, transparent and inclusive consultation process.
    4 For each candidate scheme, ENISA shall establish an ad hoc working group IAW for the purpose of providing ENISA with specific advice and expertise.
    5 ENISA shall closely cooperate with the ECCG.
    The ECCG shall provide ENISA with assistance and expert advice in relation to the preparation of the candidate scheme AND shall adopt an opinion on the candidate scheme.
    6 ENISA shall take utmost account of the opinion of the ECCG before transmitting the candidate scheme prepared IAW paragraphs 3, 4 and 5 to the Commission.
    The opinion of the ECCG shall not bind ENISA, nor shall the absence of such an opinion prevent ENISA from transmitting the candidate scheme to the Commission.
    7 The Commission, based on the candidate scheme prepared by ENISA, may adopt implementing acts providing for a European cybersecurity certification scheme for ICT products, ICT services and ICT processes.
    Those implementing acts shall be adopted by Commission IAW the examination procedure referred.
    8 At least every five years, ENISA shall evaluate each adopted European cybersecurity certification scheme, taking into account the feedback received from interested parties.
    IF necessary, the Commission OR the ECCG may request ENISA to start the process of developing a revised candidate scheme IAW Article 48 and this Article.
  time:timestamp: '2026-05-15T14:27:07.373293+02:00'
