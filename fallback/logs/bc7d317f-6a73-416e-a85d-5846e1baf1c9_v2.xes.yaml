  cpee:exposition: |-
    %% Output Intermediate
    ```mermaid
    graph LR
    0:startevent:((startevent)) --> 1:task:(Receive Defective Computer)
    1:task:(Receive Defective Computer) --> 2:task:(Check Defect)
    2:task:(Check Defect) --> 3:task:(Calculate Repair Cost)
    3:task:(Calculate Repair Cost) --> 4:exclusivegateway:{x}
    4:exclusivegateway:{x} --> |Costs Acceptable| 5:task:(Customer Approval)
    4:exclusivegateway:{x} --> |Costs Not Acceptable| 17:endevent:(((endevent)))
    5:task:(Customer Approval) --> 6:parallelgateway:{AND}
    6:parallelgateway:{AND} --> 7:task:(Check and Repair Hardware)
    6:parallelgateway:{AND} --> 8:task:(Check and Configure Software)
    7:task:(Check and Repair Hardware) --> 9:task:(Test System Functionality 1)
    8:task:(Check and Configure Software) --> 10:task:(Test System Functionality 2)
    9:task:(Test System Functionality 1) --> 11:exclusivegateway:{x}
    10:task:(Test System Functionality 2) --> 12:exclusivegateway:{x}
    11:exclusivegateway:{x} --> |Error Detected| 13:task:(Another Repair Activity 1)
    12:exclusivegateway:{x} --> |Error Detected| 14:task:(Another Repair Activity 2)
    11:exclusivegateway:{x} --> |No Error Detected| 15:parallelgateway:{AND}
    12:exclusivegateway:{x} --> |No Error Detected| 15:parallelgateway:{AND}
    13:task:(Another Repair Activity 1) --> 9:task:(Test System Functionality 1)
    14:task:(Another Repair Activity 2) --> 10:task:(Test System Functionality 2)
    15:parallelgateway:{AND} --> 16:task:(Repair Finished)
    16:task:(Repair Finished) --> 17:endevent:(((endevent)))
    ```
  time:timestamp: '2026-04-19T23:48:07.863182+02:00'
