  cpee:exposition: |-
    # User Input:
    User preferences regarding the lighting in the build-
    ing are collected. The outside light conditions are constantly
    measured by light sensors. Depending on the light intensity the
    light in the room switched on, switched off, or maintained. If
    the light has been on for 10 hours, it should be switched off.
