  cpee:exposition: |-
    # User Input:
    Simplify this process graph while keeping all contextual and hierarchical information intact.


    Do not remove, rename, or merge any nodes — every government entity and branch must remain represented.


    Preserve the logical hierarchy of the U.S. Government:


    United States Government → Legislative Branch, Executive Branch, Judicial Branch


    Each branch should retain its sub-elements in correct order.


    Simplify visually and structurally by:


    Collapsing or grouping related nodes (e.g., all Cabinet Departments into one “Cabinet Departments (15 total)” node).


    Minimizing visual clutter while maintaining readable connections.


    Using concise labels (but keep full meaning).


    Reducing parallel gateways where they don’t affect understanding.


    Do not alter the semantics or flow direction.


    Preserve all relationships — if one entity reports to or belongs under another, that link must remain.


    The simplified version should still clearly convey:


    The three branches of government.


    Their primary subdivisions (Congress, President, Supreme Court, etc.).


    Major subgroups (Committees, Cabinet Departments, Specialized Courts).


    The goal is to make the graph cleaner, smaller, and more legible without losing any context or meaning.


    Output the simplified structure as a valid CPEE XML or visual graph, keeping identical node IDs and labels.
