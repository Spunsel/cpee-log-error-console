event:
  concept:instance: 12505
  id:id: external
  cpee:activity: external
  cpee:instance: 15d17a0d-3789-4074-8246-940e83525085
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 8f9169cd238d96c7bcf0e525731073c6cc42845d
  cpee:exposition: |+
    # User Input:
    represent the hierarchy of the United States Government as it is presented here in graph format:
    United States Government
    │
    ├── Legislative Branch (Makes the Laws)
    │ │
    │ ├── U.S. Congress
    │ │ │
    │ │ ├── Senate
    │ │ │ ├── 100 Senators (2 per state)
    │ │ │ ├── Vice President (President of the Senate)
    │ │ │ └── President Pro Tempore
    │ │ │
    │ │ └── House of Representatives
    │ │ ├── 435 Representatives (based on population)
    │ │ ├── Speaker of the House
    │ │ ├── Majority and Minority Leaders
    │ │ └── Committees (e.g., Appropriations, Ways & Means, Judiciary)
    │ │
    │ └── Congressional Support Agencies
    │ ├── Congressional Budget Office (CBO)
    │ ├── Government Accountability Office (GAO)
    │ ├── Library of Congress
    │ └── Congressional Research Service (CRS)
    │
    ├── Executive Branch (Enforces the Laws)
    │ │
    │ ├── President of the United States
    │ │ ├── Vice President
    │ │ ├── Executive Office of the President (EOP)
    │ │ │ ├── White House Office
    │ │ │ ├── National Security Council (NSC)
    │ │ │ ├── Office of Management and Budget (OMB)
    │ │ │ ├── Council of Economic Advisers (CEA)
    │ │ │ └── Office of the U.S. Trade Representative (USTR)
    │ │ │
    │ │ └── The Cabinet (15 Executive Departments)
    │ │ ├── Department of State
    │ │ ├── Department of the Treasury
    │ │ ├── Department of Defense
    │ │ ├── Department of Justice
    │ │ ├── Department of the Interior
    │ │ ├── Department of Agriculture
    │ │ ├── Department of Commerce
    │ │ ├── Department of Labor
    │ │ ├── Department of Health and Human Services (HHS)
    │ │ ├── Department of Housing and Urban Development (HUD)
    │ │ ├── Department of Transportation (DOT)
    │ │ ├── Department of Energy (DOE)
    │ │ ├── Department of Education (ED)
    │ │ ├── Department of Veterans Affairs (VA)
    │ │ └── Department of Homeland Security (DHS)
    │ │
    │ └── Independent Agencies and Commissions
    │ ├── Central Intelligence Agency (CIA)
    │ ├── Environmental Protection Agency (EPA)
    │ ├── Federal Reserve System (Fed)
    │ ├── Federal Communications Commission (FCC)
    │ ├── Federal Trade Commission (FTC)
    │ ├── National Aeronautics and Space Administration (NASA)
    │ ├── Securities and Exchange Commission (SEC)
    │ └── U.S. Postal Service (USPS)
    │
    └── Judicial Branch (Interprets the Laws)
        │
        ├── Supreme Court of the United States (SCOTUS)
        │ ├── 9 Justices (1 Chief Justice + 8 Associate Justices)
        │ └── Decides constitutionality of laws
        │
        ├── U.S. Courts of Appeals (13 Circuits)
        │ ├── 12 Regional Circuits
        │ └── 1 Federal Circuit
        │
        ├── U.S. District Courts (94 Districts)
        │ ├── General trial courts
        │ └── Includes territorial and D.C. courts
        │
        └── Specialized Courts
            ├── U.S. Bankruptcy Courts
            ├── U.S. Tax Court
            ├── U.S. Court of Federal Claims
            ├── U.S. Court of Appeals for Veterans Claims
            └── U.S. Court of International Trade

  time:timestamp: '2025-11-12T15:46:50.596660+01:00'
...
