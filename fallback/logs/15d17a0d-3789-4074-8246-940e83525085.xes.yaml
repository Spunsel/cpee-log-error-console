event:
  concept:instance: 12505
  id:id: external
  cpee:activity: external
  cpee:instance: 15d17a0d-3789-4074-8246-940e83525085
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 5688c15d2e1ffd1d9de0c020272bfc8d13dbd9fc
  cpee:exposition: |-
    # User Input:
    Generate a hierarchical organization chart showing the structure of the United States Government.


    The chart should be clear, labeled, and visually organized into the three branches: Legislative, Executive, and Judicial.


    Top Level:


    "United States Government" at the top center.


    Second Level:


    Three main nodes branching from it:


    "Legislative Branch (Makes the Laws)"


    "Executive Branch (Enforces the Laws)"


    "Judicial Branch (Interprets the Laws)"


    Third Level and below:


    Legislative Branch:


    Congress → Senate (100 members) and House of Representatives (435 members)


    Add subnodes: Speaker of the House, Vice President (President of Senate), Committees, and Congressional Support Agencies (CBO, GAO, CRS, Library of Congress).


    Executive Branch:


    President → Vice President → Executive Office of the President (White House Office, NSC, OMB, CEA, USTR)


    Cabinet Departments (15 total): State, Treasury, Defense, Justice, Interior, Agriculture, Commerce, Labor, HHS, HUD, Transportation, Energy, Education, Veterans Affairs, Homeland Security


    Independent Agencies and Commissions: CIA, EPA, NASA, SEC, FCC, FTC, Federal Reserve, USPS.


    Judicial Branch:


    Supreme Court (Chief Justice + 8 Associate Justices)


    Courts of Appeals (13 circuits)


    District Courts (94 districts)


    Specialized Courts (Tax Court, Court of Federal Claims, Court of International Trade, Bankruptcy Courts, Veterans Claims).


    Style Requirements:


    Use boxes or nodes with connecting lines to show hierarchy.


    Place the branches horizontally under the U.S. Government node.


    Use clean colors and labels for clarity.


    Optional: add icons for each branch (Capitol, White House, Supreme Court).


    Ensure text is readable and layout is not cluttered.


    Goal: A clean, educational visual hierarchy of the entire U.S. federal government structure.
  time:timestamp: '2025-11-12T15:48:32.632937+01:00'
