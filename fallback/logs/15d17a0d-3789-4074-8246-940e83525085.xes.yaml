event:
  concept:instance: 12505
  id:id: external
  cpee:activity: external
  cpee:instance: 15d17a0d-3789-4074-8246-940e83525085
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: fb210ac5cca2131aa68668e40e72f95d8aa09cef
  cpee:exposition: |-
    # User Input:
    Task: Render a hierarchical organization chart of the United States Government.


    Hard constraints (do NOT violate):


    Output only the graph. Do not include meta-steps, tasks, or instructional text as nodes.


    Use one root: United States Government.


    Show exactly the nodes listed below; no extra nodes (e.g., “Generate Organization Chart”, “Display Top Level”, etc.).


    Use left-to-right top layout: root → three branches on the same level → their children vertically.


    Use grouping/containers for the three branches and for any “group” nodes (e.g., Support Agencies).


    Labels may include counts in parentheses but do not explode into member nodes (e.g., don’t draw 100 senators).


    Nodes & edges (exact hierarchy):


    Root


    United States Government


    Legislative Branch (Makes the Laws)


    Congress


    Senate (100 members; VP = President of the Senate; President Pro Tempore)


    House of Representatives (435 members; Speaker; Majority & Minority Leaders)


    Committees


    Congressional Support Agencies


    Congressional Budget Office (CBO)


    Government Accountability Office (GAO)


    Library of Congress


    Congressional Research Service (CRS)


    Executive Branch (Enforces the Laws)


    President


    Vice President


    Executive Office of the President (EOP)


    White House Office


    National Security Council (NSC)


    Office of Management and Budget (OMB)


    Council of Economic Advisers (CEA)


    U.S. Trade Representative (USTR)


    Cabinet Departments (15)


    State


    Treasury


    Defense


    Justice


    Interior


    Agriculture


    Commerce


    Labor


    Health and Human Services (HHS)


    Housing and Urban Development (HUD)


    Transportation (DOT)


    Energy (DOE)


    Education (ED)


    Veterans Affairs (VA)


    Homeland Security (DHS)


    Independent Agencies & Commissions (examples)


    CIA


    EPA


    Federal Reserve System


    FCC


    FTC


    NASA


    SEC


    USPS


    Judicial Branch (Interprets the Laws)


    Supreme Court of the United States (1 Chief + 8 Associate Justices)


    U.S. Courts of Appeals (13 circuits)


    U.S. District Courts (94 districts)


    Specialized Courts


    U.S. Bankruptcy Courts


    U.S. Tax Court


    U.S. Court of Federal Claims


    U.S. Court of Appeals for Veterans Claims


    U.S. Court of International Trade


    Styling & layout requirements:


    Place the three branches in three side-by-side columns under the root.


    Within each branch, stack children top-to-bottom with clear connector lines.


    Use rounded boxes; small text fits inside boxes; wrap long labels.


    Use containers or swimlanes titled “Legislative Branch”, “Executive Branch”, “Judicial Branch”.


    Do not draw cross-branch arrows; only parent→child connectors.


    Prohibited content: Any node whose label includes “Generate”, “Display”, “Step”, “Task”, or instructions. No duplicate nodes. No decorative icons if they become nodes.
  time:timestamp: '2025-11-12T15:50:32.924208+01:00'
