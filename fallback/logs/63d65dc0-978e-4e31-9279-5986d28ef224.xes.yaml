    The following events occur in parallel:


    3.Â Â  The Executive Board shall be composed of five members. The members of the Executive Board shall be appointed from among the members of the Management Board. One of the members shall be the Chairperson of the Management Board, who may also chair the Executive Board, and another shall be one of the representatives of the Commission. The appointments of the members of the Executive Board shall aim to ensure gender balance on the Executive Board. The Executive Director shall take part in the meetings of the Executive Board but shall not have the right to vote.

    4.Â Â  The term of office of the members of the Executive Board shall be four years. That term shall be renewable.

    5.Â Â  The Executive Board shall meet at least once every three months. The Chairperson of the Executive Board shall convene additional meetings at the request of its members.

    6.Â Â  The Management Board shall lay down the rules of procedure of the Executive Board.
