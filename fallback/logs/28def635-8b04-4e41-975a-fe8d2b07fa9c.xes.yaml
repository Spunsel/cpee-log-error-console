  cpee:exposition: |-
    %% Output Intermediate
    ```mermaid
    bpmn
      direction LR

      0:startevent:((startevent))
      1:task:(Customer informs network operator)
      2:exclusivegateway:{x}
      3:exclusivegateway:{x}
      4:task:(Apply 60-day data protection deactivation)
      5:exclusivegateway:{x}
      6:task:(Send 'Activate Display' command to meter)
      7:task:(Send 'Deactivate Display' command to meter)
      8:exclusivegateway:{x}
      9:task:(Meter reports status and logs entry)
      10:endevent:(((endevent)))

      0 --> 1
      1 --> 2
      2 --> |Activate| 3
      2 --> |Deactivate| 7
      3 --> |Customer Change| 4
      3 --> |No Customer Change| 5
      4 --> 5
      5 --> 6
      6 --> 8
      7 --> 8
      8 --> 9
      9 --> 10
    ```
  time:timestamp: '2026-01-12T15:05:05.145663+01:00'
