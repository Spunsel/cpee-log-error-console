event:
  concept:instance: 12260
  id:id: ex-ante
  cpee:instance: 57ac4449-2988-42b6-86f5-85140e22852c
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 8fb71e93fada917a6b18d15178cc75cab2345896
  cpee:exposition: |-
    # User Input:
    Article 23: Reporting obligations
    1 Each Member State shall ensure that essential and important entities notify its CSIRT or, where applicable, its competent authority IAW of any incident that has a significant impact on the provision of their services as referred to in (significant incident).
    IF appropriate, entities concerned shall notify the recipients of their services of significant incidents.
    Each Member State shall ensure that those entities report any information enabling the CSIRT or, where applicable, the competent authority to determine any cross-border impact of the incident.
    The mere act of notification shall not subject the notifying entity to increased liability.
    IF the entities concerned notify the competent authority of a significant incident under the first subparagraph, the Member State shall ensure that that competent authority forwards the notification to the CSIRT upon receipt.
    In the case of a cross-border or cross-sectoral significant incident, Member States shall ensure that their single points of contact are provided by Member States in due time with relevant information notified in accordance.
    2 IF applicable, Member States shall ensure that essential and important entities communicate to the recipients of their services that are potentially affected by a significant cyber threat any measures or remedies that those recipients are able to take in response to that threat.
    IF appropriate, the entities shall also inform those recipients of the significant cyber threat itself.
    --PARALLEL TASKS--
    3(a) An incident shall be considered by Member States to be significant if the incident has caused or is capable of causing severe operational disruption of the services or financial loss for the entity concerned
    3(b) An incident shall be considered by Member States to be significant if the incident has affected or is capable of affecting other natural or legal persons by causing considerable material or non-material damage
    --END OF PARALLEL TASKS--
    --PARALLEL TASKS--
    4(a) Member States shall ensure that, for the purpose of notification under, the entities concerned submit to the CSIRT or, where applicable, the competent authority and in any event within 24 hours of becoming aware of the significant incident, an early warning, which, where applicable, shall indicate whether the significant incident is suspected by Member States of being caused by unlawful or malicious acts or could have a cross-border impact
    4(b) Member States shall ensure that, for the purpose of notification under, the entities concerned submit to the CSIRT or, where applicable, the competent authority and in any event within 72 hours of becoming aware of the significant incident, an incident notification, which, where applicable, shall update the information referred to in point (a) and indicate an initial assessment of the significant incident, including its severity and impact, as well as, where available, the indicators of compromise
    4(c) Member States shall ensure that, for the purpose of notification under, the entities concerned submit to the CSIRT or, where applicable, the competent authority upon the request of a CSIRT or, where applicable, the competent authority, an intermediate report on relevant status updates4(d) Member States shall ensure that, for the purpose of notification under, the entities concerned submit to the CSIRT or, where applicable, the competent authority a final report not later than one month after the submission of the incident notification under point (b), including the following:
    4(i) Member States shall ensure that, for the purpose of notification under, the entities concerned submit to the CSIRT or, where applicable, the competent authority a detailed description of the incident, including its severity and impact;
    (ii)
    the type of threat or root cause that is likely to have triggered the incident;
    (iii)
    applied and ongoing mitigation measures;
    (iv)
    where applicable, the cross-border impact of the incident
    4(e) Member States shall ensure that, for the purpose of notification under, the entities concerned submit to the CSIRT or, where applicable, the competent authority in the event of an ongoing incident at the time of the submission of the final report referred to in point (d), Member States shall ensure that entities concerned provide a progress report at that time and a final report within one month of their handling of the incident.
    By way of derogation from the first subparagraph, point (b), a trust service provider shall, with regard to significant incidents, notify the CSIRT or, where applicable, the competent authority and in any event within 24 hours of becoming aware of the significant incident
    --END OF PARALLEL TASKS--
    5 The CSIRT OR the competent authority shall provide AND where possible within 24 hours of receiving the early warning referred to in, point (a), a response to the notifying entity, including initial feedback on the significant incident and, upon request of the entity, guidance or operational advice on the implementation of possible mitigation measures.
    IF the CSIRT is not the initial recipient of the notification referred to in, the guidance shall be provided by the competent authority in cooperation with the CSIRT.
    The CSIRT shall provide additional technical support if the entity concerned so requests.
    IF the significant incident is suspected by CSIRT to be of criminal nature, the CSIRT OR the competent authority shall also provide guidance on reporting the significant incident to law enforcement authorities.
    6 IF appropriate, and where the significant incident concerns two or more Member States, the CSIRT, the competent authority or the single point of contact shall inform the other affected Member States and ENISA of the significant incident.
    Such information shall include the type of information received in accordance.
    In so doing, the CSIRT, the competent authority OR the single point of contact shall, IAW Union or national law, preserve the entity’s security and commercial interests as well as the confidentiality of the information provided.
    7 IF public awareness is necessary to prevent a significant incident or to deal with an ongoing significant incident, or where disclosure of the significant incident is otherwise in the public interest, a Member State’s CSIRT OR, where applicable, its competent authority, and, where appropriate, the CSIRTs or the competent authorities of other Member States concerned, may, after consulting the entity concerned, inform the public about the significant incident OR require the entity to do so.
    8 At the request of the CSIRT or the competent authority, the single point of contact shall forward notifications received pursuant to to the single points of contact of other affected Member States.
    9 The single point of contact shall submit to ENISA every three months a summary report, including anonymised and aggregated data on significant incidents, incidents, cyber threats and near misses notified IAW of this Article.
    ENISA may adopt technical guidance on the parameters of the information.
    ENISA shall inform the Cooperation Group and the CSIRTs network about its findings on notifications received every six months.
    10 The CSIRTs OR, where applicable, the competent authorities shall provide to the competent authorities information about significant incidents, incidents, cyber threats and near misses notified IAW of this Article and with by entities identified as critical entities .
    11 The Commission may adopt implementing acts further specifying the type of information, the format and the procedure of a notification submitted pursuant to of this Article and to and of a communication submitted pursuant to of this Article.
    By 17 October 2024, the Commission shall, with regard to DNS service providers, TLD name registries, cloud computing service providers, data centre service providers, content delivery network providers, managed service providers, managed security service providers, as well as providers of online marketplaces, of online search engines and of social networking services platforms, adopt implementing acts further specifying the cases in which an incident shall be considered by Commission to be significant as referred.
    The Commission may adopt such implementing acts with regard to other essential and important entities.
    The Commission shall exchange advice AND cooperate with the Cooperation Group on the draft implementing acts referred to in the first and second subparagraphs of this paragraph IAW, point (e).
    Those implementing acts shall be adopted by Commission IAW the examination procedure referred.
  time:timestamp: '2026-05-15T14:55:14.723375+02:00'
