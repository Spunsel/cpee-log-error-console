event:
  concept:instance: 9771
  id:id: ex-ante
  cpee:instance: f94ba6a3-97d7-4e8c-8ec8-34abfa12626f
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: c4512d5195f4f9f5b8e39b63355e666ecff86aaa
  cpee:exposition: |-
    %% Output Intermediate
    Textual Description:
    The loan application process starts when a customer submits a loan application. The application is then reviewed. If the application is approved, the loan is granted and the customer is notified. If the application is not approved, the customer is notified about the rejection. The process ends when the customer is notified.

    Mermaid.js BPMN Model:

    ```mermaid
    graph LR
    0:startevent:((startevent)) --> 1:task:(Customer submits loan application)
    1:task:(Customer submits loan application) --> 2:task:(Review loan application)
    2:task:(Review loan application) --> 3:exclusivegateway:{x}
    3:exclusivegateway:{x} --> |Application approved| 4:task:(Grant loan)
    3:exclusivegateway:{x} --> |Application not approved| 5:task:(Notify customer about rejection)
    4:task:(Grant loan) --> 6:task:(Notify customer about approval)
    5:task:(Notify customer about rejection) --> 7:endevent:(((endevent)))
    6:task:(Notify customer about approval) --> 7:endevent:(((endevent)))
    ```

    This model represents the described loan application process. It starts with the customer submitting a loan application, which is then reviewed. Depending on whether the application is approved or not, the loan is either granted or the customer is notified about the rejection. The process ends when the customer is notified.
  time:timestamp: '2026-04-23T09:29:29.814947+02:00'
