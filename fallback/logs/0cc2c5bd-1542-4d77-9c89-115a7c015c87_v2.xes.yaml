  cpee:instance: 0cc2c5bd-1542-4d77-9c89-115a7c015c87
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 609813c89cb1efb4c7cabc476294cd3aa5faed76
  cpee:exposition: |-
    # User Input:
    The process starts. First, ingredients are retrieved. Then, the ingredients are mixed. After that, ice cubes are added. Next, a decision is made: if the customer wants a straw, then a straw is added, otherwise the process continues without adding a straw. Then, another decision is made: if the customer wants more liquor, an additional shot of liquor is added, otherwise, if the customer is satisfied, the process proceeds. The process ends.
    Can you represent the fact that the user can request a shot of liquor multiple times, until they are satisfied?
  time:timestamp: '2026-03-22T16:37:58.565835+01:00'
