event:
  concept:instance: 503
  id:id: ex-ante
  cpee:instance: 0cc2c5bd-1542-4d77-9c89-115a7c015c87
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: b00f45f8d31e74f637d7ddc0b885f67a5c173f07
  cpee:exposition: |-
    # User Input:
    The process starts with retrieving ingredients. Then, a decision is made. If the condition is met, the process proceeds directly to a merge point. Otherwise, the process continues to mixing ingredients, after which the process splits into two parallel activities: adding ice cubes and adding a straw. Once both activities are completed, the process merges back together, and another decision is made. If the condition is met, the process proceeds directly to a merge point. Otherwise, the process continues to another decision point. If the customer wants more liquor, an additional shot of liquor is added, and then the process merges back. Otherwise, the process proceeds directly to the merge point. From the merge point, the process loops back to the previous decision point. From the merge point, the process merges back, and then the process ends.


    Is it still possible for a customer to have a cocktail without a straw?
  time:timestamp: '2026-03-22T16:42:37.472319+01:00'
