event:
  concept:instance: 4
  id:id: ex-ante
  cpee:instance: 4c6a949d-f14b-41a1-8da1-a6c7b6992691
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 8466e4ffa4c2a087cf24e3f2cc83af2148881ab3
  cpee:exposition: |-
    # User Input:
    . 开始

    流程开始。
    接收订单
    系统或人工接收到新的客户订单。
    订单信息审核
    操作：检查订单信息的完整性与准确性（如：收货地址、商品规格、数量、客户联系方式等）。
    判断：订单信息是否完整且准确？
    是：进入步骤4。
    否：进入步骤3a。

    3a. 联系客户确认/修改订单

    操作：与客户联系，确认或修改不清晰、不完整或有误的订单信息。
    判断：客户是否确认或修改完成？
    是：返回步骤3（重新审核）。
    否：进入步骤3b。

    3b. 取消订单

    操作：如果无法与客户达成一致或客户主动要求取消，则取消订单。
    结束：此订单流程结束。
    库存检查
    操作：根据订单内容检查所需商品的库存情况。
    判断：所需商品库存是否充足？
    是：进入步骤5。
    否：进入步骤4a。

    4a. 处理缺货

    操作：
    记录缺货商品及数量。
    通知采购部门补货（如果适用）。
    联系客户告知缺货情况，并提供选项（如：等待补货、更换商品、部分发货、取消订单）。
    判断：根据客户选择处理。
    等待补货：进入等待状态，补货后返回步骤4。
    更换商品：返回步骤3（重新审核新商品订单）。
    部分发货：对有货商品进入步骤5，缺货商品进入等待或取消。
    取消订单：进入步骤3b。
    订单确认与处理
    操作：
    正式确认订单。
    生成内部处理单或拣货单。
    更新订单状态为“处理中”。
    拣货
    操作：仓库人员根据拣货单从货架上拣取相应商品。
    打包
    操作：
    核对拣取的商品与订单是否一致。
    对商品进行妥善包装，确保运输安全。
    贴上物流面单。
    称重与物流信息录入
    操作：
    对包裹进行称重。
    将物流单号等信息录入系统，并更新订单状态为“已发货”。
    （可选）通知客户订单已发货及物流信息。
    移交物流
    操作：将打包好的包裹移交给合作的物流公司进行配送。
    结束
  time:timestamp: '2026-03-16T22:13:17.524767+01:00'
