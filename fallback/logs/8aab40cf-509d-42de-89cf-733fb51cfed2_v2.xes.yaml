event:
  concept:instance: 12231
  id:id: ex-ante
  cpee:instance: 8aab40cf-509d-42de-89cf-733fb51cfed2
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: c939157a15e4973ed1f50afb9e753230703545f3
  cpee:exposition: |-
    # User Input:
    Article 22: Trusted flaggers
    1 Providers of online platforms shall take the necessary technical and organisational measures to ensure that notices submitted by trusted flaggers, acting within their designated area of expertise, through the mechanisms referred to in, are given by Providers priority and are processed by Providers and decided upon.
    --PARALLEL TASKS--
    2(a) The status of ‘trusted flagger’ under this Regulation shall be awarded, upon application by any entity, by the Digital Services Coordinator of the Member State in which the applicant is established by Providers, to an applicant
    2(b) The status of ‘trusted flagger’ under this Regulation shall be awarded, upon application by any entity, by the Digital Services Coordinator of the Member State in which the applicant is established by Providers, to an applicant
    2(c) The status of ‘trusted flagger’ under this Regulation shall be awarded, upon application by any entity, by the Digital Services Coordinator of the Member State in which the applicant is established by Providers, to an applicant
    --END OF PARALLEL TASKS--
    --PARALLEL TASKS--
    3(a) Trusted flaggers shall publish, at least once a year easily comprehensible and detailed reports on notices submitted IAW during the relevant period. The report shall list at least the number of notices categorised by the identity of the provider of hosting services,
    3(b) Trusted flaggers shall publish, at least once a year easily comprehensible and detailed reports on notices submitted IAW during the relevant period. The report shall list at least the number of notices categorised by the type of allegedly illegal content notified,
    3(c) Trusted flaggers shall publish, at least once a year easily comprehensible and detailed reports on notices submitted IAW during the relevant period. The report shall list at least the number of notices categorised by the action taken by the provider.
    Those reports shall include an explanation of the procedures in place to ensure.
    Trusted flaggers shall send those reports to the awarding Digital Services Coordinator, and shall make them publicly available. The information in those reports shall not contain personal data
    --END OF PARALLEL TASKS--
    4 Digital Services Coordinators shall communicate to the Commission and the Board the names, addresses and email addresses of the entities to which Digital Services Coordinators have awarded the status of the trusted flagger IAW or whose trusted flagger status Digital Services Coordinators have suspended IAW or revoked in accordance.
    5 The Commission shall publish the information referred to in in a publicly available database, in an easily accessible and machine-readable format, AND shall keep the database up to date.
    6 IF a provider of online platforms has information indicating that a trusted flagger has submitted a significant number of insufficiently precise, inaccurate or inadequately substantiated notices through the mechanisms referred to in, including information gathered in connection to the processing of complaints through the internal complaint-handling systems referred to in, Commission shall communicate that information to the Digital Services Coordinator, providing the necessary explanations and supporting documents.
    Upon receiving the information from the provider of online platforms, and if the Digital Services Coordinator considers that there are legitimate reasons to open an investigation, the status of trusted flagger shall be suspended by Commission during the period of the investigation.
    That investigation shall be carried by Commission out.
    7 The Digital Services Coordinator shall revoke that status if the Digital Services Coordinator determines, following an investigation either on its own initiative or on the basis information received from third parties, including the information provided by a provider of online platforms pursuant to, that the entity no longer meets the conditions set out.
    Before revoking that status, the Digital Services Coordinator shall afford the entity an opportunity to react to the findings of its investigation and its intention to revoke the entity’s status as trusted flagger.
    8 The Commission, after consulting the Board, shall, where necessary, issue guidelines to assist providers of online platforms and Digital Services Coordinators in the application of paragraphs 2, 6 and 7.
  time:timestamp: '2026-05-15T14:31:43.788398+02:00'
