event:
  concept:instance: 11741
  id:id: ex-ante
  cpee:instance: 216deea0-2ace-487f-bffa-810d082337a5
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 5f9b52184c57c8179c5281bab467d9b21af9aa1c
  cpee:exposition: |
    # User Input:
    The process starts when a claim is submitted. Subsequently, a decision
    is made based on whether the claim is valid. If the claim is valid, the
    claim details are verified. Following verification, another decision is
    made based on whether the details are valid. If the details are valid, a
    payment is processed, and the customer is notified. If the details are
    not valid, the claim is rejected. If the initial claim is not valid, the claim
    is also rejected. After the customer is notified or the claim is rejected,
    the process ends.
  time:timestamp: '2026-05-08T14:45:26.877186+02:00'
