event:
  concept:instance: 12251
  id:id: ex-ante
  cpee:instance: 7c7654bb-b3c0-4be6-a2f3-1a0009e36452
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 307e5ad0c4768a14396a310d53278c2817f021e5
  cpee:exposition: |-
    # User Input:
    1 Member States shall require that verification of the identity of the customer and the beneficial owner take place
    before the establishment of a business relationship or the carrying out of the transaction.
    2 By way of derogation from paragraph 1, Member States may allow verification of the identity of the customer and the beneficial owner to be completed by Member States during the establishment of a business relationship if necessary so as not to interrupt the normal conduct of business and where there is little risk of money laundering or terrorist financing.
    In such situations, those procedures shall be completed by Member States as soon as practicable after initial contact.
    3 By way of derogation from paragraph 1, Member States may allow the opening of an account with a credit
    institution or financial institution, including accounts , provided that there are adequate safeguards in place to ensure that transactions are not carried out by the customer or on its behalf until full compliance with the customer due diligence requirements laid down in points (a) and (b) of the first subparagraph of Article 13(1) is obtained by Member States.
    4 Member States shall require that, where an obliged entity is unable to comply with the customer due diligence
    requirements laid down in point (a), (b) or (c) of the first subparagraph of Article 13(1), Member States shall not carry out a
    transaction through a bank account, establish a business relationship or carry out the transaction, and shall terminate the business relationship and consider making a suspicious transaction report to the FIU in relation to the customer in accordance.
    Member States shall not apply the first subparagraph to notaries, other independent legal professionals, auditors, external accountants and tax advisors only to the strict extent that those persons ascertain the legal position of their client, or perform the task of defending or representing that client in, or concerning, judicial proceedings, including providing advice on instituting or avoiding such proceedings.
    5 Member States shall require that obliged entities apply the customer due diligence measures not only to all new
    customers but also at appropriate times to existing customers on a risk-sensitive basis, including at times when the
    relevant circumstances of a customer change.
  time:timestamp: '2026-05-15T14:48:26.772451+02:00'
