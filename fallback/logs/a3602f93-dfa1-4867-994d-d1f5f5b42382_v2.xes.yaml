event:
  concept:instance: 9143
  id:id: ex-ante
  cpee:instance: a3602f93-dfa1-4867-994d-d1f5f5b42382
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: '095cfc25995280f10016d46cdbf4bedb1700732e'
  cpee:exposition: |-
    # User Input:
    The process starts when a claim is submitted. Subsequently, a decision is made based on whether the claim is valid. If the claim is valid, the claim details are verified. Following verification, another decision is made based on whether the details are valid. If the details are valid, a payment is processed, and the customer is notified. If the details are not valid, the claim is rejected. If the initial claim is not valid, the claim is also rejected. After the customer is notified or the claim is rejected, the process ends.
  time:timestamp: '2026-04-13T10:34:35.698322+02:00'
