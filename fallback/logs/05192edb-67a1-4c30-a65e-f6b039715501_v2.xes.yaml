  cpee:change_uuid: 05335df79ca370b2bc7589f9b57782b51b9b17bd
  cpee:exposition: |-
    # User Input:
    Management of Femur Fractures (EU-compliant pathway)

    When a patient with a suspected femur fracture arrives at the emergency department, the trauma team begins with an immediate primary assessment according to the ATLS protocol. The first priority is to identify and treat any life-threatening conditions. If the patient shows signs of haemodynamic instability or polytrauma, the case is flagged as a candidate for damage control orthopaedics (DCO).

    If the patient is unstable, the orthopaedic and trauma teams proceed with temporary stabilisation. This usually involves the application of a traction splint or an external fixator to control pain and bleeding, followed by resuscitation and transfer to intensive care for physiological optimisation. Imaging such as a trauma CT is performed once the patient is stable enough. Intravenous antibiotics are given immediately if the fracture is open, and mechanical venous-thromboembolism prophylaxis is started unless contraindicated. When the patientâ€™s condition improves and vital signs stabilise, the team re-evaluates for definitive fixation.

    If the patient is stable at presentation, or once stabilised after DCO, the care team proceeds to definitive management. Radiographs of the femur (anteroposterior and lateral) are obtained, and a CT scan is added when the fracture is complex or involves a joint surface. The fracture is then classified as proximal, shaft, or distal, following AO/OTA standards. At this stage, the patientâ€™s comorbidities, anticoagulant use, and pre-injury mobility are assessed, and orthogeriatric consultation is requested for older or frail patients. Preoperative optimisation begins immediately, focusing on hydration, analgesia, and correction of reversible medical issues.

    After classification, the surgical team decides on the appropriate treatment pathway.

    Proximal femur fractures (neck or intertrochanteric) are managed according to the degree of displacement and the patientâ€™s functional status. Displaced intracapsular fractures in elderly patients are generally treated with arthroplastyâ€”either hemiarthroplasty or total hip replacementâ€”while non-displaced fractures or those in younger patients are fixed internally using screws or a dynamic hip screw. Surgery is planned within 48 hours of admission whenever possible, as early operation reduces complications and mortality.

    Femoral shaft fractures are best treated with a reamed intramedullary nail inserted through an antegrade approach. For physiologically stable patients, this should ideally be done within 24 hours of injury. If the fracture is open, intravenous antibiotics and tetanus prophylaxis are administered promptly, and soft-tissue care follows established protocols.

    Distal femur fractures are treated with either a retrograde intramedullary nail or locking plate fixation, depending on the fracture pattern and the surgeonâ€™s assessment.

    Before surgery, the anaesthesia team assesses the patient and determines whether regional or general anaesthesia is most appropriate. Perioperative antibiotic prophylaxis is given before incision, and pharmacological thromboprophylaxis is started post-operatively as soon as the bleeding risk allows.

    After surgery, the emphasis shifts to early mobilisation and multidisciplinary rehabilitation. The goal is to have the patient out of bed and mobilisingâ€”either fully or partially weight-bearingâ€”within the first 24 hours when the fixation permits. The orthogeriatric and rehabilitation teams coordinate physiotherapy, occupational therapy, and pain management. Venous-thromboembolism prophylaxis continues until the patient is mobile, and osteoporosis or falls-prevention strategies are introduced where appropriate.

    Follow-up imaging is scheduled at approximately six and twelve weeks to evaluate healing and implant stability. Throughout this period, the team monitors for complications such as infection, non-union, or thromboembolic events. Key performance indicators are tracked to maintain quality: the percentage of hip fracture surgeries completed within forty-eight hours, the proportion of shaft fractures nailed within twenty-four hours, timely administration of antibiotics for open fractures, and orthogeriatric review within seventy-two hours of admission.

    The process concludes when the patient is safely discharged, follow-up plans are in place, and outcome data are entered into the hospitalâ€™s trauma registry or national audit.
