  cpee:exposition: |+
    # User Input:
    consider this excel table, create a process for femur treatment:
    Subprozess    Schritt-Nr.    Prozesschritt    Abteilung/Fachbereich    Bearbeiter    Erzeugte Dokumente    Dokumentenschlüssel    Genutztes Programm    Beschreibung    Endgerät    Betriebssystem Endgerät    Bemerkung    Bearbeitungszeit (optional)    Wartezeit (optional)
    Aufnahme über die CNA    1    Ankunft Patient in CNA    CNA    Rettungsdienst    Einsatzprotokoll        NIDA    Patient wird in die Notaufnahme mit dem Rettungsdienst gebracht             Einsatzprotokoll nur als PDF im Archiv        
        2    Aufnahme/Anlage Fall    CNA    Anmeldung ZNA    Fall        i.s.h.med.    Registrierung Patient über Anmeldung (Erhebung Patientendaten Einlesen, Krankenkassenkarte)    Desktop-PC    Windows 11            
        3    Triage und Erhebung Notfallanamnese    CNA    Pflegepersonal CNA    Triage; Überwachungsprotokoll Notaufnahme    ZC2_TRIAGE; ZC2_UEBERW    Papier    Triage durch Pflegepersonal (ESI-Score)    Papier        Nachträglicher Scan ins i.s.h.med., Papierdokument nicht sinnvoll nachnutzbar        
        4    Einlesen Vorbefunde    CNA    Pflegepersonal CNA    Scan Vorbefunde (Elektronsicher Medikationsplan, Pflegeüberleitungsbogen, Arztbriefe, etc.)        i.s.h.med.    Scannen und Einlesen von Vorbefunden    Desktop-PC    Windows 11    Unübersichtlich als PDF im Archiv abgelegt        
    Diagnostik    5    Untersuchung ärztlich    CNA    Ärztliches Personal Unfallchirurgie    Kurzbrief Amublanz    ZAMBKBRIEF    i.s.h.med., ukw.mobile    Anamnese, Untersuchung    Desktop-PC, iPhone    Windows 11, iOS    Viele unstrukturierte Informationen, wie Medikation, Allergien, Diagnosen        
        6    Laborauftrag    CNA    Pflegepersonal CNA    Lauris-Auftrag        Lauris    Auftrag zur Labordiagnostik    Desktop-PC    Windows 11            
        7    Auftrag Transfusionsmedizin    CNA    Pflegepersonal CNA    Transfusionsschein    ZC2_TRANSF    Papier    Auftrag für Transfusionsprodukte    Papier        Nachträglicher Scan ins i.s.h.med., im System nicht sinnvoll nachvollziehbar, ob bereits beauftragt        
        8    Klinischer Auftrag Radiologie    CNA    Ärztliches Personal Unfallchirurgie    Klinischer Auftrag Radiologie    ZSDANORD (wenn über ukw.mobile erstellt)    i.s.h.med.; ukw.mobile    Klinischer Auftrag zur Röntgendiagnostik    Desktop-PC, iPhone    Windows 11, iOS            
        9    Erhebung Scores Geriatrie    CNA    Pflegepersonal CNA    ISAR-Score, 4AT-Score    ZC2_ADMIN    Papier    Erhebung von Scores gemäß GBA-Beschluss            Nachträglicher Scan ins i.s.h.med., Papierdokument nicht sinnvoll nachnutzbar        
        10    Transport Radiologie    CNA    Pflegepersonal CNA    Innerklinischer Transportauftrag        i.s.h.med.    Transportauftrag    Desktop-PC                
        11    Radiologische Diagnostik    Radiologie    MRTA    Radiologische Bilddatei        Merlin    Durchführung der radiologischen Diagnostik    Desktop-PC    Windows 11            
        12    Radiologischer Befund    Radiologie    Ärztliches Personal Radiologie    Radiologischer Befund    ZN7RADKAP1    i.s.h.med.    Erstellung radiologischer Befund    Desktop-PC    Windows 11            
