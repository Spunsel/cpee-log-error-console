  cpee:exposition: |-
    # User Input:
    It's my birthday, so I throw a party. First, I send out invites and collect the responses of who's attending. If any vegans attend my party, I adjust my menu to include vegan options. If not, I keep it strictly vegetarian. When my guests arrive, they may eat, drink and/or play games. At 12am, the party is over.
  time:timestamp: '2026-04-27T10:04:30.999574+02:00'
