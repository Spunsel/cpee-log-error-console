  cpee:exposition: |-
    # User Input:
    The process is triggered by the demand of a functional department to fill a post .
    The post is advertised , applicants apply , the applications are checked and the post is filled .
    The process finishes when the post was filled , precisely through the conclusion of a contract of employment .
  time:timestamp: '2026-04-20T00:06:28.311730+02:00'
