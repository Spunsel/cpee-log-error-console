event:
  concept:instance: 9594
  id:id: ex-ante
  cpee:instance: 8ec1c7a0-5350-48c8-b245-b60d1e81e876
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: c7f250be47c2c48e1b195e8360c9f58b974566d7
  cpee:exposition: |-
    # User Input:
    The loan application process describes the sequence of activities

    through which a financial institution evaluates and decides on

    Customers upload their complaint via an online form. The form

    contains the insurance number, the amount of damage, and a

    description of the damage. If the amount of damage is ≤ 100 Euro,

    an automatic plausibility check is conducted and the complaint is

    approved. The customer is informed via email and the money

    transfer is initiated.

    If the damage amount is above 100 Euro, a clerk checks the

    complaint. The customer is informed on the decision via email. If

    the complaint is rejected, the customer is offered an optional

    meeting.
  time:timestamp: '2026-04-20T09:56:04.165061+02:00'
