event:
  concept:instance: 140984
  id:id: external
  cpee:activity: external
  cpee:instance: 98712ca1-52be-4c5b-8e93-9a03d3f756f9
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: e7155cbe85efc9d267b8206c178de482482eba7c
  cpee:exposition: |+
    # User Input:
    Please create a sales process. The process should start with the activity RFP received. Then the sales representative of the modeled organization should prepare the offer. Then, there should be an XOR gateway. Either, the sales rep decided to reject the deal (this would lead to the end node of the process) or the sales rep sends the offer to the customer or the offer needs to go to financial AND/OR legal department depending on the discount and terms of services specified by the sales rep. In this case, these two adapt the offer and send it back to the sales rep. If the offer is sent to the customer, he can either accept or decline the offer. If it gets accepted, the sales rep will sign the contract and the process is finished. If it gets rejected, the sales rep can either make a new offer of reject the deal.

  time:timestamp: '2026-02-06T16:25:30.593074+01:00'
