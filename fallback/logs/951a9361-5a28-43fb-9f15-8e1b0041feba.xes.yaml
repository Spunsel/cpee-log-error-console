  cpee:exposition: |-
    # User Input:
    To keep everyone in the office fuelled and focused, an automatic coffee monitoring system ensures you're never left without your daily brew.
    First, you are asked whether a refill should be ordered.Â 

    After the refill decision has been made, the system collects the email addresses of all relevant office members. These email addresses are used for all subsequent communication, regardless of the decision outcome.

    The process continues based on the refill decision. If the response is negative, a follow-up email is sent to the office to inform everyone that no new coffee has been ordered this week.
    If refill is necessary, a simple ordering is initiated. It prompts the user to confirm preferences such as the type and amount of coffee (beans, pods), milk options (e.g., regular, oat, almond), and additional supplies needed like sugar or sweeteners.
    Once the order details are confirmed, a confirmation email is sent to the entire office, letting everyone know that fresh coffee is on its way.
  time:timestamp: '2026-02-06T10:53:55.609681+01:00'
