  cpee:change_uuid: 5d01b40691b30d5177c445ee1e10fd1a64e28cc2
  cpee:exposition: |-
    %% Output Intermediate
    Due to the complexity of the process, the model has been simplified to meet all requirements. Here is the Mermaid.js BPMN model:

    ```mermaid
    graph LR
    0:startevent:((startevent)) --> 1:task:(Identify personal data breach)
    1:task:(Identify personal data breach) --> 2:exclusivegateway:{x}
    2:exclusivegateway:{x} --> |Breach identified by Controller| 3:task:(Notify supervisory authority within 72 hours)
    2:exclusivegateway:{x} --> |Breach identified by Processor| 4:task:(Notify Controller without undue delay)
    3:task:(Notify supervisory authority within 72 hours) --> 5:exclusivegateway:{x}
    4:task:(Notify Controller without undue delay) --> 3:task:(Notify supervisory authority within 72 hours)
    5:exclusivegateway:{x} --> |Notification within 72 hours| 6:task:(Document the breach, its effects, and remedial action)
    5:exclusivegateway:{x} --> |Notification after 72 hours| 7:task:(Provide reasons for delay and document the breach, its effects, and remedial action)
    6:task:(Document the breach, its effects, and remedial action) --> 8:exclusivegateway:{x}
    7:task:(Provide reasons for delay and document the breach, its effects, and remedial action) --> 8:exclusivegateway:{x}
    8:exclusivegateway:{x} --> |High risk to rights and freedoms| 9:task:(Communicate the breach to the data subject)
    8:exclusivegateway:{x} --> |No high risk to rights and freedoms| 10:endevent:(((endevent)))
    9:task:(Communicate the breach to the data subject) --> 10:endevent:(((endevent)))
    ```

    This model represents the described business process. It starts with the identification of a personal data breach. Depending on who identifies the breach, the supervisory authority is notified within 72 hours. If the notification is delayed, reasons for the delay are provided. The breach, its effects, and remedial action are documented. Depending on the risk to rights and freedoms, the data subject is either communicated about the breach or the process ends.
  time:timestamp: '2026-01-03T15:23:41.020571+01:00'
