  id:id: external
  cpee:activity: external
  cpee:instance: 8197db8a-44e2-4d3d-8ead-abfd08c17fa9
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 1190937c2683de7f71e6fd03782b2e475d2e214d
  cpee:exposition: |+
    # User Input:
    You produce custom chainsaws on demand. Your chainsaws have at least 5
    properties such as length of the "guide bar" (Schwertlaenge), chain width,
    electric or motor chainsaw. After your customer told you the properties, you
    can start ordering the parts from various online sources (in parallel). After
    the parts arrive you have to do a manual inspection of all parts, and then
    assemble the parts. During production, you regularly send updates to your
    customer. After producing the first saw you send it to your customer. If he
    likes it, the rest of his order are produced.


    1. Identify all roles and their associated activities from this text. If a role is a subrole of another, clearly indicate this. If a role belongs to another organization, this should also be clearly marked. Analyze the process description to model the BPMN data flow. For each task that creates a data object, create a â€œData Output Associationâ€ to that data object. Then, for each subsequent task that uses this data, create a â€œData Input Associationâ€ from the data object to the task.
    2. Assign a numerical timestamp to all activities and gateways to control the sequence. Ensure that any preceding element has a lower timestamp than its successor. Elements that occur in parallel must share an identical timestamp. If subsequent events depend on a decision, the XOR gateway must also have an earlier timestamp than the following elements.
    3. Connect all elements (activities, gateways, events, data objects) using the appropriate connecting objects (Sequence Flows, Message Flows, Data Associations) based on the roles, data analysis and timestamps previously established. Ensure the connections adhere strictly to the sequence defined by the timestamps. Generate the final, complete BPMN modelÂ 

  time:timestamp: '2025-10-30T17:27:01.848968+01:00'
...
