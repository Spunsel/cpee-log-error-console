    # User Input:
    Refinement:Correct the just created model regarding the following things. Don't change the rest of the model:Â 
    It should only be possible to order all parts one time. If the inspection fails only certain parts that failed the inspection should be reordered.
    Updating the customer should take place in a loop until the first saw is done.Â 

    You produce custom chainsaws on demand. Your chainsaws have at least 5properties such as length of the "guide bar" (Schwertlaenge), chain width,electric or motor chainsaw. After your customer told you the properties, youcan start ordering the parts from various online sources (in parallel). Afterthe parts arrive you have to do a manual inspection of all parts, and thenassemble the parts. During production, you regularly send updates to yourcustomer. After producing the first saw you send it to your customer. If helikes it, the rest of his order are produced.

