    ```mermaid
    flowchart LR
        se:startevent:((startevent)) --> a1:task:(Define Airplane Model)
        a1:task:(Define Airplane Model) --> pg1:parallelgateway:{AND}
        pg1:parallelgateway:{AND} --> a3:task:(Customize Interior)
        pg1:parallelgateway:{AND} --> a4:task:(Number and Color of Seats)
        pg1:parallelgateway:{AND} --> a5:task:(Lighting)
        pg1:parallelgateway:{AND} --> a6:task:(Carpet and Wall Color)
        pg1:parallelgateway:{AND} --> a7:task:(Entertainment System)
        pg1:parallelgateway:{AND} --> a8:task:(Water Amount in Toilets)
        pg1:parallelgateway:{AND} --> a2:task:(Choose Bar Type)
        a2:task:(Choose Bar Type) --> eg1:exclusivegateway:{x}
        eg1:exclusivegateway:{x} --> |Vodka Bar| b1:task:(Vodka Bar)
        eg1:exclusivegateway:{x} --> |Whiskey Bar| b2:task:(Whiskey Bar)
        eg1:exclusivegateway:{x} --> |Wine Bar| b3:task:(Wine Bar)
        eg1:exclusivegateway:{x} --> |Cocktail Bar| b4:task:(Cocktail Bar)
        eg1:exclusivegateway:{x} --> |Coffee Bar| b5:task:(Coffee Bar)
        b1:task:(Vodka Bar) --> eg2:exclusivegateway:{x}
        b2:task:(Whiskey Bar) --> eg2:exclusivegateway:{x}
        b3:task:(Wine Bar) --> eg2:exclusivegateway:{x}
        b4:task:(Cocktail Bar) --> eg2:exclusivegateway:{x}
        b5:task:(Coffee Bar) --> eg2:exclusivegateway:{x}
        a3:task:(Customize Interior) --> pg2:parallelgateway:{AND}
        a4:task:(Number and Color of Seats) --> pg2:parallelgateway:{AND}
        a5:task:(Lighting) --> pg2:parallelgateway:{AND}
        a6:task:(Carpet and Wall Color) --> pg2:parallelgateway:{AND}
        a7:task:(Entertainment System) --> pg2:parallelgateway:{AND}
        a8:task:(Water Amount in Toilets) --> pg2:parallelgateway:{AND}
        eg2:exclusivegateway:{x} --> pg2:parallelgateway:{AND}
        pg2:parallelgateway:{AND} --> ee:endevent:((endevent))
    ```
  time:timestamp: '2025-11-03T16:13:53.400621+01:00'
