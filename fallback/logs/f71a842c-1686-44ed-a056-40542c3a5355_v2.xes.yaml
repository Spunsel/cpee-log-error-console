event:
  concept:instance: 5049
  id:id: external
  cpee:activity: external
  cpee:instance: f71a842c-1686-44ed-a056-40542c3a5355
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/change
  cpee:description: |
    <?xml version="1.0"?>
    <description xmlns="http://cpee.org/ns/description/1.0" xmlns:a="http://cpee.org/ns/annotation/1.0">
      <call id="a1" endpoint="" a:alt_id="a1">
        <parameters>
          <label>Define Airplane Model</label>
          <method/>
          <type>:task</type>
          <arguments/>
        </parameters>
      </call>
      <parallel wait="-1" cancel="last" a:alt_id="pg1">
        <parallel_branch>
          <call id="a5" endpoint="" a:alt_id="a3">
            <parameters>
              <label>Customize Interior</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
        </parallel_branch>
        <parallel_branch>
          <call id="a7" endpoint="" a:alt_id="a4">
            <parameters>
              <label>Number and Color of Seats</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
        </parallel_branch>
        <parallel_branch>
          <call id="a9" endpoint="" a:alt_id="a5">
            <parameters>
              <label>Lighting</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
        </parallel_branch>
        <parallel_branch>
          <call id="a11" endpoint="" a:alt_id="a6">
            <parameters>
              <label>Carpet and Wall Color</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
        </parallel_branch>
        <parallel_branch>
          <call id="a13" endpoint="" a:alt_id="a7">
            <parameters>
              <label>Entertainment System</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
        </parallel_branch>
        <parallel_branch>
          <call id="a15" endpoint="" a:alt_id="a8">
            <parameters>
              <label>Water Amount in Toilets</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
        </parallel_branch>
        <parallel_branch>
          <call id="a17" endpoint="" a:alt_id="a2">
            <parameters>
              <label>Choose Bar Type</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
          <choose mode="exclusive" a:alt_id="eg1">
            <alternative condition="Vodka Bar" language="text/javascript">
              <call id="a21" endpoint="" a:alt_id="b1">
                <parameters>
                  <label>Vodka Bar</label>
                  <method/>
                  <type>:task</type>
                  <arguments/>
                </parameters>
              </call>
            </alternative>
            <alternative condition="Whiskey Bar" language="text/javascript">
              <call id="a23" endpoint="" a:alt_id="b2">
                <parameters>
                  <label>Whiskey Bar</label>
                  <method/>
                  <type>:task</type>
                  <arguments/>
                </parameters>
              </call>
            </alternative>
            <alternative condition="Wine Bar" language="text/javascript">
              <call id="a25" endpoint="" a:alt_id="b3">
                <parameters>
                  <label>Wine Bar</label>
                  <method/>
                  <type>:task</type>
                  <arguments/>
                </parameters>
              </call>
            </alternative>
            <alternative condition="Cocktail Bar" language="text/javascript">
              <call id="a27" endpoint="" a:alt_id="b4">
                <parameters>
                  <label>Cocktail Bar</label>
                  <method/>
                  <type>:task</type>
                  <arguments/>
                </parameters>
              </call>
            </alternative>
            <alternative condition="Coffee Bar" language="text/javascript">
              <call id="a29" endpoint="" a:alt_id="b5">
                <parameters>
                  <label>Coffee Bar</label>
                  <method/>
                  <type>:task</type>
                  <arguments/>
                </parameters>
              </call>
            </alternative>
          </choose>
        </parallel_branch>
      </parallel>
