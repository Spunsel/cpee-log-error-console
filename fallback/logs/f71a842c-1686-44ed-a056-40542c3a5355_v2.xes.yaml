event:
  concept:instance: 5049
  id:id: external
  cpee:activity: external
  cpee:instance: f71a842c-1686-44ed-a056-40542c3a5355
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 33f9e3333ead2e5ff40dd9deadb228e733d251d0
  cpee:exposition: |-
    # User Input:
    Add tasks where the customer defines the airplane’s interior: choose one of five bar types, number and color of seats, lighting, carpet and wall color, entertainment system, and water amount in toilets. Add a parallel gateway to start all configuration tasks at the same time. Inside the ÜSChoose Bar Type⬝ branch, include an exclusive gateway with five options: vodka bar, whiskey bar, wine bar, cocktail bar, and coffee bar. Only one of these options should be selected. When all configuration branches are finished, merge them back together.
  time:timestamp: '2025-11-03T16:13:53.400006+01:00'
