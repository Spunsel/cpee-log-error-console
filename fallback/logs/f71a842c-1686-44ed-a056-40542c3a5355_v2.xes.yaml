    # User Input:
     After sending the confirmation create parallel branches for the manufacturing of different interior components. For example, the Russian team manufactures the vodka bar, the Irish team manufactures the whiskey bar, the french team for the wine bar, the german team for the cocktail bar and the Italian team for the coffee bar. Add a branch and manufacturer for each remaining task. Use a parallel gateway to start and later join these tasks.
