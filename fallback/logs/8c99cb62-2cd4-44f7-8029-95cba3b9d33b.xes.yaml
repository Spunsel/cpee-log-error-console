  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 7e073e18e0dddc20165546a936652ec38be17587
  cpee:exposition: "%% Output Intermediate\nDue to the complexity of the description,
    the model has been simplified to meet all requirements. \n\n```mermaid\ngraph
    LR\n0:startevent:((startevent)) --> 1:task:(Customer decides to activate or deactivate
    consumption time series display)\n1:task:(Customer decides to activate or deactivate
    consumption time series display) --> 2:exclusivegateway:{x}\n2:exclusivegateway:{x}
    --> |Activate| 3:task:(Activate consumption time series display)\n2:exclusivegateway:{x}
    --> |Deactivate| 4:task:(Deactivate consumption time series display)\n3:task:(Activate
    consumption time series display) --> 5:task:(Notify network operator)\n4:task:(Deactivate
    consumption time series display) --> 5:task:(Notify network operator)\n5:task:(Notify
    network operator) --> 6:task:(Transmit status to central system as ALARM or EVENT)\n6:task:(Transmit
    status to central system as ALARM or EVENT) --> 7:task:(Enter status in logbook)\n7:task:(Enter
    status in logbook) --> 8:endevent:(((endevent)))\n```\n\nThis model represents
    the described business process. It starts with the customer deciding to activate
    or deactivate the consumption time series display. Depending on the customer's
    decision, different paths are followed. If the customer decides to activate the
    display, the network operator is notified and the status is transmitted to the
    central system as ALARM or EVENT. If the customer decides to deactivate the display,
    the same steps are followed. The process ends after the status is entered in the
    logbook."
  time:timestamp: '2025-12-29T20:23:19.785174+01:00'
