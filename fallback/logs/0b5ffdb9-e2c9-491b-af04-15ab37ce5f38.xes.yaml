event:
  concept:instance: 83256
  id:id: external
  cpee:activity: external
  cpee:instance: 0b5ffdb9-e2c9-491b-af04-15ab37ce5f38
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: ea42ed496861a40f3d09390fbde7ff6762708797
  cpee:exposition: |
    # User Input:
    1. Initiation and Requisition Validation The procurement lifecycle initiates when a Department Head submits a Purchase Requisition (PR) via the central ERP system. The system immediately performs a logic check: if the estimated value is under $5,000 USD, the PR is automatically routed to the Department Manager for single-step approval. However, if the value exceeds $5,000 USD but is under $50,000 USD, it triggers a secondary financial review by the Regional Controller. For any PR exceeding $50,000 USD (or the local currency equivalent adjusted for quarterly inflation rates), the request is flagged as "CapEx-Critical" and requires a digital signature from the Chief Financial Officer (CFO) before proceeding to vendor selection.

    2. Vendor Selection and Compliance Vetting Once the financial authority matrix is satisfied, the Procurement Officer must determine if the requested goods/services can be sourced from a Preferred Vendor.
    Existing Vendor: If a Preferred Vendor is selected, the Officer checks the Master Service Agreement (MSA) for validity. If the MSA expires within 90 days, a renewal negotiation workflow is triggered parallel to the purchasing track.
    New Vendor: If a new vendor is required, a Request for Proposal (RFP) is issued. Upon selecting a candidate, the "Vendor Onboarding Protocol" activates. This requires three simultaneous inputs:
    Legal: Verification of international trade sanctions lists (OFAC) and local labor law compliance.
    InfoSec: If the vendor will access company data, they must complete the Third-Party Security Risk Assessment (TP-SRA) scoring at least 75/100.
    Finance: A credit risk analysis using D&B reports.
    3. Contract Negotiation and Regional Variations If the vendor is based in the European Union, the Data Processing Addendum (DPA) must be aligned with GDPR requirements, necessitating review by the Data Privacy Officer (DPO). For vendors in the APAC region, specific logistics riders regarding incoterms (e.g., FOB vs. CIF) must be attached to the contract. Discrepancies in liability clauses greater than $1M require escalation to the General Counsel.

    4. Purchase Order Issuance and ERP Integration Upon successful completion of vetting and contract execution, the ERP system generates a Purchase Order (PO) number. This PO is technically "locked" until the Quality Assurance (QA) team verifies the vendor's ISO certification status in the supplier portal. Once unlocked, the PO is transmitted via EDI (Electronic Data Interchange) to the vendor. Simultaneously, the inventory management module reserves a virtual slot for the incoming goods, and the Accounts Payable team receives a generic "Encumbrance Notification" to reserve cash flow for the future invoice.
  time:timestamp: '2025-12-11T13:51:25.189194+01:00'
