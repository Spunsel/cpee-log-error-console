    <?xml version="1.0"?>
    <description xmlns="http://cpee.org/ns/description/1.0" xmlns:a="http://cpee.org/ns/annotation/1.0">
      <call id="a1" endpoint="" a:alt_id="t1">
        <parameters>
          <label>Submit Purchase Requisition</label>
          <method/>
          <type>:task</type>
          <arguments/>
        </parameters>
      </call>
      <choose mode="exclusive" a:alt_id="eg1">
        <alternative condition="Value &lt; $5,000" language="text/javascript">
          <call id="a5" endpoint="" a:alt_id="t2">
            <parameters>
              <label>Department Manager Approval</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
        </alternative>
        <alternative condition="$5,000 &lt; Value &lt; $50,000" language="text/javascript">
          <call id="a7" endpoint="" a:alt_id="t3">
            <parameters>
              <label>Regional Controller Review</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
        </alternative>
        <alternative condition="Value &gt; $50,000" language="text/javascript">
          <call id="a9" endpoint="" a:alt_id="t4">
            <parameters>
              <label>CFO Approval - CapEx-Critical</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
        </alternative>
      </choose>
      <call id="a17" endpoint="" a:alt_id="t5">
        <parameters>
          <label>Determine Preferred Vendor</label>
          <method/>
          <type>:task</type>
          <arguments/>
        </parameters>
      </call>
      <choose mode="exclusive" a:alt_id="eg2">
        <alternative condition="Existing Vendor" language="text/javascript">
          <call id="a21" endpoint="" a:alt_id="t6">
            <parameters>
              <label>Check MSA Validity</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
          <choose mode="exclusive" a:alt_id="eg3">
            <alternative condition="MSA Expires within 90 days" language="text/javascript">
              <call id="a27" endpoint="" a:alt_id="t8">
                <parameters>
                  <label>Renewal Negotiation Workflow</label>
                  <method/>
                  <type>:task</type>
                  <arguments/>
                </parameters>
              </call>
            </alternative>
            <alternative condition="MSA Valid" language="text/javascript"/>
          </choose>
        </alternative>
        <alternative condition="">
          <call id="a23" endpoint="" a:alt_id="t7">
            <parameters>
              <label>Issue RFP</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
          <call id="a31" endpoint="" a:alt_id="t9">
            <parameters>
              <label>Vendor Onboarding Protocol</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
          <parallel wait="-1" cancel="last" a:alt_id="pg1">
            <parallel_branch>
              <call id="a35" endpoint="" a:alt_id="t10">
                <parameters>
                  <label>Legal Verification</label>
                  <method/>
                  <type>:task</type>
                  <arguments/>
                </parameters>
              </call>
            </parallel_branch>
            <parallel_branch>
              <call id="a37" endpoint="" a:alt_id="t11">
                <parameters>
                  <label>InfoSec Assessment</label>
                  <method/>
                  <type>:task</type>
                  <arguments/>
                </parameters>
              </call>
            </parallel_branch>
            <parallel_branch>
              <call id="a39" endpoint="" a:alt_id="t12">
                <parameters>
                  <label>Finance Credit Risk Analysis</label>
                  <method/>
                  <type>:task</type>
                  <arguments/>
                </parameters>
              </call>
            </parallel_branch>
          </parallel>
        </alternative>
      </choose>
      <call id="a51" endpoint="" a:alt_id="t13">
        <parameters>
          <label>Contract Negotiation</label>
          <method/>
          <type>:task</type>
          <arguments/>
        </parameters>
      </call>
      <choose mode="exclusive" a:alt_id="eg4">
        <alternative condition="Vendor in EU" language="text/javascript">
          <call id="a55" endpoint="" a:alt_id="t14">
            <parameters>
              <label>DPO Review - GDPR Alignment</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
        </alternative>
        <alternative condition="Vendor in APAC" language="text/javascript">
          <call id="a57" endpoint="" a:alt_id="t15">
            <parameters>
              <label>Attach Logistics Riders</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
        </alternative>
        <alternative condition="Liability &gt; $1M" language="text/javascript">
          <call id="a59" endpoint="" a:alt_id="t16">
            <parameters>
              <label>Escalate to General Counsel</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
        </alternative>
      </choose>
      <call id="a67" endpoint="" a:alt_id="t17">
        <parameters>
