    id=\"sid-99DC1CC9-AD54-41FE-BA99-BBFCB0A1792D\" textFormat=\"text/plain\">\n      <text>ID6</text>\n
    \   </textAnnotation>\n    <textAnnotation id=\"sid-9CB103FC-4135-44AE-B4F6-3C1116CCC0FD\"
    textFormat=\"text/plain\">\n      <text>ID1: Was passiert wenn sich kein Bewerber
    gemeldet hat? --&gt; Anpassen der Stellenausschreibung, löschen dieser? \nID2:
    Die Bewerbung soll auch archiviert werden, jedoch mit Status \"bei Eingang abgelehnt\"\nID3:
    Die Informationen wann welcher Bewerber eingeladen wurde, soll bitte im Tool erfasst
    werden.\nID4: Müssen hier die Bewerbungs-unterlagen zurückgesendet werden?\nID5:
    Müssen hier die Bewerbungsunterlagen zurückgesendet werden?\nID6: kann der Bewerber
    auch \"geparkt\" werden, wenn weitere Gespräche folgen? wenn ja, wie soll das
    geschehen?\nID7: Was passiert wenn der Teilnehmer nicht erscheint?\nID8: Müssen
    hier die Bewerbungsunterlagen zurückgesendet werden?\nID9: Wie laufen jetzt alle
    anderen Bewerbungsgespräche? Werden die neu gestartet? \nID10: Muss jetzt die
    Stelle offline genommen werden?\nID11: Wie funktioniert das genau? Prozesskopplung
    zu Management Bewerbungsgespräche?\nID12: Soll IT-unterstützt laufen, gemäß vordefiniertem
    Template\nID13: Vorgabe wie das Filtern von statten gehen soll?! --&gt; Business
    Rules</text>\n    </textAnnotation>\n    <textAnnotation id=\"sid-9FBF1EA9-75EA-44B0-8B16-9F82808B0566\"
    textFormat=\"text/plain\">\n      <text>Annahmen:\n- alle Bewerbungen gehen über
    Personal ein.\n- unvollständige Bewerbungen werden nicht verfolgt bzw. nach einer
    Frist verworfen\n- Es wurden nur Bewerber eingeladen, da aus Personalsicht inhaltlich
    geprüft sind. (z.B. müssen die Bewerbungen vollständig sein!)</text>\n    </textAnnotation>\n
    \   <textAnnotation id=\"sid-CC64D413-A2EA-438C-B0FE-27F814C0C97B\" textFormat=\"text/plain\">\n
    \     <text>Fehlt noch:\n- Teilnehmer kann rückmelden, dass er Bewerbung zurückzieht\n-
    Teilnehmer kann rückmelden, dass er Bewerbungsgespräch nicht wahrnehmen kann (komplette
    Absage oder neuen Termin vereinbaren)\n- Verwendung von Daten ist nicht konsistent
    im Modell eingezeichnet\n- Klärung der offenen ToDos direkt im Diagramm</text>\n
