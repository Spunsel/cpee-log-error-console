  cpee:change_uuid: ea42ed496861a40f3d09390fbde7ff6762708797
  cpee:exposition: |-
    %% Output Intermediate
    ```mermaid
    flowchart LR
        se:startevent:((startevent)) --> t1:task:(Submit Purchase Requisition)
        t1 --> eg1:exclusivegateway:{x}
        eg1 --> |Value < $5,000| t2:task:(Department Manager Approval)
        eg1 --> |$5,000 < Value < $50,000| t3:task:(Regional Controller Review)
        eg1 --> |Value > $50,000| t4:task:(CFO Approval - CapEx-Critical)
        t2 --> mg1:exclusivegateway:{x}
        t3 --> mg1
        t4 --> mg1
        mg1 --> t5:task:(Determine Preferred Vendor)
        t5 --> eg2:exclusivegateway:{x}
        eg2 --> |Existing Vendor| t6:task:(Check MSA Validity)
        eg2 --> |New Vendor| t7:task:(Issue RFP)
        t6 --> eg3:exclusivegateway:{x}
        eg3 --> |MSA Expires within 90 days| t8:task:(Renewal Negotiation Workflow)
        eg3 --> |MSA Valid| mg2:exclusivegateway:{x}
        t7 --> t9:task:(Vendor Onboarding Protocol)
        t9 --> pg1:parallelgateway:{AND}
        pg1 --> t10:task:(Legal Verification)
        pg1 --> t11:task:(InfoSec Assessment)
        pg1 --> t12:task:(Finance Credit Risk Analysis)
        t10 --> pg2:parallelgateway:{AND}
        t11 --> pg2
        t12 --> pg2
        pg2 --> mg2
        t8 --> mg2
        mg2 --> t13:task:(Contract Negotiation)
        t13 --> eg4:exclusivegateway:{x}
        eg4 --> |Vendor in EU| t14:task:(DPO Review - GDPR Alignment)
        eg4 --> |Vendor in APAC| t15:task:(Attach Logistics Riders)
        eg4 --> |Liability > $1M| t16:task:(Escalate to General Counsel)
        t14 --> mg3:exclusivegateway:{x}
        t15 --> mg3
        t16 --> mg3
        mg3 --> t17:task:(Purchase Order Issuance)
        t17 --> t18:task:(Verify ISO Certification)
        t18 --> t19:task:(Transmit PO via EDI)
        t19 --> t20:task:(Reserve Inventory Slot)
        t20 --> t21:task:(Encumbrance Notification)
        t21 --> ee:endevent:(((endevent)))
    ```
  time:timestamp: '2025-12-11T13:51:25.189516+01:00'
