    4.Â Â  The term of office of the members of the Executive Board shall be four years. That term shall be renewable.

    5.Â Â  The Executive Board shall meet at least once every three months. The Chairperson of the Executive Board shall convene additional meetings at the request of its members.

    6.Â Â  The Management Board shall lay down the rules of procedure of the Executive Board.
