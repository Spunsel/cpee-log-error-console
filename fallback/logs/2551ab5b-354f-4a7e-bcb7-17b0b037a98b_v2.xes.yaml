event:
  concept:instance: 5898
  id:id: external
  cpee:activity: external
  cpee:instance: 2551ab5b-354f-4a7e-bcb7-17b0b037a98b
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 957345e8d775921d44b7dc4a584a026d0e8b708a
  cpee:exposition: |+
    # User Input:
    Process description: 

    You want to build a tree house. First you collect your requirements, and send
    them to a tree house architect. The architect sends you back a draft, which
    you refine multiple times with additional requirements. You then create the
    list of needed materials from the plan. These materials fall into several categories,
    you order them from several online stores. While the order is processed, you send messages
    to several of your friends to build the house. After the house is built, you send invitations
    for a tree house party to your friends. In order to buy the snacks for the party, a list
    of people that attend the party is created.
    Additional Information: 
    The Mermaid.js syntax for BPMN models is described as follows:
    Each mermaid ja node must have the following structure:
    id:type:shape and text
    id � it is a unique identifier, Id can be only an integer from n to n.
    Each node has a unique identifier
    type � defines the type of element regarding to BPMN 2.0 notation.
    possible types are: 
    start event, end event, task, subprocess, exclusive, inclusive and parallel gateway.
    Based on the type of the node following shapes and texts are to be used:
    startevent:((startevent)) i.e., id:startevent:((startevent))
    endevent:((endevent)) i.e., endevent:((endevent))
    task:(task label) i.e., id:task:(task label)
    subprocess:(subprocess label) i.e., id:subprocess:(subprocess label)
    exclusivegateway:{x} i.e., id:exclusivegateway:{x}
    parallelgateway:{AND} i.e., id:parallelgateway:{AND}
    inclusvegateway:{O} i.e., id: inclusvegateway:{O}

    All gateways must have both a split and a merge point.
    Each gateway that initiates a split must be properly closed by a merge gateway of the same type (e.g., an exclusive gateway must be merged by another exclusive gateway).
    It is strictly prohibited to use inly id (i.e. 2) as a reference.
    All elements are connected with each other with the help of the direction.
    If there are some conditions or annotations it is necessary to use text on links (i.e., edge labels) edge label: |condition or annotation|
    Edge label is always located between 2 nodes :
    id:exclusivegateway:{x} --> |condition or annotation|id:task:(tasklabel)
    Return only mermaid.js as text without any additional information!
    Give me just the raw Mermaid.js code without mardown formatting.
    Example of mermaid.js:
    flowchart LR
      0:startevent:((startevent)) --> 1:task:(task A)
      1:task: --> 2:exclusivegateway:{x}
      2:exclusivegateway: --> 3:task:(task B)
      2:exclusivegateway: --> 4:task(task C)
      3:task: --> 5:exclusivegateway:{x}
      4:task --> 5:exclusivegateway:
      5:exclusivegateway: --> 6:task:(task D)
      6:task: --> 7:endevent:((endevent))

    Your task: 
    Output a valid mermaid.js diagram showing the sequence of tasks and events in the description above. 

  time:timestamp: '2025-11-04T19:49:31.790715+01:00'
...
