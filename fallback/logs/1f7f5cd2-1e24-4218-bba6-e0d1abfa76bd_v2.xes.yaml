  cpee:change_uuid: cb8ca227a681807372cb2fb7836a8414d7a077cf
  cpee:exposition: |-
    # User Input:
    Exchange of health data before a transfer is carried out
    1 For the sole purpose of the provision of medical care or treatment concerning disabled persons, elderly people, pregnant women, minors and persons who have been subject to torture, rape or other serious forms of psychological, physical and sexual violence, the transferring Member State shall, in so far as who is available to the competent authority IAW national law, transmit to the Member State responsible information on any special needs of the person to be transferred by corresponding authority , which in specific cases may include information on that person’s physical or mental health.
    That information shall be transferred by corresponding authority in a common health certificate with the necessary documents attached.
    The Member State responsible shall ensure that those special needs are adequately addressed by Member State , including any essential medical care that may be required by Member State.
    The Commission shall draw up the common health certificate.
    Those implementing acts shall be adopted by Commission IAW the examination procedure laid down.
    2 The transferring Member State shall only transmit the information referred to in to the Member State responsible after having obtained the explicit consent of the applicant and/or of his or her representative OR, if the applicant is physically or legally incapable of giving his or her consent, when such transmission is necessary to protect the vital interests of the applicant or of another person.
    The lack of consent, including a refusal to consent, shall not constitute an obstacle to the transfer.
    3 The processing of personal health data referred to in shall only be carried out by a health professional.
    4 The exchange of information under this Article shall only take place between the health professionals or other persons referred.
    The information exchanged shall only be used by Commission for the purposes set out in AND shall not be further processed by Commission.
    5 The Commission shall adopt uniform conditions and practical arrangements for exchanging the information referred to in of this Article.
    Those implementing acts shall be adopted by Commission IAW the examination procedure laid down.
    6 The rules laid down in to (12) shall apply to the exchange of information pursuant to this Article.
  time:timestamp: '2026-05-15T14:44:43.530118+02:00'
