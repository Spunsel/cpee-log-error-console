event:
  concept:instance: 77526
  id:id: external
  cpee:activity: external
  cpee:instance: 869ad6cf-d719-4e7d-8d68-d5dfb5ec0869
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: aa8b9136fd069e0671d1a54eac4a9cea25017f97
  cpee:exposition: "# User Input:\nAn einem schönen Herbsttag radelt Lothar zum Sport.
    In der Würzburger Innenstadt gerät er wegen einer kurzen Unaufmerksamkeit mit
    dem Vorderrad in die Straßenbahnschienen und stürzt auf sein rechtes Handgelenk.
    Er kann es kaum mehr bewegen und merkt, dass etwas nicht stimmt. Deshalb entscheidet
    er sich dazu, zu seiner Hausärztin zu fahren.\r\nSeine Hausärztin führt eine kurze
    Anamnese und körperliche Untersuchung durch. Die Ergebnisse dokumentiert Sie auf
    der Papier-Patientenakte von Lothar. Das Handgelenk ist nur leicht geschwollen
    und die Hausärztin vermutet lediglich eine Prellung. Da Lothar außerdem eine Schürfwunde
    am Kniegelenk hat, fragt die Hausärztin den Tetanusstatus ab. Lothar muss gestehen,
    dass er seinen Impfpass verloren und sich nicht erinnern kann, wann die letzte
    Impfung stattgefunden hat. Es erfolgt daher eine Auffrischimpfung und die Ausstellung
    eines neuen Impfasses in Papierform. Zum Ausschluss einer Fraktur des rechten
    Handgelenks stellt sie Lothar eine Überweisung zum Röntgen aus.\r\nLothar telefoniert
    den gesamten Nachmittag herum und findet schließlich eine radiologische Praxis,
    die ihn für einen Termin am kommenden Tag einschieben kann. Dort angekommen werden
    Informationen, wie Vorerkrankungen, vorherige radiologische Untersuchungen, Medikation
    und Allergien abgefragt. Das Röntgenbild des Handgelenks wird in zwei Ebenen durchgeführt.
    Da in der Praxis viel los ist, werden Lothar die Röntgenbilder auf CD mitgegeben
    und ihm mitgeteilt, dass der Radiologe sich beim ihm telefonisch melden werde,
    wenn etwas auffällig sei. Die Hausärztin werde den Befund in den kommenden Tagen
    per Post erhalten. Am selben Nachmittag erhält Lothar einen Anruf vom Radiologen,
    dass er einen nicht verschobenen Bruch der Speiche habe. Der Radiologe empfiehlt
    ihm sich am selben Tag in einer unfallchirurgischen Klinik vorzustellen.\r\nLothar
    entscheidet sich direkt in der städtischen Klinik vorzustellen. Dort angekommen
    wartet Lothar mehrere Stunden in der Notaufnahme. Während der Wartezeit beantwortet
    Lothar seine Arbeitsemails und schaut einen Film auf dem Handy. Als er aufgerufen
    wird erhebt der Unfallchirurg erneut die Anamnese mit Abfrage von Vorerkrankungen,
    Medikation und Allergien. Er fragt auch den Tetanusschutz ab und Lothar kann stolz
    seinen neuen Impfausweis präsentierten. Lothar nimmt Medikamente ein, weiß aber
    nicht welche. Der junge Unfallchirurg ruft in der Praxis der Hausärztin an, aber
    diese ist bereits geschlossen. \r\nDie Röntgenbilder auf der CD können nicht geöffnet
    werden, aber Lothar hat die Bilder zum Glück mit seinem Handy abfotografiert.
    Der junge Arzt ist sich nicht sicher, ob eine OP erforderlich ist. Da es schon
    spät ist und die einzige Oberärztin im Haus am OP feststeht wird der Arm eingegipst
    und der Unfallchirurg empfiehlt Lothar sich am Folgetag wieder vorzustellen, um
    abzuklären, ob eine Indikation zur OP besteht. Lothar wird gebeten eine neue CD
    mit den Röntgenbildern mitzubringen. Lothar erhält ein Rezept für Schmerzmittel
    und eine Arbeitsunfähigkeitsbescheinigung für vier Wochen.\r\nAm Folgetag geht
    Lothar um 08:00 Uhr zur radiologischen Praxis und lässt sich eine neue CD ausstellen.
    Anschließend begibt er sich wieder in die Klinik. Hier wartet Lothar wieder mehrere
    Stunden, bis er aufgerufen wird. In dieser Zeit bestellt Lothar online ein Geschenk
    für sein Patenkind und storniert in einer App sein Hotel für den eigentlich geplanten
    Kletterurlaub.\r\nAls er endlich aufgerufen wird, ist eine andere Ärztin da und
    sie erhebt erneut eine Anamnese. Die CD ist diesmal zum Glück einlesbar. Der Medikationsplan
    kann per Fax von der Hausärztin angefordert werden. Die Oberärztin der Unfallchirurgie
    stellt die Indikation zur OP. Sie stellt jedoch fest, dass der Abstand zwischen
    dem Mond- und Kahnbein vergrößert ist. Sie fragt Lothar, ob das bekannt sei, da
    es ein Hinweis für eine SL-Bandverletzung sei. Wenn er ältere Röntgenbilder habe,
    könne man das ebenfalls beurteilen. Lothar gibt an, dass er vor vielen Jahren
    mal eine Verletzung am rechten Handgelenk hatte, aber nicht mehr wisse, was genau
    war. Röntgenbilder wurden zwar gemacht, aber die hab er nicht. Es wird beschlossen
    ein MRT zu machen, um eine Verletzung des SL-Bandes vor einer OP auszuschließen.
    Es ist mittlerweile sehr spät und Lothar kann seine AU nicht mehr bei seinem Arbeitgeber
    abgegeben. Zum Glück ist der nächste Termin für ein MRT erst zwei Tage später
    und Lothar hat genug Zeit seine AU abzugeben.\r\nAm Tag des MRTs kommt Lothar
    in die Radiologie. Da er einen Termin hat muss er nicht lange warten. Erneut werden
    Vorerkrankungen, Voraufnahmen und Allergien abgefragt. Die Radiologin weiß, dass
    eine OP ansteht und ruft nach Durchsicht der Bilder die unfallchirurgische Oberärztin
    an, um ihr zu sagen, dass es sich um eine alte Verletzung handele. Lothar kommt
    noch am selben Tag in die unfallchirurgische Sprechstunde und der OP-Termin wird
    für den kommenden Montag vereinbart.\r\nLothar muss sich nun in der Anästhesie
    zum Aufklärungsgespräch begeben. Hier muss er, gefühlt zum tausendsten Mal, Fragen
    zu Vorerkrankungen, Medikation und Allergien beantworten. Auch bei Vorstellung
    auf der Station muss er dieselben Informationen bei der Pflege angeben.\r\nAm
    OP-Tag stellt sich Lothar um 06:30 auf der Station vor. Der Stationsarzt wartet
    schon ganz aufgeregt, da er festgestellt hat, dass die ausgedruckte OP-Aufklärung
    verloren gegangen ist. Er teilt Lothar mit, dass ohne Aufklärung keine OP stattfinden
    kann, da eine tagesgleiche Aufklärung rechtlich nicht zulässig ist. Lothar ist
    jedoch vorbereitet und kann seine Kopie von der Aufklärung vorzeigen und der Stationsarzt
    ist erleichtert.\r\nDer weitere Ablauf bis zur OP verläuft ohne Besonderheiten.
    In der Einleitung im OP wird es jedoch hektisch, nachdem das Lokalanästhetikum
    für die Plexus Anästhesie gegeben wurde. Lothar erleidet einen anaphylaktischen
    Schock und das Team der Anästhesie benötigt einige Minuten, um ihn zu stabilisieren.
    Letztlich wird eine Vollnarkose durchgeführt und die weitere Operation verläuft
    komplikationslos.\r\nNach jeweils einer Nacht auf Intensiv- und Normalstation
    kann Lothar entlassen werden. Ihm wird ein ausgedruckter Allergiepass für das
    Anästhetikum mitgegeben. Im Entlassgespräch wird die Nachbehandlung besprochen.
    Aufgrund von Personalmangel ist der Entlassbrief noch nicht fertig und muss postalisch
    an die Hausärztin geschickt werden.\r\nDie weiteren Wundkontrollen und der Fadenzug
    erfolgen bei der Hausärztin. Sie stellt außerdem Rezepte für Schmerzmittel und
    Physiotherapie aus. Auf dem Weg zur Apotheke muss Lothar feststellen, dass er
    das Rezept für Medikamente verloren hat. Die Hausarztpraxis hat mittlerweile wieder
    geschlossen, also kauft er sich frei verkäufliche Schmerzmittel.\r\nLothar sucht
    im Internet nach Physiotherapiepraxen. Erst die zwölfte Praxis kann ihm überhaupt
    einen Termin anbieten- in vier Wochen. Lothar schaut sich bis dahin YouTube Videos
    zu Übungen nach distalen Radiusfrakturen an und übt selbstständig.\r\nVier Wochen
    später stellt sich Lothar in der Physiotherapeutischen Praxis vor. Die erfahrene
    Physiotherapeutin fragt Lothar, ob er den Nachbehandlungsplan mitgebracht habe.
    Den hat er natürlich noch nicht bei der Hausärztin abgeholt⬦\r\n\n"
  time:timestamp: '2025-12-01T15:51:26.969997+01:00'
