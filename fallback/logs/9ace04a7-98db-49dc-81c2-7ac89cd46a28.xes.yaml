event:
  concept:instance: 83110
  id:id: external
  cpee:activity: external
  cpee:instance: 9ace04a7-98db-49dc-81c2-7ac89cd46a28
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: da68f2c0919523f06af3dd333d015c7162dd1262
  cpee:exposition: |+
    # User Input:
    Ziel: Spaghetti Napoli kochen für zwei Personen, Zeitbedarf ca. 30 Minuten
    Folgende Zutaten werden benötigt: 2 Dosentomaten (2 Dosen à 250 Gramm, gehackt), jeweils eine Prise Salz, Pfeffer, Kräuter (Oregano), Tomatenmark (2 Esslöffel), �l (2 Esslöffel), Zwiebel (eine kleine Zwiebel), Knoblauch (1 Zehe), Nudeln (Spaghetti, 250 Gramm).
    Folgende Utensilien werden benötigt: Kochtopf für 2 Liter (Nudeln), Kochtopf für Soße für 1 Liter, Rührlöffel, Schneidemesser, Nudelsieb, Pastateller, Besteck (Gabel, Löffel), Servietten, Gläser
    In der Küche
    Für die Zubereitung der Soße werden die Zwiebeln und der Knoblauch fein gehackt und in �l im Kochtopf angedünstet. Tomatenmark hinzufügen und mit andünsten. Mit den gehackten Tomaten aus der Dose auffüllen und würzen (Salz, Pfeffer, Kräuter). Die Soße 30 Minuten bei niedriger Hitze köcheln, ggf nach dieser Zeit nachwürzen oder pürieren (je nach Geschmack). In der Zwischenzeit im Nudeltopf 2 Liter Wasser leicht salzen und zum Kochen bringen. Nudeln nach Anweisung (je nach Herstellerangaben auf der Verpackung) kochen. Nach Kochzeit absieben. Nudeln (je nach Belieben) nochmals in Butter schwenken. 

    Servieren am Tisch
    Tisch mit 2 Pastatellern, Besteck (2x Gabel und 2x Löffel), Gläser, Servietten decken. Nudeln in Schüssel mit Nudelzange versehen und auf den Tisch stellen.
    Soße in Schüssel mit Schöpflöffel auf den Tisch stellen. 



  time:timestamp: '2025-12-10T10:39:54.013932+01:00'
...
