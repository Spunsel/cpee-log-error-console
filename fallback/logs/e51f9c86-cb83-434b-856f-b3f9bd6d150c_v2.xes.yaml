    ```mermaid
    graph LR
      0:startevent:((startevent)) --> 1:task:(Receive Credit Request)
      1:task:(Receive Credit Request) --> 2:task:(Review Request Details)
      2:task:(Review Request Details) --> 3:parallelgateway:{AND}
      3:parallelgateway:{AND} --> 4:task:(Evaluate Financial Risk)
      3:parallelgateway:{AND} --> 5:task:(Determine Credit Terms)
      5:task:(Determine Credit Terms) --> 6:exclusivegateway:{x}
      6:exclusivegateway:{x} --> 7:task:(Calculate Standard Terms) |Standard Terms|
      6:exclusivegateway:{x} --> 8:task:(Prepare Custom Terms) |Special Consideration|
      7:task:(Calculate Standard Terms) --> 9:exclusivegateway:{x}
      8:task:(Prepare Custom Terms) --> 9:exclusivegateway:{x}
      9:exclusivegateway:{x} --> 10:task:(Prepare Contract)
      4:task:(Evaluate Financial Risk) --> 11:parallelgateway:{AND}
      10:task:(Prepare Contract) --> 11:parallelgateway:{AND}
      11:parallelgateway:{AND} --> 12:task:(Send Quote to Customer)
      12:task:(Send Quote to Customer) --> 13:endevent:(((endevent)))
    ```
  time:timestamp: '2025-10-28T09:33:44.398051+01:00'
