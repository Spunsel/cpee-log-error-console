  cpee:change_uuid: 7ce24122e68e29dd2c2f4aba5f7625a94e2b2e9c
  cpee:exposition: |-
    %% Output Intermediate
    Based on the provided modifications, it seems like you want to add a condition to the process model to check if the display of consumption time series is permitted. Here is the updated Mermaid.js code:

    ```mermaid
    flowchart LR
    se:startevent:((startevent))-->gw1s:exclusivegateway:{x}
    gw1s:exclusivegateway:{x}-->|"Check permission"|a1:task:(Check if display is permitted)
    a1:task:(Check if display is permitted)-->gw2s:exclusivegateway:{x}
    gw2s:exclusivegateway:{x}-->|"Permission granted"|a3:task:(Activate consumption time series display)
    a3:task:(Activate consumption time series display)-->a7:task:(Notify network operator)
    a7:task:(Notify network operator)-->gw1e:exclusivegateway:{x}
    gw2s:exclusivegateway:{x}-->|"Permission denied"|a5:task:(Deactivate consumption time series display)
    a5:task:(Deactivate consumption time series display)-->a9:task:(Inform network operator)
    a9:task:(Inform network operator)-->gw1e:exclusivegateway:{x}
    gw1e:exclusivegateway:{x}-->ee:endevent:((endevent))
    ```

    In this updated model, after the start event, the process checks if the display of consumption time series is permitted. If permission is granted, the process activates the display and notifies the network operator. If permission is denied, the process deactivates the display and informs the network operator. The process then ends.
  time:timestamp: '2025-12-30T11:20:40.635376+01:00'
