  cpee:exposition: |-
    %% Output Intermediate
    ```mermaid
    graph LR
    0:startevent:((startevent)) --> 1:exclusivegateway:{x}
    1:exclusivegateway:{x} --> |Activate display| 2:task:(Activate consumption time series display)
    1:exclusivegateway:{x} --> |Deactivate display| 3:task:(Deactivate consumption time series display)
    2:task:(Activate consumption time series display) --> 4:task:(Notify network operator)
    3:task:(Deactivate consumption time series display) --> 5:task:(Inform network operator)
    4:task:(Notify network operator) --> 6:endevent:(((endevent)))
    5:task:(Inform network operator) --> 6:endevent:(((endevent)))
    ```

    This model represents the described business process. It starts with the customer's decision to either activate or deactivate the consumption time series display on the meter. Depending on the decision, the corresponding task is performed and the network operator is notified. The process ends after the network operator has been informed.
