event:
  concept:instance: 8802
  id:id: ex-ante
  cpee:instance: 702dcb5b-23e0-41f1-a496-5659924a6278
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 0d4951d680bdaeb4e89204a916d73ab02443119c
  cpee:exposition: |-
    # User Input:
    Ein Nachteilsausgleichsverfahren beginnt damit, dass eine Studierende oder ein Studierender den Bedarf erkennt und einen entsprechenden Antrag stellt. Dieser Antrag wird zusammen mit einem Attest spätestens zu Beginn der Prüfungsanmeldephase per E-Mail an die zuständige Schriftführung gesendet. Dabei kann der konkrete Adressat je nach School variieren.

    Nach Eingang des Antrags übernimmt die Schriftführung des Prüfungsausschusses die formale Prüfung. Dabei wird überprüft, ob alle erforderlichen Unterlagen vollständig vorliegen und ob die Angaben glaubhaft sind. Diese Prüfung erfolgt unmittelbar nach Erhalt des Antrags und bildet die Grundlage für alle weiteren Schritte.

    Ist der Antrag formal korrekt, folgt die inhaltliche Prüfung. Diese liegt in der Verantwortung des Prüfungsausschussvorsitzenden, wird jedoch häufig in enger Abstimmung mit der Schriftführung durchgeführt. Ziel dieses Schrittes ist es, über die konkrete Ausführungsform des Nachteilsausgleichs zu entscheiden.

    Im Anschluss an die inhaltliche Entscheidung erfolgt die Verbescheidung. Die Schriftführung erstellt einen Bescheid, der den Studierenden per E-Mail übermittelt wird. Je nach Fall kann dieser eine Rechtsbehelfsbelehrung enthalten. Es wird zudem erwogen, diese standardmäßig beizufügen, um rechtliche Klarheit zu schaffen.

    Parallel dazu führt die Schriftführung fortlaufend eine Liste über alle genehmigten Nachteilsausgleiche. Diese wird aktuell in Form einer Excel-Datei auf einem NAS-Laufwerk gepflegt. Perspektivisch könnte dieser Schritt durch automatisierte Benachrichtigungen, etwa über Outlook, unterstützt werden.

    Sobald die Studierenden ihre Prüfungen planen, informieren sie die Schriftführung per E-Mail über die konkret vorgesehenen Prüfungen. Dies muss vor dem Ende der Prüfungsanmeldephase erfolgen und dient als Grundlage für die weitere Organisation.

    Nach Ablauf der Anmeldephase werden alle relevanten Nachteilsausgleiche von der Schriftführung manuell in einer Excel-Tabelle zusammengeführt. Auf dieser Basis erfolgt die Information der Prüfenden, ebenfalls per E-Mail. Dabei wird diskutiert, ob diese Form der Informationsweitergabe datenschutzrechtlich unbedenklich ist, insbesondere wenn alle Prüfenden Einblick in sämtliche Nachteilsausgleiche erhalten, ohne dass Studierende eine Auswahl pro Prüfung treffen können.

    Die Prüfenden übernehmen daraufhin die organisatorische Umsetzung. Dazu gehören unter anderem die Buchung zusätzlicher Räume, die Einteilung von Aufsichtspersonal sowie die Bereitstellung technischer Unterstützung. Diese Maßnahmen müssen rechtzeitig vor der jeweiligen Prüfung erfolgen.

    Ergänzend dazu nehmen die Studierenden bis spätestens 14 Tage vor der Prüfung eigenständig Kontakt zu den Prüfenden auf, um den Nachteilsausgleich abzustimmen. In der dafür vorgesehenen Standard-E-Mail sind die Pflichten der Studierenden bereits enthalten.

    Abschließend informieren die Prüfenden die Studierenden über die konkreten Prüfungsmodalitäten sowie den Prüfungsraum. Diese Information erfolgt ebenfalls per E-Mail und stellt sicher, dass alle Beteiligten optimal vorbereitet sind. 
  time:timestamp: '2026-04-07T16:25:06.954465+02:00'
