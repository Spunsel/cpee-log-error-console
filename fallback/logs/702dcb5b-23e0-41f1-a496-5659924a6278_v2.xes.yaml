    Ein Nachteilsausgleichsverfahren beginnt damit, dass eine Studierende oder ein Studierender den Bedarf erkennt und einen entsprechenden Antrag stellt. Dieser Antrag wird zusammen mit einem Attest spÃ¤testens zu Beginn der PrÃ¼fungsanmeldephase per E-Mail an die zustÃ¤ndige SchriftfÃ¼hrung gesendet. Dabei kann der konkrete Adressat je nach School variieren.

    Nach Eingang des Antrags Ã¼bernimmt die SchriftfÃ¼hrung des PrÃ¼fungsausschusses die formale PrÃ¼fung. Dabei wird Ã¼berprÃ¼ft, ob alle erforderlichen Unterlagen vollstÃ¤ndig vorliegen und ob die Angaben glaubhaft sind. Diese PrÃ¼fung erfolgt unmittelbar nach Erhalt des Antrags und bildet die Grundlage fÃ¼r alle weiteren Schritte.

    Ist der Antrag formal korrekt, folgt die inhaltliche PrÃ¼fung. Diese liegt in der Verantwortung des PrÃ¼fungsausschussvorsitzenden, wird jedoch hÃ¤ufig in enger Abstimmung mit der SchriftfÃ¼hrung durchgefÃ¼hrt. Ziel dieses Schrittes ist es, Ã¼ber die konkrete AusfÃ¼hrungsform des Nachteilsausgleichs zu entscheiden.

    Im Anschluss an die inhaltliche Entscheidung erfolgt die Verbescheidung. Die SchriftfÃ¼hrung erstellt einen Bescheid, der den Studierenden per E-Mail Ã¼bermittelt wird. Je nach Fall kann dieser eine Rechtsbehelfsbelehrung enthalten. Es wird zudem erwogen, diese standardmÃ¤ÃŸig beizufÃ¼gen, um rechtliche Klarheit zu schaffen.

    Parallel dazu fÃ¼hrt die SchriftfÃ¼hrung fortlaufend eine Liste Ã¼ber alle genehmigten Nachteilsausgleiche. Diese wird aktuell in Form einer Excel-Datei auf einem NAS-Laufwerk gepflegt. Perspektivisch kÃ¶nnte dieser Schritt durch automatisierte Benachrichtigungen, etwa Ã¼ber Outlook, unterstÃ¼tzt werden.

    Sobald die Studierenden ihre PrÃ¼fungen planen, informieren sie die SchriftfÃ¼hrung per E-Mail Ã¼ber die konkret vorgesehenen PrÃ¼fungen. Dies muss vor dem Ende der PrÃ¼fungsanmeldephase erfolgen und dient als Grundlage fÃ¼r die weitere Organisation.

    Nach Ablauf der Anmeldephase werden alle relevanten Nachteilsausgleiche von der SchriftfÃ¼hrung manuell in einer Excel-Tabelle zusammengefÃ¼hrt. Auf dieser Basis erfolgt die Information der PrÃ¼fenden, ebenfalls per E-Mail. Dabei wird diskutiert, ob diese Form der Informationsweitergabe datenschutzrechtlich unbedenklich ist, insbesondere wenn alle PrÃ¼fenden Einblick in sÃ¤mtliche Nachteilsausgleiche erhalten, ohne dass Studierende eine Auswahl pro PrÃ¼fung treffen kÃ¶nnen.

    Die PrÃ¼fenden Ã¼bernehmen daraufhin die organisatorische Umsetzung. Dazu gehÃ¶ren unter anderem die Buchung zusÃ¤tzlicher RÃ¤ume, die Einteilung von Aufsichtspersonal sowie die Bereitstellung technischer UnterstÃ¼tzung. Diese MaÃŸnahmen mÃ¼ssen rechtzeitig vor der jeweiligen PrÃ¼fung erfolgen.

    ErgÃ¤nzend dazu nehmen die Studierenden bis spÃ¤testens 14 Tage vor der PrÃ¼fung eigenstÃ¤ndig Kontakt zu den PrÃ¼fenden auf, um den Nachteilsausgleich abzustimmen. In der dafÃ¼r vorgesehenen Standard-E-Mail sind die Pflichten der Studierenden bereits enthalten.

    AbschlieÃŸend informieren die PrÃ¼fenden die Studierenden Ã¼ber die konkreten PrÃ¼fungsmodalitÃ¤ten sowie den PrÃ¼fungsraum. Diese Information erfolgt ebenfalls per E-Mail und stellt sicher, dass alle Beteiligten optimal vorbereitet sind.Â 
