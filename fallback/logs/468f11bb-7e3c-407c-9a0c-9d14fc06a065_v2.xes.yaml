event:
  concept:instance: 9163
  id:id: ex-ante
  cpee:instance: 468f11bb-7e3c-407c-9a0c-9d14fc06a065
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 71c08705861cd98ad487f4cb095abd5e1e7be8f0
  cpee:exposition: |-
    # User Input:
    The loan application process describes the sequence of activities through which a financial institution evaluates and decides on Customers upload their complaint via an online form. The form contains the insurance number, the amount of damage, and a description of the damage. If the amount of damage is ≤ 100 Euro, an automatic plausibility check is conducted and the complaint is approved. The customer is informed via email and the money transfer is initiated. If the damage amount is above 100 Euro, a clerk checks the complaint. The customer is informed on the decision via email. If the complaint is rejected, the customer is offered an optional meeting. 
  time:timestamp: '2026-04-13T10:40:42.392935+02:00'
