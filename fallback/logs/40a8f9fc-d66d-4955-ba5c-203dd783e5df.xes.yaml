  concept:instance: 83131
  id:id: external
  cpee:activity: external
  cpee:instance: 40a8f9fc-d66d-4955-ba5c-203dd783e5df
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 7b7f886ca6eed0f472335c44b59a181c707e1348
  cpee:exposition: |-
    # User Input:
    der prozess startet mit der eigentlichen anfrage.
    anschließend wird die anfrage vom Datenschutzbeauftragten geprüft. Wenn die Prüfung anzeigt, dass Dokumente fehlen, frag bitte beim Antragsteller erneut nach. Dann wird erneut überprüft.
    Wenn alle notwendigen Informationen da sind, muss eine Antwort in Form eines Votums verfasst werden. Der Fall wird anschließend dokumentiert und archiviert.
  time:timestamp: '2025-12-10T14:36:25.940523+01:00'
