  cpee:exposition: |-
    # User Input:
    der prozess startet mit der eigentlichen anfrage.anschließend wird die anfrage vom Datenschutzbeauftragten geprüft. Wenn die Prüfung anzeigt, dass Dokumente fehlen, frag bitte beim Antragsteller erneut nach. Dann wird erneut überprüft.Wenn alle notwendigen Informationen da sind, muss eine Antwort in Form eines Votums verfasst werden. Der Fall wird anschließend dokumentiert und archiviert.
  time:timestamp: '2025-12-10T14:40:51.533172+01:00'
