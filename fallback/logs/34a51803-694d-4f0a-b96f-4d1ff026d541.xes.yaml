  cpee:exposition: |-
    # User Input:
    Source-to-Pay (S2P) � Beispielhafte Prozessbeschreibung

    Der Source-to-Pay-Prozess umfasst den gesamten Beschaffungszyklus eines Unternehmens, von der Bedarfsermittlung bis zur Bezahlung des Lieferanten. Er gliedert sich typischerweise in folgende Phasen:

    1. Bedarfsermittlung und Sourcing Der Prozess beginnt, wenn eine Fachabteilung einen Bedarf an Waren oder Dienstleistungen meldet. Der Einkauf analysiert den Bedarf, definiert Anforderungen und Spezifikationen und identifiziert potenzielle Lieferanten am Markt. Dazu werden Lieferantendatenbanken, Marktanalysen und bestehende Rahmenverträge herangezogen.

    2. Ausschreibung und Angebotsvergleich Für den identifizierten Bedarf wird eine Ausschreibung (RFQ/RFP) an qualifizierte Lieferanten versendet. Die eingehenden Angebote werden anhand definierter Kriterien wie Preis, Qualität, Lieferzeit und Nachhaltigkeit bewertet und verglichen. Bei Bedarf finden Verhandlungsrunden statt.

    3. Lieferantenauswahl und Vertragsabschluss Auf Basis der Bewertung wird ein Lieferant ausgewählt. Die Vertragskonditionen � darunter Preise, Zahlungsbedingungen, Lieferfristen, Service-Level-Agreements und Haftungsregelungen � werden verhandelt und in einem Rahmen- oder Einzelvertrag festgehalten. Der Vertrag wird durch die zuständigen Stellen freigegeben.

    4. Bestellanforderung und Bestellung (BANF/PO) Die Fachabteilung erstellt eine Bestellanforderung (BANF), die einen definierten Genehmigungsworkflow durchläuft. Nach Freigabe wird daraus eine Bestellung (Purchase Order) generiert und an den Lieferanten übermittelt.

    5. Wareneingang und Leistungsbestätigung Bei Lieferung der Ware bzw. Erbringung der Dienstleistung erfolgt eine Prüfung auf Übereinstimmung mit der Bestellung hinsichtlich Menge, Qualität und Spezifikation. Der Wareneingang wird im System erfasst und dokumentiert. Bei Abweichungen wird ein Klärungsprozess mit dem Lieferanten angestoßen.

    6. Rechnungsprüfung und Freigabe Die eingehende Lieferantenrechnung wird gegen Bestellung und Wareneingang abgeglichen (3-Way-Match). Stimmen alle Daten überein, wird die Rechnung zur Zahlung freigegeben. Bei Abweichungen wird die Rechnung zur Klärung an den Einkauf oder die Fachabteilung zurückgeleitet.

    7. Zahlung Nach Freigabe wird die Zahlung gemäß den vereinbarten Zahlungsbedingungen veranlasst � unter Berücksichtigung möglicher Skontofristen. Die Buchung erfolgt in der Kreditorenbuchhaltung.

    8. Lieferantenbewertung und kontinuierliche Verbesserung Nach Abschluss des Vorgangs fließen Daten zu Liefertreue, Qualität und Zusammenarbeit in die Lieferantenbewertung ein. Diese Erkenntnisse bilden die Grundlage für zukünftige Sourcing-Entscheidungen und die strategische Weiterentwicklung der Lieferantenbasis.
