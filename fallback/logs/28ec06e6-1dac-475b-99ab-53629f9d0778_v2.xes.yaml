  concept:instance: 1314
  id:id: external
  cpee:activity: external
  cpee:instance: 28ec06e6-1dac-475b-99ab-53629f9d0778
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: c5c3dcc56d4df02a633a21ff8d34f9557f254b4d
  cpee:exposition: |+
    # User Input:
    Refinement:
    Correct the just created model regarding the following things. Don't change the rest of the model. You will find the corresponding graphical representation in the appendix:
    Things to be corrected:
    If the inspection is not satisfactory, the respective part should be ordered again
    It should be possible to order at least 5 different types of parts
    Updating the customer should take place in a loop until the first saw is done
    Label the XOR Gateways
    It should be possible to order at least 5 different types of parts

    Shorten the names of the functions.
    Updating the customer should happen parallel to building the first saw


    â€œCustomer likes first sawâ€ and â€œCustomer dislike first sawâ€ are no functions



    You produce custom chainsaws on demand. Your chainsaws have at least 5
    properties such as length of the "guide bar" (Schwertlaenge), chain width,
    electric or motor chainsaw. After your customer told you the properties, you
    can start ordering the parts from various online sources (in parallel). After
    the parts arrive you have to do a manual inspection of all parts, and then
    assemble the parts. During production, you regularly send updates to your
    customer. After producing the first saw you send it to your customer. If he
    likes it, the rest of his order are produced.

    The Mermaid.js syntax for BPMN models is described as follows:
    Â Each mermaid js node must have the following structure:
    Â id:type:shape and text
    Â id - it is a unique identifier. Id can be only an integer from 0 to n.
    Â Each node has a unique identifier
    type - defines the type of the element regarding to BPMN 2.0 notation.
    Possible types are:
    Â start event, end event, task, subprocess, exclusive, inclusive and parallel gateway.
    Â Based on the type of the node following shapes and texts are to be used:
    Â startevent: ((startevent)) i.e., id:startevent:((startevent))
    Â endevent: ((endevent)) i.e., id:endevent:((endevent))
    Â task: (task label) i.e., id:task:(task label)
    Â subprocess: (subprocess label) i.e., id:subprocess:(subprocess label)
    Â exclusivegateway: {X} i.e., id:exclusivegateway:{X}
    Â parallelgateway: {AND} i.e., id:parallelgateway:{AND}
    Â inclusivegateway: {O} i.e., id:inclusivegateway:{O}
    All gateways must have both a split and a merge point.
    Â Each gateway that initiates a split must be properly closed by a merge gateway of the same type (e.g., an exclusive gateway must be merged by another exclusive gateway).
    It is strictly prohibited to use only id (i.e. 2) as a reference.
    All elements are connected with each other with the help of the direction.
    Â direction: -->
    If there are some conditions or annotations it is necessary to use text on links (i.e., edge labels)
    Â edge label: | condition or annotation |
    Edge label is always located between 2 nodes:
    Â id:exclusivegateway:{x} --> | condition or annotation | id:task:(task label)
    Example (follow this structure strictly):


    0:startevent:((startevent))-->1:task:(task A)
    1:task:-->2:exclusivegateway:{x}
    2:exclusivegateway:{x}-->3:task:(task B)
    2:exclusivegateway:{x}-->4:task:(task C)
    3:task:-->5:exclusivegateway:{x}
    4:task:-->5:exclusivegateway:{x}
    5:exclusivegateway:{x}-->6:task:(task D)
    6:task:-->7:endevent:(((endevent)))

    Return only mermaid.js as text without any additional information!
    Give me just the raw Mermaid.js code without markdown formatting
    Put paragraphs after each Node definition and Connection

