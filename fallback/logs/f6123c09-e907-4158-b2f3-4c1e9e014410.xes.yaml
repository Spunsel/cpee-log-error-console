  cpee:change_uuid: 7ff5a9f1a68eb3ccbdea4fe4d263cf3db9034556
  cpee:exposition: |-
    # User Input:
    Creating a successful menu requires a transition from broad ideas to specific dietary logistics. Follow these four steps:

    1. Audit Requirements

    Reach out to every guest to confirm medical allergies (e.g., nuts, shellfish), dietary lifestyles (e.g., vegan, keto), and strong aversions. Do not guess; data is your best tool for safety.

    2. Choose a Modular Theme

    Select a "build-your-own" or customizable cuisine—such as tacos, Buddha bowls, or pasta bars. This allows you to keep problematic ingredients (like dairy or gluten) in separate bowls, letting guests curate a meal that fits their specific needs.

    3. Apply the "Inclusive Main" Strategy

    Instead of cooking five different entrees, prepare one base main dish that satisfies the most restrictive guest (e.g., a vegan, gluten-free vegetable curry). You can then offer "add-ons" like grilled protein or bread on the side for others.

    4. Verify and Label

    Before serving, double-check ingredient labels for hidden allergens (like soy in dressings). Create small menu cards or labels that clearly mark dishes as "GF," "Vegan," or "Nut-Free" so guests can dine with confidence.

    How many guests are you expecting, and do you already know of any specific dietary restrictions?
  time:timestamp: '2026-04-17T16:04:24.315164+02:00'
