event:
  concept:instance: 46913
  id:id: ex-ante
  cpee:instance: 3bc9b38e-9275-4fd2-bf63-d138476ba679
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: d9c4846a292d301eac7ee4fd05bebbfe169cc122
  cpee:exposition: |-
    %% Output Intermediate
    To generate a BPMN model in Mermaid.js format, I would need a detailed description of the insurance claim process. However, based on a general understanding of the process, here is a simple model:

    graph LR
    0:startevent:((startevent)) --> 1:task:(File Insurance Claim)
    1:task:(File Insurance Claim) --> 2:task:(Review Claim)
    2:task:(Review Claim) --> 3:exclusivegateway:{x}
    3:exclusivegateway:{x} --> |Approved| 4:task:(Process Payment)
    3:exclusivegateway:{x} --> |Denied| 5:task:(Notify Claimant of Denial)
    4:task:(Process Payment) --> 6:task:(Notify Claimant of Approval and Payment)
    5:task:(Notify Claimant of Denial) --> 7:exclusivegateway:{x}
    6:task:(Notify Claimant of Approval and Payment) --> 7:exclusivegateway:{x}
    7:exclusivegateway:{x} --> 8:endevent:(((endevent)))

    This model assumes that the process starts with filing an insurance claim, which is then reviewed. If the claim is approved, the payment is processed and the claimant is notified. If the claim is denied, the claimant is also notified. The process ends after the claimant has been notified.
  time:timestamp: '2026-05-25T19:42:40.511403+02:00'
