event:
  concept:instance: 64307
  id:id: external
  cpee:activity: external
  cpee:instance: 26616adb-57ef-4618-82a4-6d398273a4ee
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 9ff003601420b316516a1d84140b8a04672112f9
  cpee:exposition: |-
    %% Output Intermediate
    Textual Description:
    The Finance Department of a University Hospital wants to bill infrastructure costs. The process starts with the collection of infrastructure usage data. Then, the data is analyzed and the costs are calculated. If the calculated costs are within the budget, an invoice is created and sent to the respective department. If the costs exceed the budget, the finance department must decide whether to adjust the costs or request additional budget. If they decide to adjust the costs, the costs are recalculated and an invoice is created and sent. If they decide to request additional budget, a budget request is sent to the management. After the management's decision, if additional budget is approved, an invoice is created and sent. If the budget is not approved, the costs are adjusted and an invoice is created and sent. The process ends when the invoice is sent.

    Mermaid.js Code:

    ```mermaid
    graph LR
    0:startevent:((startevent)) --> 1:task:(Collect infrastructure usage data)
    1:task:(Collect infrastructure usage data) --> 2:task:(Analyze data and calculate costs)
    2:task:(Analyze data and calculate costs) --> 3:exclusivegateway:{x}
    3:exclusivegateway:{x} --> |Costs within budget| 4:task:(Create and send invoice)
    3:exclusivegateway:{x} --> |Costs exceed budget| 5:exclusivegateway:{x}
    5:exclusivegateway:{x} --> |Adjust costs| 6:task:(Recalculate costs)
    5:exclusivegateway:{x} --> |Request additional budget| 7:task:(Send budget request to management)
    6:task:(Recalculate costs) --> 8:task:(Create and send invoice)
    7:task:(Send budget request to management) --> 9:exclusivegateway:{x}
    9:exclusivegateway:{x} --> |Additional budget approved| 10:task:(Create and send invoice)
    9:exclusivegateway:{x} --> |Additional budget not approved| 6:task:(Recalculate costs)
    4:task:(Create and send invoice) --> 11:endevent:(((endevent)))
    8:task:(Create and send invoice) --> 11:endevent:(((endevent)))
    10:task:(Create and send invoice) --> 11:endevent:(((endevent)))
    ```
    This code will generate a BPMN diagram that accurately represents the described business process.
  time:timestamp: '2025-11-24T12:14:25.804712+01:00'
