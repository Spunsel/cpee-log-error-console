event:
  concept:instance: 64307
  id:id: external
  cpee:activity: external
  cpee:instance: 26616adb-57ef-4618-82a4-6d398273a4ee
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: a7a17d277393271d4cc0fb5de9f1710bdf1e1929
  cpee:exposition: "# User Input:\nHier ist ein Vorschlag für einen BPMN-Prozess (Business
    Process Model and Notation) für die\n\U0001F449 „Verrechnung von Infrastrukturkosten“
    im Universitätsklinikumskontext.\n\U0001F9E9 Prozessname: Verrechnung von Infrastrukturkosten\nProzessziel:\nZurechnung
    und Umlage von zentralen Infrastrukturkosten (z. B. IT, Gebäude, Energie, Reinigung,
    Verwaltung) auf nutzende Organisationseinheiten (Kliniken, Institute, Forschungsbereiche)
    gemäß interner Kostenverteilungslogik und Trennungsrechnung.\n\U0001F3D7️ BPMN-Akteure
    (Swimlanes)\nKostenstellenverantwortliche / Fachabteilungen\n(z. B. Technischer
    Dienst, IT, Verwaltung)\nFinanzabteilung / Controlling\n(z. B. KLR-Team, Finanzcontrolling)\nDatenmanagement
    / ERP-System\n(z. B. SAP, BI-System)\nKliniken & Institute (Kostenträger)\n(Empfänger
    der Umlage)\nLeitung Finanzen / Vorstand Verwaltung\n(Freigabe und Reporting)\n\U0001F9ED
    BPMN-Prozessbeschreibung (Textform)\n1. Start: Periodenbeginn (z. B. Quartal /
    Jahr)\nEreignis: „Kostenverteilungsperiode beginnt“\nTrigger: Automatischer Prozessstart
    im ERP-System oder durch Controlling-Kalender.\n2. Sammeln der Infrastrukturkosten
    (Kostenstellenverantwortliche)\nAktivitäten:\nErfassung der angefallenen Infrastrukturkosten
    (z. B. IT, Strom, Gebäudereinigung, Verwaltung)\nZuordnung zu Kostenstellen (Primärkosten)\nÜbermittlung
    an Controlling\nDatenaustausch: Buchungsläufe, Kostenartenberichte\n3. Plausibilitätsprüfung
    der Daten (Finanzabteilung)\nAktivitäten:\nPrüfung der Vollständigkeit und Korrektheit
    der Kostenarten\nAbgleich mit Budget- und Vorperiodenwerten\nRückmeldung bei Auffälligkeiten
    an Fachabteilungen\nEntscheidungspunkt: „Kosten plausibel?“\nNein: Rückgabe zur
    Korrektur\nJa: Weiter\n4. Definition der Verteilungsschlüssel (Controlling)\nAktivitäten:\nFestlegung
    oder Aktualisierung der Umlageschlüssel (z. B. m², Personalstellen, IT-Nutzer,
    Laborstunden)\nGenehmigung durch Leitung Finanzen (falls notwendig)\nDatenbasis:
    Stammdaten, Nutzungsstatistiken, HR-Daten\n5. Durchführung der Umlage (ERP-System
    / Controlling)\nAktivitäten:\nBerechnung der Umlage auf Empfänger-Kostenstellen
    gemäß Schlüssel\nBuchung der sekundären Kosten im ERP-System (z. B. SAP-CO Umlagezyklus)\nSystemereignis:
    „Umlauf abgeschlossen“\n6. Prüfung der Umlageergebnisse (Controlling + Empfänger)\nAktivitäten:\nEmpfänger
    erhalten Umlageberichte\nKontrolle auf sachliche und rechnerische Richtigkeit\nFeedback
    an Controlling bei Auffälligkeiten\nEntscheidungspunkt: „Ergebnisse korrekt?“\nNein:
    Korrektur und Neuverteilung\nJa: Weiter\n7. Reporting und Freigabe (Finanzleitung)\nAktivitäten:\nErstellung
    des Verrechnungsberichts (z. B. je Klinik/Institut)\nVorlage an Leitung Finanzen
    / Vorstand Verwaltung\nFreigabe und Kommunikation an alle Einheiten\nDokumentation
    im ERP/BI-System\n8. Ende des Prozesses\nEreignis: „Umlage abgeschlossen und freigegeben“\nOutput:\nBuchungssätze
    im ERP-System\nBericht an Ministerium/Universität (Trennungsrechnung)\nGrundlage
    für Budgetplanung und Controlling\n\U0001F9EE Optional: Erweiterungen / Subprozesse\nAutomatisierte
    Datenübernahme aus Gebäudemanagement oder Zeiterfassungssystemen\nTrennungsrechnung:
    Separate Umlagen für Klinik, Forschung, Lehre\nAuditprozess: Nachgelagerte Prüfung
    durch Revision oder Ministerium\nDashboards: Visualisierung der Kostenstruktur
    und Umlageeffekte\n\n"
  time:timestamp: '2025-11-24T12:17:07.832247+01:00'
