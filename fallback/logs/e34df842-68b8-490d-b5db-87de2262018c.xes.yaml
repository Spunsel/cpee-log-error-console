event:
  concept:instance: 8573
  id:id: ex-ante
  cpee:instance: e34df842-68b8-490d-b5db-87de2262018c
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: d819552fcf8618656fa1de56fa389c1eda32809b
  cpee:exposition: |-
    # User Input:
    The employee from the department fills out the form and sends it to someone. That person reviews it immediately or at a later time and may forward it. The responsible manager—either Mr. Müller or the controller—must approve it, regardless of whether the amount is correct or not. The manager then does so. If everything is in order, the process is completed. If not, something happens. The applicant receives feedback within a reasonable timeframe regarding their request for the project budget, which was submitted earlier. The system sends them an email. The process is then completed, but first, the matter must be resolved.
  time:timestamp: '2026-03-29T13:28:45.616836+02:00'
