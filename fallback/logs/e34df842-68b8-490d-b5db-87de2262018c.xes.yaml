event:
  concept:instance: 8573
  id:id: ex-ante
  cpee:instance: e34df842-68b8-490d-b5db-87de2262018c
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 131cfb53aeb37153dbf1541e3783bac67d97fea1
  cpee:exposition: |-
    # User Input:
    Der Mitarbeiter aus der Abteilung füllt das Formular aus und schickt es an jemanden. Er prüft es dann sofort oder irgendwann später und leitet es eventuell weiter. Der zuständige Manager — also entweder Herr Müller oder die Controllerin — muss das genehmigen, sofern der Betrag stimmt oder auch nicht. Danach macht sie das dann. Wenn alles passt, wird der Vorgang abgeschlossen. Falls nicht, passiert was. Der Antragsteller bekommt in einem angemessenen Zeitraum eine Rückmeldung über seine Anfrage bezüglich des Budgets für das Projekt, welches bereits vorher eingereicht wurde. Das System schickt ihm eine E-Mail. Anschließend wird der Prozess beendet, aber vorher muss noch das Ding erledigt werden.
  time:timestamp: '2026-03-29T13:29:19.862330+02:00'
