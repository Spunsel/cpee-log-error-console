  cpee:exposition: |-
    %% Output Intermediate
    ```mermaid
    graph LR
    0:startevent:((startevent)) --> 1:task:(Receive Sample)
    1:task:(Receive Sample) --> 2:task:(Check Sample)
    2:task:(Check Sample) --> 3:task:(Carry Out Examination)
    3:task:(Carry Out Examination) --> 4:task:(Results Available)
    4:task:(Results Available) --> 5:parallelgateway:{AND}
    5:parallelgateway:{AND} --> 6:task:(Prepare Report)
    5:parallelgateway:{AND} --> 7:exclusivegateway:{x}
    5:parallelgateway:{AND} --> 11:exclusivegateway:{x}
    7:exclusivegateway:{x} --> 8:task:(Send for Confirmatory Testing) |Results Require|
    7:exclusivegateway:{x} --> 9:parallelgateway:{AND} |Results Do Not Require|
    8:task:(Send for Confirmatory Testing) --> 9:parallelgateway:{AND}
    11:exclusivegateway:{x} --> 12:task:(Notify Clinician) |Critical Results|
    11:exclusivegateway:{x} --> 9:parallelgateway:{AND} |Not Critical Results|
    12:task:(Notify Clinician) --> 9:parallelgateway:{AND}
    6:task:(Prepare Report) --> 9:parallelgateway:{AND}
    9:parallelgateway:{AND} --> 10:endevent:(((endevent)))
    ```
  time:timestamp: '2025-10-28T16:46:56.476262+01:00'
