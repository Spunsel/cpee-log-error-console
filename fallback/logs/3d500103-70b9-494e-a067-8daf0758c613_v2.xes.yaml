event:
  concept:instance: 1046
  id:id: external
  cpee:activity: external
  cpee:instance: 3d500103-70b9-494e-a067-8daf0758c613
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 74776730b06355d47fb639cebb22e4fb961fed94
  cpee:exposition: |-
    # User Input:
    Once the lab receives a sample, it is first checked to ensure everything is in order, and then the examination is carried out.
    After the results are available, a few things can happen. A report is always prepared to document the findings. At the same time, if the results require it, the sample might be sent for confirmatory testing, and the clinician can be notified immediately in case of critical results.
    When all necessary follow-up steps are completed, the process comes to an end.
  time:timestamp: '2025-10-28T16:46:56.475666+01:00'
