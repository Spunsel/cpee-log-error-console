event:
  concept:instance: 82263
  id:id: external
  cpee:activity: external
  cpee:instance: 20211dd3-3ed9-4185-8759-4e22852baae4
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: aad8f1c768068bdac6cf6040329af9db2e8966be
  cpee:exposition: |-
    # User Input:
    Der Head of Product Marketing erhält den Auftrag von seinem Chef, dass er ein neues Produkt entwerfen soll. Danach startet er eine Marktanalyse. Zunächst werden die Wettbewerber recherchiert. Dann wird geprüft, was diese auf ihrer Feature Roadmap für nächste Produkte angekündigt haben. Dies wird abgeglichen mit der eigenen Future Feature Map. Anschließend wird bewertet, welches feature einen echten Vorteil bringen würde. Danach wird ein Feature Bundle erstellt. Daraus wird ein Produktvorschlag erstellt. Dieser wird prototypisch umgesetzt. Die Umsetzung wird validiert. Sollte diese nicht erfolgreich sein, wird der Produktvorschlag adaptiert. Sollte dieser gar nicht erfolgreich sein, wird ein neues Feature Bündel gewählt und dann ein ganz neuer Produktvorschlag konzipiert und auch dieser wieder validiert. Sollte ein Produktvorschlag durchgehend positiv validiert werden oder überwiegend positiv, dann wird ein Produkt verabschiedet und in die Umsetzung gebracht.
  time:timestamp: '2025-12-08T09:45:11.554275+01:00'
