event:
  concept:instance: 1039
  id:id: external
  cpee:activity: external
  cpee:instance: edb5ba63-6c1f-4359-be8a-e62654230436
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: c8878a820e522d921cbe03cf718aa011c6f2ec29
  cpee:exposition: |-
    # User Input:
    Before outputting, verify that for every gateway with multiple outgoing edges, there is a corresponding gateway later in the diagram with the same type and multiple incoming edges. In loops, i.e., when the flow is going back, the return flow should reconnect to the same gateway node used for the split. In that case, the flow may return to the same gateway that started the repeated section.

    The process starts when the lab material is received.
    The material is then checked for correctness and quality. If the check reveals that the sample is unsuitable�for example, the labeling is unclear or the volume is insufficient�the sample is re-prepared or reprocessed, and the check is repeated.
    Once the sample passes the check, the examination is performed. After the examination, a report is created to document the results.
    The process ends when the report is completed.
  time:timestamp: '2025-10-28T17:46:25.286405+01:00'
