  cpee:change_uuid: fc0eb493e54034f98b111b12835ea740f6c6fbc7
  cpee:exposition: |-
    # User Input:
    I am the HR clerk .
    When a vacancy is reported to me , I create a job description from the information .
    Sometimes there is still confusion in the message , then I must ask the Department again .
    I am submitting the job description for consideration and waiting for the approval .
    But , it can also happen that the department does not approve it , but rejects it , and requests a correction .
    Then I correct the description and submit it again for consideration .
    If the description is finally approved , I post the job .
  time:timestamp: '2026-04-20T00:07:38.832400+02:00'
