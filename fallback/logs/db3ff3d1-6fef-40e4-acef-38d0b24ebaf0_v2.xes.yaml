    # User Input:
    This evaluation will consist of a short introduction, followed byÂ two main tasks. The entire session is planned to take approximately one hour.

    Task 1Â is based on a predefined, simple B2B order processing scenario.

    You will be provided with a checklist to guide you through the required steps. The purpose of this task is to help you become familiar with the main features of the tool.

    Task 2Â is based on a real-world case.

    In this task, you will use the tool more independently to create and refine your own model based on the provided documentation.

    Following the tasks, you are required to complete a set of open-ended questions.

    These questions can be answered either after completing Task 1 or at the end of the evaluation after Task 2.
