    1:task:-->2:task:(Prepare coffee ground and set up the brewer)
    2:task:-->3:task:(Pour water and serve)
    3:task:-->4:endevent:(((endevent)))
    ```

    This process model starts with the start event, then follows three tasks: "First, boil water", "Prepare coffee ground and set up the brewer", and "Pour water and serve". The process ends with the end event.
