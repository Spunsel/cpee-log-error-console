event:
  concept:instance: 8609
  id:id: ex-ante
  cpee:instance: b07b153f-cc0d-474c-abb7-060a878b2014
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: aff28cd6c8f93214983661f6dd14d80597637c71
  cpee:exposition: |-
    # User Input:
    Устройства генерируют события (метрики) и передают их в кафку
    Кафка в качестве брокера временно хранит события
    Консьюмер передаёт метрики из брокера в таблицу
    Метрики попадают в raw таблицу. raw таблица хранит необработанные события (в том виде, в каком они поступили с устройств)
    Materialized view читает новые записи из raw таблицы, трансформирует их. Извлекает поля, преобразует формат данных, формирует агрегированные (нормализованные) записи
    Agregated tables хранят уже обработанные записи, оптимизированные для запросов
    TTL автоматически удаляет или архивирует устаревшие данные
    (при наличии) MergeTree заменяет дубли событий, которым не нужна история 
    Api и BI вычитывают обработанные записи из таблицы. Api передаёт данные в ЛКП, BI анализирует данные в виде дашбордов/таблиц/графиков
  time:timestamp: '2026-03-30T13:09:59.193281+02:00'
