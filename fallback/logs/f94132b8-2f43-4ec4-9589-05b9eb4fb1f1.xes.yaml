  cpee:exposition: |-
    %% Output Intermediate
    ```mermaid
    graph LR
        0:startevent:((startevent))
        1:task:(Formular ausfüllen und abschicken)
        2:task:(Formular prüfen)
        3:exclusivegateway:{x}
        4:task:(Formular weiterleiten)
        5:exclusivegateway:{x}
        6:task:(Genehmigung einholen)
        7:exclusivegateway:{x}
        8:task:(Vorgang bearbeiten)
        9:task:(Ablehnung bearbeiten)
        10:exclusivegateway:{x}
        11:task:(Antragsteller informieren)
        12:task:(Abschließende Tätigkeit)
        13:endevent:(((endevent)))

        0 --> 1
        1 --> 2
        2 --> 3
        3 --> |Weiterleitung erforderlich| 4
        3 --> |Nicht erforderlich| 5
        4 --> 5
        5 --> 6
        6 --> 7
        7 --> |Genehmigt| 8
        7 --> |Nicht genehmigt| 9
        8 --> 10
        9 --> 10
        10 --> 11
        11 --> 12
        12 --> 13
    ```
  time:timestamp: '2026-03-28T17:15:06.292672+01:00'
