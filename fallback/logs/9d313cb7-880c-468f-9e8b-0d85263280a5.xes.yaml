event:
  concept:instance: 88781
  id:id: external
  cpee:activity: external
  cpee:instance: 9d313cb7-880c-468f-9e8b-0d85263280a5
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 542bd7190c93d1f3e75c6fbd0b7e6bd577e6b642
  cpee:exposition: |-
    # User Input:
    ·      Der Prozess beginnt damit, dass ein Kundenauftrag eingeht bzw. dass die technische Klärung erfolgt ist

    ·      Anschließend werden alle Basisdaten aus dem ERP-System übernommen und eine Auftragsbestätigung im ERP-System erstellt, wobei optional ein Zahlungsplan als Dokument hinzugefügt werden können.

    ·      Parallel erstellt der Projektleiter den Zahlungsplan in Word

    ·      nach diesen Schritten folgt zunächst ein zeitlicher Puffer von etwa 2 Monaten bis zum voraussichtlichen Ausführungsbeginn.

    ·      In der Phase vor dem Ausführungsbeginn beginnt die Projektplanung: Der Projektplaner legt die Vorplanung fest und das Backoffice legt parallel die Vorplanung ebenfalls fest

    ·      Dann wird die Vorplanung parallel vom Einkauf, vom Backoffice und vom Projektplaner durchgeführt

    ·      Etwa zwei Wochen vor dem geplanten Baustart wird der Termin mit dem Kunden fixiert

    ·      Anschließend beginnt die Vorbereitung des Baubeginns im Einkauf, parallel dazu erstellt der Projektplaner eine Zeitvorgabe/Kurzbeschriebung in Word. Danach aber parallel zur Vorbereitung im Einkauf wird die Bauakte im backoffice erstellt

    ·      Etwa eine Woche vor Montagebeginn wird eine Baustelleneinweisung durchgeführt, bei der die Bauakte an den Teamleiter übergeben wird und Baustelle mit dem Teamleiter besucht wird

    ·      Nun ist der Projektplanung Privatkunden Prozess beendet
  time:timestamp: '2025-12-23T12:33:06.727596+01:00'
