event:
  concept:instance: 88781
  id:id: external
  cpee:activity: external
  cpee:instance: 9d313cb7-880c-468f-9e8b-0d85263280a5
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 1d80b608527318668a8822b3ef521e6e861da894
  cpee:exposition: |-
    # User Input:
         Der Einakufsprozess beginnt mit der Mengenermittlung, woraufhin im Büro der benötigte Baustoffhändler im openHandwerk System angelegt wird

          Nach Anlage des Baustoffhändlers, frägt der Baustoffhändler Preise an, typischerweise per E-Mail über openHandwerk

          Anschließend werden die Lieferantenangebote vom Büro miteinander verglichen, um die wirtschaftlich günstigste Option zu ermitteln; basierend auf diesem Vergleich wird das wirtschaftlich beste Angebot ausgewählt.

    Das ausgewählte Angebot wird kalkuliert und als Angebot in openHandwerk hinterlegt.

          Danach wird geprüft, ob ein Zuschlag erhalten wurde

     Falls der Zuschlag nicht erteilt wird, wird der betreffende Baustoffhändler abgesagt, üblicherweise per E-Mail über openHandwerk, und der Prozess endet

          Wird der Zuschlag hingegen erteilt, wird die Ware abgenommen und in der Auftragsmappe in openHandwerk dokumentiert. Damit ist der Einkaufsprozess erfolgreich abgeschlossen.
  time:timestamp: '2025-12-23T12:37:33.526333+01:00'
