    ·      Der Prozess beginnt damit, dass auf einen Zahlungseingang gewartet wird

    ·      Dann werden Zahlungseingänge bzw. ausstehende Zahlungen geprüft

    ·      Je nachdem was jetzt passiert, geht es anders weiter. Entweder es gibt einen Zahlungseingang, dann wird die Zahlung dem Auftrag zugeordnet: Dafür werden Information aus einem Kontoauszug und aus einem Offenen Posten geholt und im Offenen Posten wieder abgelegt. Anschließend wird die Rechnung aus dem Offenen Posten ausgebucht und wenn das die Letzte Rechnung des Auftrags war ist der Auftrag abgeschlossen und der Prozess beendet

    ·      Falls das nicht die letzte rechnung war, werden erneut Zahlungseingänge bzw. ausstehende Zahlungen geprüft.

    ·      Im Anderen Fall wenn kein Zahlungs eingang passiert und eine Frist verstrichen ist, wird geprüft , die wievielte zahlungserinnerung ist. Bei der ersten wird eine Zahlungserinnerung gesendet. Bei der 2 eine zahlungsaufforderung, und bei der 3. Wird die 3. stufe ausgeführt. Im System wird die jeweilige Aktion hinterlegt und die neue Frist gesetzt
  time:timestamp: '2025-12-23T12:56:31.665958+01:00'
