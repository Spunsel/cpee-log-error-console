  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 47a328dc59bbefc4b30953278c2665a0b944a744
  cpee:exposition: |-
    # User Input:
    ·      Der Kunde nimmt über Email, Telefon, einem Gespräch oder einem Architekten den Kontakt auf, wodurch ein neuer Kontakt im System angelegt wird

    ·      Anschließend wird ein Termin mit dem Kunden vereinbart, wenn der Kunde über einen PC/Internetanschluss verfügt, dann via Messenger/Email, ansonsten übers Telefon/Persönliches Gespräch

    ·      Der vereinbarte Termin wird im Microsoft Outlook Kalender festgehalten

    ·      Anschließend wird die Baustelle besichtigt sowie das notwendige Aufmaß aufgenommen und als E-Formular hochgeladen.

    ·      Auf Grundlage dieser Informationen wird geprüft, ob Kapazitäten für die Angebotserstellung vorhanden sind; wenn ja, wird das Angebot geschrieben, andernfalls erhält der Kunde eine Absage z.b. via Email, Chatfunktion, Messenger oder Telefon und der Prozess bricht ab.

    ·      Nach Schreiben des Angebots wird, falls der Kunde einen PC-Anschluss hat das Angebot via Email, Messenger versendet. Falls der Kunde keinen PC-Anschluss hat wird das Angebot per Post, Übergabe oder Automatisierter Versendung verschickt

    ·      Dann wird geprüft ob eine Antwort da ist

    ·      Der Kunde entscheidet, ob er dem Angebot zustimmt; bei Zuschlag wird das Angebot in einen Auftrag umgewandelt und der Prozess gilt als erfolgreich abgeschlossen.

    ·      Gibt der Kunde keinen Zuschlag, wird ein weiteres Gespräch via Email, Messenger, Telefon oder persönlich geführt, und nur wenn danach eine Einigung erzielt wird, erfolgt die Auftragsumwandlung; andernfalls gilt der Angebotsprozess als fehlgeschlagen.
  time:timestamp: '2025-12-23T11:31:32.188233+01:00'
