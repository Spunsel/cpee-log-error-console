  cpee:change_uuid: de87eaf00d6b75d2acb8aa3447378b56677a92b6
  cpee:exposition: |-
    # User Input:
    ·      Der KFZ-Prozess beginnt damit, dass ein Kunde anruft oder eine E-Mail sendet; im Büro der Werkstatt wird die Anfrage entgegengenommen und die Kundenhistorie in der Datenbank geöffnet

    ·      Daraufhin wird geprüft, ob der gewünschte Service im Portfolio liegt; falls dies nicht der Fall ist, wird die Anfrage direkt abgelehnt, wodurch der Prozess endet.

    ·      Ist nicht sicher, ob der Service im Portfolio liegt, wird in der Werkstatt des Autohauses nachgefragt, die die Frage dann beantwortet

    ·      Wenn die Werkstatt eine negative Antwort gibt, wird die Anfrage abgelehnt und der Prozess ist beendet. Wenn die Werkstatt eine positive Antwort gibt, geht es genauso weiter, wie wenn bereits sicher war, dass der Service im Portfolio lag

    ·      Nun wird geprüft, ob ein Kostenvoranschlag gewünscht ist; wenn kein Kostenvoranschlag benötigt wird, wird direkt ein Termin vereinbart, der Auftrag in der Datenbank angelegt und der Prozess abgeschlossen.

    ·      Falls ein Kostenvoranschlag gewünscht ist, erstellt das Büro einen Kostenvoranschlag

    ·      Der Kunde prüft den Kostenvoranschlag. Wenn er nicht in Ordnung ist, sendet der Kunde eine Nachricht und das Büro erhält eine Absage und der Prozess ist beendet

    ·      Wenn der Kostenvoranschlag in Ordnung ist, erhält das Büro eine Zusage. Dann wird ein Termin vereinbart und ein Auftrag in der Datenbank angelegt und der Prozess ist beendet
