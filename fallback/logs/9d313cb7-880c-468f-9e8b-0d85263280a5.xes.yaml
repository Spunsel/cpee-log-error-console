event:
  concept:instance: 88781
  id:id: external
  cpee:activity: external
  cpee:instance: 9d313cb7-880c-468f-9e8b-0d85263280a5
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: e0f69db27c3912e4fb3e62b8cc000dc790b22e5c
  cpee:exposition: |+
    # User Input:
    Der Prozess beginnt mit einer Kundenanfrage, woraufhin im Büro ein Kundentermin vereinbart wird, der per E-Mail oder über einen Notizkalender festgehalten wird, bevor anschließend auf der Baustelle die örtlichen Gegebenheiten betrachtet werden

    Nach der Besichtigung wird geprüft, ob die gewünschte Leistung angeboten werden kann. Wenn dies möglich ist, wird ein Angebot erstellt, unterstützt durch das Kalkulationsprogramm „Nextbau", wenn dies nicht möglich ist, wird dem Kunden direkt eine Absage erteilt wird und der Prozess gilt als fehlgeschlagen.

    Das erstellte Angebot wird danach an den Kunden versendet, und der Kunde entscheidet, ob er dieses annimmt; bei Ablehnung wird geprüft, ob eine Preis­anpassung möglich ist. Wenn es möglich ist, wird die Arbeitsvorbereitung geplant und der Prozess gilt als abgeschlossen. Wenn nicht gilt der Prozess als fehlgeschlagen

    Bei Zuschlag des Angebots, wird die Arbeitsvorbereitung geplant und der Angebots-/Auftragsprozess gilt als erfolgreich abgeschlossen


  time:timestamp: '2025-12-23T11:28:13.191745+01:00'
...
