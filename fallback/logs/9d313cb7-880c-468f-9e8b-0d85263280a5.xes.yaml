event:
  concept:instance: 88781
  id:id: external
  cpee:activity: external
  cpee:instance: 9d313cb7-880c-468f-9e8b-0d85263280a5
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 38977dd11224e596a13f34bb03b45366494c0b2b
  cpee:exposition: |-
    # User Input:
    Der Prozess beginnt damit, dass der Mitarbeiter am Arbeitsplatz steht

    Zu Beginn läuft man 2 Minuten zum Lager und entnimmt das Werkstück aus dem lager

    Danach läuft man 2 Minuten zurück

    Dann wird die Packung geöffnet und auf den Arbeitstisch gelegt

    Anschließend wird CNC geöffnet

    Jetzt wird ein Altes Werkstück entnommen. Dann wird das neue Werkstück eingelegt

    Dann wird das CNC Programm gestartet

    Nun wird das alte Werkstück in die Verpackung gelegt

    Wenn CNC komplett durchgelaufen ist bzw. keine Werkstücke mehr vorhanden sind, gilt der CNC Prozess als abgeschlossen. Ansonsten muss CNC nochmal geöffnet werden und der restliche Prozess nochmal gemacht werden
  time:timestamp: '2025-12-23T11:41:24.352528+01:00'
