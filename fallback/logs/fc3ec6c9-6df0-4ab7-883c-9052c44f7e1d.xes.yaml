    # User Input:
    Der Kunde ruft den Kundensupport an.
    Der Agent fragt nach der Bestellnummer des Kunden. 
    Der Agent prüft die Bestellung. 
    Der Agent informiert den Kunden über den Status der Bestellung. 
    Der Kunde verabschiedet sich. 
