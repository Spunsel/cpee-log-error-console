  cpee:exposition: |+
    # User Input:
    I would like to go to the bathroom. For it, i'd like a trigger based on my gut feeling. I'd have to, then, leave the computer by standing up. Afterwards, I'd go through the hallway, enter the bathroom, check for toilet paper, if there isn't any, get toilet paper from the closet and bring to the bathroom. Finally, when in the bathroom, I'd have to check the toilet seat for any stains. If there are stains, I'd have to clean them using the paper. Onnce the seat is clean, I would sit and the process would end. If there is no toilet paper, the process would end, because I would have to go buy some. 

