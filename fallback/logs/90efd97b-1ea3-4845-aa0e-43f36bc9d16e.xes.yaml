    Chapter 2 Donor selection
    161Additional recommendations for granulocytapheresis
    Clinical efficacy, indications and dosage of granulocyte transfusionÂ 
    have not been established. In view of this, provision of informedÂ 
    consent prior to collection of granulocytes is particularly important.Â 
    Effective granulocyte collection involves administration of medicationÂ 
    (corticosteroids and/or granulocyte colony-stimulating factor) toÂ 
    increase circulating granulocyte levels and the use of sedimentingÂ 
    agents (hydroxyethyl starch; HES) during the procedure itself. Both ofÂ 
    these have potentially severe side-effects, identified below, that need toÂ 
    be communicated to the donor.
    HES acts as a volume expander. Donors who have received HES mayÂ 
    experience headaches or peripheral oedema because of expandedÂ 
    circulatory volume. HES may accumulate, which can result inÂ 
    pruritus, and allergic reactions are possible.
    Corticosteroids may cause, for example, hypertension, diabetesÂ 
    mellitus, cataracts, peptic ulcer and psychiatric problems.
    Granulocyte colony-stimulating factor (G-CSF): the most commonÂ 
    short-term complication following G-CSF administration inÂ 
    peripheral blood stem cell (PBSC) donors is bone pain; although,Â 
    on very rare occasions, splenic rupture or lung injury may occur.Â 
    Concerns have also been raised relating to the development of acuteÂ 
    myeloid leukaemia (AML)/myelodysplasia (MDS) after G-CSFÂ 
    administration. To date, however, registry data from Europe andÂ 
    the USA have not identified any increased risk of AML/MDS inÂ 
    healthy individuals who donated PBSCs and received G-CSF as aÂ 
    pretreatment. The median follow-up of these studies is, however, lessÂ 
    than 5 years. Therefore, if G-CSF is given to a donor, a protocol forÂ 
    long-term follow-up should be in place.
