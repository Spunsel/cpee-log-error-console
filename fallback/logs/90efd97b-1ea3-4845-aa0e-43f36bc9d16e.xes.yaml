    2.2.4.Â  Iron stores
    There is increasing awareness of the risk of iron deficiency followingÂ 
    regular whole blood donation. This is particularly apparent in femaleÂ 
    donors of childbearing years, frequent whole blood donors and inÂ 
    donors with inadequate dietary iron intake who may present as aÂ 
    first-time donor with low or borderline iron stores. Each whole bloodÂ 
    donation results in the loss of 200 to 250 mg of iron. Replenishment ofÂ 
    this may take up to 6 months based on a normal healthy diet.
    Iron deficiency may occur despite a normal pre-donationÂ 
    haemoglobin measurement.
    Standard
    2.2.4.1.Â  Blood establishments should have measures in place to minimiseÂ 
    iron depletion in frequent blood donors.Â 
