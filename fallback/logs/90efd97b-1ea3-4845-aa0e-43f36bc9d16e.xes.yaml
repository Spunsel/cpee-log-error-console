    2.2.1.7.Â  Procedures should be in place to ensure that any abnormal findingsÂ 
    arising from the donor selection process are properly reviewed byÂ 
    a qualified healthcare professional and that appropriate action isÂ 
    taken (GPG 6.1.13.) .Â 
