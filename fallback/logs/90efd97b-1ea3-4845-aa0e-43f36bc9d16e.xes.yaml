    2.5. Post-donation information
    2.5.1. Overview
    Blood establishments often receive information from blood donorsÂ 
    after donation that should have resulted in their deferral and mayÂ 
    attempt to retrieve distributed blood components that did not meet allÂ 
    quality standards and regulations.
    Post-donation information (PDI) is largely a reflection of the inherentÂ 
    limitations of the current donor screening process, which uses broad,Â 
    precautionary questions to guard against theoretical or extremelyÂ 
    remote risks. Consequently, PDI is an important measure of theÂ 
    accuracy of donor suitability assessment and compliance with goodÂ 
    practice.
    2.5.2.Â  Donor instruction
    Standard
    2.5.2.1.Â  Donors should be instructed to inform the blood establishmentÂ 
    about any relevant information that was not previously disclosed orÂ 
    if signs or symptoms occur after a donation. This scenario indicatesÂ 
    that the donation may have been infectious or that any otherÂ 
    information not disclosed during the health screening may renderÂ 
    prior donations unsuitable for transfusion (GPG 6.1.12) .
    PDI includes information provided by the donor or other source andÂ 
    received by telephone or other means of communication following aÂ 
    donation. Blood establishments should evaluate PDI that is revealedÂ 
    by a third party without the donorâ€™s knowledge, weighing theÂ 
    reliability of the source of the information against the direct responsesÂ 
    from the donor.
