    Guide to the preparation, use and quality assurance of blood components1402.3.3.Â  Infectious diseases
    Transmission of infectious agents by transfusion can be minimisedÂ 
    by careful and appropriate use of donor questionnaires, laboratoryÂ 
    testing and pathogen inactivation technologies (PIT).
    Other measures are needed for infections where there is a possibilityÂ 
    of asymptomatic infection or existence of a carrier state. QuestioningÂ 
    donors about symptoms in these circumstances does not alwaysÂ 
    prevent transmission.
    Donors should be questioned on their risk of exposure to infectiousÂ 
    agents, which includes taking a travel history:
    â€¢ For infections in which the agent has been fully cleared fromÂ 
    the donorâ€™s blood on recovery, the donor should be deferredÂ 
    from donation until they are no longer infectious (usually 2Â 
    weeks from cessation of symptoms);
    â€¢ In cases of known contact with an infectious agent, the donorÂ 
    should be deferred for approximately twice the length of theÂ 
    incubation period. In case of a geographical risk of exposure toÂ 
    multiple infectious agents, the longest deferral period applies;
    â€¢ Many infections that can be transmitted by transfusionÂ 
    have defined geographical limits, and the risk of transfusionÂ 
    transmission can be minimised by temporary deferral orÂ 
    testing donors travelling from affected areas. Testing becomesÂ 
    especially relevant when deferral policies may potentially affectÂ 
    supply.
    Blood services should maintain a watching brief on changes to risksÂ 
    of infectious diseases worldwide. Risk-benefit analyses should beÂ 
    carried out to determine appropriate measures to decrease the risksÂ 
    of transfusion transmission. The risk of importation of an infectiousÂ 
    agent through donors visiting an affected area should be balancedÂ 
    by considering the likelihood of this occurring, and the impact ofÂ 
    introducing a new donor deferral ruling on blood supply. This riskÂ 
    will vary between countries.
