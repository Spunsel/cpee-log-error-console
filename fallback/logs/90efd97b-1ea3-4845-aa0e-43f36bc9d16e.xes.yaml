    163Designated donations are those intended for named patients based onÂ 
    medical indications. Circumstances where designated donations mayÂ 
    be indicated include:
    â€¢ Patients with rare blood types, where no compatibleÂ 
    anonymous donations are available;
    â€¢ Where donor-specific transfusions are indicated forÂ 
    immune modulation or immunotherapy; for instance, inÂ 
    the preparation procedure for kidney transplants or forÂ 
    lymphocyte transfusions aimed at a graft-versus-leukaemiaÂ 
    effect;
    â€¢ In certain cases of alloimmune neonatal thrombocytopaenia;Â 
    for instance, if HPA-typed platelets are not available andÂ 
    intravenous immunoglobulin therapy is not sufficient.
    These donations may involve family members, in which case theÂ 
    responsible physician should weigh up the risks and benefits for theÂ 
    patient.
    The practice of transfusing parental blood to infants is not withoutÂ 
    risk. Mothers may have antibodies to antigens that are present onÂ 
    the infantâ€™s red blood cells, platelets or white blood cells. Therefore,Â 
    maternal plasma should not be transfused. Fathers should not serveÂ 
    as cell donors to neonates because maternal antibodies to antigensÂ 
    inherited from the father may have been transmitted through theÂ 
    placenta to the foetus. In addition, due to partial histocompatibility,Â 
    transfusions of cells from parental or family donors carry anÂ 
    increased risk of transfusion-associated graft-versus-host diseaseÂ 
    (TA-GVHD), even in the immunocompetent recipient, and so suchÂ 
    components should be irradiated. In the case of platelets, PIT forÂ 
    components may be used as an alternative to irradiation.
