    2.3. Donor deferral
    2.3.1. General remarks
    Donors with hazardous occupations or hobbies should be advised toÂ 
    wait for an interval of not less than 12 hours between donation andÂ 
    returning to the occupation or hobby. Examples of such hazardousÂ 
    occupations or hobbies include piloting, bus or train driving, craneÂ 
    operation, climbing of ladders or scaffolding, gliding, climbing andÂ 
    diving.
    Donors presenting with a medical condition or under medicalÂ 
    treatment should be assessed to determine their eligibility. ReasonsÂ 
    for donor deferral may include non-infectious medical conditions,Â 
    infectious diseases and medical or surgical treatments.
    Standard
    2.3.1.1.Â  Deferred individuals should be given a clear explanation of theÂ 
    reasons for deferral.
