  cpee:change_uuid: 5779909fd1efe3fb7f1bc46aa11d69f7afd46c0d
  cpee:exposition: |-
    # User Input:
    It's my birthday, so I throw a party. First, I send out invites and collect the responses of who's attending. If any vegans attend my party, I adjust my menu to include vegan options. If not, I keep it strictly vegetarian. When my guests arrive, we have a great time until they leave.
