    2. Approval strategies with classification
    3. Generation of order (single order, call-off from a long-term framework contract, or a value-based contract)
    4. Integration of delivery notifications via EDI in case of changes during procurement
    5. Quality check by QM module after goods arrival
    6. Invoice verification (automated via ERS procedure or classic comparison of partial invoices and advance payments)
    7. Payment block in case of deviations exceeding defined tolerance limits
    8. Manual clarification or price difference booking in the context of invoice reduction
    9. Process ends with the machine payment run in the FI module

    Mermaid.js BPMN model:

    ```mermaid
    graph LR
    0:startevent:((startevent)) --> 1:task:(Automated demand determination by MRP system)
