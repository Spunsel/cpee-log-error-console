    4:task:(Integration of delivery notifications via EDI) --> 5:task:(Quality check by QM module)
    5:task:(Quality check by QM module) --> 6:task:(Invoice verification)
    6:task:(Invoice verification) --> 7:exclusivegateway:{x}
    7:exclusivegateway:{x} --> |Deviations within tolerance limits| 8:task:(Machine payment run in the FI module)
    7:exclusivegateway:{x} --> |Deviations exceed tolerance limits| 9:task:(Payment block and manual clarification)
    9:task:(Payment block and manual clarification) --> 10:task:(Price difference booking in the context of invoice reduction)
    10:task:(Price difference booking in the context of invoice reduction) --> 11:task:(Machine payment run in the FI module)
    11:task:(Machine payment run in the FI module) --> 12:endevent:(((endevent)))
    ```
