n. Sollten Abweichungen zwischen Bestellung, Wareneingang und Rechnung die definierten Toleranzgrenzen Ã¼berschreiten, setzt das System automatisch eine Zahlungssperre, die erst nach einer manuellen KlÃ¤rung oder einer Preisdifferenzbuchung im Rahmen der RechnungskÃ¼rzung aufgehoben wird, bevor der Prozess mit dem maschinellen Zahllauf im FI-Modul endet.
