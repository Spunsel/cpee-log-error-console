  cpee:exposition: |-
    # User Input:
    Der Bestellprozess in SAP beginnt klassisch mit einer Bestellanforderung, kann jedoch je nach Bedarf variieren, etwa wenn bei fehlender Bezugsquelle zunÃ¤chst ein mehrstufiges Anfrage- und Angebotsverfahren durchlaufen wird, um Preise verschiedener Kreditoren zu vergleichen. Sobald ein Lieferant feststeht, wird die Bestellung erzeugt, wobei bei hochwertigen GÃ¼tern oder hohen Auftragswerten oft ein Freigabeverfahren zwischengeschaltet ist, das die Bestellung erst nach der Genehmigung durch einen Verantwortlichen fÃ¼r den Versand freigibt. In der Logistikphase folgt nach der Warenlieferung Ã¼blicherweise die Erfassung des Wareneingangs, doch bei Dienstleistungen tritt an diese Stelle das Leistungserfassungsblatt, welches die erbrachte Arbeit dokumentiert und separat abgenommen werden muss. Eine weitere Variante stellt das Gutschriftverfahren dar, bei dem kein Rechnungseingang vom Lieferanten abgewartet wird, sondern das System die Abrechnung basierend auf den Wareneingangsdaten automatisch anstÃ¶ÃŸt. Falls die gelieferte Ware MÃ¤ngel aufweist, wird der Standardfluss durch eine RÃ¼cklieferung oder eine Teilstornierung unterbrochen, was wiederum eine Gutschriftanforderung in der RechnungsprÃ¼fung auslÃ¶st. Den Abschluss bildet in jedem Fall die Ãœberleitung an die Finanzbuchhaltung, wo die Zahlung entweder nach dem Drei-Wege-Match zwischen Bestellung, Wareneingang und Rechnung oder bei KleinbetrÃ¤gen direkt nach der Rechnungserfassung ohne vorherigen Lagerzugang erfolgt.
  time:timestamp: '2026-03-27T14:41:02.433698+01:00'
