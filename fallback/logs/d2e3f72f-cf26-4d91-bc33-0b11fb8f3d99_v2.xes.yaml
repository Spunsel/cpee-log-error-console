  cpee:change_uuid: e0b0fd66591c7f7cffb8d4367651adc6a735ffb4
  cpee:exposition: |-
    # User Input:
    The resolution of a pizza delivery order relies on a synchronized workflow between the Customer, the Restaurant, and the Courier.

    1. Initiation (Customer)

    The process begins when the customer selects a pizza, provides a specific delivery address, and completes payment. This creates a digital or physical "ticket" that triggers the kitchen's operations.

    2. Production (Restaurant)

    The restaurant validates the order and begins preparation. This involves:

    Assembly: Stretching dough and applying toppings.

    Baking: Cooking the pizza (typically at temperatures around 230°C to 260°C).

    Packaging: Boxing the pizza and securing it with heat-retaining materials to ensure quality upon arrival.

    3. Logistics (Courier)

    Once the "Order Ready" status is triggered, the courier collects the thermal bag and navigates to the destination. Their primary responsibility is maintaining the food's structural integrity and temperature during transit.

    4. Fulfillment (Completion)

    The event resolves when the courier hands off the order. The customer verifies the contents, and the system marks the transaction as "Delivered," successfully closing the logistical loop.
  time:timestamp: '2026-04-17T16:02:13.863298+02:00'
