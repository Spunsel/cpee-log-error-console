  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 3fd6d13fc5b6a63bc78853f78e6e61db31ea05f1
  cpee:exposition: |-
    # User Input:
    To keep everyone in the office fuelled and focused, an automatic coffee monitoring system ensures no one is left without their daily brew.

    The process begins by checking whether a coffee refill is required.

    If no refill is needed, the system proceeds to collect the email addresses of all relevant office members. Once the email addresses are available, a notification email is sent to the office informing everyone that no new coffee will be ordered this week.

    If a refill is required, the system initiates an ordering process. The user is prompted to confirm preferences such as the type and amount of coffee (e.g. beans or pods), milk options (regular, oat, almond), and any additional supplies like sugar or sweeteners.
    After the order details are confirmed, the system collects the email addresses of all relevant office members and sends a confirmation email to the entire office, letting everyone know that fresh coffee is on its way.
  time:timestamp: '2026-02-06T10:49:33.163878+01:00'
