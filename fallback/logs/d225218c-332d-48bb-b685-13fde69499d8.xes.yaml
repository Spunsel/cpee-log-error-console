event:
  concept:instance: 140967
  id:id: external
  cpee:activity: external
  cpee:instance: d225218c-332d-48bb-b685-13fde69499d8
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: d24144fe5aaf9d0410da2a2dd6ae2ed0f5009e30
  cpee:exposition: |-
    # User Input:
    To keep everyone in the office fuelled and focused, an automatic coffee monitoring system ensures you're never left without your daily brew.
    First, you are asked whether a refill should be ordered. Then, collect the email addresses of all relevant office members to ensure everyone will stay informed.
    If the response is negative, a follow-up email is sent to the office to inform everyone that no new coffee has been ordered this week.
    If refill is necessary, a simple ordering is initiated. It prompts the user to confirm preferences such as the type and amount of coffee (beans, pods), milk options (e.g., regular, oat, almond), and additional supplies needed like sugar or sweeteners.
    Once the order details are confirmed, a confirmation email is sent to the entire office, letting everyone know that fresh coffee is on its way.
  time:timestamp: '2026-02-06T10:51:04.868072+01:00'
