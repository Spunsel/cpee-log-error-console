event:
  concept:instance: 9269
  id:id: ex-ante
  cpee:instance: 076f47cd-b67a-4837-9c1a-ac677cb5a3d4
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: e912127128ed3ebf084173b417208e92a4e3b08d
  cpee:exposition: |+
    # User Input:
    The process starts. First, the need is identified. Then, an article is selected and an order is created. The order is then checked internally. If approval is required, the order is approved. Otherwise, if no approval is required, the process continues directly. After approval or if no approval was necessary, the order is sent to the supplier. Subsequently, an order confirmation is received. The goods receipt is then checked, followed by reconciliation of the invoice. The invoice is then approved for payment and the invoice is paid. Finally, the order process is completed and documented, and the process ends.

  time:timestamp: '2026-04-14T10:39:26.631559+02:00'
...
