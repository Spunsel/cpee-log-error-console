event:
  concept:instance: 11284
  id:id: ex-ante
  cpee:instance: a04f9de7-0285-43fa-9e1a-1c8a0982532a
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 6945d4891f962d3a78a72d186c28d502bcb9e13c
  cpee:exposition: |
    # User Input:
    Zu diesem Szenario sollst du ein BPMN Modell Code erstellen. Schreibe den BPMN-Code CPEE-kompatibel und block-strukturiert. Es darf kein XOR direkt nach „collect requirements“ entstehen. Der Ablauf muss zuerst linear sein: collect requirements → send to architect → receive draft. Erst danach folgt ein XOR „Refinement needed?“. Der yes-Pfad führt über refine requirements → send additional requirements → receive draft zurück zu genau diesem XOR. Der no-Pfad führt weiter zu create materials list. AND-Gateways müssen immer als sauberer Split mit passendem Join modelliert werden.
  time:timestamp: '2026-05-05T17:15:54.584917+02:00'
