event:
  concept:instance: 486
  id:id: ex-ante
  cpee:instance: 83865a73-1bda-453a-bdca-ede1018ec456
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: a0daf7603039d4b54ad92c0fe13b90fd7c8c5708
  cpee:exposition: |+
    # User Input:
    gestalte einen Prozess zur Beauftragung von ausländischen Arbeitskräften. Starte mit dem STellen einer Personalanforderung auf deren Basis die Stellenanzeige im Bewerbermanagementsystem erstellt und durch den Auftraggeber anschließend freigegeben wird. Erst wenn hier keine geeigneten inländischen Bewerber nach 3 Monaten eingegangen werden, wird die Personalleitung vom Stelleninhaber darüber informiert und der gemeinsame beschluss zur Akquise ausländischer Arbeitnehmer getroffen. Dazu bedarf es einer Budgetfreigabe durch den GB3, diese triggert eine Information an den Einkauf im GB4, der dann aktiv wird. Die Ausschreibende Stelle muss jetzt einen Anforderungskatalog erstellen auf Basis dessen der Einkauf geeignete Agenturen anfragt.

  time:timestamp: '2026-03-19T17:05:59.140342+01:00'
...
