event:
  concept:instance: 58726
  id:id: ex-ante
  cpee:instance: e97670b8-e643-488c-8ca7-dd845db872b0
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: d91b6b0eac1a91ad26a6f4163f397fe771f1cab6
  cpee:exposition: |-
    %% Output Intermediate
    ```mermaid
    graph LR
    0:startevent:((startevent)) --> 1:task:(Create Loan Application)
    1:task:(Create Loan Application) --> 2:task:(Submit Loan Application)
    2:task:(Submit Loan Application) --> 3:task:(Pre-Verification Service Reads Application)
    3:task:(Pre-Verification Service Reads Application) --> 4:parallelgateway:{AND}
    4:parallelgateway:{AND} --> 5:task:(KYC Service Collects Identity Document)
    4:parallelgateway:{AND} --> 6:task:(Compliance Service Gets Customer Sanction History)
    5:task:(KYC Service Collects Identity Document) --> 7:task:(KYC Service Validates KYC Status)
    6:task:(Compliance Service Gets Customer Sanction History) --> 8:task:(Compliance Service Computes AML Risk Level)
    7:task:(KYC Service Validates KYC Status) --> 9:parallelgateway:{AND}
    8:task:(Compliance Service Computes AML Risk Level) --> 9:parallelgateway:{AND}
    9:parallelgateway:{AND} --> 10:task:(Pre-Verification Service Computes DTI Ratio)
    10:task:(Pre-Verification Service Computes DTI Ratio) --> 11:task:(Pre-Verification Service Evaluates Credit Score)
    11:task:(Pre-Verification Service Evaluates Credit Score) --> 12:task:(Loan Officer Reads Application)
    12:task:(Loan Officer Reads Application) --> 13:task:(Loan Officer Computes Risk Score)
    13:task:(Loan Officer Computes Risk Score) --> 14:exclusivegateway:{x}
    14:exclusivegateway:{x} --> |Approves| 15:task:(Loan Officer Approves Loan)
    14:exclusivegateway:{x} --> |Denies| 16:task:(Loan Officer Denies Loan)
    15:task:(Loan Officer Approves Loan) --> 17:exclusivegateway:{x}
    16:task:(Loan Officer Denies Loan) --> 17:exclusivegateway:{x}
    17:exclusivegateway:{x} --> 18:endevent:(((endevent)))
    ```
    This model represents the described process, where the loan application goes through several services and checks before a loan officer makes the final decision. All paths start from the start event and lead to the end event, and each split gateway has a matching merge gateway.
  time:timestamp: '2026-05-28T14:59:25.632020+02:00'
