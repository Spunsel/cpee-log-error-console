event:
  concept:instance: 58726
  id:id: ex-ante
  cpee:instance: e97670b8-e643-488c-8ca7-dd845db872b0
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: d91b6b0eac1a91ad26a6f4163f397fe771f1cab6
  cpee:exposition: |+
    # User Input:
    This is the process for a loan approval. 

    A customer creates a loan application and submits it to its bank. 
    First, the pre-verification (PV) service reads the application for completeness. 

    Then, two other services are called in parallel. 
    The KYC Service (Know-Your-Customer) collects identity document, then validates the KYC status.
    In the mean time, the Compliance Service get the customer sanction's history, then computes the AML risk level.

    After these two services are completed, the pre-verification service compute the DTI (Debt-To-Income) ratio, then evaluate the customer's credit score.

    Next, a Loan Officer takes over the application : they reads it, then compute the risk score of the loan.

    Finally, the Loan Officer approves or denies the loan.



  time:timestamp: '2026-05-28T14:59:25.631563+02:00'
...
