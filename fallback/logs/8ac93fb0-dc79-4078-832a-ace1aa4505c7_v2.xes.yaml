event:
  concept:instance: 9266
  id:id: ex-ante
  cpee:instance: 8ac93fb0-dc79-4078-832a-ace1aa4505c7
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 4def44e790ed117e8efe8d4618a33c096907364e
  cpee:exposition: |-
    # User Input:
    Erstelle diesen Prozess:



    Der Bestellprozess beginnt damit, dass ein Bedarf an einem Produkt oder Material festgestellt wird. Anschließend werden die benötigten Artikel ausgewählt und die Bestellung mit allen wichtigen Angaben wie Artikelbezeichnung, Menge, Preis, Lieferant und gewünschtem Liefertermin erstellt. Danach wird die Bestellung intern geprüft und, falls erforderlich, von der zuständigen Person freigegeben. Nach der Freigabe wird die Bestellung an den Lieferanten übermittelt, zum Beispiel per E-Mail, über ein Bestellsystem oder über einen Online-Shop.

    Sobald der Lieferant die Bestellung erhalten hat, erfolgt in der Regel eine Bestellbestätigung. Darin wird mitgeteilt, ob die Bestellung angenommen wurde und ob die Lieferung wie gewünscht erfolgen kann. Nach Eingang der Ware wird geprüft, ob die Lieferung vollständig und korrekt ist, ob die bestellten Mengen stimmen und ob die Ware unbeschädigt angekommen ist. Anschließend wird die Rechnung mit der Bestellung und dem Wareneingang abgeglichen. Wenn alle Angaben korrekt sind, wird die Rechnung zur Zahlung freigegeben und fristgerecht beglichen. Zum Schluss wird der Bestellvorgang abgeschlossen und die dazugehörigen Unterlagen werden dokumentiert und archiviert.
  time:timestamp: '2026-04-14T08:03:28.283914+02:00'
