event:
  concept:instance: 930
  id:id: external
  cpee:activity: external
  cpee:instance: 10208187-7fb4-45c1-a448-75160364a551
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 477a6638a3db8e3f95914a88ce0363b4b560a4fe
  cpee:exposition: |-
    # User Input:
    Desired Process / Solution
    Workflow Overview
    End User Interaction
    User accesses the SHARP Service Portal (Walk-up Experience).
    Selects â€œSchedule a Callbackâ€ as a service option.
    Chooses preferred callback location, reason, and available time slot (system displays slots based on location, time zone, and holidays).
    Receives confirmation and calendar invite/blocker (Outlook/MS Teams integration).
    Can cancel or reschedule before the appointment.
    Automation & Integration
    System prevents double-booking and updates agent queue/dashboard with new callback details.
    Sends reminders to both user and assigned agent before the scheduled callback.
    Logs all scheduled callbacks for reporting and analytics.
    Supports remote-only appointments if required by location.
    Integrates with O365/MS Teams/Outlook for calendar management and notifications.
    Optionally, triggers contextual KB suggestions for users based on reason for visit.
    Agent Experience
    Agent receives timely notification of upcoming callbacks, including user details and reason.
    Views all scheduled callbacks in dashboard/queue.
    Initiates callback at scheduled time (phone or MS Teams, as per user profile).
    Documents outcome in SHARP/ServiceNow and marks callback as completed.
    System updates reporting and triggers post-callback feedback survey.
    Notifications & Communication
    Users notified if agent cannot reach them, with instructions for rescheduling.
    Agents notified if user cancels/reschedules.
    Feedback options (e.g., survey) provided after callback.
    Integration Points
    ServiceNow Walk-up Experience: Extends current walk-up module to support scheduled callbacks, including remote and in-person options.
    O365/MS Teams/Outlook: Calendar invites and updates, agent/user notifications.
    Genesys Cloud (or Nice CXone): For telephony integration, queue management, and reporting.
    Knowledge Base: Contextual KB articles linked to reasons for callback, supporting self-service and agent assist.
  time:timestamp: '2025-10-28T13:39:08.719473+01:00'
