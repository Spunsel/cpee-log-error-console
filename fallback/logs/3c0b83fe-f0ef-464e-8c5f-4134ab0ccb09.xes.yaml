    möglichkeit/Prozess- optimierung)\n\n \n\n\n\n\n1.\n\n\t\n\nAntrag der Studierenden\n\n\t\n\nSchriftlich
    per Mail\nan Schriftführung\n\n\t\n\nSpätestens Anfang der Prüfungsanmeldephase\n\n\t\n\nStudierende\n\n\t\n\nAntrag
    und Attest\n\n\t\n\n \n\n\t\n\nAdressat ggf. bei anderen Schools unterschiedlich\n\n\n\n\n2.\n\n\t\n\nFormale
    Prüfung\n\n\t\n\nPrüfung auf Vollständigkeit und Glaubhaftmachung\n\n\t\n\nNach
    Erhalt des Antrags\n\n\t\n\nSchriftführung\n\n\n\n\t\n\nAntrag und Attest\n\n\t\n\n \n\n\t\n\n \n\n\n\n\n3.\n\n\t\n\ninhaltliche
    Prüfung\n\n\t\n\nEntscheidung über Form des Nachteilsausgleichs\n\n\t\n\nNach
    formaler Prüfung\n\n\t\n\nPA-Vorsitzender\n(Schriftführung – in Absprache mit
    PA-Vorsitz)\n\n\t\n\nAntrag und Attest\n\n\t\n\n \n\n\t\n\nWäre Delegation auf
    Schriftführung möglich?\nbei anderen Schoolsev. anders\n\n\n\n\n4.\n\n\t\n\nVerbescheidung\n\n\t\n\nBescheid
    / E-Mail\n\n\t\n\nNach fachlicher Prüfung\n\n\t\n\nSchriftführung\n\n\t\n\nBescheid,
