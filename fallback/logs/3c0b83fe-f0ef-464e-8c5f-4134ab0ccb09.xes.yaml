event:
  concept:instance: 8800
  id:id: ex-ante
  cpee:instance: 3c0b83fe-f0ef-464e-8c5f-4134ab0ccb09
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: efbe2dc9371a51f54702791434656f1ea4f12ec2
  cpee:exposition: |-
    # User Input:
    Antrag der Studierenden              Schriftlich per Mail

    an Schriftführung             Spätestens Anfang der Prüfungsanmeldephase   Studierende               Antrag und Attest                          Adressat ggf. bei anderen Schools unterschiedlich

    Formale Prüfung              Prüfung auf Vollständigkeit und Glaubhaftmachung         Nach Erhalt des Antrags        Schriftführung

                   Antrag und Attest                         

    inhaltliche Prüfung          Entscheidung über Form des Nachteilsausgleichs             Nach formaler Prüfung             PA-Vorsitzender

    (Schriftführung – in Absprache mit PA-Vorsitz)   Antrag und Attest                          Wäre Delegation auf Schriftführung möglich?

    bei anderen Schoolsev. anders

    Verbescheidung               Bescheid / E-Mail            Nach fachlicher Prüfung               Schriftführung    Bescheid, ggf. Fallbedingt

    Rechtsbehelfsbelehrung                              Überlegung, ob nicht standardmäßig Rechtsbehelfsbelehrung beigefügt wird

    Liste über NTA                 Fortlaufend        Schriftführung    Excel / NAS Laufwerk                    Ggf. automatische Outlook E-Mail

    Info über geplante Prüfungen     Mail an Schriftführung   Vor Enddatum der Anmeldephase               Studierende        Mail                     

    Alle NTA zusammenfassen           Manuell in Excel-Tabelle              ab Enddatum der Anmeldephase   Schriftführungen              Excel-Tabelle                   

    Information der Prüfenden          Mail an Prüfende             ab Enddatum der Anmeldephase               Schriftführung    Excel-Tabelle                    Auch über TO möglich/

    Verstößt es gegen den Datenschutz, wenn alle Prüfenden den Nachteilsausgleich sehen und Studierende nicht auswählen können für welche Prüfung?

    Organisation von Raum/Aufsicht              Buchung zusätzlicher Räume, zusätzliche Aufsicht, Bereitstellen von IT-Unterstützung, usw.              Vor der Prüfung               Prüfender                                         

    Studierende kontaktieren Prüfende        Mail       Bis 14 Tage vor der Prüfung        Studierende               Mail                      In Standard-E-Mail sind die Pflichten des Studierenden enthalten

    Informationen über Prüfungsmodalitäten und Raum      Mail       Vor der Prüfung               Prüfende             Mail
  time:timestamp: '2026-04-07T15:58:36.832550+02:00'
