    -       exclusive gateway with the condition ÜSdedicated communication channels exist?⬝; and

    -       exclusive gateway with the condition ÜSSMEs fulfil the eligibility conditions?⬝

    The exclusive gateway with the condition ÜSSMEs fulfil the eligibility conditions?⬝ has two paths: ÜSyes⬝ leads to ÜSProvide with priority access to the AI regulatory sandboxes⬝ which is sending a message flow to SME, which SME receives as ÜSreceive access⬝ and starts its process, which then connects to joint gateway and ÜSno⬝ leads to joint gateway.

    The exclusive gateway with the condition ÜSdedicated communication channels exist?⬝ has two paths: ÜSyes⬝ leads to ÜSUtilise existing channels⬝, sending a message flow to SME, and ÜSno⬝ leads to ÜSEstablish new channels⬝, also sending a message flow to SME. Then both paths are connected with joint exclusive gateway, after which SME ÜSShare interests and needs⬝, sends message flow and ends its process and so a message event ÜSReceive interests and needs⬝ is received by Member State and the task ÜSTake the needs into account when setting fees⬝ happens. Now, all these elements are connected with joint parallel gateway and the process ends for the Member State.

     

    The parallel gateway of AI Office includes the following activities occurring in parallel:

    -       ÜSEvaluate the convergence of best practices⬝ and following ÜSPromote the convergence of best practices⬝;

    -       ÜSOrganise appropriate communication campaigns⬝;

    -       ÜSDevelop a single information platform⬝ and following ÜSMaintain a single information platform⬝;

    -       receiving a message ÜSReceive request⬝ from the Board’s task ÜSRequest standardised templates⬝ before the task ÜSProvide standardised templates⬝, which sends the templates to the Board and the board ends its process.

    Now, the parallel gateway joints all elements of AI Office and ends the process.

     
  time:timestamp: '2026-03-23T13:42:07.003957+01:00'
