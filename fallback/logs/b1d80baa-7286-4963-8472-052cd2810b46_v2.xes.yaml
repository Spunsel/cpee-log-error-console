event:
  concept:instance: 523
  id:id: ex-ante
  cpee:instance: b1d80baa-7286-4963-8472-052cd2810b46
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: e8be667036f66f4512aa10b42d870621aad14c42
  cpee:exposition: |-
    # User Input:
    The process starts and is immediately followed by two sequential activities. After these activities are completed, a decision is made, and the process continues down one of two alternative paths.


    If the first path is taken, an activity is performed. This leads to another decision point where one of five mutually exclusive paths is chosen. Each of these five paths consists of a single, unique activity. After the activity on the chosen path is completed, all five paths merge back together. Following the merge, one more activity is performed.


    If the second path is taken from the first decision point, an activity is performed. This is followed by a decision where one of four mutually exclusive paths is selected. Each of these four paths contains a single, distinct activity. Once the activity on the selected path is finished, all four paths converge. After they converge, another activity is carried out.


    Both of the main paths, originating from the first decision, now merge into a single flow. From this point, two final activities are performed in sequence. Upon completion of the second activity, the process concludes.
  time:timestamp: '2026-03-23T12:52:39.858828+01:00'
