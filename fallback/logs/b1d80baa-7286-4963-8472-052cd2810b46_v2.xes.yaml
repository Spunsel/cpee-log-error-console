event:
  concept:instance: 523
  id:id: ex-ante
  cpee:instance: b1d80baa-7286-4963-8472-052cd2810b46
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 0b41eecf3ae57b4fec3888437aa817582d06a350
  cpee:exposition: |-
    # User Input:
    The process starts with two parallel subprocesses: one for Member State and one for AI Office.

     

    The parallel gateway of Member State includes: ÜSFacilitate the participation in the development process⬝ which sends the message flow to SME; exclusive gateway with the condition ÜSdedicated communication channels exist?⬝; and exclusive gateway with the condition ÜSSMEs fulfil the eligibility conditions?⬝ The exclusive gateway with the condition ÜSSMEs fulfil the eligibility conditions?⬝ has two paths: ÜSyes⬝ leads to ÜSProvide with priority access to the AI regulatory sandboxes⬝ which is sending a message flow to SME, which SME receives as ÜSreceive access⬝ and starts its process, which then connects to joint gateway and ÜSno⬝ leads to joint gateway. The exclusive gateway with the condition ÜSdedicated communication channels exist?⬝ has two paths: ÜSyes⬝ leads to ÜSUtilise existing channels⬝, sending a message flow to SME, and ÜSno⬝ leads to ÜSEstablish new channels⬝, also sending a message flow to SME. Then both paths are connected with joint exclusive gateway, after which SME ÜSShare interests and needs⬝, sends message flow and ends its process and so a message event ÜSReceive interests and needs⬝ is received by Member State and the task ÜSTake the needs into account when setting fees⬝ happens. Now, all these elements are connected with joint parallel gateway and the process ends for the Member State.

     

    The parallel gateway of AI Office includes: ÜSEvaluate the convergence of best practices⬝ and following ÜSPromote the convergence of best practices⬝; ÜSOrganise appropriate communication campaigns⬝; ÜSDevelop a single information platform⬝ and following ÜSMaintain a single information platform⬝; receiving a message ÜSReceive request⬝ from the Board’s task ÜSRequest standardised templates⬝ before the task ÜSProvide standardised templates⬝, which sends the templates to the Board and the board ends its process. Now, the parallel gateway joints all elements of AI Office and ends the process.

     
  time:timestamp: '2026-03-23T13:38:19.860944+01:00'
