event:
  concept:instance: 523
  id:id: ex-ante
  cpee:instance: b1d80baa-7286-4963-8472-052cd2810b46
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 5fe23b427b798a37b62c789ad35d0f8e068d7d27
  cpee:exposition: |-
    # User Input:
    The process contains the following actors: Member State, AI Office, SME, and Board.

     

    The process starts with two parallel subprocesses: one for Member State and one for AI Office.

     

    Following activities occur in parallel for Member State:

    -       Member State shall facilitate the participation of SMEs and other relevant stakeholders in the standardisation development process;

    -       Member State shall organise specific awareness raising and training activities

    -       Member State shall either utilise existing dedicated channels OR Member State shall establish new channels if no exist. After that, SME may share interests and needs and following, Member State take into account the specific interests and needs;

    -       Member State shall provide SMEs with priority access to the AI regulatory sandboxes to the extent that they fulfil the eligibility conditions and selection criteria and having a registered office or a branch in the Union

     

    Following activities occur in parallel for AI Office:

    -       Board shall request standardised templates and after that AI Office shall provide standardised templates;

    -       AI Office shall develop a single information platform and afterwards maintain a single information platform;

    -       AI Office shall organise appropriate communication campaigns;

    -       AI Office shall evaluate the convergence of best practices in public procurement procedures in relation to AI systems. Then, AI Office shall promote the convergence of best practices in public procurement procedures in relation to AI systems
  time:timestamp: '2026-03-23T19:51:07.313937+01:00'
