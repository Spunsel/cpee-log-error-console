event:
  concept:instance: 39
  id:id: ex-ante
  cpee:instance: 9798d3a4-8333-43d8-abbf-d1eeda668b54
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: acb295cf8c3e0ccb71c03e4d048313b6931066e9
  cpee:exposition: |-
    # User Input:
    输电线路日常巡视流程
    按照流程图执行周期巡视任务：接收巡视计划→现场巡视（通道、杆塔、导地线、绝缘子、金具）→数据记录与拍照→缺陷初步判定→录入运维系统。流程图明确巡视点位、周期、标准，杜绝漏巡、漏记，保障基础质量。
    2. 线路缺陷分级与上报流程
    依据流程图对缺陷统一管理：发现缺陷→等级判定（一般 / 严重 / 紧急）→分类登记→逐级上报→下达处理指令。流程图严格规定上报时限与处置要求，避免缺陷扩大引发线路故障。
    3. 输电线路停电检修作业流程
    检修作业依照流程图执行：申请停电→办理工作票→现场安全措施（挂接地线、设围栏）→开工检修→更换部件 / 紧固螺栓 / 通道清障→质量自检→现场验收→拆除安全措施→工作终结→恢复送电。流程图固化关键质量控制点，防止漏项、错项，保证检修质量。
    4. 线路施工质量过程管控流程
    新建、改造线路按流程图开展质量控制：基础施工检查→杆塔组立精度校验→导地线架设张力控制→附件安装核查→接地装置测试→中间验收。不合格项按流程图立即整改，复检合格后方可进入下一工序。
    5. 竣工投产验收流程
    按照流程图完成最终质量把关：资料核查→现场全面检查→电气试验（绝缘、接地等）→缺陷整改闭环→质量评定→签署验收意见→移交投运。流程图确保验收无遗漏，线路达标后方可入网运行。
    6. 故障抢修与质量闭环流程
    线路故障时依照流程图快速处置：故障告警→故障定位→组织抢修→消除缺陷→试验检查→恢复供电→原因分析→制定预防措施→归档。流程图实现抢修标准化，同时形成质量闭环，降低重复故障率。
  time:timestamp: '2026-03-17T09:01:26.346946+01:00'
