event:
  concept:instance: 82151
  id:id: external
  cpee:activity: external
  cpee:instance: 58353131-f648-483e-8cfa-604e2dfd823e
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 189acb851f22caf130b6f35ca0669e5cb63ed6fd
  cpee:exposition: |-
    %% Output Intermediate
    Textual Description (translated from Polish):
    Prepare a simple complaint process model.

    A customer submits a complaint. The complaint is then reviewed. If the complaint is valid, the product is replaced and the customer is notified. If the complaint is not valid, the customer is notified about the rejection. The process ends when the customer receives the notification.

    Mermaid.js BPMN Model:

    ```mermaid
    graph LR
    0:startevent:((startevent)) --> 1:task:(Customer submits a complaint)
    1:task:(Customer submits a complaint) --> 2:task:(Review complaint)
    2:task:(Review complaint) --> 3:exclusivegateway:{x}
    3:exclusivegateway:{x} --> |Complaint is valid| 4:task:(Replace product)
    3:exclusivegateway:{x} --> |Complaint is not valid| 5:task:(Notify customer about rejection)
    4:task:(Replace product) --> 6:task:(Notify customer)
    5:task:(Notify customer about rejection) --> 7:endevent:(((endevent)))
    6:task:(Notify customer) --> 7:endevent:(((endevent)))
    ```
  time:timestamp: '2025-12-05T17:57:51.642561+01:00'
