    se:startevent:((startevent))-->a1:task:(Customer submits a complaint)
    a1:task:(Customer submits a complaint)-->a3:task:(Review complaint)
    a3:task:(Review complaint)-->gw1s:parallelgateway:{AND}
    -->a7:task:(Financial department reviews complaint)
    a7:task:(Financial department reviews complaint)-->gw1e:parallelgateway:{AND}
    -->a9:task:(Technical department reviews complaint)
    a9:task:(Technical department reviews complaint)-->gw1e:parallelgateway:{AND}
    gw1e:parallelgateway:{AND}-->gw2s:exclusivegateway:{x}
    gw2s:exclusivegateway:{x}-->|"Complaint is valid"|a17:task:(Replace product)
    a17:task:(Replace product)-->a19:task:(Notify customer)
    a19:task:(Notify customer)-->gw2e:exclusivegateway:{x}
    gw2s:exclusivegateway:{x}-->|"Complaint is not valid"|a23:task:(Notify customer about rejection)
    a23:task:(Notify customer about rejection)-->gw2e:exclusivegateway:{x}
    gw2e:exclusivegateway:{x}-->ee:endevent:((endevent))
