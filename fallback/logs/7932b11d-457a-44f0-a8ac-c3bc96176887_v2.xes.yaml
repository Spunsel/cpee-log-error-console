event:
  concept:instance: 12377
  id:id: external
  cpee:activity: external
  cpee:instance: 7932b11d-457a-44f0-a8ac-c3bc96176887
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 0d5f37b3b7bb49325e8a30cee2d5610c733e0c64
  cpee:exposition: |-
    # User Input:
    Eine Agentur die einen Service zum Design und zur Erstellung von modularen Webseiten anbietet möchte
    ihre Produktpalette erweitern. Hierzu wird zunächst ein Projekt vom Management initiiert. Im ersten Schritt
    wird die Marketingabteilung beauftragt eine Kampagne zu erstellen, um an die Wünsche der Kunden zu
    gelangen. Nachdem die Kampagne an die Kunden verschickt wurden, werden die Antworten dieser gespeichert.
    Anschließend werden die Antworten von der Analyseabteilung ausgewertet. Die Resultate der Auswertung
    durch die Analyseabteilung werden gespeichert und dem Management präsentiert. Auf Basis der Resultate
    entscheidet das Management ob das Projekt fortgesetzt oder beendet wird. Wird das Projekt beendet endet
    auch der Prozess. Wird das Projekt fortgesetzt bearbeiten die Kreativ- und IT-Abteilung parallel die vom
    Management festgelegten Aufgaben. Das Projekt ist abgeschlossen sobald alle Aufgaben erledigt sind.
  time:timestamp: '2025-11-12T13:01:18.710395+01:00'
