event:
  concept:instance: 76397
  id:id: external
  cpee:activity: external
  cpee:instance: 7ea4d238-0cf4-447d-b0a5-a9fa5828e9fd
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: a96738865a46d7f02b3ff7a6ecca347e2a51c64c
  cpee:exposition: |-
    # User Input:
    On a beautiful autumn day, Lothar cycles to sports practice. In downtown Würzburg, due to a brief lapse in attention, his front wheel gets caught in the tram rails and he falls onto his right wrist. He can barely move it anymore and realizes that something is wrong. Therefore, he decides to go to his family doctor.


    His family doctor conducts a brief medical history and physical examination. She documents the results in Lothar’s paper medical record. The wrist is only slightly swollen and the doctor suspects merely a bruise. Since Lothar also has an abrasion on his knee, she asks about his tetanus vaccination status. Lothar has to admit that he has lost his vaccination booklet and cannot remember when his last vaccination was. He therefore receives a booster shot and is issued a new paper vaccination record. To rule out a fracture of the right wrist, she gives Lothar a referral for an X-ray.


    Lothar spends the entire afternoon making phone calls and finally finds a radiology practice that can squeeze him in for an appointment the following day. When he arrives, information such as previous illnesses, prior imaging, medications, and allergies is collected. The X-ray of the wrist is taken in two views. Since the practice is very busy, Lothar is given the X-ray images on a CD and is told that the radiologist will call him if anything abnormal is found. His family doctor will receive the report by mail in the coming days. That same afternoon, Lothar receives a call from the radiologist informing him that he has a non-displaced fracture of the radius. The radiologist recommends that he present to a trauma surgery clinic the same day.


    Lothar decides to go straight to a hospital. After arriving, he waits several hours in the emergency department. During the waiting time, Lothar answers work emails and watches a movie on his phone. When he is finally called in, the trauma surgeon takes his medical history again, asking about previous illnesses, medication, and allergies. He also asks about tetanus protection, and Lothar proudly presents his new vaccination booklet. Lothar takes medication but does not know which ones. The young trauma surgeon calls the family doctor’s office, but it is already closed.


    The X-ray images on the CD cannot be opened, but fortunately Lothar has taken photos of the images with his phone. The young doctor is unsure whether surgery is required. Since it is already late and the only senior physician in the hospital is tied up in the operating room, the arm is put in a cast and Lothar is advised to return the next day to clarify whether surgery is necessary. He is asked to bring a new CD with the X-ray images. Lothar receives a prescription for painkillers and a certificate of incapacity for work for four weeks.


    The next day at 8:00 a.m., Lothar goes to the radiology practice to have a new CD made. Afterwards, he returns to the hospital. There he waits several more hours before being called in again. During this time, Lothar orders a gift for his godchild online and cancels his hotel booking for the climbing holiday he had planned.


    When he is finally called in, a different doctor sees him and once again takes his medical history. This time, the CD can thankfully be read. His medication plan is requested by fax from his family doctor. The senior trauma consultant determines that surgery is indicated. However, she notices that the distance between the lunate and scaphoid bones is increased. She asks Lothar if this is known to him, as it is a sign of a scapholunate ligament injury. If he had older X-rays, this could also be assessed. Lothar states that he injured his right wrist many years ago but no longer remembers exactly what happened. X-rays were taken, but he does not have them. It is decided to perform an MRI to rule out injury to the scapholunate ligament before surgery. It is already very late and Lothar can no longer submit his sick note to his employer. Fortunately, the next MRI appointment is not until two days later, giving him enough time to submit it.


    On the day of the MRI, Lothar comes to the radiology department. Since he has an appointment, he does not have to wait long. Once again, previous illnesses, prior imaging, and allergies are asked about. The radiologist knows that surgery is planned and, after reviewing the images, calls the senior trauma surgeon to inform her that it is an old injury. Lothar is seen in the trauma surgery outpatient clinic the same day, and the surgery date is scheduled for the upcoming Monday.


    Lothar now goes to the anesthesia department for the preoperative consultation. Here, he has to answer questions about previous illnesses, medications, and allergies once again—what feels like the thousandth time. When he is admitted to the ward, he has to provide the same information to the nursing staff.


    On the day of surgery, Lothar reports to the ward at 6:30 a.m. The ward doctor is already quite agitated, having discovered that the printed consent form has been lost. He tells Lothar that surgery cannot take place without documentation of consent, as same-day consent is not legally permitted. However, Lothar is prepared and is able to present his own copy of the consent form, much to the doctor’s relief.


    The rest of the process before surgery is uneventful. During induction in the operating room, however, things become hectic after the local anesthetic for the brachial plexus block is administered. Lothar suffers an anaphylactic shock, and the anesthesia team needs several minutes to stabilize him. Ultimately, general anesthesia is performed and the rest of the operation proceeds without complications.


    After spending one night each in the intensive care unit and on a general ward, Lothar is discharged. He is given a printed allergy card for the anesthetic. The follow-up treatment is discussed during the discharge conversation. Due to staff shortages, the discharge letter is not yet ready and must be sent by mail to his family doctor.


    Subsequent wound checks and suture removal are performed by his family doctor, who also issues prescriptions for pain medication and physical therapy. On the way to the pharmacy, Lothar realizes that he has lost the prescription for the medication. The doctor’s office is already closed, so he buys over-the-counter painkillers instead.


    Lothar searches the internet for physical therapy practices. Only the twelfth practice he contacts is able to offer him an appointment—in four weeks. Until then, Lothar watches YouTube videos with exercises for distal radius fractures and practices on his own.


    Four weeks later, Lothar attends his appointment at the physical therapy practice. The experienced physiotherapist asks whether he has brought the aftercare plan with him. Of course, he still has not picked it up from his family doctor…
  time:timestamp: '2025-11-30T16:23:00.707076+01:00'
