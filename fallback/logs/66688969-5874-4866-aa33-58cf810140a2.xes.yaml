  cpee:change_uuid: e77023a5b994609f86aeb412fa12b3710ba83128
  cpee:exposition: "# User Input:\nDie Firma Superduperproduction nimmt Auftr¨age
    fur die Planung und den Bau von Produktionshallen ¨ entgegen. Der Prozess beginnt,
    sobald die beauftragende Firma Informationen zur Gr¨oße und zum Verwen\x02dungszweck
    des geplanten Standorts ubermittelt. Ein Architekt begutachtet die Gegebenheiten
    vor Ort und ¨ erstellt ein Gutachten ob das Projekt dort realisierbar ist oder
    nicht. Kann das Projekt nicht realisiert wer\x02den kann die beauftragende Firma
    entweder den Auftrag zuruckziehen, wodurch der Prozess endet oder ¨ solange neue
    Standortvorschl¨age einbringen bis das Gutachten positiv ausf¨allt. Danach erarbeitet
    die Pla\x02nungsabteilung einen konkreten Konstruktionsvorschlag fur den gew ¨
    ¨ahlten Standort. W¨ahrenddessen erstellt die Finanzabteilung der Baufirma auch
    einen Kostenplan fur den Auftrag. Die beauftragende Firma kann den ¨ Gesamtvorschlag
    dann annehmen oder ablehnen. Lehnt sie ihn ab, endet der Prozess. Nimmt die Firma
    den Vorschlag an erstellt Superduperproduction eine Ausschreibung um eine externe
    Baufirma zu finden. Nach dem erfolgreichen Bau der Halle durch die externe Firma
    wird eine Rechnung an die beauftragende Firma geschickt. Der Prozess endet hiermit."
  time:timestamp: '2025-12-21T11:22:23.568815+01:00'
