event:
  concept:instance: 104630
  id:id: external
  cpee:activity: external
  cpee:instance: fbe8a625-7889-4ae6-8d0e-0bb42e59e2d1
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: ef6c2e24820718802c7760274f740793b1eb1230
  cpee:exposition: |-
    # User Input:
    After receiving the customer’s order, it is forwarded to the respective manufacturing teams.
    The production process then splits into three parallel branches:
    Manufacture the seats,
    Set the water amount, and
    Manufacture the selected bars.
    The bar manufacturing process operates as an inclusive subprocess. Depending on the
    customer's customization, any combination of the five available bar types � Vodka, Whiskey,
    Wine, Gin, and Juice Bar � may be produced, including none, some, or all of them. The
    process continues once all selected bars have been manufactured. Once all parallel tasks �
    seat manufacturing, water adjustment, and the selected bar productions � are completed,
    the process flow continues with assembling the airplane interior.
    After the interior has been assembled, the plane undergoes a test flight. During this flight, the
    system collects flight data. Then, after the flight, a test protocol should be created.
    Once the protocol is complete, it is sent simultaneously to both the manufacturer (ÜSme⬝) and
    the customer for review. Finally, the airplane is delivered to the customer, who must confirm
    receipt and acceptance of the product, thereby completing the process.
  time:timestamp: '2026-01-13T13:21:11.252990+01:00'
