event:
  concept:instance: 488
  id:id: ex-ante
  cpee:instance: 5c82d1cd-1483-4b02-b754-daf6e805cbe0
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 50b37d0c1275088796f90af9a982325ae18e3b20
  cpee:exposition: |-
    # User Input:
    The process starts when a personnel request is submitted durch einstellende Abteilung. Subsequently, a job advertisement is created durch Fine and then approved durch einstellende Abteilung. Following the approval, a decision is made based on whether there are suitable applicants. If there are no suitable applicants, the personnel department is informed, leading to a decision on whether to recruit foreign workers. If the decision is to recruit foreign workers, budget approval is obtained, and the purchasing department is informed. Then, a requirements catalog is created, the purchasing department requests proposals from agencies, and an agency is commissioned. Alternatively, if suitable domestic applicants are available after 3 months, they are directly hired. The process ends after either the agency is commissioned or the direct hiring is completed.
  time:timestamp: '2026-03-20T08:49:04.620698+01:00'
