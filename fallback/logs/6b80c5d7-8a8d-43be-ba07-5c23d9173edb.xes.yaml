  cpee:exposition: |-
    # User Input:
    To purchase a product from the machine, customers first select what product they
    want, and then proceed to payment. Before proceeding, the machine records the
    payment as either having failed or as accepted. The machine can then deliver the
    selected product to the customer. Note that the machine cannot deliver the product
    before a successful payment
  time:timestamp: '2026-03-26T11:50:01.348664+01:00'
