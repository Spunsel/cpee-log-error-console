    4:endevent:(((End)))
    5:task:(Inform Storehouse and Engineering)
    6:parallelgateway:{AND}
    7:task:(Process Part List)
    8:task:(Prepare for Assembling)
    9:parallelgateway:{AND}
    10:task:(Assemble Bicycle)
    11:task:(Ship Bicycle)
    12:endevent:(((End)))
    13:exclusivegateway:{x}
    14:task:(Reserve Part)
    15:task:(Back-order Part)

    0:startevent:((Start)) --> 1:task:(Receive Order)
    1:task:(Receive Order) --> 2:exclusivegateway:{x}
    2:exclusivegateway:{x} --> |Reject| 3:task:(Reject Order)
    2:exclusivegateway:{x} --> |Accept| 5:task:(Inform Storehouse and Engineering)
    3:task:(Reject Order) --> 4:endevent:(((End)))
    5:task:(Inform Storehouse and Engineering) --> 6:parallelgateway:{AND}
    6:parallelgateway:{AND} --> 7:task:(Process Part List)
    6:parallelgateway:{AND} --> 8:task:(Prepare for Assembling)
    7:task:(Process Part List) --> 13:exclusivegateway:{x}
    13:exclusivegateway:{x} --> |Available| 14:task:(Reserve Part)
    13:exclusivegateway:{x} --> |Not Available| 15:task:(Back-order Part)
    14:task:(Reserve Part) --> 9:parallelgateway:{AND}
    15:task:(Back-order Part) --> 9:parallelgateway:{AND}
    8:task:(Prepare for Assembling) --> 9:parallelgateway:{AND}
    9:parallelgateway:{AND} --> 10:task:(Assemble Bicycle)
    10:task:(Assemble Bicycle) --> 11:task:(Ship Bicycle)
    11:task:(Ship Bicycle) --> 12:endevent:(((End)))
    ```
