event:
  concept:instance: 9462
  id:id: ex-ante
  cpee:instance: e6b16583-d7a5-410b-85bf-4c27f17577ec
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: c648e08405881ce7d8e526b10bd68ecc7cd7c85f
  cpee:exposition: |-
    # User Input:
    Die Visite beginnt mit der Vorbereitung, bei der das Ärzteteam und das Pflegepersonal die aktuellen Patientenakten, Laborwerte und Befunde der letzten Stunden sichten. Anschließend begibt sich die Gruppe an das Patientenbett, um die Visite durchzuführen: Der behandelnde Arzt bespricht mit dem Patienten den aktuellen Gesundheitszustand, führt gegebenenfalls eine kurze körperliche Untersuchung durch und erläutert die nächsten Behandlungsschritte.

    Dabei werden direkt am Bett Entscheidungen über weitere Maßnahmen getroffen, wie etwa die Anpassung der Medikation, die Anordnung neuer Diagnostik (z. B. Röntgen oder Blutentnahme) oder die Planung der Entlassung. Abschließend erfolgt die Dokumentation und Umsetzung: Die Pflegekraft und die Ärzte übertragen die Ergebnisse in die Patientenkurve, lösen die entsprechenden Bestellungen im System aus und informieren gegebenenfalls andere Fachabteilungen über die notwendigen Folgeschritte.
  time:timestamp: '2026-04-16T12:18:20.278212+02:00'
