  cpee:exposition: |+
    # User Input:
    The process starts when an application form is filled out. The filled-out application is then submitted. Depending on whether the application meets the requirements, it is either rejected or sent for review. If the application is rejected, the process ends. If the application is accepted, the tuition fee is paid. After the fee is paid, two activities occur in parallel: attending orientation and receiving a student ID. Once both activities are completed, the courses are enrolled in, and the process ends.


