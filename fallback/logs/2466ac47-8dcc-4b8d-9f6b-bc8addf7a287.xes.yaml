event:
  concept:instance: 82050
  id:id: external
  cpee:activity: external
  cpee:instance: 2466ac47-8dcc-4b8d-9f6b-bc8addf7a287
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: a6266dfca766e0b4cadd99527f34ec6f3a5d07c2
  cpee:exposition: |-
    %% Output Intermediate
    Textual Description:
    A student applies for enrollment. The university checks if the student meets the admission requirements. If the student meets the requirements, the student is enrolled and notified. If the student does not meet the requirements, the student is notified about the rejection. After the student is notified, the process ends.

    Mermaid.js BPMN Model:

    ```mermaid
    graph LR
    0:startevent:((startevent)) --> 1:task:(Student applies for enrollment)
    1:task:(Student applies for enrollment) --> 2:exclusivegateway:{x}
    2:exclusivegateway:{x} --> |Meets requirements| 3:task:(Enroll student)
    2:exclusivegateway:{x} --> |Does not meet requirements| 4:task:(Notify student about rejection)
    3:task:(Enroll student) --> 5:task:(Notify student)
    4:task:(Notify student about rejection) --> 6:exclusivegateway:{x}
    5:task:(Notify student) --> 6:exclusivegateway:{x}
    6:exclusivegateway:{x} --> 7:endevent:(((endevent)))
    ```
    This model represents the described process. The student applies for enrollment, which is then checked for admission requirements. Depending on the requirements status, the student is either enrolled or notified about the rejection. After the student is notified, the process ends.
  time:timestamp: '2025-12-03T19:37:46.782761+01:00'
