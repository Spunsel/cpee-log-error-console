        8:parallelgateway:{AND} --> 10:task:(Enroll in Courses)
        10:task:(Enroll in Courses) --> 11:exclusivegateway:{x}
        3:exclusivegateway:{x} --> |"Does Not Meet Requirements"| 12:task:(Reject Application)
        12:task:(Reject Application) --> 11:exclusivegateway:{x}
        11:exclusivegateway:{x} --> 13:endevent:(((endevent)))
    ```
