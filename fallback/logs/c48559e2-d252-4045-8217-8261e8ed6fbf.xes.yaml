event:
  concept:instance: 920
  id:id: external
  cpee:activity: external
  cpee:instance: c48559e2-d252-4045-8217-8261e8ed6fbf
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 43a53d5e874c6ab0862c742ea375d8a6aab12c34
  cpee:exposition: |-
    # User Input:
    A Customer reaches out to the Bank, submitting a Credit Request hoping to secure a loan. The request lands with a
    Sales Representative, who begins reviewing the details to ensure everything is in order. Once the review is complete,
    the request is handed off for further action in two important areas. On one side, a Risk Analyst begins evaluating the
    financial risk of approving the credit, considering the customer’s financial history and the overall risk involved in
    granting the loan. At the same time, the Sales Representative looks at the terms of the credit. If the customer qualifies
    for standard terms, the Sales Representative calculates those terms directly. However, if the situation requires special
    consideration, a Sales Manager steps in to prepare custom terms according to the customer’s needs. With the terms
    settled, the Sales Representative prepares a contract. As both the Risk Analyst completes the risk assessment and the
    Sales Representative finalizes the contract, the process moves forward, and the Sales Representative sends the official
    quote back to the Customer. Once the customer receives the quote, the process reaches its end.
  time:timestamp: '2025-10-28T13:31:24.470130+01:00'
