event:
  concept:instance: 34
  id:id: ex-ante
  cpee:instance: '0397d09f-d256-4039-82f0-134719a34ac4'
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 10f04ab9b60a228fb514cc6bac6b0128b72fdaec
  cpee:exposition: |-
    # User Input:
    来料检验（IQC）
    物料入库前，IQC 按流程图规定的抽检比例、检验项目（外观、尺寸、性能）进行检测。
    合格：流入仓库，进入生产环节。
    不合格：按流程图判定拒收 / 返工 / 特采，并记录异常。
    制程巡检（IPQC）
    生产线上按固定频次巡检，流程图明确关键工序控制点。
    正常：继续生产。
    异常：立即按流程图执行停机→标识隔离→原因分析→整改→复检。
    成品终检（FQC）
    成品下线后，依据流程图逐项核对功能、外观、包装、标签。
    合格：流转至待出货区。
    不合格：进入返工 / 报废流程，流程图规定返工最多 1 次，避免重复不良。
    出货抽检（OQC）
    出货前按流程图执行批量抽检。
    合格：允许出货。
    不合格：整批隔离，重新全检，同时启动纠正预防措施（CAPA）。
    客诉反馈与闭环
    客户反馈质量问题后，按流程图追溯：
    客诉登记→问题重现→定位工序→责任判定→整改→验证→关闭。
    流程图确保每一步可追溯、不遗漏。
  time:timestamp: '2026-03-17T08:51:22.573482+01:00'
