    1:task:(Receive Pizza Order) --> 2:task:(Prepare Pizza)
    2:task:(Prepare Pizza) --> 3:exclusivegateway:{x}
    3:exclusivegateway:{x} --> |Order Confirmed| 4:task:(Bake Pizza)
    3:exclusivegateway:{x} --> |Order Cancelled| 8:task:(Notify Customer)
    4:task:(Bake Pizza) --> 5:task:(Package Pizza)
    5:task:(Package Pizza) --> 6:task:(Deliver Pizza)
    6:task:(Deliver Pizza) --> 9:task:(Handle Payment)
    9:task:(Handle Payment) --> 7:endevent:(((End Event)))
    8:task:(Notify Customer) --> 7:endevent:(((End Event)))
