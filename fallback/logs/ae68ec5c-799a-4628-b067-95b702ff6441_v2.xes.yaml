event:
  concept:instance: 9562
  id:id: ex-ante
  cpee:instance: ae68ec5c-799a-4628-b067-95b702ff6441
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 59ae18f1e7e61f8114327ac2686f2400b3b7c532
  cpee:exposition: |-
    # User Input:
    Every weekday morning , the database is backed up and then it is checked to see whether the Account Defaulter table has new records .
    If no new records are found , then the process should check the CRM system to see whether new returns have been filed .
    If new returns exist , then register all defaulting accounts and customers .
    If the defaulting client codes have not been previously advised , produce another table of defaulting accounts and send to account management .
    All of this must be completed by 2 : 30 pm , if it is not , then an alert should be sent to the supervisor .
    Once the new defaulting account report has been completed , check the CRM system to see whether new returns have been filed .
    If new returns have been filed , reconcile with the existing account defaulters table .
    This must be completed by 4 : 0 pm otherwise a supervisor should be sent a message .
  time:timestamp: '2026-04-20T00:08:39.527263+02:00'
