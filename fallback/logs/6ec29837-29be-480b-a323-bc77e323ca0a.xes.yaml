    # User Input:
    Article 23: Reporting obligations
    1 Each Member State shall ensure that essential and important entities notify its CSIRT or, where applicable, its with paragraph 4 of any incident.
    shall notify the recipients of their services of significant incidents.
    Each Member State shall ensure that those entities report any information enabling the CSIRT or, where applicable, determine any cross-border impact of the incident.
    The mere act of notification shall not subject the notifying entity to increased liability.
    the entities concerned notify the competent authority of a significant incident under the first subparagraph, the Member State shall ensure that that competent authority forwards the notification to the CSIRT upon receipt.
    In the case of a cross-border or cross-sectoral significant incident, Member States shall ensure.
    2 Member States shall ensure that essential and important entities communicate to the recipients of their services that are potentially affected by a significant cyber threat any measures or remedies that those recipients are able to take in response to that threat.
    shall also inform those recipients of the significant cyber threat itself.
    3(a) An incident shall be considered by Member States to be significant if Member States has caused or is capable of causing severe operational disruption of the services or financial loss for the entity concerned AND
    3(b) An incident shall be considered by Member States to be significant if Member States has affected or is capable of affecting other natural or legal persons by causing considerable material or non-material damage
    4(a) Member States shall ensure that, for the purpose of notification under paragraph 1, the entities concerned submit to the CSIRT orthe competent authority and in any event within 24 hours of becoming aware of the significant incident, an early warning, which, where applicablethe significant incident is suspected by Member States of being caused by unlawful or malicious acts or could have a cross-border impact AND
    4(b) Member States shall ensure that, for the purpose of notification under paragraph 1, the entities concerned submit to the CSIRT orthe competent authority and in any event within 72 hours of becoming aware of the significant incident, an incident notification, which, where the significant incident, including its, where availablecompromise AND
    4(c) Member States shall ensure that, for the purpose of notification under paragraph 1, the entities concerned submit to the CSIRT orthe competent authority upon the request of a CSIRT orthe competent authority, an intermediate report on relevant status updates AND
    4(d) Member States shall ensure that, for the purpose of notification under paragraph 1, the entities concerned submit to the CSIRT orthe competent authority a final report not later than one month after the submission of the incident notification under point (b) AND
    4(i) Member States shall ensure that, for the purpose of notification under paragraph 1, the entities concerned submit to the CSIRT orthe competent authority a detailed description of the incident; (ii) the type of threat or root cause; (iii) applied and ongoing mitigation measures; (iv) the cross-border impact of the incident AND
    4(e) Member States shall ensure that, for the purpose of notification under paragraph 1, the entities concerned submit to the CSIRT orthe competent authority in the event of an ongoing incident at the time of the submission of the final entities concerned provide a progress report at that time and a final report within one month of their handling of the incident. By way of derogation from the first subparagraph, point (b), a trust service provider shall, with regard to significant incidents, notify the CSIRT orthe competent authority and in any event within 24 hours of becoming aware of the significant incident
    5 The CSIRT or the competent authority shall provide and where possible within 24 receiving the early to the notifying entity, including initial feedback entity, guidance or operational advice on the implementation of possible mitigation measures.
    The CSIRT shall provide additional technical support if the entity concerned so requests.
    the significant incident is suspected by CSIRT to be of criminal nature, the CSIRT or the competent authority shall also provide guidance on reporting the significant incident to law enforcement authorities.
    6 particular where the incident concerns two or more Member States, the CSIRT, the competent authority or the single point of contact shall inform the other affected Member States and ENISA of the significant incident.
    Such information shall include the type of information
    7 is necessary to prevent a significant incident or to deal with an ongoing significant incident, or of the significant incident is otherwise in the public interest, a Member Stateâ€™s CSIRT orits competent authority, and competent authorities of other Member States concerned, may, after consulting the entity concerned, inform the public about the significant incident or require the entity to do so.
    8 At the request of the CSIRT or the competent authority, the single point of contact shall forward Member States.
    9 The single point of contact shall submit to ENISA every three months a summary reportincidents, cyber threats and near misses
    In order to contribute to the provision of comparable information, ENISA may adopt technical guidance on the parameters of the information to be included by ENISA in the summary report.
    ENISA shall inform the Cooperation Group and the CSIRTs network about its findings on notifications received every six months.
    10 The CSIRTs orthe competent authorities shall provide to the competent authorities under information about significant incidents, incidents, cyber threats and near misses entities identified as critical entities.
    11 The Commission may adopt implementing acts further specifying the type of information, the format and the procedure of a a
    By 17 October 2024, the Commission shall, with regard to DNS service providers, TLD name registries, cloud computing service providers, data centre service providers, content delivery network providers, managed service providers, managed security service providers, as well as providers of online marketplaces, of online search engines and of social networking services platforms, adopt implementing acts further specifying the cases in which an incident shall be considered by Commission to be significant
    The Commission may adopt such implementing acts with regard to other essential and important entities.
