event:
  concept:instance: 9460
  id:id: ex-ante
  cpee:instance: '006538cd-f1e6-4ffa-a7bb-466dbb3e09a9'
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: bc07fca65d1e31b049ab25f772d9df93d872f60a
  cpee:exposition: |-
    # User Input:
    Der Bestellprozess beginnt mit der Auswahl der Pizza aus der Speisekarte, woraufhin der Kunde seine Bestellung entweder telefonisch, online oder persönlich aufgibt. Das System oder Personal prüft die Verfügbarkeit der Zutaten, bestätigt den Preis und übermittelt den Auftrag direkt in die Küche.

    Dort wird der Teig vorbereitet, belegt und im Ofen gebacken, während parallel die Logistik (Lieferung oder Abholung) vorbereitet wird. Nach der Qualitätskontrolle wird die Pizza verpackt. Der Prozess schließt mit der Bezahlung und der Übergabe der Ware an den Kunden ab, womit der Auftrag im System als erledigt markiert wird.
  time:timestamp: '2026-04-16T11:47:24.997744+02:00'
