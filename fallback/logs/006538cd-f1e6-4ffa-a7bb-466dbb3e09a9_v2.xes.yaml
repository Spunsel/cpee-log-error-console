event:
  concept:instance: 9460
  id:id: ex-ante
  cpee:instance: '006538cd-f1e6-4ffa-a7bb-466dbb3e09a9'
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: fdcd7924733549ced0b124bc0f15086990cfaa72
  cpee:exposition: |-
    # User Input:
    Der Besuch beim Hausarzt beginnt mit der Anmeldung am Empfang, wo die Medizinische Fachangestellte (MFA) die elektronische Gesundheitskarte des Patienten einliest, die Stammdaten im System abgleicht und den Terminstatus prüft. Nach einer Überbrückungszeit im Wartezimmer wird der Patient in das Sprechzimmer gerufen. Dort führt der Arzt zunächst die Anamnese durch, untersucht den Patienten körperlich und stellt eine Diagnose.

    Zur weiteren Behandlung leitet der Arzt die entsprechenden medizinischen und administrativen Maßnahmen ein: Er verordnet Medikamente über ein E-Rezept, stellt bei Bedarf eine elektronische Arbeitsunfähigkeitsbescheinigung (eAU) aus oder erstellt eine Überweisung an einen Facharzt. Sämtliche Symptome, Befunde und erbrachte Leistungen werden zeitgleich in der digitalen Patientenakte dokumentiert, um die spätere ärztliche Abrechnung sicherzustellen. Der Praxisbesuch endet abschließend wieder am Empfang, wo der Patient offene Dokumente erhält, bei Bedarf einen Folgetermin vereinbart und die Praxis verlässt.
  time:timestamp: '2026-04-16T11:45:52.015758+02:00'
