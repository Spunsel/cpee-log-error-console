  cpee:exposition: |-
    # User Input:
    Category: Manufacturing Title: Building a House. You want to build a tree house. First you collect your requirements, and send them to a tree house architect. After collecting the requirements: the architect sends you back a draft, which you refine multiple times with additional requirements. You then create the list of needed materials from the plan. Next, you text your friends and ask for help.
  time:timestamp: '2026-05-05T20:16:19.389461+02:00'
