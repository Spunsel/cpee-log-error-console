  cpee:change_uuid: 789d8d0f0f250e08cc0903d3639cacd03621421e
  cpee:exposition: |-
    # User Input:
    Add tasks where the customer defines the airplane’s interior: choose one of five bar types, number and color of seats, lighting, carpet and wall color, entertainment system, and water amount in toilets. Add a parallel gateway to start all configuration tasks at the same time. Inside the ÜSChoose Bar Type⬝ branch, include an exclusive gateway with five options: vodka bar, whiskey bar, wine bar, cocktail bar, and coffee bar. Only one of these options should be selected. 
  time:timestamp: '2025-11-03T16:41:58.607232+01:00'
