              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
        </parallel_branch>
        <parallel_branch>
          <call id="a7" endpoint="" a:alt_id="a4">
            <parameters>
              <label>Choose Number and Color of Seats</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
        </parallel_branch>
