  cpee:exposition: |
    # User Input:
    Interview P1_MP4
    E1: [00:00:00] Kein Problem. Solange ich nicht irgendwo im Internet
    auftauche, ist das okay. Das ist nicht der Plan.
    Nicolas Düro: Nee, das wird nicht passieren. Das ist nicht
    E1: der Plan, das ist erschreckend. Das wird nicht passieren, nehme ich viel mit.
    Nico hast
    Moritz Walgern: du die Aufzeichnung schon gestartet? Ja, die habe ich jetzt
    gestartet. Sehr gut, danke.
    Gut, dann können wir anfangen. Außer Sie haben noch irgendwelche Fragen.
    Passt Super. Genau, vielleicht einmal noch für die Aufzeichnung. Könnten Sie
    kurz über Ihre derzeitige Position und auch Ihre Aufgaben bei der Sparkasse
    erzählen nur als Einleitung
    E1: Ja, also ich leite seit 2018 die Kreditbearbeitung, das ist eine
    Marktfolgeeinheit, die von Privatkunden bis zum Unternehmenskunden
    sämtliche Kreditanträge die nicht fallabschließend bei den Kollegen, die am
    Markt arbeiten, vollzogen werden, vervollständigen auf aufsichtsrechtliche
    Themen, regulatorische Themen und eben auch auf Auffälligkeiten überprüft, in
    Teilen [00:01:00] zweitvotiert und im Kreditantragsprozess Decken wir alles ab,
    was der Markt alleine nicht machen darf.
    Das gibt die CRR und die Emma Rusk entsprechend vor. Das heißt, wir sind
    hauptsächlich im risikorelevanten Kreditbereich unterwegs und bei der
    Vertragsproduktion, sofern die Technik es nicht alleine kann. In unserem Haus
    ist das im privaten Baufinanzierungsprozess Etwa 60 Prozent der privaten
    Baufinanzierung, die bei uns in der Abteilung vertragstechnisch und
    aufsichtsrechtlich entsprechend abgewickelt wird.
    Moritz Walgern: Verstehe ich das richtig, dass es dann vor allem um
    Baufinanzierung geht oder sind da noch andere bestimmte Kreditsanträge, die
    vor allem in Ihre Prüfung fallen?
    E1: Da ich die Info bekommen hatte, dass Sie sich hauptsächlich um das Thema
    Baufinanzierung bekommen, habe ich mich darauf fokussiert. Es ist alles mit
    dabei, von der privaten Baufinanzierung bis hin zum Unternehmensverkauf,
    zum Unternehmen zur strukturierten Finanzierung.
