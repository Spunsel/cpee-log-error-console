event:
  concept:instance: 141033
  id:id: external
  cpee:activity: external
  cpee:instance: 87eb077b-371a-480e-a97c-685ef7780fac
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 4e899029ff6a3209df15980c6edf1ba006d533c6
  cpee:exposition: |-
    # User Input:
    To keep everyone in the office fuelled and focused, an automatic coffee monitoring system ensures you're never left without your daily brew.
    First, you are asked whether a refill should be ordered. If the response is negative, a follow-up email is sent to the office to inform everyone that no new coffee has been ordered this week. If refill is necessary, a simple ordering is initiated. It prompts the user to confirm preferences such as the type and amount of coffee (beans, pods), milk options (e.g., regular, oat, almond), and additional supplies needed like sugar or sweeteners.
  time:timestamp: '2026-02-09T17:44:10.268319+01:00'
