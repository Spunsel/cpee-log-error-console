                      <label>[Wait for Next Service Date]</label>
                      <method/>
                      <type>:task</type>
                      <arguments/>
                    </parameters>
                  </call>
                </alternative>
                <alternative condition="Not Registered" language="text/javascript">
                  <escape a:alt_id="-1"/>
                </alternative>
              </choose>
            </alternative>
            <alternative condition="Not Due" language="text/javascript">
              <call id="a1" endpoint="" a:alt_id="1">
                <parameters>
                  <label>[Wait for Next Service Date]</label>
                  <method/>
                  <type>:task</type>
                  <arguments/>
                </parameters>
              </call>
            </alternative>
          </choose>
        </loop>
      </loop>
    </description>
