event:
  concept:instance: 104821
  id:id: external
  cpee:activity: external
  cpee:instance: c577b7e9-0fa7-44e5-a7ff-a22a043727dd
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/change
  cpee:description: |
    <?xml version="1.0"?>
    <description xmlns="http://cpee.org/ns/description/1.0" xmlns:a="http://cpee.org/ns/annotation/1.0">
      <call id="a3" endpoint="" a:alt_id="3">
        <parameters>
          <label>Enter car problems for reference</label>
          <method/>
          <type>:task</type>
          <arguments/>
        </parameters>
      </call>
      <call id="a5" endpoint="" a:alt_id="4">
        <parameters>
          <label>Send status updates via email while repair ongoing</label>
          <method/>
          <type>:task</type>
          <arguments/>
        </parameters>
      </call>
      <call id="a7" endpoint="" a:alt_id="5">
        <parameters>
          <label>Mark repair successful and set next service date</label>
          <method/>
          <type>:task</type>
          <arguments/>
        </parameters>
      </call>
      <call id="a11" endpoint="" a:alt_id="7">
        <parameters>
          <label>Pay through app when repair is done</label>
          <method/>
          <type>:task</type>
          <arguments/>
        </parameters>
      </call>
      <call id="a17" endpoint="" a:alt_id="10">
        <parameters>
          <label>Check if car is registered</label>
          <method/>
          <type>:task</type>
          <arguments/>
        </parameters>
      </call>
      <choose mode="exclusive" a:alt_id="11">
        <alternative condition="Registered" language="text/javascript">
          <call id="a21" endpoint="" a:alt_id="12">
            <parameters>
              <label>Notify car owner via app</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
          <call id="a25" endpoint="" a:alt_id="13">
            <parameters>
              <label>Take car to service when notified</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
          <call id="a27" endpoint="" a:alt_id="14">
            <parameters>
              <label>Wait 30 days &#x2013; check if service done</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
          <choose mode="exclusive" a:alt_id="15">
            <alternative condition="Service done" language="text/javascript"/>
            <alternative condition="No service within 30 days" language="text/javascript">
              <call id="a33" endpoint="" a:alt_id="16">
                <parameters>
                  <label>Fine car owner</label>
                  <method/>
                  <type>:task</type>
                  <arguments/>
                </parameters>
              </call>
            </alternative>
          </choose>
        </alternative>
        <alternative condition="Not registered" language="text/javascript"/>
      </choose>
    </description>
  cpee:change_uuid: da26c59467e448a30b491d63b54dd6876bfa6d16
  time:timestamp: '2026-01-13T15:43:49.364139+01:00'
