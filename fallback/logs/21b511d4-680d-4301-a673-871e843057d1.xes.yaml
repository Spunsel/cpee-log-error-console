event:
  concept:instance: 76446
  id:id: external
  cpee:activity: external
  cpee:instance: 21b511d4-680d-4301-a673-871e843057d1
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 38c1381a05f0453632b938a7302d4515be3216e1
  cpee:exposition: "# User Input:\nSkip to content\nNew Standardized Joiner (Onboarding)
    Process for Group Tenant\nCall Center Image\nNew Standardized Joiner (Onboarding)
    Process for the Group Tenant\nTo ensure a seamless and consistent onboarding experience
    across the organization, we have introduced the new standardized Joiner Process
    for the Group Tenant. This process streamlines the integration of new employees
    by providing a unified framework for account creation, access management, and
    system onboarding. By implementing this approach, we aim to enhance efficiency,
    maintain compliance, and deliver a high-quality onboarding experience for all
    new joiners within the Group Tenant environment.\nWhat is the reason for the standardized
    Joiner (Onboarding) Process?\nAs the Competence Centers (CCs) migrate to the Group
    Tenant environment, we discovered variations in the joiner processes across CCs.
    To simplify and unify the onboarding journey, we developed a standardized process
    that ensures the best possible experience for new joiners at valantic. This process
    guarantees that all standard accounts and hardware are delivered to the joiner
    on their first day of employment. To achieve this, we made key adjustments to
    existing processes.\nWhat is the standardized Joiner (Onboarding) Process?\nWhen
    an applicant accepts an offer at valantic, several steps are required to successfully
    onboard the new joiner. The process involves various stakeholders and teams to
    ensure seamless collaboration. To streamline this, we partnered with HR and identified
    three key participants in the process:\nHR: HR initiates the process by providing
    information about the new joiner, including personal details and employment specifics.\nDepartment:
    The new joiner's department is optionally involved, as they have the best understanding
    of the role and requirements.\nGroup IT: Group IT is responsible for providing
    accounts, hardware, and ensuring compliance with policies.\nThe onboarding journey
    has been simplified to focus on key steps such as creating primary accounts (e.g.,
    user account and email address), providing a laptop with the Group IT standard
    setup, or ensuring CC-managed hardware complies with group policies.\nHow will
    it be done?\nHR creates a Joiner Ticket in the self-service portal and fills in
    all necessary information.\nIn the case of a long-term onboarding process (more
    than 28 days before the start date), the responsible department (manager or buddy,
    if applicable) can add specific requests, such as a special laptop or smartphone
    type.\nFor a fast onboarding process, this option will be skipped, and the process
    will start with the minimum standard setup.\nThe minimum standard setup includes:\nLaptop
    (based on the joinerâ€™s level)\nUser account and email account\neSIM\nWhat options
    do the responsible department members have?\nResponsible department members can
    add specific requests, such as choosing a special laptop or smartphone. If no
    additional or individual requests are made within 28 days of the joinerâ€™s start
    date, the task will automatically be skipped to ensure a smooth onboarding process
    with the standard setup.\nWe understand how busy you are, so we will remind you
    about your decision! \U0001F60A\nForecast for Improvement\nOnce the process is
    rolled out, we will continuously review and improve it. Planned enhancements include:\nAutomatically
    creating a separate ticket after account creation to request additional permissions
    using simple checkboxes.\nIntroducing standardized permission sets based on CC,
    department, or other conditions, so new joiners receive the appropriate access
    automatically."
  time:timestamp: '2025-12-03T08:34:19.843136+01:00'
