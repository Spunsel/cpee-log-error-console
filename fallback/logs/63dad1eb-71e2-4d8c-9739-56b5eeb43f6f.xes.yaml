event:
  concept:instance: 77237
  id:id: external
  cpee:activity: external
  cpee:instance: 63dad1eb-71e2-4d8c-9739-56b5eeb43f6f
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 0ea3ed416406bfb199e13daf5b2c9cc87805f5a2
  cpee:exposition: |-
    # User Input:
    Below is the artifact description and a running example that follows the exact steps shown in the figure. It explains how the blockchain-based information system (IS) prevents the double spending that sits at the core of Cum-Ex.
    Purpose and idea
    Objective: make it technically impossible to redeem the same withholding tax more than once, even if multiple “tax receipts” circulate in the post–dividend compensation chain.
    Mechanism: at the moment the issuer actually pays the dividend, the IS mints a single, event‑specific set of tokens that embody the redeemable withholding tax. At year‑end, a tax receipt can only be redeemed if it is paired with the matching tokens. Any receipt without the tokens is not redeemable.
    Actors and artifacts
    Issuer/paying agent of ABC Stock (and the custody chain that executes corporate actions).
    Shareholder of record (rightful dividend recipient).
    Short seller and buyer around record date (they create the compensation chain central to Cum‑Ex).
    Tax authority (redeems/credits withholding tax).
    Artifacts:
    Tokens: event‑specific, fungible units minted once per dividend event, equal to the withheld tax amount for each beneficial owner/custodian.
    Tax receipt: document attesting to withholding; multiple can exist off‑chain, but only one set of tokens exists on‑chain.
    Smart contracts: Minting, transfer, and redemption contracts that enforce the pairing of “receipt + tokens.”
    Timeline legend used below
    −1 = before dividend
    0 = dividend payout
    1 = after dividend (ex‑date/settlement and compensation)
    2 = end‑of‑year redemption
    Running example with every step in the figure
    Preparatory market situation (before record date)
    [−1] Short sells ABC Stock: A short position is opened. This sets up the typical Cum‑Ex pattern in which a later buyer may receive dividend compensation from a short seller rather than a true dividend from the issuer.
    Dividend event (moment 0)
    [0.1] Gross dividend (left branch): ABC declares and allocates the gross dividend to the shareholder of record on the issuer/custodian side.
    [0.2] Gross dividend (right branch): The same gross dividend event is shown a second time to highlight that two economic paths follow (true dividend vs. later compensation).
    [0.3] Payment capital gains tax: The diagram flags that any later dividend “compensation” paid by a short is treated as capital gains for the receiver and follows a different tax treatment than dividends.
    [0.4] Give Permission to Mint Tokens: The issuer/paying agent (or its designated corporate‑actions smart contract) authorizes minting for this specific dividend event. Only permissioned custodians/agents can call mint.
    [0.5] Net dividend + Issues Tax Receipt + Mints Tokens:
    The issuer pays the net dividend (gross minus withheld tax) to the shareholder of record.
    The issuer issues the official tax receipt corresponding to the withheld amount.
    Simultaneously, the IS mints the event‑specific tokens. Supply per investor equals the withheld tax attributable to that investor’s net dividend. Tokens are delivered to the custodian wallet representing the beneficial owner.
    These tokens are the only on‑chain objects that can unlock year‑end redemption. No tokens will ever be minted for later “compensation” payments.
    After the dividend (ex‑date, settlement, and compensation)
    [1.1] Sells ABC Stock: A trade occurs in the ex‑dividend period.
    [1.2] Transfers ABC Stock: The shares are delivered to the buyer.
    [1.3] Delivers ABC Stock + net dividend compensation: Because the seller was short over record date, they owe the buyer a cash compensation equal to the net dividend. The buyer thus receives stock plus a cash “net dividend compensation,” not a dividend from the issuer.
    [1.4] Net dividend compensation + Issues Tax receipt: Market practice may generate a “tax receipt” or statement to accompany this compensation. However, crucially, the issuer’s system has not minted any tokens for this compensation chain.
    [1.4] No tax receipt to revoke: The issuer does not revoke the original tax receipt issued at [0.5]; instead, the IS relies on the token requirement. Only one redeemable claim exists because only one set of tokens exists.
    Year‑end tax reclaim (moment 2)
    Left branch: legitimate redemption
    [2] Redeems corresponding tokens: The rightful claimant (or its custodian) sends the event‑specific tokens to the redemption smart contract. The contract validates the token class (ISIN, record date, country), amount, and that they are unspent. Tokens are burned or locked to prevent reuse.
    [2] Redeems Tax receipt: Alongside the tokens, the claimant presents the off‑chain tax receipt (or its cryptographic hash/attestation). The contract emits a redemption event for the tax authority. Because both artifacts match, the reclaim is accepted.
    Right branch: attempted double spending fails
    [2] Tries to Redeem Tax receipt but no tokens: Any party who only holds a “compensation” receipt cannot redeem because they do not possess the event‑specific tokens minted at [0.5]. The redemption contract rejects the claim.
    Clarifying notes reflected in the figure
    “Tokens” appear only on the left branch because they are minted exclusively when the issuer pays a real dividend. No tokens are ever created for compensation flows.
    The two gross‑dividend boxes [0.1] and [0.2] show the single corporate action that later branches into two economic results (dividend vs. compensation).
    The capital‑gains‑tax box [0.3] highlights the different tax character of compensation payments.
    Footnote 1 (chain of custody): Multiple custodians may appear in the chain; only permissioned custodians can hold/move tokens. The token requirement is preserved across the chain, so redemption is only possible once.
    Footnote 2 (token transferability): Tokens can be transferred. For example, Alice (true dividend recipient) could sell/transfer the tokens to Bob; in that case only Bob—who now holds both the receipt and the tokens—could redeem, and no one else could.
    What the blockchain IS enforces
    One‑time mint at the source: Tokens are minted exactly once, at the issuer’s official dividend payment, and in an amount equal to the withheld tax actually deducted.
    Pairing rule at redemption: A tax receipt is redeemable only if the presenter also delivers the exact matching tokens. Without tokens, redemption is impossible.
    Finality: Tokens are burned/locked upon redemption, creating an immutable on‑chain audit trail. A second redemption attempt for the same event fails deterministically.
    Sketch of the components (implementable but intentionally simple)
    Minting contract: Event registry keyed by security identifier, record date, and jurisdiction; mints ERC‑20/1155‑style tokens to permissioned custodians when [0.4]/[0.5] occur.
    Transfer controls: Allowlist of regulated custodians; optional transfer notes linking token moves to custody instructions in the traditional chain.
    Receipt registry: Stores hashes/attestations of issuer tax receipts created at [0.5]; links each hash to the event id.
    Redemption contract: Requires the correct token amount and a matching receipt hash for the same event; marks the receipt as spent; burns/locks tokens; emits a verifiable redemption event for the tax authority.
    Auditability: The chain provides a single source of truth for token supply, movements, and redemptions, enabling reconciliations with the issuer’s corporate‑action records.
    Outcome
    Even if multiple “receipts” are produced along the compensation chain (the core Cum‑Ex exploit), only the holder of the event‑specific tokens can redeem. Because only one set of tokens exists for the event and those tokens are consumed at redemption, double spending of withholding tax becomes technically infeasible.
  time:timestamp: '2025-12-01T11:24:07.915853+01:00'
