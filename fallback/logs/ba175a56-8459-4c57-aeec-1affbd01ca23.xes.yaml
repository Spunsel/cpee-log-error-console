event:
  concept:instance: 88782
  id:id: external
  cpee:activity: external
  cpee:instance: ba175a56-8459-4c57-aeec-1affbd01ca23
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: d46c06afcfcf2d802637c247b9c691a3ce8f72e7
  cpee:exposition: "# User Input:\nÜbersicht – Urlaubsantrag mit Rückmeldung durch
    die Verwaltung\n\n\nDer gesamte Ablauf besteht aus zwei separaten, aber miteinander
    verknüpften Teilprozessen:\n\n\nDer Vorgang aus Sicht des Mitarbeitenden (wie
    er einen Urlaub beantragt und auf die Entscheidung wartet).\nDer Vorgang aus Sicht
    der Verwaltung (wie sie den Antrag prüft, ggf. zusagt oder absagt und das Ergebnis
    zurückmeldet).\nBeide Teilprozesse sind über Nachrichtenflüsse (E‑Mail) miteinander
    verbunden, sodass das Ergebnis der Entscheidung wieder zum Mitarbeitenden zurückkehrt.\n\n\n\n\n1.
    Prozess „Mitarbeiter“ (Urlaub beantragen)\n\n\nSchritt\tWas passiert\tZweck\nStart‑Ereignis
    „Urlaub beantragen“\tDer Mitarbeitende initiiert den Vorgang, z. B. indem er in
    seinem Kalender oder über ein Formular den Wunsch äußert.\tEinstiegspunkt des
    Prozesses.\nAufgabe „Urlaubsantrag per E‑Mail senden\tDer Mitarbeitende schreibt
    eine E‑Mail mit den gewünschten Urlaubsterminen und sendet sie an die Verwaltung.\tFormaler
    Antrag wird an die zuständige Stelle übermittelt.\nZwischenereignis „Entscheidung
    erhalten (Nachrichten‑Catch‑Event)\tDer Mitarbeitende wartet auf eine Antwort‑Nachricht
    (E‑Mail) von der Verwaltung.\tSynchronisation: Der Prozess wird hier pausiert,
    bis die Verwaltung zurückmeldet.\nExklusives Gateway „Zusage erhalten?\tSobald
    die Antwort eingetroffen ist, wird geprüft, ob die Entscheidung eine Zusage ist.\tEntscheidungspunkt,
    der den weiteren Fluss bestimmt.\n– Ja‑Pfad → End‑Ereignis „Prozess beendet\tBei
    einer Zusage wird der Prozess erfolgreich beendet.\tDer Mitarbeitende erhält die
    Bestätigung und kann den Urlaub planen.\n– Nein‑Pfad → Zurück zur Aufgabe „Urlaubsantrag
    per E‑Mail senden\tBei einer Absage (z. B. weil das Zeitfenster nicht passt) wird
    der Mitarbeitende zurück zur Eingabestelle geführt, um ggf. einen neuen Zeitraum
    zu wählen und den Vorgang erneut zu starten.\tMöglichkeit zur Korrektur / Wiederholung,
    bis eine Zusage vorliegt.\nWiederholungsschleife: Der Entscheidungs‑Gateway führt
    bei einer negativen Entscheidung zurück zur Antragstellung, wodurch ein iterativer
    Ablauf entsteht: Antrag → Entscheidung → Absage → Neuer Antrag … bis die Bedingung
    „Zusage erhalten“ erfüllt ist.\n\n\n\n\n2. Prozess „Verwaltung“ (Entscheidung
    vorbereiten)\n\n\nSchritt\tWas passiert\tZweck\nStart‑Ereignis „Entscheidung vorbereiten
    (Nachrichten‑Start‑Event)\tDer Verwaltungsbereich wird durch das Eintreffen einer
    E‑Mail mit dem Urlaubsantrag aktiviert.\tEinstiegspunkt, der an den Eingang einer
    Nachricht (E‑Mail) gekoppelt ist.\nAufgabe „E‑Mail erhalten\tDie eingegangene
    Urlaubsanfrage wird geöffnet und registriert.\tSichtbarmachung des Antrags für
    die nachfolgenden Prüfungsschritte.\nAufgabe „Zeitraum prüfen\tDie Verwaltung
    prüft, ob der gewünschte Urlaubszeitraum mit den betrieblichen Erfordernissen
    (z. B. Personalplanung, andere Urlaube) vereinbar ist.\tFachliche Bewertung der
    Anfrage.\nExklusives Gateway „Zeitraum passend?\tBasierend auf der Prüfung wird
    entschieden, ob der Zeitraum akzeptabel ist.\tEntscheidungspunkt, der den Pfad
    zur Zusage oder zur Absage auswählt.\n– Ja‑Pfad → Aufgabe „Zusage per E‑Mail senden\tBei
    positiver Prüfung wird eine Bestätigungs‑E‑Mail an den Mitarbeitenden geschickt.\tRückmeldung,
    dass der Urlaub genehmigt ist.\n– Nein‑Pfad → Aufgabe „Absage per E‑Mail senden\tBei
    negativer Prüfung wird eine Absage‑E‑Mail an den Mitarbeitenden geschickt, oft
    mit Hinweis auf alternative Termine.\tRückmeldung, dass der beantragte Zeitraum
    nicht möglich ist.\nEnd‑Ereignis „Entscheidung getroffen (Nachrichten‑End‑Event)\tNachdem
    die entsprechende Nachricht (Zusage oder Absage) versendet wurde, endet der Verwaltungsprozess.\tAbschluss
    des Entscheidungsvorgangs.\n\n\n3. Interaktion zwischen den beiden Pools (Mitarbeiter ↔ Verwaltung)\n\n\nNachrichtenfluss
    vom Mitarbeitenden zur Verwaltung\n\n\nSobald der Mitarbeitende den Antrag per
    E‑Mail sendet, wird die Nachricht an die Verwaltung übergeben.\nIn BPMN‑Begriffen
    ist das ein Message‑Flow von der Aufgabe „Urlaubsantrag per E‑Mail senden“ zum
    Start‑Ereignis „Entscheidung vorbereiten“ der Verwaltung.\nNachrichtenfluss von
    der Verwaltung zurück zum Mitarbeitenden\n\n\nDie Verwaltung schickt entweder
    eine Zusage‑ oder eine Absage‑E‑Mail.\nDieser Nachrichtenfluss führt zu dem Intermediate
    Catch Event „Entscheidung erhalten“ im Mitarbeitenden‑Pool, wodurch dieser Prozess
    wieder aktiviert wird und die Entscheidung auswertet.\nDamit entsteht ein Rückkopplungs‑Loop:
    Der Mitarbeitende initiiert den Antrag, die Verwaltung prüft und beantwortet,
    und der Mitarbeitende reagiert (Akzeptieren oder Neuauswahl). Der Loop wiederholt
    sich, solange die Entscheidung negativ ist.\n\n\n\n\n4. Geschäftslogik und mögliche
    Varianten\n\n\nBedingung\tErgebnis\tAuswirkungen\n${zeitraumPassend} (aus Sicht
    der Verwaltung)\tDie gewünschten Urlaubstage passen in den betrieblichen Kalender.\tVerwaltung
    sendet Zusage → Mitarbeitender erhält positive Rückmeldung → Prozess endet.\n${!zeitraumPassend}\tDer
    Zeitraum kollidiert mit anderen Vorgaben.\tVerwaltung sendet Absage → Mitarbeitender
    wird zurück zur Antragstellung geleitet, um einen anderen Zeitraum zu wählen.\n${entscheidungZusage}
    (aus Sicht des Mitarbeitenden‑Gateways)\tDas erhaltene Nachrichtenelement wird
    als Zusage interpretiert.\tDer exklusive Gateway leitet zum End‑Ereignis (Prozess
    beendet).\n${!entscheidungZusage}\tDie Nachricht enthält eine Absage.\tDer exklusive
    Gateway führt zurück zur Aufgabe „Urlaubsantrag per E‑Mail senden“ und ermöglicht
    eine Wiederholung.\nErweiterungsmöglichkeiten\n\n\nAutomatisierte Prüfungen: Statt
    einer manuellen „Zeitraum prüfen“-Aufgabe könnte ein System automatisch Kalendereinträge
    prüfen und das Ergebnis als Nachricht zurückgeben.\nMehrstufige Genehmigung: Bei
    größeren Abwesenheiten könnte ein zweiter Genehmigungs‑Gateway (z. B. Vorgesetzter)
    eingeführt werden.\nBenachrichtigungen: Zusätzliche Informations‑E‑Mails (Eingangsbestätigung,
    Erinnerungen) könnten als weitere Nachrichten‑Flows ergänzt werden.\n\n\n5. Zusammenfassung
    des Gesamtablaufs\n\n\nMitarbeiter startet den Vorgang, sendet einen Urlaubsantrag
    per E‑Mail.\nVerwaltung empfängt die Mail, prüft den gewünschten Zeitraum und
    entscheidet.\nVerwaltung schickt entweder eine Zusage‑ oder eine Absage‑Mail zurück.\nMitarbeiter
    erhält die Nachricht, das exklusive Gateway prüft, ob es sich um eine Zusage handelt.\nBei
    Zusage: Prozess endet erfolgreich.\nBei Absage: Der Mitarbeitende wird zurück
    zur Antragstellung geleitet, um einen anderen Zeitraum zu wählen, und der Zyklus
    beginnt erneut.\nDurch den klaren Nachrichten‑Austausch und den Entscheidungspunkten
    wird gewährleistet, dass sowohl die betrieblichen Anforderungen als auch die Wünsche
    des Mitarbeitenden berücksichtigt werden, während gleichzeitig ein transparenter,
    nachvollziehbarer Ablauf entsteht."
  time:timestamp: '2025-12-23T11:34:00.855052+01:00'
