  cpee:exposition: |-
    # User Input:
    Ich habe den folgenden Prozess:
    Innerhalb des Unternehmens "PDC" gibt es zum einen die "Verwaltung" und zum anderen die "Mitarbeiter". Wenn nun ein Mitarbeiter Urlaub einreichen will, so schreibt er den Verwaltung eine E-Mail mit dem Zeitraum des gewünschten Urlaubs. Die Verwaltung prüft bei Erhalt der E-Mail, ob der Zeitraum passt und der Mitarbeiter dort Urlaub nehmen kann. Wenn der Zeitraum passt, so schreibt die Verwaltung dem Mitarbeiter eine E-Mail mit der Zusage für den Urlaub. Passt der Zeitraum nicht, schickt die Verwaltung dem Mitarbeiter eine Absage für den Urlaub.
  time:timestamp: '2025-12-23T11:57:26.936066+01:00'
