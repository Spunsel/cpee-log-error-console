event:
  concept:instance: 12242
  id:id: ex-ante
  cpee:instance: 705c4986-98a8-4a1e-ab01-74ae419c322f
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 45ec361f0d35e3e86c02523d1626fc839dee8608
  cpee:exposition: |-
    # User Input:
    Article 11: Compliance with the minimum standards of physical and mental fitness
    1 Member States shall, before a driving licence is issued by Member States for the first time, ensure that applicants undergo a medical examination in which the minimum standards of physical and mental fitness covering all the medical conditions set out in are applied by Member States.
    A medical examination shall, however, be required by Member States in respect of applications for driving licences of categories C, CE, C1, C1E, D, D1, DE or D1E, regardless of whether a medical examination was undertaken by Member States for another category.
    2 Before a driving licence is renewed by Member States, applicants for the renewal shall undergo a medical examination covering the medical conditions set out.
    This shall apply to the renewal of driving licences in category AM only if so required by the Member State in question IAW, point (b).
    --PARALLEL TASKS--
    3(a) Notwithstanding paragraphs 1 and 2, and to the extent not otherwise provided for by, such as in the case of the appropriate assessment of eyesight for applicants for driving licences IAW, Member States may, for categories AM, A, A1, A2, B, B1 and BE, instead of requiring a medical examination, apply one or both of the following alternative measures require the applicant or holder of the driving licence to fill in a self-assessment form covering the medical conditions set out in when applying for the issuance or renewal of a driving licence; or
    3(b) Notwithstanding paragraphs 1 and 2, and to the extent not otherwise provided for by, such as in the case of the appropriate assessment of eyesight for applicants for driving licences IAW, Member States may, for categories AM, A, A1, A2, B, B1 and BE, instead of requiring a medical examination, apply one or both of the following alternative measures establish a national system of assessment of fitness to drive to ensure that significant changes in physical or mental fitness are reacted by Member States to in order to comply with the minimum standards of physical and mental fitness set out in, after the driving licence has been issued by Member States to the applicant following a medical examination or self-assessment
    --END OF PARALLEL TASKS--
    4 Member States may provide for appropriate measures or for knowingly providing information in the self-assessment form, or for failing to meet any requirement established IAW, point (b).
    5 Member States may apply the alternative measure under, point (b), in such a way that Member States allows the monitoring of fitness to drive during periods of administrative validity.
    6 IF, on the basis of information acquired pursuant to the various alternative measures set out in, Member States becomes apparent that the applicant OR holder of a driving licence is likely to have one or more of the medical conditions listed in, Member States shall ensure that the applicant or holder of the driving licence undergoes a medical examination prior to the Member States issuing or renewing the driving licence.
    7 This Article shall not prevent Member States from taking measures to raise awareness and improve the knowledge of the health sector and of driving licence holders about the minimum standards of physical and mental fitness for driving set out.
    IF Member States adopt guidelines for medical practitioners to help identify driving licence holders who no longer meet the minimum standards of physical and mental fitness to drive, Member States shall inform the Commission thereof.
    The Commission shall make the guidelines available to the other Member States.
    IF Member States develop public awareness campaigns to inform citizens about mental or physical health conditions that may impair fitness to drive, Member States shall inform the Commission thereof.
    The Commission shall make the information available to the other Member States.
    8 The standards set by Member States for the issuance OR any subsequent renewal of driving licences may be stricter than those set out.
  time:timestamp: '2026-05-15T14:40:47.654576+02:00'
