  cpee:change_uuid: 2b57182411954cf58b372449cf0cd6acbe0635b6
  cpee:exposition: |-
    %% Output Intermediate
    ```mermaid
    bpmn
      direction LR
        0:startevent:((startevent))
        1:task:(Receive Customer Request)
        2:exclusivegateway:{x}
        3:task:(Activate Time Series Display)
        4:task:(Deactivate Time Series Display)
        5:exclusivegateway:{x}
        6:parallelgateway:{AND}
        7:task:(Report Status to Central System)
        8:task:(Enter Status in Meter Logbook)
        9:parallelgateway:{AND}
        10:endevent:(((endevent)))

        0 --> 1
        1 --> 2
        2 --> |Activate| 3
        2 --> |Deactivate| 4
        3 --> 5
        4 --> 5
        5 --> 6
        6 --> 7
        6 --> 8
        7 --> 9
        8 --> 9
        9 --> 10
    ```
  time:timestamp: '2026-01-12T15:14:32.747789+01:00'
