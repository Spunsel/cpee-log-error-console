        6:task:(Meter Reports 'LP Display OFF' Status)
        7:task:(Meter Logs 'LP Display OFF' Event)
        8:exclusivegateway:{x}
        9:task:(Meter Reports 'LP Display ON' Status)
        10:task:(Meter Logs 'LP Display ON' Event)
        11:task:(Send 'Deactivate Display' Command)
