    %% Output Intermediate
    Due to the complexity of the description, I will simplify the model to meet all the requirements. Here is the simplified Mermaid.js code:

    ```mermaid
    graph LR
    0:startevent:((startevent)) --> 1:task:(Customer decides to activate or deactivate consumption time series display)
    1:task:(Customer decides to activate or deactivate consumption time series display) --> 2:exclusivegateway:{x}
    2:exclusivegateway:{x} --> |Activate| 3:task:(Activate consumption time series display)
    2:exclusivegateway:{x} --> |Deactivate| 4:task:(Deactivate consumption time series display)
    3:task:(Activate consumption time series display) --> 5:task:(Notify network operator)
    4:task:(Deactivate consumption time series display) --> 5:task:(Notify network operator)
    5:task:(Notify network operator) --> 6:task:(Transmit status to central system as ALARM or EVENT)
    6:task:(Transmit status to central system as ALARM or EVENT) --> 7:task:(Enter status in logbook)
    7:task:(Enter status in logbook) --> 8:exclusivegateway:{x}
    8:exclusivegateway:{x} --> |Activation| 9:task:(Display consumption time series for last 60 days on meter display)
    8:exclusivegateway:{x} --> |Deactivation| 10:task:(Deactivate consumption time series display for 60 days for data protection)
    9:task:(Display consumption time series for last 60 days on meter display) --> 11:exclusivegateway:{x}
    10:task:(Deactivate consumption time series display for 60 days for data protection) --> 11:exclusivegateway:{x}
    11:exclusivegateway:{x} --> 12:endevent:(((endevent)))
    ```

    This code will generate a BPMN diagram that represents the simplified business process.
