  cpee:change_uuid: 280783aef893d78e9fd227034ab7fd6908c75bbe
  cpee:exposition: |-
    # User Input:
    To buy a product from the machine, customers first select a product, after which the they must pay. The payment is processed and recorded as either failed or accepted. Once this step is completed, the machine engages the dispensing unit to deliver the selected product to the customer. A product should never be delivered before payment is accepted
  time:timestamp: '2025-12-10T10:57:28.937104+01:00'
