  cpee:change_uuid: 00da8d4aef3c851b6f31d49a5d39d7ff2e86b4f9
  cpee:exposition: |+
    # User Input:
    i. Process description:
    Category: Manufacturing
    Title: Chainsaw
    You produce custom chainsaws on demand. Your chainsaws have at least 5 properties such as length of the "guide bar" (Schwertlaenge), chain width, electric or motor chainsaw. After your customer told you the properties, you can start ordering the parts from various online sources (in parallel). After the parts arrive you have to do a manual inspection of all parts, and then assemble the parts. During production, you regularly send updates to your customer. After producing the first saw you send it to your customer. If he likes it, the rest of his order are produced.
    Task:
    Considering the provided process description and additional rules create a valid Mermaid.js graph.

  time:timestamp: '2025-11-04T18:05:22.688843+01:00'
