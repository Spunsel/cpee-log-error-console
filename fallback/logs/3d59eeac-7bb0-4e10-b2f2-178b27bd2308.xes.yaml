    ```mermaid
    graph LR
      0:startevent:((startevent)) --> 1:task:(Receive Order)
      1:task:(Receive Order) --> 2:task:(Define Properties)
      2:task:(Define Properties) --> 3:parallelgateway:{AND}
      3:parallelgateway:{AND} --> 4:task:(Order Guide Bar)
      3:parallelgateway:{AND} --> 5:task:(Order Chain)
      3:parallelgateway:{AND} --> 6:task:(Order Motor/Electric Parts)
      4:task:(Order Guide Bar) --> 7:parallelgateway:{AND}
      5:task:(Order Chain) --> 7:parallelgateway:{AND}
      6:task:(Order Motor/Electric Parts) --> 7:parallelgateway:{AND}
      7:parallelgateway:{AND} --> 8:task:(Inspect Parts)
      8:task:(Inspect Parts) --> 9:task:(Assemble Chainsaw)
      9:task:(Assemble Chainsaw) --> 10:task:(Send Updates)
      10:task:(Send Updates) --> 11:task:(Produce First Saw)
      11:task:(Produce First Saw) --> 12:task:(Send First Saw to Customer)
      12:task:(Send First Saw to Customer) --> 13:exclusivegateway:{x}
      13:exclusivegateway:{x} --> |Customer Likes It| 14:task:(Produce Rest of Order)
      13:exclusivegateway:{x} --> |Customer Doesn't Like It| 15:task:(Stop Production)
      14:task:(Produce Rest of Order) --> 16:endevent:(((endevent)))
      15:task:(Stop Production) --> 16:endevent:(((endevent)))
    ```
  time:timestamp: '2025-11-04T18:05:22.689507+01:00'
