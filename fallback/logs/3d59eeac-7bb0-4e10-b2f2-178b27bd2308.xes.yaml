  cpee:exposition: |-
    # User Input:
    Do this for both Send Updates.
    Put an exclusive Gateway before and after it.
    The one after it loops back to the gateway before Send updates, when The other Task is still running.
    This means if Produce First saw is running for the first Send updates or Produce Rest of Order for second Send Updates.
