    CRITICAL RULE:

    For each task, DO NOT connect all input dependencies.




    Instead:

    - Trace each input back to its upstream tasks

    - If multiple inputs belong to the SAME dependency chain,

    Â  ONLY connect the task to the MOST IMMEDIATE upstream task




    This means:

    - Keep ONLY direct dependencies

    - IGNORE transitive dependencies

    - NEVER connect a task to both a parent and a grandparent




    Example:

    If A â†’ B â†’ C, and C lists A and B as inputs:

    â†’ ONLY connect B â†’ C




    Additional rules:

    - Each task appears only once

    - Prefer the minimum number of edges

    - Keep the graph readable, not complete

    - Parallel tasks are allowed only if they truly have no shared upstream chain




    Goal:

    Create a MINIMAL EXECUTION DAG, not a full dependency map.
