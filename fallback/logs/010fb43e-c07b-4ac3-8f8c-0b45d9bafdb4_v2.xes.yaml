event:
  concept:instance: 9705
  id:id: ex-ante
  cpee:instance: 010fb43e-c07b-4ac3-8f8c-0b45d9bafdb4
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: e39bd5c2ccd6b2d4e99eb2d1ff1c5b46b2cd95f8
  cpee:exposition: |-
    # User Input:
    Crie um diagrama BPMN 2.0 para o processo completo de uma confeitaria, com 4 piscinas principais: Venda, Produção, Entrega e Estoque.

    Na piscina Venda, o processo começa com o evento de início "Cliente chega" (por balcão, telefone ou app). Em seguida, a atividade "Atendente anota pedido". Depois, uma atividade de validação "Confirma disponibilidade de sabores e ingredientes". Após a validação, a atividade "Informa valor e tempo de entrega". Então, a atividade "Registra pedido". O processo de Venda termina com uma mensagem enviada para a piscina Produção.

    Na piscina Produção, o processo começa ao receber a mensagem "Cozinha recebe pedido" da Venda. Em seguida, a atividade "Prepara o pedido solicitado". Depois, a atividade "Embala o pedido". O processo de Produção termina com uma mensagem enviada para a piscina Entrega.

    Na piscina Entrega, o processo começa ao receber a mensagem "Pedido pronto para entrega" da Produção. Em seguida, a atividade "Gerente atribui a um entregador". Depois, a atividade "Entregador confirma saída". Então, a atividade "Realiza rota". Em seguida, um gateway baseado em eventos: se o pagamento já foi feito antecipadamente, siga para "Entregador confirma conclusão". Se o pagamento não foi feito, execute "Cliente recebe e paga" e depois "Entregador confirma conclusão". O processo de Entrega termina com o evento de fim.

    Paralelamente, existe a piscina Estoque. Ela roda em background. O processo começa com o evento de ciclo "Diariamente". Em seguida, a atividade "Funcionário verifica quantidade de ingredientes". Depois, um gateway exclusivo: se a quantidade estiver baixa, execute "Solicita compra se necessário". Se houver falta total de um item, execute "Comunica vendas para suspender o produto", enviando uma mensagem de volta para a piscina Venda para suspender a venda daquele item. O processo de Estoque retorna ao início para nova verificação.
  time:timestamp: '2026-04-21T22:05:51.979623+02:00'
