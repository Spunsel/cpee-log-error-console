event:
  concept:instance: 9705
  id:id: ex-ante
  cpee:instance: 010fb43e-c07b-4ac3-8f8c-0b45d9bafdb4
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: e39bd5c2ccd6b2d4e99eb2d1ff1c5b46b2cd95f8
  cpee:exposition: "%% Output Intermediate\nDue to the complexity of the description
    and the limitations of Mermaid.js, the model will be simplified. The model will
    not include the \"Estoque\" pool and the \"Diariamente\" event, as Mermaid.js
    does not support pools and cycle events. \n\n```mermaid\ngraph LR\n0:startevent:((startevent))
    --> 1:task:(Cliente chega)\n1:task:(Cliente chega) --> 2:task:(Atendente anota
    pedido)\n2:task:(Atendente anota pedido) --> 3:task:(Confirma disponibilidade
    de sabores e ingredientes)\n3:task:(Confirma disponibilidade de sabores e ingredientes)
    --> 4:task:(Informa valor e tempo de entrega)\n4:task:(Informa valor e tempo de
    entrega) --> 5:task:(Registra pedido)\n5:task:(Registra pedido) --> 6:task:(Cozinha
    recebe pedido)\n6:task:(Cozinha recebe pedido) --> 7:task:(Prepara o pedido solicitado)\n7:task:(Prepara
    o pedido solicitado) --> 8:task:(Embala o pedido)\n8:task:(Embala o pedido) -->
    9:task:(Pedido pronto para entrega)\n9:task:(Pedido pronto para entrega) --> 10:task:(Gerente
    atribui a um entregador)\n10:task:(Gerente atribui a um entregador) --> 11:task:(Entregador
    confirma saída)\n11:task:(Entregador confirma saída) --> 12:task:(Realiza rota)\n12:task:(Realiza
    rota) --> 13:exclusivegateway:{x}\n13:exclusivegateway:{x} --> |Pagamento feito
    antecipadamente| 14:task:(Entregador confirma conclusão)\n13:exclusivegateway:{x}
    --> |Pagamento não feito| 15:task:(Cliente recebe e paga)\n15:task:(Cliente recebe
    e paga) --> 16:task:(Entregador confirma conclusão)\n14:task:(Entregador confirma
    conclusão) --> 17:endevent:(((endevent)))\n16:task:(Entregador confirma conclusão)
    --> 17:endevent:(((endevent)))\n```\nThis model represents the process from the
    customer's arrival to the delivery of the order. The decision whether the payment
    has been made in advance or not is represented by an exclusive gateway."
  time:timestamp: '2026-04-21T22:05:51.979946+02:00'
