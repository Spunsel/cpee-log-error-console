event:
  concept:instance: 9468
  id:id: ex-ante
  cpee:instance: afd090d8-c798-454e-b206-a7e850a372d0
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 3843d86f9caa2c11d229e95e81b490c3cca15558
  cpee:exposition: |-
    # User Input:
    Process Name: AI Project Matchmaking & Vector Sync Workflow

    Participants: User, Supabase Database, Supabase Edge Functions, OpenAI API, Microsoft Power Automate

    The process has two independent starting events based on the User's actions.

    Scenario 1: Project Completion (Building AI Memory)

    The User updates a project status to "completed" in the application.

    The Supabase Database detects the update and triggers the Project Completion SQL function.

    The Supabase Database sends a webhook containing the project data to the Vector Sync Edge Function.

    The Vector Sync Edge Function extracts and cleans the project text, including the title, background, and objective.

    The Vector Sync Edge Function requests a vector embedding for the text from the OpenAI API.

    The OpenAI API generates and returns the mathematical vector array.

    The Vector Sync Edge Function saves the returned vector into the "project_vector_db" table in the Supabase Database.

    This scenario ends.

    Scenario 2: Proposal Creation (AI Matchmaking)

    The User updates a project status to "proposal" in the application.

    The Supabase Database detects the update and triggers the Proposal Creation SQL function.

    The Supabase Database sends a webhook containing the project data to the AI Matchmaker Edge Function.

    The AI Matchmaker Edge Function extracts the project text and requests a temporary vector embedding from the OpenAI API.

    The OpenAI API generates and returns the temporary vector.

    The AI Matchmaker Edge Function queries the Supabase Database to execute a cosine similarity search using the temporary vector.

    The Supabase Database calculates the similarity and returns a list of matching historical projects.

    The AI Matchmaker Edge Function queries the Supabase Database to retrieve a list of past projects for the exact same client.

    The Supabase Database returns the same-client project list.

    The AI Matchmaker Edge Function filters the combined matching projects by applying business rules, such as the trainee project logic.

    The AI Matchmaker Edge Function saves the final lists of similar projects and same-client projects into the "project_references" table in the Supabase Database.

    The AI Matchmaker Edge Function sends an HTTP webhook containing the match IDs to Microsoft Power Automate.

    Microsoft Power Automate receives the payload and executes the final email notification workflow.

    This scenario ends.
  time:timestamp: '2026-04-16T13:55:57.589520+02:00'
