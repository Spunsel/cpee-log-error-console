event:
  concept:instance: 98618
  id:id: external
  cpee:activity: external
  cpee:instance: 5d3b9c26-050e-4635-8739-def061535f76
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: e9bcaec4b0cc5301cb5d44dd3c06c0d33becb63b
  cpee:exposition: |-
    # User Input:
    The customer wishes to activate the consumption time series display on the meter display and notify the network operator or the customer wishes to deactivate the consumption time series display on the meter display and inform the network operator about this. For reasons of data protection law, the display of consumption time series, for example: load profile on the display via the call button, is only permitted in special cases. It must be possible to activate or deactivate the display of the consumption time series via the meter's WAN interface. The status is to be transmitted to the central system as ALARM or EVENT and entered in the logbook. In the basic setting of the meter, the display of the consumption time series must always be deactivated. Whether the display of the consumption time series, for example: load profile is active or inactive, is decided by the customer. He informs the network operator (via web portal, via the call center, letter, ...). A synchronization of the device setting with respect to the consumption time series display is usefully 1 - 2 times a day (Customer should not be able to change the setting for load profile display every minute). When the consumption time series display is activated, the customer has the option to view the load profile for the last 60 days directly on the meter display. Unless it is in the course of a customer change to a new customer based on the plant. Then a 60-day deactivation of the consumption time series display for data protection reasons is necessary. When activated, the consumption time series is available on the meter display for customers. When deactivated, the consumption time series is no longer visible on the meter display for customers. In both cases, the meter reports its status to the central system as ALARM or EVENT ("LP Display OFF" or "LP Display ON") and entry in the logbook of the meter.
  time:timestamp: '2025-12-29T10:39:13.374586+01:00'
