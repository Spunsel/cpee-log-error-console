  cpee:exposition: |+
    # User Input:
    The process starts.  an employee submits a vacation request. a decision is made. If the request is approved, the employee receives their vacation, and the process merges to a single flow. If the request is denied, the supervisor rejects the request, and the employee submits a new request, returning to the "employee submits vacation request" step. If an escalation occurs during the "employee submits vacation request" step, the process merges to a single flow. The process then returns to the initial decision point. If the initial condition is not true, the process ends.

  time:timestamp: '2025-11-25T13:50:00.117650+01:00'
