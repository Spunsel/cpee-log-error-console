event:
  concept:instance: 65138
  id:id: external
  cpee:activity: external
  cpee:instance: 2b309025-dd6a-4b2c-bbff-cde51df46ca5
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: c551d03385b49f490d81a6c779e4f05a70f93046
  cpee:exposition: |-
    # User Input:
    Der Prozess beginnt damit, dass ein Mitarbeiter einen Urlaubsantrag über das interne Portal stellt.
    Das System prüft automatisch, ob alle Pflichtfelder ausgefüllt sind. Wenn Informationen fehlen, wird der Antrag an den Mitarbeiter zurückgesendet, der ihn ergänzt und erneut einreicht.


    Wenn der Antrag vollständig ist, wird er an den direkten Vorgesetzten weitergeleitet.
    Der Vorgesetzte entscheidet, ob der Urlaub genehmigt oder abgelehnt wird.


    Wenn der Urlaub genehmigt wird, erhält der Mitarbeiter eine automatische Benachrichtigung über die Genehmigung. Außerdem wird der Urlaubskalender im HR-System aktualisiert.


    Wenn der Antrag abgelehnt wird, erhält der Mitarbeiter eine Ablehnungsbenachrichtigung mit optionalem Kommentar.


    Nach der Benachrichtigung wird der Prozess beendet.
  time:timestamp: '2025-11-25T14:00:35.723688+01:00'
