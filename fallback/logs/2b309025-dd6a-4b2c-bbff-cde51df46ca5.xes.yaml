event:
  concept:instance: 65138
  id:id: external
  cpee:activity: external
  cpee:instance: 2b309025-dd6a-4b2c-bbff-cde51df46ca5
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: b2f3a9d69d97f15dac81495728b07acc50c9b6d5
  cpee:exposition: |-
    # User Input:
    Der Prozess wird angestoßen, indem der Mitarbeiter einen Urlaubsantrag bei dem Vorgesetzten meldet. Der Vorgesetzte kann entscheiden, ob er den Urlaubsantrag ablehnt oder genehmigt. Wenn er den Antrag genehmigt, erhält der Mitarbeiter seinen Urlaub. Der Prozess ist positiv beendet. Wenn der Vorgesetzte den Urlaubsantrag ablehnt, gibt es zwei Möglichkeiten: entweder stellt der Mitarbeiter einen neuen Urlaubsantrag bei dem Vorgesetzten und der Prozess beginnt von vorne, oder der Mitarbeiter erhält keinen Urlaub. In diesem Fall ist der Prozess negativ beendet. 
  time:timestamp: '2025-11-25T13:59:11.608293+01:00'
