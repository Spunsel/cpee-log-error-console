  cpee:change_uuid: 24aeca329874bb0751fc10212d8bff056c206b9a
  cpee:exposition: "# User Input:\nUser preferences regarding the lighting in the
    building are collected.  The outside light conditions are constantly measured
    by light sensors. Depending on the light intensity and the user preferences, the
    light in the room  switched on, switched off, or maintained. If the light has
    been on for 10 hours OR it starts to flicker, it should be switched off. "
  time:timestamp: '2026-06-03T16:02:49.519138+02:00'
