    Another decision point is reached, followed by another decision point.
    At the next decision point, if the vacation is approved, the employee receives confirmation of their vacation.
    If the vacation is not approved, the employee receives notification that their vacation has been denied.
    Following the denial, there's a decision to either submit a new request, which loops back to the "employee submits vacation request" task, or to end the process.
    If the decision is to end the process, the process ends.
    If a new request is submitted, the process escalates and then returns to the decision point where vacation approval is determined.
    After the employee receives confirmation of their vacation, the process returns to the initial decision point.
    Finally, the process ends.

