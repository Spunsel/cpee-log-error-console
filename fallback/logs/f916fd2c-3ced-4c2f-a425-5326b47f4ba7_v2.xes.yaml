                    <method/>
                    <type>:task</type>
                    <arguments/>
                  </parameters>
                </call>
              </alternative>
              <alternative condition="Customer doesn't want more liquor" language="text/javascript"/>
            </choose>
          </loop>
        </alternative>
      </choose>
    </description>
