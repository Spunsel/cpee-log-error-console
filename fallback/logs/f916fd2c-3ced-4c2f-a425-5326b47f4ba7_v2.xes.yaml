    <?xml version="1.0"?>
    <description xmlns="http://cpee.org/ns/description/1.0" xmlns:a="http://cpee.org/ns/annotation/1.0">
      <call id="a1" endpoint="" a:alt_id="1">
        <parameters>
          <label>Retrieve ingredients</label>
          <method/>
          <type>:task</type>
          <arguments/>
        </parameters>
      </call>
      <choose mode="exclusive" a:alt_id="2">
        <alternative condition="Condition Met" language="text/javascript"/>
        <alternative condition="Condition Not Met" language="text/javascript">
          <call id="a7" endpoint="" a:alt_id="3">
            <parameters>
              <label>Mixing ingredients</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
          <parallel wait="-1" cancel="last" a:alt_id="4">
            <parallel_branch>
              <call id="a11" endpoint="" a:alt_id="5">
                <parameters>
                  <label>Adding ice cubes</label>
                  <method/>
                  <type>:task</type>
                  <arguments/>
