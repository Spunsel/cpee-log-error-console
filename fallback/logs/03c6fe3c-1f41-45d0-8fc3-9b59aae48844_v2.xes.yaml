    %% Output Intermediate
    ```mermaid
    graph LR
        0:startevent:((startevent))
        1:task:(Auftrag im ERP erfassen)
        2:exclusivegateway:{x}
        3:task:(Kundendaten anlegen)
        4:exclusivegateway:{x}
        5:exclusivegateway:{x}
        6:task:(Zahlungsbedingungen anpassen)
        7:exclusivegateway:{x}
        8:task:(Auftrag an Logistik weitergeben)
        9:task:(Materialverfügbarkeit prüfen)
        10:exclusivegateway:{x}
        11:task:(Nachbestellung auslösen)
        12:task:(Auf Materialeingang warten)
        13:exclusivegateway:{x}
        14:task:(Auftrag einplanen (Express priorisiert))
        15:task:(Liefertermin ermitteln)
        16:task:(Liefertermin an Vertrieb zurückgeben)
        17:task:(Auftragsbestätigung versenden)
        18:endevent:(((endevent)))

        0 --> 1
        1 --> 2
        2 --> |Kunde existiert nicht| 3
        3 --> 4
        2 --> |Kunde existiert| 4
        4 --> 5
        5 --> |Auftragswert > X| 6
        6 --> 7
        5 --> |Auftragswert <= X| 7
        7 --> 8
        8 --> 9
        9 --> 10
        10 --> |Nicht ausreichend| 11
        11 --> 12
        12 --> 13
        10 --> |Ausreichend| 13
        13 --> 14
        14 --> 15
        15 --> 16
        16 --> 17
        17 --> 18
    ```
  time:timestamp: '2026-03-23T10:14:19.391453+01:00'
