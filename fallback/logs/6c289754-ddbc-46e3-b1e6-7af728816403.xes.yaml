  cpee:instance: 6c289754-ddbc-46e3-b1e6-7af728816403
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 2d0a8247cc0fe8a94f87f06c66838f17d3b6b073
  cpee:exposition: |-
    # User Input:
    Customers upload their complaint via an online form. The form contains the insurance number, the amount of damage, and a description of the damage. 
    If the amount of damage is ≤ 100 Euro, an automatic plausibility check is conducted and the complaint is approved. The customer is informed via email and the money transfer is initiated.
    If the damage amount is above 100 Euro, a clerk checks the complaint. The customer is informed on the decision via email. If the complaint is rejected, the customer is offered an optional meeting. 
  time:timestamp: '2026-04-27T09:14:12.517354+02:00'
