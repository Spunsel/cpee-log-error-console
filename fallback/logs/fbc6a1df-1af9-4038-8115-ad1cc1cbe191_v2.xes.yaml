  cpee:exposition: |+
    # User Input:
    Article 17: Supervisory body
    1 Member States shall designate a supervisory body established in their territory or, upon mutual agreement with another Member State, a supervisory body established in that other Member State.
    That body shall be responsible for supervisory tasks in the designating Member State.
    Supervisory bodies shall be given by Supervisory bodies the necessary powers and adequate resources for the exercise of their tasks.
    2 Member States shall notify to the Commission the names and the addresses of their respective designated supervisory bodies.
    --PARALLEL TASKS--
    3(a) The role of the supervisory body shall be to supervise qualified trust service providers established in the territory of the designating Member State to ensure, through ex ante and ex post supervisory activities,
    3(b) The role of the supervisory body shall be to take action if necessary, in relation to non-qualified trust service providers established in the territory of the designating Member State, through ex post supervisory activities, when informed that those non-qualified trust service providers or the trust services the role provide allegedly do not meet the requirements laid down in this Regulation
    --END OF PARALLEL TASKS--
    --PARALLEL TASKS--
    4(a) For the purposes of paragraph 3 and subject to the limitations provided therein, the tasks of the supervisory body shall include to cooperate with other supervisory bodies and provide them with assistance IAW Article 18
    4(b) For the purposes of paragraph 3 and subject to the limitations provided therein, the tasks of the supervisory body shall include to analyse the conformity assessment reports
    4(c) For the purposes of paragraph 3 and subject to the limitations provided therein, the tasks of the supervisory body shall include to inform other supervisory bodies and the public about breaches of security or loss of integrity
    4(d) For the purposes of paragraph 3 and subject to the limitations provided therein, the tasks of the supervisory body shall include to report to the Commission about its main activities IAW of this Article
    4(e) For the purposes of paragraph 3 and subject to the limitations provided therein, the tasks of the supervisory body shall include to carry out audits or request a conformity assessment body to perform a conformity assessment of the qualified trust service providers
    4(f) For the purposes of paragraph 3 and subject to the limitations provided therein, the tasks of the supervisory body shall include to cooperate with the data protection authorities by informing them about the results of audits of qualified trust service providers, where personal data protection rules appear to have been breached by Member States
    4(g) For the purposes of paragraph 3 and subject to the limitations provided therein, the tasks of the supervisory body shall include to grant qualified status to trust service providers and to the services and to withdraw this status
    4(h) For the purposes of paragraph 3 and subject to the limitations provided therein, the tasks of the supervisory body shall include to inform the body responsible for the national trusted list referred to in about its decisions to grant or to withdraw qualified status, unless that body is also the supervisory body
    4(i) For the purposes of paragraph 3 and subject to the limitations provided therein, the tasks of the supervisory body shall include to verify the existence and correct application of provisions on termination plans in cases where the qualified trust service provider ceases its activities, including how information is kept by Member States accessible IAW point (h) of
    4(j) For the purposes of paragraph 3 and subject to the limitations provided therein, the tasks of the supervisory body shall include to require that trust service providers remedy any failure to fulfil the requirements laid down in this Regulation
    --END OF PARALLEL TASKS--5 Member States may require the supervisory body to establish, maintain and update a trust infrastructure IAW the conditions under national law.
    6 By 31 March each year, each supervisory body shall submit to the Commission a report on its previous calendar year’s main activities together with a summary of breach notifications received from trust service providers in accordance.
    7 The Commission shall make the annual report referred to in available to Member States.
    8 The Commission may define the formats and procedures for the report referred.
    Those implementing acts shall be adopted by Commission IAW the examination procedure referred.
    ---
    Article 18: Mutual assistance
    1 Supervisory bodies shall cooperate with a view to exchanging good practice.
    A supervisory body shall, upon receipt of a justified request from another supervisory body, provide that body with assistance so that the activities of supervisory bodies can be carried by Supervisory bodies out in a consistent manner.
    Mutual assistance may cover information requests and supervisory measures, such as requests to carry out inspections related to the conformity assessment reports as referred.
    --PARALLEL TASKS--
    2(a) A supervisory body may refuse that request on any of the following grounds the supervisory body is not competent to provide the requested assistance
    2(b) A supervisory body may refuse that request on any of the following grounds the requested assistance is not proportionate to supervisory activities of the supervisory body carried out IAW Article 17
    2(c) A supervisory body may refuse that request on any of the following grounds providing the requested assistance would be incompatible with this Regulation
    --END OF PARALLEL TASKS--
    3 IF appropriate, Member States may authorise their respective supervisory bodies to carry out joint investigations in which staff from other Member States’ supervisory bodies is involved by Member States.
    The arrangements AND procedures for such joint actions shall be agreed by Member States upon AND established by the Member States concerned IAW their national law.
    ---
    Article 19: Security requirements applicable to trust service providers
    1 Qualified and non-qualified trust service providers shall take appropriate technical and organisational measures to manage the risks posed to the security of the trust services.
    Having regard to the latest technological developments, those measures shall ensure that the level of security is commensurate to the degree of risk.
    measures shall be taken by Qualified non - qualified service providers to prevent and minimise the impact of security incidents and inform stakeholders of the adverse effects of any such incidents.
    2 Qualified and non-qualified trust service providers shall but in any event within 24 hours after having become aware of it, notify the supervisory body and, where applicable, other relevant bodies, such as the competent national body for information security or the data protection authority, of any breach of security or loss of integrity.
    IF the breach of security or loss of integrity is likely to adversely affect a natural or legal person to whom the trusted service has been provided by Qualified non - qualified service providers, the trust service provider shall also notify the natural or legal person of the breach of security or loss of integrity.
    IF appropriate if a breach of security or loss of integrity concerns two or more Member States, the notified supervisory body shall inform the supervisory bodies in other Member States concerned and ENISA.
    The notified supervisory body shall inform the public OR require the trust service provider to do so, where the notified supervisory body determines that disclosure of the breach of security or loss of integrity is in the public interest.
    3 The supervisory body shall provide ENISA once a year with a summary of notifications of breach of security and loss of integrity received from trust service providers.
    --PARALLEL TASKS--
    4(a) The Commission may further specify the measures referred to in ; AND
    4(b) The Commission may define the formats and procedures, including deadlines, applicable for the purpose of paragraph 2.
    Those implementing acts shall be adopted by Commission IAW the examination procedure
    --END OF PARALLEL TASKS--


