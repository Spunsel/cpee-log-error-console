  cpee:description: |
    <?xml version="1.0"?>
    <description xmlns="http://cpee.org/ns/description/1.0">
      <call id="a17" endpoint="subprocess">
        <parameters>
          <label>Validate Special Action</label>
          <color/>
          <method>:post</method>
          <arguments>
            <behavior>wait_running</behavior>
            <url>https://cpee.org/hub/server/Teaching.dir/Prak.dir/TUM-Prak-24-WS.dir/Zeka_Dizdar.dir/actions.dir/validate_special.xml</url>
            <init>
              <current_player>!data.current_player</current_player>
            </init>
            <endpoints/>
            <attributes/>
            <customization/>
          </arguments>
        </parameters>
        <code>
          <signal/>
          <prepare/>
          <finalize output="result">data.title = result["title"]
    data.message = result["message"]
    data.special = result["special"]
    data.current_player = result["current_player"]</finalize>
          <update output="result"/>
          <rescue output="result"/>
        </code>
        <annotations>
          <_generic/>
          <_logging_behavior>
            <_exclude/>
            <_include/>
          </_logging_behavior>
          <_timing>
            <_timing_weight/>
            <_timing_avg/>
            <explanations/>
          </_timing>
          <_shifting>
            <_shifting_type>Duration</_shifting_type>
          </_shifting>
          <_context_data_analysis>
            <probes/>
            <ips/>
          </_context_data_analysis>
          <report>
            <url/>
          </report>
          <_notes>
            <_notes_general/>
          </_notes>
        </annotations>
        <documentation>
          <input/>
          <output/>
          <implementation>
            <description/>
          </implementation>
          <code>
            <description/>
          </code>
        </documentation>
      </call>
      <choose mode="exclusive" label="">
        <alternative condition="data.special == true">
          <manipulate id="a3" label="Handle Special Action Conditions">
            <code># --- Variables ---
    action_id = data.current_player["chosen_action"].to_i

    skills = data.current_player["skills"] || []
    skill  = skills.find { |s| (s["id"] || 0).to_i == action_id } || {}

    m_cost = (skill["m_cost"] || 0).to_i
    a_cost = (skill["a_cost"] || 0).to_i

    mana = data.current_player["mana"].to_i
    adr  = data.current_player["adrenaline"].to_i

    conds = (data.current_player["conditions"] || []).map(&amp;:to_s)

    # --- Apply Special Action Results ---

    case action_id
    when 14
      max_move = data.current_player["max_movement"].to_i
      cur_move = data.current_player["current_movement"].to_i
      data.current_player["current_movement"] = cur_move + max_move

      data.current_player["action_available"] = false
    when 3, 9, 11
      data.current_player["mana"] = [mana - m_cost, 0].max
      data.current_player["adrenaline"] = [adr - a_cost, 0].max

      case action_id
      when 3
        conds &lt;&lt; "raging" unless conds.include?("raging")
      when 9
        conds &lt;&lt; "hidden" unless conds.include?("hidden")
      when 11
        conds &lt;&lt; "shielded" unless conds.include?("shielded")
      end

      data.current_player["b_action_available"] = false
    end

    data.current_player["conditions"] = conds</code>
            <annotations>
              <_logging_behavior>
                <_exclude/>
              </_logging_behavior>
              <_context_data_analysis>
                <probes/>
              </_context_data_analysis>
            </annotations>
          </manipulate>
          <parallel wait="-1" cancel="last">
            <parallel_branch>
              <call id="a7" endpoint="frames_display">
