  cpee:change_uuid: f8c06da07ba62d1f786f5a6ae246a43d0c1963e9
  cpee:exposition: |-
    %% Output Intermediate
    Sure, here is the updated Mermaid.js code for a typical order to cash workflow:

    ```mermaid
    graph LR
    se:startevent:((startevent))-->t1:task:(Receive Order)
    t1:task:-->t2:task:(Check Credit)
    t2:task:-->eg1:exclusivegateway:{x}
    eg1:exclusivegateway:{x}-->|Credit Approved|t3:task:(Process Order)
    eg1:exclusivegateway:{x}-->|Credit Denied|t4:task:(Reject Order)
    t3:task:-->t5:task:(Ship Order)
    t4:task:-->ee:endevent:(((endevent)))
    t5:task:-->t6:task:(Send Invoice)
    t6:task:-->t7:task:(Receive Payment)
    t7:task:-->ee:endevent:(((endevent)))
    ```

    This process starts with receiving an order, then checking the customer's credit. If the credit is approved, the order is processed and shipped, and an invoice is sent. After receiving payment, the process ends. If the credit is denied, the order is rejected and the process ends.
  time:timestamp: '2025-12-01T09:01:43.408538+01:00'
