  cpee:change_uuid: 9439bd3a061c9092ff6cc46bec67a0c43d611fcf
  cpee:exposition: |+
    # User Input:
    The process starts. First, the customer is seated, and then their order is taken. After the order is taken, the payment is received. A decision is made based on whether the pizza is on the menu. If the pizza is on the menu, the process proceeds to another decision point. If the pizza is not on the menu, the cook is informed, and then the process proceeds to the mentioned decision point. At that point, the pizza is made and then baked. Another decision is made based on whether the ingredients are available. If the ingredients are available, the pizza is served, and the process proceeds to its end. If the ingredients are unavailable, the customer is informed, and the process proceeds to its end. The process ends. if there are no seats, the customer gets informed. if he chooses to wait, he gets seated at the next table, if not, the process ends

  time:timestamp: '2026-01-11T18:13:54.035133+01:00'
...
