event:
  concept:instance: 8574
  id:id: ex-ante
  cpee:instance: 64a9c21a-f3b6-4b59-a7b5-2fce1352ea6a
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 174a722e959ae4f0387a6f9294fb03d7812adcdd
  cpee:exposition: |-
    # User Input:
    The process starts when a start event is triggered. A form is filled out and sent, after which the form is checked. Depending on the outcome of the check, the process either proceeds to a "Weiterleiten" task or skips it. If the "weiterleiten" task is executed, it is followed by a gateway. Regardless of whether the "weiterleiten" task was executed or skipped, the process continues to another gateway where a decision is made whether approval by a manager is required. If approval is required, a "Genehmigen durch Manager" task is performed. Otherwise, this task is skipped. After the gateway, the "Erledigen" task is performed. Subsequently, depending on whether everything fits, either an email is sent or another task named "Was passiert" is performed. Finally, after sending the email or performing the "Was passiert" task, a task named "Ding erledigen" is executed, and the process ends.
  time:timestamp: '2026-03-29T14:25:04.847564+02:00'
