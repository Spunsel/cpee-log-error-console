    <?xml version="1.0"?>
    <description xmlns="http://cpee.org/ns/description/1.0">
      <call id="a1" endpoint="bookAir">
        <parameters>
          <label>Book Airline 1</label>
          <method>:post</method>
          <arguments>
            <from>!data.from</from>
            <to>!data.to</to>
            <persons>!data.persons</persons>
          </arguments>
        </parameters>
        <code>
          <prepare/>
          <finalize output="result">data.airline = result.value('id')
    data.costs += result.value('costs').to_f
    status.update 1, 'Hotel'</finalize>
          <update output="result"/>
          <rescue output="result"/>
        </code>
        <annotations>
          <_timing>
            <_timing_weight/>
            <_timing_avg/>
            <explanations/>
          </_timing>
          <_shifting>
            <_shifting_type>Duration</_shifting_type>
          </_shifting>
          <_context_data_analysis>
            <probes/>
            <ips/>
          </_context_data_analysis>
          <report>
            <url/>
          </report>
          <_notes>
            <_notes_general/>
          </_notes>
        </annotations>
        <documentation>
          <input/>
          <output/>
          <implementation>
            <description/>
          </implementation>
          <code>
            <description/>
          </code>
        </documentation>
      </call>
      <parallel wait="-1" cancel="last">
        <loop mode="pre_test" condition="data.persons &gt; 0">
          <parallel_branch>
            <call id="a2" endpoint="bookHotel">
              <parameters>
                <label>Book Hotel</label>
                <method>:post</method>
                <arguments>
                  <to>!data.to</to>
                </arguments>
              </parameters>
              <code>
                <prepare/>
                <finalize output="result">data.hotels &lt;&lt; result.value('id')
    data.costs += result.value('costs').to_f</finalize>
                <update output="result"/>
                <rescue output="result"/>
              </code>
              <annotations>
                <_timing>
                  <_timing_weight/>
                  <_timing_avg/>
                  <explanations/>
                </_timing>
                <_shifting>
                  <_shifting_type>Duration</_shifting_type>
                </_shifting>
                <_context_data_analysis>
                  <probes/>
                  <ips/>
                </_context_data_analysis>
                <report>
                  <url/>
                </report>
                <_notes>
                  <_notes_general/>
                </_notes>
              </annotations>
              <documentation>
                <input/>
                <output/>
                <implementation>
                  <description/>
                </implementation>
                <code>
                  <description/>
                </code>
              </documentation>
            </call>
          </parallel_branch>
          <manipulate id="a3" label="">
            <code>data.persons -= 1</code>
            <annotations>
              <_logging_behavior>
                <_exclude/>
              </_logging_behavior>
              <_context_data_analysis>
                <probes/>
              </_context_data_analysis>
            </annotations>
          </manipulate>
        </loop>
      </parallel>
