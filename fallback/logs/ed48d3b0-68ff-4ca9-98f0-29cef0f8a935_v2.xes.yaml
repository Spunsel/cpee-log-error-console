event:
  concept:instance: 377
  id:id: external
  cpee:activity: external
  cpee:instance: ed48d3b0-68ff-4ca9-98f0-29cef0f8a935
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 0e7b487bbe8a1cc0749f524b2a90fbeff83704cf
  cpee:exposition: |-
    # User Input:
    The police has a new app to remind you of your car service. The process is
    started after a successful service. When a service is necessary, the system
    checks if your car is still registered. If it is registered, you are notified.
    If you do not go to the service, you are fined after 30 days. At the car
    service facility the mechanic enters the problems of your car for reference.
    While you wait (can take several days), you get status updates via email).
    You can pay through the app, when the repair is done. The mechanic enters
    that the repair was successful and you got your "Pickerl". The mechanic enters
    the time for you next service.
  time:timestamp: '2025-10-30T17:28:39.802231+01:00'
