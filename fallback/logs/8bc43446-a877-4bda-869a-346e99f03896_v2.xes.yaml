    <?xml version="1.0"?>
    <description xmlns="http://cpee.org/ns/description/1.0" xmlns:a="http://cpee.org/ns/annotation/1.0">
      <call id="a1" endpoint="" a:alt_id="1">
        <parameters>
          <label>Upload Complaint</label>
          <method/>
          <type>:task</type>
          <arguments/>
        </parameters>
      </call>
      <choose mode="exclusive" a:alt_id="2">
        <alternative condition="Damage &lt;= 100 Euro" language="text/javascript">
          <call id="a5" endpoint="" a:alt_id="3">
            <parameters>
              <label>Conduct Automatic Plausibility Check</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
          <call id="a7" endpoint="" a:alt_id="4">
            <parameters>
              <label>Approve Complaint Automatically</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
          <call id="a9" endpoint="" a:alt_id="5">
            <parameters>
              <label>Inform Customer (Approved)</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
          <call id="a11" endpoint="" a:alt_id="6">
            <parameters>
              <label>Initiate Money Transfer</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
        </alternative>
        <alternative condition="Damage &gt; 100 Euro" language="text/javascript">
          <call id="a13" endpoint="" a:alt_id="7">
            <parameters>
              <label>Clerk Checks Complaint</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
          <call id="a15" endpoint="" a:alt_id="8">
            <parameters>
              <label>Inform Customer on Decision</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
          <choose mode="exclusive" a:alt_id="9">
            <alternative condition="Complaint Approved" language="text/javascript">
              <call id="a11" endpoint="" a:alt_id="6">
                <parameters>
                  <label>Initiate Money Transfer</label>
                  <method/>
                  <type>:task</type>
                  <arguments/>
                </parameters>
              </call>
            </alternative>
            <alternative condition="Complaint Rejected" language="text/javascript">
              <call id="a21" endpoint="" a:alt_id="10">
                <parameters>
                  <label>Offer Optional Meeting</label>
                  <method/>
                  <type>:task</type>
                  <arguments/>
                </parameters>
              </call>
            </alternative>
          </choose>
        </alternative>
      </choose>
