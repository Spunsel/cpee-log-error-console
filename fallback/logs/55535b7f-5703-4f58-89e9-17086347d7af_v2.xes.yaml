  cpee:exposition: |-
    # User Input:
    A VC company has a constant flow of emails to their inbox, with small start ups that want investments. The request comes to the inbox, then it gets filtered by an LLM on relevance, higher than 0.5 it gets redirected to a Junior, else rejected. Then the juniors decide if its worthy and conduct a proper due diligance. If it satisfies, contact is made with the start up with the Seniors of the VC. 
  time:timestamp: '2026-04-13T10:36:10.997802+02:00'
