event:
  concept:instance: 9708
  id:id: ex-ante
  cpee:instance: f9ea4218-31a7-4ea0-9c18-9047b85722f3
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 7daa2f1d66ec0a64409460950ca4096aae822408
  cpee:exposition: |-
    # User Input:
    Criar um diagrama BPMN para uma pizzaria com 4 piscinas: Venda, Produção, Entrega e Estoque.

    Piscina 1: Venda
    Início: Cliente chega (por balcão, telefone ou app).
    Tarefa 1: Atendente anota o pedido.
    Tarefa 2: Atendente confirma disponibilidade de sabores e ingredientes.
    Decisão 1: Está disponível?
    - Se NÃO: Informar indisponibilidade e sugerir alternativas. Voltar para "Atendente anota o pedido".
    - Se SIM: Seguir para Tarefa 3.
    Tarefa 3: Atendente informa valor e tempo de entrega.
    Tarefa 4: Atendente registra o pedido.
    Fim da piscina Venda. Enviar mensagem para a piscina Produção.

    Piscina 2: Produção
    Início: Cozinha recebe o pedido (mensagem vinda da Venda).
    Tarefa 1: Cozinha prepara o pedido solicitado.
    Tarefa 2: Cozinha embala o pedido.
    Fim da piscina Produção. Enviar mensagem para a piscina Entrega.

    Piscina 3: Entrega
    Início: Gerente recebe pedido pronto (mensagem vinda da Produção).
    Tarefa 1: Gerente atribui pedido a um entregador.
    Tarefa 2: Entregador confirma saída para entrega.
    Tarefa 3: Entregador realiza a rota até o cliente.
    Tarefa 4: Cliente recebe o pedido.
    Decisão 1: O pagamento já foi realizado?
    - Se NÃO: Cliente paga no ato da entrega.
    - Se SIM: Seguir para Tarefa 5.
    Tarefa 5: Entregador confirma a conclusão da entrega.
    Fim da piscina Entrega.

    Piscina 4: Estoque (processo paralelo e contínuo)
    Início: Funcionário verifica quantidade de ingredientes periodicamente.
    Decisão 1: É necessário comprar mais?
    - Se NÃO: Voltar para "Funcionário verifica quantidade".
    - Se SIM: Seguir para Tarefa 1.
    Tarefa 1: Funcionário solicita compra de ingredientes.
    Tarefa 2: Se houver falta de um item, comunicar a piscina Venda imediatamente para suspender a venda do produto.
    Voltar para "Funcionário verifica quantidade".
  time:timestamp: '2026-04-21T22:24:30.326781+02:00'
