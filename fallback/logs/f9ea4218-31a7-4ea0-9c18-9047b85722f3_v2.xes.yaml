event:
  concept:instance: 9708
  id:id: ex-ante
  cpee:instance: f9ea4218-31a7-4ea0-9c18-9047b85722f3
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 7daa2f1d66ec0a64409460950ca4096aae822408
  cpee:exposition: |-
    %% Output Intermediate
    Here is the Mermaid.js code for the provided BPMN model:

    ```mermaid
    graph LR
    se1:startevent:((startevent))-->t1:task:(Cliente chega)
    t1:task:-->t2:task:(Atendente anota o pedido)
    t2:task:-->t3:task:(Atendente confirma disponibilidade)
    t3:task:-->eg1:exclusivegateway:{x}
    eg1:exclusivegateway:{x}-->|Está disponível? NÃO|t2:task:
    eg1:exclusivegateway:{x}-->|Está disponível? SIM|t4:task:(Atendente informa valor e tempo de entrega)
    t4:task:-->t5:task:(Atendente registra o pedido)
    t5:task:-->ee1:endevent:(((endevent)))

    graph LR
    se2:startevent:((startevent))-->t6:task:(Cozinha recebe o pedido)
    t6:task:-->t7:task:(Cozinha prepara o pedido solicitado)
    t7:task:-->t8:task:(Cozinha embala o pedido)
    t8:task:-->ee2:endevent:(((endevent)))

    graph LR
    se3:startevent:((startevent))-->t9:task:(Gerente recebe pedido pronto)
    t9:task:-->t10:task:(Gerente atribui pedido a um entregador)
    t10:task:-->t11:task:(Entregador confirma saída para entrega)
    t11:task:-->t12:task:(Entregador realiza a rota até o cliente)
    t12:task:-->t13:task:(Cliente recebe o pedido)
    t13:task:-->eg2:exclusivegateway:{x}
    eg2:exclusivegateway:{x}-->|O pagamento já foi realizado? NÃO|t14:task:(Cliente paga no ato da entrega)
    eg2:exclusivegateway:{x}-->|O pagamento já foi realizado? SIM|t15:task:(Entregador confirma a conclusão da entrega)
    t15:task:-->ee3:endevent:(((endevent)))

    graph LR
    se4:startevent:((startevent))-->t16:task:(Funcionário verifica quantidade de ingredientes)
    t16:task:-->eg3:exclusivegateway:{x}
    eg3:exclusivegateway:{x}-->|É necessário comprar mais? NÃO|t16:task:
    eg3:exclusivegateway:{x}-->|É necessário comprar mais? SIM|t17:task:(Funcionário solicita compra de ingredientes)
    t17:task:-->t18:task:(Comunicar a piscina Venda)
    t18:task:-->t16:task:
    ```

    Please note that this is a simplified version of the process. In a real-world scenario, you might want to use message events or signal events to model the communication between the pools (Venda, Produção, Entrega, Estoque). However, Mermaid.js does not support these BPMN elements.
  time:timestamp: '2026-04-21T22:24:30.327076+02:00'
