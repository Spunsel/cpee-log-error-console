  cpee:change_uuid: 982f4602867153c128a23b9a36b78d7c786f67b2
  cpee:exposition: |-
    # User Input:
    The process starts when the lab material is received.

    The material is then checked for correctness and quality. If the check reveals that the sample is unsuitable—for example, the labeling is unclear or the volume is insufficient—the sample is re-prepared or reprocessed, and the check is repeated.

    Once the sample passes the check, the examination is performed. After the examination, a report is created to document the results.

    The process ends when the report is completed.
  time:timestamp: '2025-10-28T23:23:22.185887+01:00'
