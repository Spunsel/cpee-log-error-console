  cpee:change_uuid: c87abb4ffc7a6ce42907a27733720756dfc13020
  cpee:exposition: |-
    # User Input:
    The process starts with receiving the lab material.
    After it is received, the lab material is checked for correctness and quality, while at the same time its details are recorded in the laboratory information system. Once both the checking and the registration are completed, the examination of the lab material is performed.
    Finally, a report is created to document the results, and the process ends.
  time:timestamp: '2025-10-28T23:19:43.931102+01:00'
