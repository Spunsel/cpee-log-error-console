  cpee:exposition: |-
    # User Input:
    The process starts at 6 o'clock in the morning. First a orderpicker will check whether there are any orders yet to pack. If there are no orders he will leave his workplace and grab a coffee. If there is an order he will check on the list on his terminal in which area of the stockroom he has to go for the required order items. He will collect all items and pack them together in a box. he puts a label on it and prepares it for delivery.
  time:timestamp: '2026-03-26T12:26:14.369930+01:00'
