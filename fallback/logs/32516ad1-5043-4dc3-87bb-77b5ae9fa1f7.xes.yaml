  cpee:exposition: |-
    %% Output Intermediate
    ```mermaid
    bpmn
      direction LR
        0:startevent:((startevent))
        1:task:(Receive Customer Request)
        2:exclusivegateway:{x}
        3:task:(Send 'Activate' Command to Meter)
        4:task:(Meter Activates Display)
        5:exclusivegateway:{x}
        6:task:(Send 'Deactivate' Command to Meter)
        7:task:(Meter Deactivates Display)
        8:task:(Meter Reports Status to Central System)
        9:task:(Meter Enters Status in Logbook)
        10:endevent:(((endevent)))

        0 --> 1
        1 --> 2
        2 --> |Activate| 3
        3 --> 4
        4 --> 5
        2 --> |Deactivate| 6
        6 --> 7
        7 --> 5
        5 --> 8
        8 --> 9
        9 --> 10
    ```
  time:timestamp: '2026-01-12T15:05:56.725374+01:00'
