  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 81e0e50e8b39f62bf849f6f4832ac1f6f8dc50d7
  cpee:exposition: |+
    # User Input:
    The stock clerk prints out a record keeping sheet and enters the date and name of the person conducting the inspection.
    Afterwards. The stock clerk walks through the temperature sensitive areas in the store to check for meat-based products.
    The stock clerk checks specifically for items close to or past their expiration date.
    If the product is past the expiration day, the stock clerk notes the product and amount on a record keeping sheet.
    He puts the item aside in a separate cart for later disposal.
    If the expiration date is as close as 48h, the stock clerk attaches a red 20% discount sticker and puts the item at the top of the stack.
    If the expiration date is as close as 24h, the stock clerk attaches a 30% discount sticker and moves it to the cooling shelf at the entry of the store.
    After having finished the inspection and disposed the expired products, the record keeping sheet is signed by the stock clerk at every line item.
    After the manager's final signature, the shop clerk scans the record keeping sheet and uploads it to a SharePoint folder, organized by year and month.
    After the stock clerk has ensured, that the sheet has been uploaded the process is finished.

  time:timestamp: '2025-11-28T17:56:56.676159+01:00'
