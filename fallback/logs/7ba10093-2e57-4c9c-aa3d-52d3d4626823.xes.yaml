event:
  concept:instance: 140609
  id:id: external
  cpee:activity: external
  cpee:instance: 7ba10093-2e57-4c9c-aa3d-52d3d4626823
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 99aa8d1b149116f8fe404a63d808f8bcc55eb080
  cpee:exposition: |-
    # User Input:
    First, suitable microorganisms or cells (such as bacteria, yeast, or animal cells) are selected and prepared. These cells are grown under controlled laboratory conditions to obtain a healthy starter culture.


    Next, the starter culture is transferred into a large vessel called a bioreactor or fermenter. Inside the bioreactor, environmental conditions such as temperature, pH, oxygen supply, and nutrient levels are carefully controlled. The cells are provided with nutrients like sugars, nitrogen sources, and minerals so that they can grow and multiply. During this stage, known as fermentation or cell cultivation, the cells produce the desired biological product.


    After sufficient growth and product formation, the fermentation process is stopped. The mixture inside the bioreactor, called the broth, contains cells, unused nutrients, waste products, and the target product. This mixture is then harvested.


    The next stage is downstream processing, where the product is separated and purified. First, the cells are removed from the liquid by methods such as filtration or centrifugation. If the product is located inside the cells, the cells are broken open using cell disruption techniques. The released product is then separated from cell debris and other impurities.


    After separation, further purification steps such as chromatography, precipitation, or membrane filtration are used to obtain the product in a highly pure form. This ensures that the final product meets quality and safety standards.


    Finally, the purified product is formulated into a usable form. It may be converted into tablets, injections, powders, or liquid solutions, packaged, labeled, and stored under appropriate conditions for distribution and use.
  time:timestamp: '2026-02-04T14:14:15.120218+01:00'
