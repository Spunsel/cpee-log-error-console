    %% Output Intermediate
    graph LR
      0:startevent:((Start))
      1:task:(Receive Invoice)
      2:task:(Verify Invoice)
      3:exclusivegateway:{x}
      4:task:(Approve Invoice)
      5:task:(Process Payment)
      6:exclusivegateway:{x}
      7:task:(Record Payment)
      8:task:(Send Confirmation)
      9:endevent:(((End)))

      0 --> 1
      1 --> 2
      2 --> 3
      3 --> |Valid Invoice| 4
      3 --> |Invalid Invoice| 9
      4 --> 5
      5 --> 6
      6 --> |Payment Successful| 7
      6 --> |Payment Failed| 9
      7 --> 8
      8 --> 9
