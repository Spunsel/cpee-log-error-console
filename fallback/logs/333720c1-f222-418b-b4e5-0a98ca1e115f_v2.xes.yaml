event:
  concept:instance: 10925
  id:id: ex-ante
  cpee:instance: 333720c1-f222-418b-b4e5-0a98ca1e115f
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 3cc82560e12987f5b584e7aec65c05f9009159c1
  cpee:exposition: |
    # User Input:
    Category: Manufacturing Title: Building a House
     
    You want to build a tree house. First you collect your requirements, and send them to a tree house architect. The architect sends you back a draft, which you refine multiple times with additional requirements. You then create the list of needed materials from the plan. These materials fall into several categories, you order them from several online stores. While the order is processed, you send messages to several of your friends to build the house. After the house is built, you send invitations for a tree house party to your friends. In order to buy the snacks for the party, a list of people that attend the party is created.  Zu diesem Szenario sollst du ein BPMN Modell Code erstellen. Schreibe den BPMN-Code CPEE-kompatibel und block-strukturiert. Es darf kein XOR direkt nach „collect requirements“ entstehen. Der Ablauf muss zuerst linear sein: collect requirements → send to architect → receive draft. Erst danach folgt ein XOR „Refinement needed?“. Der yes-Pfad führt über refine requirements → send additional requirements → receive draft zurück zu genau diesem XOR. Der no-Pfad führt weiter zu create materials list. AND-Gateways müssen immer als sauberer Split mit passendem Join modelliert werden.
  time:timestamp: '2026-05-05T11:24:34.857033+02:00'
