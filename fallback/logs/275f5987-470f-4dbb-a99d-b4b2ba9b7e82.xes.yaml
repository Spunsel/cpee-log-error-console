  cpee:change_uuid: 927fdf3025fa31c68eb3a62770bf5d7c58858202
  cpee:exposition: |-
    # User Input:
    Article 7 Organisational structure and separation of the reporting lines 1.   A CCP shall define the composition, role and responsibilities of the board and senior management and any board committees. These arrangements shall be clearly specified and well-documented. The board shall establish, at a minimum an audit committee and a remuneration committee. The risk committee established in accordance with Article 28 of Regulation (EU) No 648/2012 shall be an advisory committee to the board. 2.   The board shall assume at least the following responsibilities: (a) the establishment of clear objectives and strategies for the CCP; (b) the effective monitoring of senior management; (c) the establishment of appropriate remuneration policies, (d) the establishment and oversight of the risk management function; (e) the oversight of the compliance function and internal control function; (f) the oversight of outsourcing arrangements; (g) the oversight of compliance with all provisions of this Regulation, Regulation (EU) No 648/2012, Implementing Regulation (EU) No 1249/2012 and all other regulatory and supervisory requirements; (h) the provision of accountability to the shareholders or owners and employees, clearing members and their customers and other relevant stakeholders. 3.   Senior management shall have at least the following responsibilities: (a) ensuring consistency of the CCP’s activities with the objectives and strategy of the CCP as determined by the board; (b) designing and establishing compliance and internal control procedures that promote the CCP’s objectives; (c) subjecting the internal control procedures to regular review and testing; (d) ensuring that sufficient resources are devoted to risk management and compliance; (e) be actively involved in the risk control process; (f) ensuring that risks posed to the CCP by its clearing and activities linked to clearing are duly addressed. 4.   Where the board delegates tasks to committees or sub-committees, it shall retain the approval of decisions that could have a significant impact on the risk profile of the CCP. 5.   The arrangements by which the board and senior management operate shall include processes to identify, address and manage potential conflicts of interest of members of the board and senior management. 6.   A CCP shall have clear and direct reporting lines between its board and senior management in order to ensure that the senior management is accountable for its performance. The reporting lines for risk management, compliance and internal audit shall be clear and separate from those for the other operations of the CCP. The chief risk officer shall report to the board either directly or through the chair of the risk committee. The chief compliance officer and the internal audit function shall report directly to the board.
  time:timestamp: '2026-01-05T17:08:55.294631+01:00'
