event:
  concept:instance: 46915
  id:id: ex-ante
  cpee:instance: 2f767e79-eabe-4af2-9f4d-c98c78ab19f4
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 77731151feb2c989138ae7d4d1dba759749721a3
  cpee:exposition: |-
    # User Input:
    Создай BPMN-диаграмму для бизнес-процесса «Поиск и назначение водителя (матчинг)» в компании «Яндекс Такси». Участники: Модуль матчинга (система), Водитель, Сервис уведомлений.

    Стартовое событие: получен новый заказ из процесса приёма заказа.

    Действия по порядку:
    1. Алгоритм матчинга ищет водителей в радиусе 2–5 км, подходящих по тарифу и статусу «свободен».
    2. Ранжирование кандидатов по времени подачи, рейтингу и вероятности принятия.
    3. Система отправляет push-уведомление выбранному водителю с предложением заказа.
    4. Таймаут ожидания ответа — 15 секунд.
    5. Шлюз-решение (исключительное):
       - Если водитель принял заказ → переход к шагу 6.
       - Если водитель не ответил или отказался → вернуться к шагу 1 (выбрать следующего кандидата).
    6. Система назначает заказ водителю (статус «назначен»).
    7. Система отправляет пассажиру информацию о водителе (имя, марка авто, госномер, рейтинг, геопозиция).

    Конечное событие: поездка переведена в статус «назначена».
  time:timestamp: '2026-05-25T22:37:32.148298+02:00'
