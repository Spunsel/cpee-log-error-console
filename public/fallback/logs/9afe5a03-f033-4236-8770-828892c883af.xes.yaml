event:
  concept:instance: 83125
  id:id: external
  cpee:activity: external
  cpee:instance: 9afe5a03-f033-4236-8770-828892c883af
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: bc36f4577cf55de51eab31f202d924c24042a476
  cpee:exposition: |-
    # User Input:
    The process in the Yummy Cookies starts when Emma de Jong, the manager, checks the orders from the database, describing the quantity, the taste, the shape and the size of the cookies, as well the decorations.
    Orders can be standard or personalized. Standard orders concern standard sizes and shapes for the cookies, while personalized orders concern specific requests and designs regarding sizes and shapes. Two employees are responsible for making the cookies, Helen the chef, and Tom the assistant chef. Regarding the standard orders, the assistant chef prepares the basic cookie dough for the oven and puts it in the oven, while the chef prepares the basis for the decoration. In the case of personalized orders, the chef creates the cookie dough that the assistant chef puts in the oven and while the cookies are in the oven she prepares the basis for the decoration.
    After the cookies come out of the oven, and the ingredients for the decoration are ready, the chef decorates the cookies. At the same time the assistant prepares the packaging, and finalizes the order by packing the cookies (e.g. writes a card with wishes). After the order is ready the manager performs the final quality check and updates the database that this order is finished.
    use swimlanes
  time:timestamp: '2025-12-10T12:40:39.951661+01:00'
