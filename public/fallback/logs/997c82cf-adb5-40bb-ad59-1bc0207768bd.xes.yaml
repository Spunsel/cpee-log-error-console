event:
  concept:instance: 83265
  id:id: external
  cpee:activity: external
  cpee:instance: 997c82cf-adb5-40bb-ad59-1bc0207768bd
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/exposition
  cpee:change_uuid: 53e7be05f1d567e400ebb5b52f2b6e23f8a27fce
  cpee:exposition: "# User Input:\nBei wirtschaftlichen Drittmitteln gibt es keine
    Fördergeber wie DFG oder Projektträger Jülich.\r\nStattdessen gibt es:\r\n• Projektinitiator
    (PI)\r\n• Projektmitarbeiter (PM)\r\n• F&E / Drittmittelverwaltung\r\n• Wirtschaftlicher
    Auftraggeber / Kunde = Mittelgeber\r\nGenau so bildet es auch das -Dokument ab:\r\nWirtschaftliche
    Drittmittel = Verträge mit Unternehmen, Institutionen, externen Auftraggebern
    (also Kunden), nicht Förderinstitutionen.\r\nIch definiere die Rollen also wie
    folgt:\r\n PI – Projektinitiator\r\n PM – Projektmitarbeiter\r\nF&E – interne
    Drittmittelverwaltung / Verwaltung wirtschaftlicher Projekte\r\nMittelgeber –
    Externer Auftraggeber (Unternehmen, Behörde, sonstiger Kunde)\r\n \r\nProzess
    der wirtschaftlichen Drittmittelförderung (wirtschaftliche Projekte)\r\n(Struktur
    identisch zu deinem nicht-wirtschaftlichen Prozess)\r\n \r\nPhase 1 – Projektanbahnung
    & Vorbereitung\r\nDiese Phase entspricht im Abschnitt 3.2.1 – Vorbereitende Arbeiten.\r\n \r\n1.
    Projektanfrage / Projektidee\r\n• Externer Auftraggeber (Kunde) stellt Anfrage
    oder PI entwickelt Projektidee mit wirtschaftlichem Nutzen.\r\n• Verantwortlich:
    PI\r\n• Rolle Mittelgeber: Anfrage / Bedarf formulieren.\r\n \r\n2. Vorprüfung
    durch PI\r\n• Erste Einschätzung:\r\no Ist das Thema durchführbar?\r\no Ist die
    wirtschaftliche Tätigkeit zulässig (Trennungsrechnung, Vollkosten)?\r\n• Verantwortlich:
    PI\r\n• Unterstützung: F&E (bei Bedarf)\r\n \r\n3. Beratung und Unterstützung
    durch F&E\r\n• Prüfung:\r\no Ist es wirklich „wirtschaftlich“? ( 3.2.1: „wirtschaftliche
    Tätigkeit“ prüfen)\r\no Muss Vollkostenkalkulation angewendet werden?\r\no Anforderungen
    an Preisuntergrenze und Overhead beachten.\r\n• Verantwortlich: F&E\r\n• Unterstützt:
    PI\r\n \r\n4. Angebot kalkulieren (Vorkalkulation / Vollkostenrechnung)\r\n• Kalkulation
    gemäß Vollkostenregelungen ( Abschnitt wirtschaftliche Einnahmen).\r\n• Enthält:\r\no
    Personalkosten\r\no Sachmittel\r\no Nutzung zentraler Infrastruktur\r\no Overhead
    / Gemeinkosten\r\no Gewinn\r\n• Verantwortlich: F&E (kalkulatorisch)\r\n• Fachliche
    Angaben: PI / PM\r\n• Mittelgeber: erhält Angebot\r\n \r\n5. Juristische / steuerliche
    Prüfung (falls nötig)\r\n• Prüfung:\r\no Vertragsbedingungen\r\no Steuerpflicht
    (Gewerbesteuer / Körperschaftssteuer)\r\no Trennungsrechnung sicherstellen\r\n•
    Verantwortlich: F&E\r\n• Mittelgeber: liefert Vertragsunterlagen\r\n \r\n6. Vertragsverhandlung
    mit Mittelgeber\r\n• Lieferumfang, Termine, Budget, IP-Regelungen, Preis, Zahlungsmodalitäten.\r\n•
    Verantwortlich: PI (fachlich)\r\n• F&E: kaufmännisch / rechtlich\r\n• Mittelgeber:
    Vertragspartner\r\n \r\n7. Vertragsschluss\r\n• Kunde und Hochschule schließen
    Vertrag rechtsgültig ab.\r\n• Verantwortlich: F&E (offizieller Unterzeichnungsprozess)\r\n•
    PI: wissenschaftlicher Verantwortlicher\r\n \r\nPhase 2 – Stammdatenanlage im
    ERP (SAP)\r\n Dokument Abschnitt 3.2.2 – Stammdatenstruktur definieren und WP001–WP002.\r\n \r\n8.
    Wirtschaftliches Projekt im SAP anlegen beauftragen\r\n• PI meldet: Projekt ist
    vertraglich abgeschlossen.\r\n• Verantwortlich: PI → F&E\r\n \r\n9. Projektdefinition
    in SAP PS anlegen\r\n• Struktur „2.nnnnnnn“ (wirtschaftliches Projekt).\r\n• Inhalte:\r\no
    Kurzbeschreibung\r\no Verantwortlichkeiten\r\no Termine\r\n• Verantwortlich: F&E\r\n•
    Funktion: WP001 – Projektdefinitionen & PSP pflegen\r\n \r\n10. PSP-Elemente anlegen\r\n•
    Struktur: „2.nnnnnnn.nn“\r\n• Mindestens ein PSP-Element, oft mehrere bei Projektphasen.\r\n•
    Verantwortlich: F&E\r\n• Funktion: WP001\r\n \r\n11. Haushaltsprogramme (PSM-FM)
    anlegen\r\n• Je PSP wird ein Haushaltsprogramm erzeugt.\r\n• Verantwortlich: F&E\r\n•
    Funktion: WP002 – Haushaltsprogramme pflegen\r\n \r\n12. Budget einstellen (Erlösseite)\r\n•
    Externe Mittel werden budgetiert.\r\n• Verantwortlich: F&E\r\n• Funktion: WP003
    – Budgetierung\r\n \r\n13. Projektinformationen an PI / PM kommunizieren\r\n•
    PSP-Nummern, Buchungsvorgaben, Kontierungsregeln.\r\n• Verantwortlich: F&E\r\n \r\n Phase
    3 – Durchführung des wirtschaftlichen Projekts\r\nHier entspricht alles Kapitel
    3.2.7 – Buchung laufender Kosten im -Dokument.\r\n \r\n14. Fachliche Projektarbeit
    durchführen\r\n• Operative Durchführung der beauftragten Leistungen.\r\n• Verantwortlich:
    PM / PI\r\n• Mittelgeber: erhält Bericht / Ergebnisse\r\n \r\n15. Personalmaßnahmen
    (falls notwendig)\r\n• Mitarbeitende rekrutieren\r\n• Anteilige Personalzeit zuordnen\r\n•
    Verantwortlich: PI / PM\r\n• F&E: prüft Zuordnung / Vollkostenrelevanz\r\n \r\n16.
    Personalkosten buchen\r\n• Durch HR-Schnittstelle oder Umbuchung.\r\n• Verantwortlich:
    F&E\r\n• Funktion: WP006 – Buchung laufender Kosten\r\n \r\n17. Beschaffung von
    Waren, Dienstleistungen, Geräten\r\n• Bedarfsmeldung durch PM\r\n• Prüfung durch
    F&E (wirtschaftliche Kosten müssen voll erfasst werden)\r\n• Bestellung in SAP
    MM\r\n• Verantwortlich: PM (Anforderung), F&E (Prüfung), Einkauf (Ausführung)\r\n•
    Funktion: WP006 – Einkaufsbuchungen\r\n \r\n18. Nutzung interner Ressourcen /
    Gemeinkosten\r\n• Interne Infrastruktur wird belastet (Räume, Labore, Geräte).\r\n•
    Vollkostenprinzip verlangt vollständige Verrechnung.\r\n• Verantwortlich: F&E
    (Umbuchungen)\r\n \r\n19. Reisekosten & sonstige Ausgaben buchen\r\n• Dienstreiseabrechnung,
    Zuordnung zum Projekt.\r\n• Verantwortlich: PM (Antrag), F&E (Buchung)\r\n• Funktion:
    WP006 – Reisekosten\r\n \r\n20. Overhead-Umbuchung\r\n• Wirtschaftliche Projekte
    enthalten Overhead-Kosten (Gemeinkosten).\r\n• SAP führt automatische Umbuchung
    durch.\r\n• Verantwortlich: F&E\r\n• Funktion: WP008 – Overheadumbuchung\r\n \r\n21.
    Laufendes Monitoring von Budget / Erlösen / Aufwand\r\n• Prüfung von Deckung,
    Gewinn, Restmitteln.\r\n• Verantwortlich: F&E\r\n• PI: fachlicher Überblick\r\n•
    Berichte: FM/RW_BUDCON & weitere\r\n \r\n Phase 4 – Fakturierung / Abrechnung
    an Mittelgeber\r\nEntspricht Kapitel WP007 – Projekt fakturieren.\r\n \r\n22.
    Fakturierungsvorbereitung\r\n• Projektfortschritt → Fakturierbare Leistung bestimmen\r\n•
    Verantwortlich: PI / PM\r\n• F&E: kaufmännische Vorbereitung\r\n \r\n23. Ausgangsrechnung
    erfassen\r\n• Rechnung über vertraglich vereinbarte Leistungen\r\n• In SAP FI
    ohne SD-Modul\r\n• Verantwortlich: F&E\r\n• Funktion: WP007 – Ausgangsrechnung\r\n \r\n24.
    Freigabe & Buchung der Rechnung\r\n• Prüfung → Genehmigung → Verbuchung\r\n• Verantwortlich:
    F&E\r\n• Funktion: WP007\r\n \r\n25. Zahlungseingang Verbuchen\r\n• Geldeingang
    auf Projekt zuordnen\r\n• Verantwortlich: F&E\r\n• Funktion: FI-Buchung\r\n \r\n Phase
    5 – Abschluss wirtschaftliches Projekt\r\n Kapitel WP009–WP012.\r\n \r\n26. Fachliche
    Abschlussarbeit\r\n• Erbringung der letzten Leistungen\r\n• Abschlussdokumentation\r\n•
    Verantwortlich: PI / PM\r\n \r\n27. Nachkalkulation durchführen\r\n• Gewinn vor
    / nach Steuern ermitteln\r\n• Vollkosten überprüfen\r\n• Verantwortlich: F&E\r\n•
    Funktion: WP009 – Umbuchung Kosten, Gewinn und Steuern\r\n \r\n28. Abschlussrechnung
    (falls vertraglich notwendig)\r\n• Restleistungen abrechnen\r\n• Verantwortlich:
    F&E (Fakturierung)\r\n \r\n29. Projekt finanziell abschließen\r\n• Restbuchungen\r\n•
    Gewinnverteilung / Rückbuchungen\r\n• Verantwortlich: F&E\r\n \r\n30. Projekt
    im ERP schließen\r\n• PSP auf „abgeschlossen“ setzen\r\n• Keine Buchungen mehr
    möglich\r\n• Verantwortlich: F&E\r\n• Funktion: WP010 – Projektdefinition/PSP-Elemente
    pflegen\r\n \r\n31. Lessons Learned\r\n• Beurteilung wirtschaftlicher Effektivität
    des Auftrags\r\n• Verantwortlich: PI\r\n \r\nZusammenfassung der Rollen (wirtschaftlich)\r\nRolle
    Bedeutung\r\nPI Wissenschaftliche Leitung, Angebot, Durchführung\r\nPM Operative
    Projektarbeit\r\nF&E Finanzielle Abwicklung, SAP-Stammdaten, Budget, Faktura\r\nMittelgeber
    Externer Auftraggeber / Kunde\r\n \r\n\r\n\n"
  time:timestamp: '2025-12-11T15:58:59.744208+01:00'
