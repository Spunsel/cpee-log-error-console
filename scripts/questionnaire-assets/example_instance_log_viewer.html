<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>example_instance_log.xes.yaml</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1e1e2e; color: #cdd6f4; font-family: 'Consolas', 'Courier New', monospace; font-size: 0.82rem; line-height: 1.6; }
  #log { padding: 20px 24px; }

  .line { white-space: pre; display: block; }
  .sep  { white-space: pre; display: block; color: #555; }
  .dim  { opacity: 0.3; }

  .expo-cpee { border: 2px solid #93c5fd; border-radius: 4px; padding: 2px 10px; margin: 1px 0; background: rgba(147,197,253,0.07); }
  .expo-mmd  { border: 2px solid #86efac; border-radius: 4px; padding: 2px 10px; margin: 1px 0; background: rgba(134,239,172,0.07); }
  .expo-usr  { border: 2px solid #fdba74; border-radius: 4px; padding: 2px 10px; margin: 1px 0; background: rgba(253,186,116,0.07); }
  .expo-llm  { border: 2px solid #d8b4fe; border-radius: 4px; padding: 2px 10px; margin: 1px 0; background: rgba(216,180,254,0.07); }

  .hl-uuid0 { background: #fde047; color: #000; border-radius: 2px; padding: 0 3px; }
  .hl-uuid1 { background: #67e8f9; color: #000; border-radius: 2px; padding: 0 3px; }
  .step-label { font-size: 0.72rem; font-weight: 700; padding: 1px 6px; border-radius: 10px; margin-left: 8px; vertical-align: middle; }
  .step-label-0 { background: #fde047; color: #000; }
  .step-label-1 { background: #67e8f9; color: #000; }
</style>
</head>
<body>
<div id="log">Loading…</div>
<script>
  fetch('example_instance_log.xes.yaml')
    .then(r => r.text())
    .then(text => {
      const log = document.getElementById('log');
      log.innerHTML = '';

      // UUID → alternating class + step number
      const uuidClass = {};
      const uuidStep  = {};
      let uuidCount = 0;
      text.split(/\r?\n/).forEach(line => {
        const m = line.match(/cpee:change_uuid:\s*(\S+)/);
        if (m) {
          const uuid = m[1].trim();
          if (!(uuid in uuidClass)) {
            uuidClass[uuid] = 'hl-uuid' + (uuidCount % 2);
            uuidStep[uuid]  = uuidCount + 1;
            uuidCount++;
          }
        }
      });

      // Determine exposition box class from document text
      function expoClass(doc) {
        if (!doc.includes('description/exposition')) return null;
        if (doc.includes('<!-- Input CPEE-Tree -->') || doc.includes('<!-- Output CPEE-Tree -->')) return 'expo-cpee';
        if (doc.includes('%% Input Intermediate')    || doc.includes('%% Output Intermediate'))   return 'expo-mmd';
        if (doc.includes('# User Input:'))  return 'expo-usr';
        if (doc.includes('# Used LLM:'))    return 'expo-llm';
        return null;
      }

      // Render one text line into a container (with optional UUID highlight)
      function makeLine(text, highlightUuid) {
        const div = document.createElement('div');
        div.className = 'line';
        const uuidM = highlightUuid && text.match(/^(\s*cpee:change_uuid:\s*)(\S+)/);
        if (uuidM) {
          const uuid  = uuidM[2].trim();
          const cls   = uuidClass[uuid] || 'hl-uuid0';
          const step  = uuidStep[uuid]  || '?';
          const parity = cls.slice(-1); // '0' or '1'
          div.appendChild(document.createTextNode(uuidM[1]));
          const uuidSpan = document.createElement('span');
          uuidSpan.className = cls;
          uuidSpan.textContent = uuid;
          div.appendChild(uuidSpan);
          const badge = document.createElement('span');
          badge.className = 'step-label step-label-' + parity;
          badge.textContent = 'Step ' + step;
          div.appendChild(badge);
          div.appendChild(document.createTextNode(text.slice(uuidM[0].length)));
        } else {
          div.textContent = text;
        }
        return div;
      }

      // Render a document block
      function renderDoc(doc, cls) {
        const lines = doc.trimEnd().split(/\r?\n/);
        const frag  = document.createDocumentFragment();

        if (!cls) {
          // Not an exposition event — render all lines normally
          lines.forEach(l => frag.appendChild(makeLine(l, false)));
          return frag;
        }

        // Find where cpee:exposition starts and where it ends
        // (ends at the line starting with 'time:timestamp' at the same indent level)
        let expoStart = -1;
        let expoEnd   = lines.length;
        for (let i = 0; i < lines.length; i++) {
          if (expoStart === -1 && /^\s*cpee:exposition:/.test(lines[i])) {
            expoStart = i;
          } else if (expoStart !== -1 && /^\s*time:timestamp:/.test(lines[i])) {
            expoEnd = i;
            break;
          }
        }

        // Lines before exposition (render with UUID highlight)
        lines.slice(0, expoStart).forEach(l => frag.appendChild(makeLine(l, true)));

        // Exposition block inside colored box
        const box = document.createElement('div');
        box.className = cls;
        lines.slice(expoStart, expoEnd).forEach(l => {
          const d = document.createElement('div');
          d.className = 'line';
          d.textContent = l;
          box.appendChild(d);
        });
        frag.appendChild(box);

        // Lines after exposition (time:timestamp etc.)
        lines.slice(expoEnd).forEach(l => frag.appendChild(makeLine(l, false)));

        return frag;
      }

      // Split YAML into documents
      const raw  = text.replace(/^\s*---\s*\r?\n/, '');
      const docs = raw.split(/\r?\n---\r?\n/);

      docs.forEach((doc, idx) => {
        if (idx > 0) {
          const cls = expoClass(doc);
          const isRelevant = cls !== null || doc.includes('description/change');
          const sep = document.createElement('div');
          sep.className = 'sep' + (isRelevant ? '' : ' dim');
          sep.textContent = '---';
          log.appendChild(sep);
        }

        const cls = expoClass(doc);
        const isRelevant = cls !== null || doc.includes('description/change');
        const frag = renderDoc(doc, cls);

        if (!isRelevant) {
          const wrapper = document.createElement('div');
          wrapper.className = 'dim';
          wrapper.appendChild(frag);
          log.appendChild(wrapper);
        } else {
          log.appendChild(frag);
        }
      });
    });
</script>
</body>
</html>
