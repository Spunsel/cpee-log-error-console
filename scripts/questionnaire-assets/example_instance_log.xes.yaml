event:
  concept:instance: 8451
  id:id: ex-ante
  cpee:instance: e59334e5-7e49-4f4c-9443-0d8a5a327ee2
  lifecycle:transition: unknown
  cpee:lifecycle:transition: description/change
  cpee:description: |
    <?xml version="1.0"?>
    <description xmlns="http://cpee.org/ns/description/1.0" xmlns:a="http://cpee.org/ns/annotation/1.0">
      <call id="a1" endpoint="" a:alt_id="a1">
        <parameters>
          <label>Insert Cup</label>
          <method/>
          <type>:task</type>
          <arguments/>
        </parameters>
      </call>
      <call id="a3" endpoint="" a:alt_id="a3">
        <parameters>
          <label>Select Drink</label>
          <method/>
          <type>:task</type>
          <arguments/>
        </parameters>
      </call>
      <choose mode="exclusive" a:alt_id="eg1">
        <alternative condition="Ingredients Available" language="text/javascript">
          <call id="a7" endpoint="" a:alt_id="a5">
            <parameters>
              <label>Process Payment</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
          <call id="a9" endpoint="" a:alt_id="a7">
            <parameters>
              <label>Brew Coffee</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
          <call id="a11" endpoint="" a:alt_id="a9">
            <parameters>
              <label>Serve Coffee</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
        </alternative>
        <alternative condition="Out of Stock" language="text/javascript">
          <call id="a15" endpoint="" a:alt_id="a4">
            <parameters>
              <label>Display Out of Stock</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
          <call id="a17" endpoint="" a:alt_id="a6">
            <parameters>
              <label>Eject Cup</label>
              <method/>
              <type>:task</type>
              <arguments/>
            </parameters>
          </call>
        </alternative>
      </choose>
    </description>
  cpee:change_uuid: ab54028fdd26260f7254b2eab91870733b7bb638
  time:timestamp: '2026-03-28T12:49:44.956587+01:00'
