name: Deploy Application and Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v1
        with:
          mdbook-version: 'latest'

      - name: Build documentation
        run: mdbook build

      - name: Prepare deployment
        run: |
          # Create deployment directory
          mkdir -p deploy_root
          
          # Create .nojekyll file to disable Jekyll processing (important for GitHub Pages)
          touch deploy_root/.nojekyll
          
          # Copy essential app files
          echo "Copying app files..."
          cp index.html deploy_root/ || { echo "ERROR: index.html not found!"; exit 1; }
          [ -f package.json ] && cp package.json deploy_root/ || echo "package.json not found (optional)"
          
          # Copy app source directory
          echo "Copying src directory..."
          cp -r src deploy_root/ || { echo "ERROR: src directory not found!"; exit 1; }
          
          # Copy scripts if they exist
          [ -d scripts ] && cp -r scripts deploy_root/ && echo "Copied scripts" || echo "scripts directory not found (optional)"
          
          # Copy built documentation to subdirectory
          echo "Copying documentation..."
          cp -r docs/book deploy_root/documentation || { echo "ERROR: docs/book not found!"; exit 1; }
          
          # Verify deployment structure
          echo "=== Deployment structure ==="
          echo "Root files:"
          ls -la deploy_root/ | head -20
          echo ""
          echo "src directory:"
          ls -la deploy_root/src/ | head -10
          echo ""
          echo "documentation directory:"
          ls -la deploy_root/documentation/ | head -10
          
          # Verify critical files exist
          if [ ! -f deploy_root/index.html ]; then
            echo "ERROR: index.html missing in deployment!"
            exit 1
          fi
          if [ ! -f deploy_root/.nojekyll ]; then
            echo "ERROR: .nojekyll missing in deployment!"
            exit 1
          fi
          if [ ! -d deploy_root/src ]; then
            echo "ERROR: src directory missing in deployment!"
            exit 1
          fi
          if [ ! -d deploy_root/documentation ]; then
            echo "ERROR: documentation directory missing in deployment!"
            exit 1
          fi
          
          echo "✓ Deployment structure verified"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy_root
          keep_files: false
