name: Deploy Application and Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v1
        with:
          mdbook-version: 'latest'

      - name: Build documentation
        run: mdbook build

      - name: Prepare deployment
        run: |
          # Create deployment directory
          mkdir -p deploy_root
          
          # Copy essential app files
          cp index.html deploy_root/
          cp package.json deploy_root/ 2>/dev/null || true
          
          # Copy app source directory
          cp -r src deploy_root/
          
          # Copy scripts if they exist
          [ -d scripts ] && cp -r scripts deploy_root/ || true
          
          # Copy built documentation to subdirectory
          cp -r docs/book deploy_root/documentation
          
          echo "Deployment structure:"
          ls -la deploy_root/
          ls -la deploy_root/documentation/ | head -10

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy_root
          keep_files: false
